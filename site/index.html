creditavel que ele deixou e o inacreditavel laugh tale.", "atores": ["Gol D. Roger", "Joy Boy"], "temas": ["Laugh Tale", "tesouro", "riso"], "corpo": "Marcado ambiguo porque o argumento e sintatico e depende de a estrutura original coordenar dois itens. Se coordenar, o relato e o tesouro sao coisas distintas na mesma ilha."}, {"id": "EV-0967-04", "fonte": "cap 967", "fonte_url": "https://thelibraryofohara.com/2022/01/04/what-is-the-one-piece-the-ultimate-one-piece-theory/", "tipo": "narracao", "confiabilidade": "canonico", "texto": "A cancao Binks' Sake toca ao longo de todo o capitulo em que a tripulacao de Roger chega a Laugh Tale.", "atores": ["Gol D. Roger"], "temas": ["Binks' Sake", "Laugh Tale", "riso"], "corpo": "Juntura diegetica: a cancao mais antiga da obra toca exatamente na cena do achado."}, {"id": "EV-0967-05", "fonte": "cap 967", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_967", "tipo": "fala", "confiabilidade": "canonico", "texto": "Rayleigh garantiu a Netuno que a tripulacao de Roger nao estava atras da arma ancestral, e sim do tesouro de quem criou a arma.", "atores": ["Silvers Rayleigh", "Neptune"], "temas": ["armas ancestrais", "tesouro", "Joy Boy", "Laugh Tale"], "corpo": "Um dos poucos enunciados da obra que atribui autoria ao tesouro: quem deixou o que esta em\nLaugh Tale e a mesma parte que criou as armas ancestrais. Toda a identificacao repousa\nnesta unica frase resumida pela wiki; se o original disser apenas \"o tesouro daquela epoca\",\na atribuicao cai."}, {"id": "EV-0967-06", "fonte": "cap 967", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_967", "tipo": "narracao", "confiabilidade": "canonico", "texto": "A arma ancestral Poseidon nao estava na Ilha dos Homens-Peixe quando a tripulacao de Roger chegou, apesar de o Poneglyph de Skypiea indicar que ela estaria la.", "atores": ["Gol D. Roger", "Neptune"], "temas": ["Poseidon", "armas ancestrais", "Poneglyphs", "Ilha dos Homens-Peixe"], "corpo": "O Poneglyph aponta um lugar e o lugar esta vazio. Isso obriga a leitura de que o texto\nantigo descreve uma funcao recorrente, nao um objeto guardado num cofre."}, {"id": "EV-0967-07", "fonte": "cap 967", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_967", "tipo": "fala", "confiabilidade": "canonico", "texto": "Netuno, que ainda nem era casado, concluiu diante dos Piratas de Roger que sua futura filha seria a Poseidon, apoiado na previsao de Shyarly de que nasceria em breve uma sereia capaz de falar com os Reis do Mar.", "atores": ["Neptune", "Shyarly", "Gol D. Roger"], "temas": ["Poseidon", "profecia", "Ilha dos Homens-Peixe"], "corpo": "A identificacao de Poseidon com uma pessoa por nascer e feita vinte e cinco anos antes de\nRobin chegar a mesma conclusao, e por um rei que so tinha uma previsao nas maos."}, {"id": "EV-0967-08", "fonte": "cap 967", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_967", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Oden registrou por escrito que, na ilha final, a tripulacao descobriu as verdades sobre o Seculo Vazio, sobre o significado do D. e sobre as armas ancestrais.", "atores": ["Kouzuki Oden", "Gol D. Roger"], "temas": ["Seculo Vazio", "Vontade de D.", "armas ancestrais", "Laugh Tale", "diario de Oden"], "corpo": "O inventario do que ha em Laugh Tale, tal como a obra o enumera: tres corpos de\nconhecimento historico. Nenhum item da lista e um objeto."}, {"id": "EV-0967-09", "fonte": "cap 967", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_967", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Na ilha final Oden aprendeu que Wano ja estivera conectada ao resto do mundo.", "atores": ["Kouzuki Oden"], "temas": ["Wano", "isolamento", "Seculo Vazio", "Laugh Tale"], "corpo": "O isolamento de Wano e posterior a alguma coisa. O que Oden decide fazer depois so faz\nsentido a luz desta linha."}, {"id": "EV-0967-10", "fonte": "cap 967", "fonte_url": "https://onepiece.fandom.com/wiki/Roger_Pirates", "tipo": "narracao", "confiabilidade": "canonico", "texto": "O tesouro encontrado na ilha final tinha sido deixado ali por Joy Boy oitocentos anos antes.", "atores": ["Joy Boy", "Gol D. Roger"], "temas": ["Laugh Tale", "Joy Boy", "tesouro", "Seculo Vazio"], "corpo": "Datacao explicita: o achado e do fim do Seculo Vazio e ficou intocado por oito seculos.\nA cifra dos oitocentos anos vem da pagina da tripulacao na wiki, que cobre os capitulos\n967 e 968 no mesmo paragrafo."}, {"id": "EV-0967-11", "fonte": "cap 967", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_967", "tipo": "narracao", "confiabilidade": "canonico", "texto": "A tripulacao de Roger gargalha ao encontrar o tesouro em Laugh Tale, e Roger comenta que chegaram cedo demais.", "atores": ["Gol D. Roger", "Rayleigh", "Oden"], "temas": ["Laugh Tale", "One Piece", "riso", "Joy Boy"], "corpo": "O riso coletivo e a restricao temporal sao as duas ancoras mais fortes de\nqualquer hipotese sobre o tesouro."}, {"id": "EV-0967-12", "fonte": "cap 967", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_967", "tipo": "narracao", "confiabilidade": "traducao_disputada", "texto": "O nome Laugh Tale foi dado pelo proprio Roger, em referencia ao que a parafrase em ingles chama de uma historia de rir.", "atores": ["Gol D. Roger"], "temas": ["Laugh Tale", "nome", "riso", "traducao"], "corpo": "O ato de nomear e canonico; a glosa nao e. Vale aqui a mesma pendencia de EV-0488-01 e a\ncorrecao de EV-0972-01: 笑い話 sao os caracteres de Laugh Tale e de Binks' Sake, e a wiki\nverte como \"funny story\", palavra que impoe comicidade a um lexema que nao a exige."}, {"id": "EV-0968-01", "fonte": "cap 968", "fonte_url": "https://onepiece.fandom.com/wiki/Joy_Boy", "tipo": "fala", "confiabilidade": "canonico", "texto": "Roger e Oden ouviram os Reis do Mar falarem do nascimento, dali a 25 anos, de alguem que os lideraria, junto com a nova Poseidon.", "atores": ["Gol D. Roger", "Kouzuki Oden"], "temas": ["tempo determinado", "Poseidon", "Reis do Mar"], "corpo": "Aqui o 'cedo demais' ganha numero: 25 anos."}, {"id": "EV-0968-02", "fonte": "cap 968", "fonte_url": "https://onepiece.fandom.com/wiki/Gol_D._Roger", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Ao saber que tinham chegado cedo demais, Roger planejou gerar um filho que encontrasse o One Piece depois dele.", "atores": ["Gol D. Roger", "Portgas D. Ace"], "temas": ["cedo demais", "sucessao", "One Piece"], "corpo": "A resposta de Roger a 'cedo demais' foi produzir uma pessoa, nao construir um mecanismo nem esconder melhor um objeto."}, {"id": "EV-0968-03", "fonte": "cap 968", "fonte_url": "https://onepiece.fandom.com/wiki/Gol_D._Roger", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Ao completar o feito, Roger da uma grande festa com a tripulacao, trocando bebidas com todos.", "atores": ["Gol D. Roger"], "temas": ["festa", "sake", "Laugh Tale"], "corpo": "A reacao registrada de quem chegou ao fim da rota foi rir e depois dar uma festa."}, {"id": "EV-0968-04", "fonte": "cap 968", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_968", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Foi o mundo, e nao Roger, que deu o nome de One Piece ao conjunto de tudo o que ele obteve na viagem final.", "atores": ["Gol D. Roger"], "temas": ["One Piece", "nome", "Era dos Piratas"], "corpo": "O nome e exogeno e coletivo. Quem o cunhou nao viu o que ha na ilha, o que enfraquece\nqualquer leitura que trate \"One Piece\" como descricao fiel do achado."}, {"id": "EV-0968-05", "fonte": "cap 968", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_968", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Roger se irritou por o Governo Mundial divulgar seu nome como Gold Roger, escondendo o Gol D., mas disse compreender o motivo do encobrimento a luz do que a tripulacao aprendera em Laugh Tale.", "atores": ["Gol D. Roger", "Governo Mundial"], "temas": ["Vontade de D.", "Governo Mundial", "Laugh Tale", "apagamento"], "corpo": "Elo direto entre o conteudo de Laugh Tale e a politica de apagamento do D.: quem leu a\nmensagem entende sozinho por que o Governo apaga a letra. Complementa EV-1190-04, que da\na mesma ordem pelo lado de quem a emitiu."}, {"id": "EV-0968-06", "fonte": "cap 968", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_968", "tipo": "fala", "confiabilidade": "canonico", "texto": "Ao ser deixado em Wano pela tripulacao, Oden declarou que abriria as fronteiras do pais antes do dia em que Joy Boy aparecer.", "atores": ["Kouzuki Oden", "Joy Boy"], "temas": ["Wano", "fronteiras", "Joy Boy", "retorno"], "corpo": "A abertura tem prazo e destinatario. Oden volta de Laugh Tale tratando o retorno de Joy Boy\ncomo evento datavel o bastante para se preparar antes dele."}, {"id": "EV-0968-07", "fonte": "cap 968", "fonte_url": "https://onepiece.fandom.com/wiki/Kozuki_Oden", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Oden recusou a oferta dos Piratas de Roger de ajuda-lo a abrir as fronteiras de Wano e decidiu realizar isso por dentro, tornando-se shogun com o apoio de seus retainers.", "atores": ["Kouzuki Oden"], "temas": ["Wano", "fronteiras", "sucessao"], "corpo": "A abertura e concebida como ato de soberania interna, nao como invasao vinda de fora.\nRestringe as leituras em que a muralha de Wano cai por forca estrangeira."}, {"id": "EV-0968-08", "fonte": "cap 968", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_968", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Os diarios de Oden contradizem o que o capitulo mostra: ele escreveu que nenhuma lagrima foi derramada na despedida de Roger e que a sua propria despedida foi com sorrisos, enquanto os paineis mostram a tripulacao em prantos nas duas cenas.", "atores": ["Kouzuki Oden"], "temas": ["diario de Oden", "confiabilidade", "riso"], "corpo": "Aviso de metodo para todo atomo cuja unica testemunha e o diario: a obra demonstra, de\nproposito, que Oden embeleza o registro na direcao do sorriso. Onde o diario diz que\nalguem riu, cabe descontar."}, {"id": "EV-0969-01", "fonte": "cap 969", "fonte_url": "https://onepiece.fandom.com/wiki/Gol_D._Roger", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Ao receber a noticia da execucao de Roger, Oden chorou e riu ao mesmo tempo, maravilhado com os feitos de Roger em vida.", "atores": ["Kouzuki Oden", "Gol D. Roger"], "temas": ["riso", "Oden", "execucao"], "corpo": "Segunda ocorrencia do par riso/tragedia associado ao que a tripulacao aprendeu."}, {"id": "EV-0972-01", "fonte": "cap 972", "fonte_url": "https://onepiece.fandom.com/wiki/Joy_Boy", "tipo": "fala", "confiabilidade": "canonico", "texto": "Ao aprender a verdadeira historia, Roger riu e declarou que gostaria de ter vivido na mesma epoca que Joy Boy.", "atores": ["Gol D. Roger", "Joy Boy"], "temas": ["riso", "Joy Boy", "Laugh Tale"], "corpo": "Corrigido em 2026-08-11. A versao anterior dizia que Roger 'achou a historia\nhilaria'. A obra nao diz que o relato era engracado — diz que causou riso, e o\nriso pode ser de alegria, de alivio ou de reconhecimento. A palavra 'hilaria'\nveio da parafrase da wiki e estava sustentando peso em H-02, H-05 e H-08.\n\nNota de leitura que vale para todos os atomos de riso deste repositorio: em\njapones 笑う cobre rir e sorrir com o mesmo verbo. A distincao entre 'sorriu' e\n'gargalhou' nas nossas traducoes e artefato, nao dado."}, {"id": "EV-0972-02", "fonte": "cap 972", "fonte_url": "https://onepiece.fandom.com/wiki/Joy_Boy", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Os Piratas de Roger leram a mensagem em Laugh Tale, aprenderam a verdadeira historia e decidiram deixar tudo como estava ao perceber que tinham chegado cedo demais.", "atores": ["Gol D. Roger"], "temas": ["Laugh Tale", "cedo demais", "mensagem"], "corpo": "Deixar como estava e uma escolha ativa: eles podiam ter levado, e nao levaram."}, {"id": "EV-0972-03", "fonte": "cap 972", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_972", "tipo": "fala", "confiabilidade": "canonico", "texto": "Oden revelou publicamente, da panela de execucao, que foi a propria familia Kouzuki que fechou Wano ao resto do mundo, para proteger o pais de uma grande forca externa.", "atores": ["Kouzuki Oden"], "temas": ["Wano", "isolamento", "Kouzuki", "ameaca"], "corpo": "O isolamento e defensivo e deliberado, decidido por quem sabia ler os Poneglyphs. Junto com\nEV-0967-09, fecha a sequencia: Wano era ligada ao mundo, os Kouzuki a fecharam, e a\nreabertura tem hora marcada."}, {"id": "EV-0972-04", "fonte": "cap 972", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_972", "tipo": "fala", "confiabilidade": "canonico", "texto": "Oden afirmou que Wano e o mundo inteiro aguardam a chegada de uma figura ligada a um intervalo de oitocentos anos, e que, quando ela aparecer, Wano deve recebe-la e trabalhar ao lado dela.", "atores": ["Kouzuki Oden"], "temas": ["Joy Boy", "retorno", "Wano", "oitocentos anos"], "corpo": "Oden nao descreve um tesouro a ser achado, e sim alguem a ser recebido, e atribui a espera\nao mundo todo, nao so a Wano."}, {"id": "EV-0972-05", "fonte": "cap 972", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_972", "tipo": "fala", "confiabilidade": "canonico", "texto": "Certo de que seria morto, Oden pediu aos seus retainers que abrissem as fronteiras de Wano em seu lugar.", "atores": ["Kouzuki Oden"], "temas": ["Wano", "fronteiras", "heranca"], "corpo": "A tarefa e delegada explicitamente, o que transforma a abertura das fronteiras em obrigacao\nherdada e nao em desejo pessoal extinto com ele."}, {"id": "EV-0972-06", "fonte": "cap 972", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_972", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Na carta deixada a Toki, Oden previu que em vinte anos estouraria uma guerra e que chegaria ao Novo Mundo uma forca capaz de derrubar Kaidou, e pediu que ela usasse seu poder em funcao disso.", "atores": ["Kouzuki Oden", "Kouzuki Toki"], "temas": ["previsao", "tempo determinado", "Wano"], "corpo": "Segunda vez no bloco em que uma data futura e tratada como calculavel. A primeira foram os\nvinte e cinco anos ouvidos dos Reis do Mar em EV-0968-01."}, {"id": "EV-0972-07", "fonte": "cap 972", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_972", "tipo": "narracao", "confiabilidade": "canonico", "texto": "O plano de Toki usar a Toki Toki no Mi para enviar pessoas vinte anos ao futuro foi concebido por Oden.", "atores": ["Kouzuki Oden", "Kouzuki Toki"], "temas": ["salto temporal", "Wano", "plano"], "corpo": "O salto de vinte anos nao foi improviso de uma mae encurralada; era instrucao previa,\nescrita antes da execucao."}, {"id": "EV-0973-01", "fonte": "cap 973", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_973", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Com o castelo em chamas, Toki enviou Momonosuke e quatro dos retainers vinte anos ao futuro e ficou para tras, em vez de fugir com eles para Zou.", "atores": ["Kouzuki Toki", "Kouzuki Momonosuke"], "temas": ["salto temporal", "Wano", "Kouzuki"], "corpo": "O herdeiro dos Kouzuki e o unico leitor de Poneglyphs restante e retirado da linha do tempo\npor vinte anos. O conhecimento da familia atravessa o intervalo dentro de uma pessoa."}, {"id": "EV-0973-02", "fonte": "cap 973", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_973", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Ferida e prestes a morrer, Toki cavalgou ate Bakura Town e proferiu publicamente uma profecia diante dos cidadaos, e Orochi passou a temer o que ela anunciou.", "atores": ["Kouzuki Toki", "Kurozumi Orochi"], "temas": ["profecia", "Wano", "Toki"], "corpo": "O ato foi deliberado: ela gastou os ultimos minutos garantindo que a profecia tivesse\ntestemunhas, o que a torna instrumento politico e nao apenas visao."}, {"id": "EV-0973-03", "fonte": "cap 973", "fonte_url": "https://onepiece.fandom.com/wiki/Amatsuki_Toki", "tipo": "narracao", "confiabilidade": "ambiguo", "texto": "Seguidores dos Kouzuki e o proprio Orochi entenderam a profecia de Toki como o anuncio de que, dali a vinte anos, nove sombras vingariam Oden, derrubariam Orochi e abririam as fronteiras de Wano.", "atores": ["Kouzuki Toki", "Kurozumi Orochi"], "temas": ["profecia", "Wano", "fronteiras", "nove sombras"], "corpo": "Marcado ambiguo de proposito: a fonte consultada nao reproduz o texto da profecia, so a\nleitura que os personagens fizeram dela, e a wiki referencia essa leitura aos capitulos 919\ne 920, fora deste bloco. Quem for dar peso a este atomo precisa antes buscar o texto\noriginal da fala."}, {"id": "EV-0973-04", "fonte": "cap 973", "fonte_url": "https://onepiece.fandom.com/wiki/Amatsuki_Toki", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Toki nasceu por volta de oitocentos e trinta anos antes do presente, dentro do Seculo Vazio, e chegou a era atual saltando repetidamente para frente no tempo sempre que corria perigo.", "atores": ["Kouzuki Toki"], "temas": ["Seculo Vazio", "salto temporal", "Toki"], "corpo": "Existe na era moderna uma pessoa nascida no Seculo Vazio que atravessou o apagamento sem\npassar por ele. E o unico caso conhecido de testemunha viva daquele periodo fora dos\nPoneglyphs."}, {"id": "EV-0973-05", "fonte": "wiki Kouzuki Toki, secao Devil Fruit", "fonte_url": "https://onepiece.fandom.com/wiki/Amatsuki_Toki", "tipo": "narracao", "confiabilidade": "ambiguo", "texto": "O poder da Toki Toki no Mi funciona numa direcao so: envia pessoas anos ou decadas para o futuro e nunca de volta ao passado.", "atores": ["Kouzuki Toki"], "temas": ["salto temporal", "akuma no mi", "tempo"], "corpo": "Ambiguo porque a pagina da personagem afirma isso sem apontar capitulo, ao contrario do\nresto da biografia. Se confirmado, fecha uma porta importante: ninguem trouxe informacao do\nSeculo Vazio para tras, so pessoas vieram para frente."}, {"id": "EV-0973-06", "fonte": "cap 973", "fonte_url": "https://onepiece.fandom.com/wiki/Amatsuki_Toki", "tipo": "narracao", "confiabilidade": "ambiguo", "texto": "Toki pertencia a familia daimyo Amatsuki e, ainda assim, nao conhecia sua terra de origem; o que ela buscava ao viajar era chegar a Wano.", "atores": ["Kouzuki Toki"], "temas": ["Seculo Vazio", "Wano", "Toki", "memoria"], "corpo": "Ambiguo porque a frase da wiki nao deixa claro se a terra desconhecida e Wano ou outro\nlugar. Se for Wano, uma nobre do Seculo Vazio ja ignorava a propria origem, e o apagamento\nseria anterior a queda."}, {"id": "EV-0973-07", "fonte": "cap 973", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_973", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Durante a viagem com os Piratas de Roger, Oden ergueu Momonosuke para lhe mostrar o horizonte, dizendo que aquilo era apenas uma parte minima do mundo que existe fora de Wano, e passou a lhe ensinar diversas materias.", "atores": ["Kouzuki Oden", "Kouzuki Momonosuke"], "temas": ["Momonosuke", "transmissao", "Wano"], "corpo": "A instrucao do herdeiro comeca a bordo, antes do diario. O que Momonosuke sabe nao veio so\ndo texto que Yamato lhe entregou."}, {"id": "EV-1000-01", "fonte": "cap 1000", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_1000", "tipo": "narracao", "confiabilidade": "canonico", "texto": "O titulo completo do capitulo 1000 e o sake que preparei enquanto esperava por voce, Luffy Chapeu de Palha.", "atores": ["Monkey D. Luffy"], "temas": ["sake", "espera", "Luffy"], "corpo": "Quem fala no titulo nao e nomeado. A leitura corrente atribui a Yamato pelo pronome usado no japones; ha quem atribua a Joy Boy."}, {"id": "EV-1000-02", "fonte": "cap 1000", "fonte_url": "https://onepiece.fandom.com/wiki/Portgas_D._Ace", "tipo": "fala", "confiabilidade": "canonico", "texto": "Ace revela a Yamato o objetivo que esta no fim do sonho de Luffy, e Yamato reconhece que bate com o que Oden registrara no diario sobre o que Roger dissera.", "atores": ["Portgas D. Ace", "Yamato", "Kouzuki Oden"], "temas": ["sonho", "Roger", "Luffy"], "corpo": "Como o objetivo esta no FIM do sonho, ele e posterior e distinto de ser Rei dos Piratas — e Roger declarou o mesmo."}, {"id": "EV-1014-01", "fonte": "cap 1014", "fonte_url": "https://onepiece.fandom.com/wiki/Joy_Boy", "tipo": "fala", "confiabilidade": "canonico", "texto": "Kaidou afirma que Luffy nao conseguiu se tornar o novo Joy Boy.", "atores": ["Kaidou", "Monkey D. Luffy"], "temas": ["Joy Boy", "Luffy", "fracasso"], "corpo": "Terceira peca da serie que inclui EV-1043-01 (Zunesha declara o retorno) e EV-1188-01 (Imu nega). O titulo e afirmado e negado varias vezes na obra."}, {"id": "EV-1023-01", "fonte": "cap 1023", "fonte_url": "https://onepiece.fandom.com/wiki/Lunarians", "tipo": "fala", "confiabilidade": "canonico", "texto": "Barba Branca contou a Marco que existiu um Kami no Kuni, um pais dos deuses, no alto da Red Line muito antes de Mary Geoise existir.", "atores": ["Edward Newgate", "Marco"], "temas": ["Red Line", "Mary Geoise", "Lunarians", "deuses"], "corpo": "A capital do Governo foi erguida sobre o lugar de algo anterior que tinha esse nome."}, {"id": "EV-1033-01", "fonte": "cap 1033", "fonte_url": "https://onepiece.fandom.com/wiki/Lunarians", "tipo": "fala", "confiabilidade": "canonico", "texto": "Queen afirma que os Lunarians eram chamados de deuses num passado distante e sobrevivem em qualquer ambiente natural.", "atores": ["Queen"], "temas": ["Lunarians", "deuses", "lua"], "corpo": "O unico eixo lunar com base canonica direta. Relevante porque nenhuma hipotese do repositorio o cobre."}, {"id": "EV-1037-01", "fonte": "cap 1037", "fonte_url": "https://onepiece.fandom.com/wiki/Nika", "tipo": "fala", "confiabilidade": "canonico", "texto": "Um dos Cinco Anciaos questiona se a fruta de Nika nao seria apenas lenda, ja que nao desperta ha seculos, e cogita que a propria fruta esteja fugindo deles.", "atores": ["Cinco Anciaos"], "temas": ["Nika", "Akuma no Mi", "Governo Mundial"], "corpo": ""}, {"id": "EV-1037-02", "fonte": "cap 1037", "fonte_url": "https://onepiece.fandom.com/wiki/Zunesha", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Zunesha chegou as aguas proximas de Wano e ali encontrou uma grande frota de navios do Governo Mundial.", "atores": ["Zunesha"], "temas": ["Zunesha", "Wano", "Governo Mundial"], "corpo": "Depois de seculos vagando, o elefante aparece exatamente no pais que guarda Pluton e um Road Poneglyph."}, {"id": "EV-1040-01", "fonte": "cap 1040", "fonte_url": "https://onepiece.fandom.com/wiki/Joy_Boy", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Joy Boy foi camarada de Zunesha durante sua vida.", "atores": ["Joy Boy", "Zunesha"], "temas": ["Joy Boy", "Zunesha"], "corpo": ""}, {"id": "EV-1041-01", "fonte": "cap 1041", "fonte_url": "https://onepiece.fandom.com/wiki/Zunesha", "tipo": "fala", "confiabilidade": "canonico", "texto": "Zunesha declarou a Momonosuke, pela Voz de Todas as Coisas, que lutaria sob o comando dele e que abriria as fronteiras de Wano.", "atores": ["Zunesha", "Kouzuki Momonosuke"], "temas": ["Zunesha", "Wano", "fronteiras", "Kouzuki Momonosuke"], "corpo": "A wiki referencia a mesma declaracao aos capitulos 1039 e 1041."}, {"id": "EV-1043-01", "fonte": "cap 1043", "fonte_url": "https://onepiece.fandom.com/wiki/Joy_Boy", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Inconsciente, o batimento cardiaco de Luffy adquiriu as qualidades dos Tambores da Libertacao, e Zunesha declarou que Joy Boy tinha retornado.", "atores": ["Monkey D. Luffy", "Zunesha"], "temas": ["Tambores da Libertacao", "Joy Boy", "retorno"], "corpo": "'Retorno' e afirmado por uma testemunha de 800 anos atras, nao por narracao."}, {"id": "EV-1046-01", "fonte": "cap 1046", "fonte_url": "https://onepiece.fandom.com/wiki/Zunesha", "tipo": "fala", "confiabilidade": "canonico", "texto": "Zunesha comparou Luffy ao Joy Boy que conheceu no passado e afirmou que aquilo era o destino do garoto, depositando confianca nele.", "atores": ["Zunesha", "Monkey D. Luffy", "Joy Boy"], "temas": ["Zunesha", "Joy Boy", "Monkey D. Luffy", "destino"], "corpo": "Testemunha ocular de 800 anos atras fazendo a identificacao, nao narracao onisciente."}, {"id": "EV-1050-01", "fonte": "cap 1050", "fonte_url": "https://onepiece.fandom.com/wiki/Zunesha", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Depois da derrota de Kaidou, Momonosuke decidiu nao abrir ainda as fronteiras de Wano e comunicou a decisao a Zunesha.", "atores": ["Kouzuki Momonosuke", "Zunesha"], "temas": ["Wano", "fronteiras", "Kouzuki Momonosuke", "Zunesha"], "corpo": "A decisao mantem Pluton selada e adia a agenda que Oden dizia ser a de Joy Boy."}, {"id": "EV-1052-01", "fonte": "cap 1052", "fonte_url": "https://onepiece.fandom.com/wiki/Zunesha", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Em respeito a decisao de Momonosuke, Zunesha deixou as aguas de Wano e sumiu na neblina proxima.", "atores": ["Zunesha", "Kouzuki Momonosuke"], "temas": ["Zunesha", "Wano"], "corpo": "O elefante obedece a autoridade Kouzuki no presente, como obedecia a uma sentenca no passado."}, {"id": "EV-1053-01", "fonte": "cap 1053", "fonte_url": "https://onepiece.fandom.com/wiki/Ancient_Weapons", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Pluton repousa numa caverna secreta ao pe do Monte Fuji submerso na antiga Wano, abaixo da caverna onde fica o Road Poneglyph do pais.", "atores": ["Kouzuki Sukiyaki", "Nico Robin"], "temas": ["Pluton", "Wano", "Road Poneglyph"], "corpo": ""}, {"id": "EV-1053-02", "fonte": "cap 1053", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_1053", "tipo": "narracao", "confiabilidade": "canonico", "texto": "O comodo do porao do castelo do xogum onde Orochi manteve Sukiyaki preso por anos abriga um Poneglyph.", "atores": ["Kouzuki Sukiyaki", "Kurozumi Orochi", "Nico Robin"], "temas": ["Poneglyphs", "Wano", "Kouzuki Sukiyaki"], "corpo": "Era o quarto secreto de passatempos do ex-xogum antes de virar cela. Robin chega ate ele por indicacao de Brook."}, {"id": "EV-1053-03", "fonte": "cap 1053", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_1053", "tipo": "fala", "confiabilidade": "canonico", "texto": "Robin afirma que o Poneglyph do Reino de Arabasta indicava que a arma ancestral Pluton esta em Wano.", "atores": ["Nico Robin"], "temas": ["Pluton", "Poneglyphs", "Arabasta", "Wano", "armas ancestrais"], "corpo": "Fecha o circuito aberto na saga de Arabasta: o que Robin leu no tumulo real e so agora diz em voz alta."}, {"id": "EV-1053-04", "fonte": "cap 1053", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_1053", "tipo": "fala", "confiabilidade": "canonico", "texto": "Sukiyaki confirma a Robin que Pluton esta de fato em Wano.", "atores": ["Kouzuki Sukiyaki", "Nico Robin"], "temas": ["Pluton", "Wano", "armas ancestrais"], "corpo": "Confirmacao vinda da linha do xogunato, independente da leitura do Poneglyph de Arabasta."}, {"id": "EV-1053-05", "fonte": "cap 1053", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_1053", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Tenguyama Hitetsu tira a mascara diante de Robin e se revela como Kouzuki Sukiyaki, o ex-xogum que Orochi deu por morto.", "atores": ["Kouzuki Sukiyaki", "Nico Robin"], "temas": ["Kouzuki Sukiyaki", "Wano", "Kouzuki"], "corpo": "Sobrevive, portanto, um Kouzuki da geracao anterior a Oden — o unico depositario vivo do que o xogunato transmitia."}, {"id": "EV-1055-01", "fonte": "cap 1055", "fonte_url": "https://onepiece.fandom.com/wiki/Ancient_Weapons", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Abrir as fronteiras de Wano significa literalmente derrubar as muralhas montanhosas e liberar Pluton.", "atores": ["Kouzuki Oden"], "temas": ["Wano", "Pluton", "Joy Boy"], "corpo": "Oden condicionou isso ao retorno de Joy Boy: a agenda dele previa entregar uma arma ao futuro."}, {"id": "EV-1055-02", "fonte": "cap 1055", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_1055", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Abaixo do castelo, atras de uma janela de vidro, ha uma cidade inteira submersa e preservada, que Sukiyaki identifica como a Wano de 800 anos atras.", "atores": ["Kouzuki Sukiyaki", "Nico Robin", "Trafalgar Law"], "temas": ["Wano", "cidade submersa", "Seculo Vazio", "afundamento"], "corpo": "Descer ate ela e descrito como descer alguns seculos. A data coincide com o fim do Seculo Vazio."}, {"id": "EV-1055-03", "fonte": "cap 1055", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_1055", "tipo": "fala", "confiabilidade": "canonico", "texto": "Sukiyaki declara nao saber como a antiga Wano acabou submersa.", "atores": ["Kouzuki Sukiyaki"], "temas": ["Wano", "cidade submersa", "afundamento"], "corpo": "Limite explicito do que a linha do xogunato preservou."}, {"id": "EV-1055-04", "fonte": "cap 1055", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_1055", "tipo": "fala", "confiabilidade": "canonico", "texto": "Sukiyaki propoe que a antiga Wano ficava ao nivel do mar na base do Monte Fuji e afundou porque as muralhas erguidas na fronteira impediram a agua da chuva de escoar, o que levou a populacao a se instalar na encosta.", "atores": ["Kouzuki Sukiyaki"], "temas": ["Wano", "cidade submersa", "afundamento", "muralhas"], "corpo": "E hipotese do proprio personagem, nao narracao. Note que aqui a agua nao e do mar e a inundacao e local, ao contrario do afundamento do Reino Antigo."}, {"id": "EV-1055-05", "fonte": "cap 1055", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_1055", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Sukiyaki conduz Robin e Law por uma escada que desce do quarto secreto ate a camara subterranea onde esta o Road Poneglyph de Wano, abaixo da cidade submersa.", "atores": ["Kouzuki Sukiyaki", "Nico Robin", "Trafalgar Law"], "temas": ["Road Poneglyph", "Wano", "Poneglyphs"], "corpo": "O acesso ao Road Poneglyph passa pela cela do ex-xogum: quem controla o castelo controla a rota para Laugh Tale."}, {"id": "EV-1055-06", "fonte": "cap 1055", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_1055", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Com a leitura do Road Poneglyph de Wano, os Chapeus de Palha passam a conhecer tres dos quatro necessarios para chegar a Laugh Tale.", "atores": ["Nico Robin", "Chapeus de Palha"], "temas": ["Road Poneglyph", "Laugh Tale", "Poneglyphs"], "corpo": "Os outros dois sao os de Zou e de Big Mom, este ultimo copiado por Brook."}, {"id": "EV-1055-07", "fonte": "cap 1055", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_1055", "tipo": "fala", "confiabilidade": "canonico", "texto": "Sukiyaki diz que Pluton esta um pouco mais abaixo, mas que ele proprio nunca a viu e nao pode mostra-la.", "atores": ["Kouzuki Sukiyaki"], "temas": ["Pluton", "Wano", "armas ancestrais"], "corpo": "Ninguem vivo no relato afirma ter visto a arma; a existencia dela em Wano e conhecimento transmitido, nao observado."}, {"id": "EV-1055-08", "fonte": "cap 1055", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_1055", "tipo": "fala", "confiabilidade": "canonico", "texto": "Sukiyaki admite que Kaidou e Orochi souberam do Poneglyph subterraneo porque Jack, por ser homem-peixe, podia explorar as ruinas submersas.", "atores": ["Kouzuki Sukiyaki", "Jack", "Kaidou", "Kurozumi Orochi"], "temas": ["Road Poneglyph", "Wano", "Poneglyphs"], "corpo": "O segredo do xogunato foi furado por uma capacidade fisica banal, nao por leitura."}, {"id": "EV-1055-09", "fonte": "cap 1055", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_1055", "tipo": "fala", "confiabilidade": "canonico", "texto": "Robin questiona por que Oden queria abrir as fronteiras de Wano, se abri-las significava soltar Pluton no mundo.", "atores": ["Nico Robin", "Kouzuki Oden"], "temas": ["Pluton", "Wano", "fronteiras", "Kouzuki Oden"], "corpo": "A pergunta fica sem resposta no arco e e repetida no capitulo seguinte."}, {"id": "EV-1055-10", "fonte": "cap 1055", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_1055", "tipo": "fala", "confiabilidade": "canonico", "texto": "Sukiyaki diz que tudo o que contou lhe foi transmitido pela linha do xogunato e que desconhece o que Oden aprendeu nas viagens fora de Wano.", "atores": ["Kouzuki Sukiyaki", "Kouzuki Oden"], "temas": ["Wano", "Kouzuki", "Seculo Vazio", "transmissao"], "corpo": "Separa duas fontes de conhecimento: a heranca do xogunato, que para na localizacao da arma, e o que Oden viu com Roger, que ninguem em Wano herdou."}, {"id": "EV-1056-01", "fonte": "cap 1056", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_1056", "tipo": "fala", "confiabilidade": "canonico", "texto": "Robin conta aos Chapeus de Palha que Pluton existe e esta em Wano, mas que ela mesma nao chegou a ve-la.", "atores": ["Nico Robin"], "temas": ["Pluton", "Wano", "armas ancestrais"], "corpo": ""}, {"id": "EV-1056-02", "fonte": "cap 1056", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_1056", "tipo": "fala", "confiabilidade": "canonico", "texto": "Perguntado por Robin se quer obter Pluton, Luffy recusa, dizendo que nao precisa dela.", "atores": ["Monkey D. Luffy", "Nico Robin"], "temas": ["Pluton", "armas ancestrais", "Monkey D. Luffy"], "corpo": "Contraste com Crocodile, Spandam e o Governo Mundial: quem esta mais perto da arma e quem menos a quer."}, {"id": "EV-1056-03", "fonte": "cap 1056", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_1056", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Caribou escuta escondido a conversa e decide levar a certa pessoa nao identificada a informacao sobre Pluton e sobre Poseidon.", "atores": ["Caribou"], "temas": ["Pluton", "Poseidon", "armas ancestrais", "Caribou"], "corpo": "Duas localizacoes de armas ancestrais vazam juntas para um destinatario ainda anonimo."}, {"id": "EV-1056-04", "fonte": "cap 1056", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_1056", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Law entrega aos Piratas de Kid uma copia em papel do Road Poneglyph de Wano.", "atores": ["Trafalgar Law", "Eustass Kid"], "temas": ["Road Poneglyph", "Poneglyphs", "Laugh Tale"], "corpo": "A informacao do Road Poneglyph de Wano deixa de ser exclusiva dos Chapeus de Palha no mesmo capitulo em que e obtida."}, {"id": "EV-1056-05", "fonte": "cap 1056", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_1056", "tipo": "fala", "confiabilidade": "canonico", "texto": "Killer afirma que, para disputar o One Piece, os Piratas de Kid precisam encontrar um homem com marca de queimadura.", "atores": ["Killer", "Eustass Kid"], "temas": ["One Piece", "Laugh Tale", "Poneglyphs"], "corpo": "Pista de que a corrida por Laugh Tale depende de uma pessoa, nao so das quatro pedras."}, {"id": "EV-1056-06", "fonte": "cap 1056", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_1056", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Sukiyaki se revela aos netos e aos retentores e diz que passara alguns conhecimentos a Momonosuke antes de voltar de vez a reclusao.", "atores": ["Kouzuki Sukiyaki", "Kouzuki Momonosuke", "Kouzuki Hiyori"], "temas": ["Kouzuki", "Wano", "transmissao"], "corpo": "O capitulo nao especifica o conteudo; a wiki apenas conjectura que inclua a leitura dos Poneglyphs, e essa conjectura nao vira atomo."}, {"id": "EV-1065-01", "fonte": "cap 1065", "fonte_url": "https://onepiece.fandom.com/wiki/Great_Kingdom", "tipo": "fala", "confiabilidade": "canonico", "texto": "Vegapunk teoriza que o Reino Antigo era, 900 anos atras, uma civilizacao tecnologicamente muito mais avancada que a do presente.", "atores": ["Vegapunk"], "temas": ["Reino Antigo", "tecnologia"], "corpo": "Vegapunk se considera 500 anos a frente do seu tempo e ainda assim inferior ao Reino Antigo."}, {"id": "EV-1066-01", "fonte": "cap 1066", "fonte_url": "https://onepiece.fandom.com/wiki/Void_Century", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Qualquer conhecimento dos eventos reais do Seculo Vazio e tratado como sentenca de morte pelo Governo Mundial, independente da filiacao de quem sabe.", "temas": ["Governo Mundial", "Seculo Vazio"], "corpo": ""}, {"id": "EV-1066-02", "fonte": "cap 1066", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_1066", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Os livros que os arqueologos de Ohara jogaram no lago foram recolhidos por gigantes liderados por Jaguar D. Saul e levados para Elbaf.", "atores": ["Jaguar D. Saul", "Vegapunk", "Monkey D. Dragon"], "temas": ["Ohara", "biblioteca", "Elbaf"], "corpo": "O acervo de Ohara nao foi destruido: mudou de lugar. O bloco Ohara e o bloco Elbaf estao ligados por esse transporte."}, {"id": "EV-1066-03", "fonte": "cap 1066", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_1066", "tipo": "fala", "confiabilidade": "canonico", "texto": "Vegapunk visitou Elbaf em segredo e leu os livros salvos de Ohara, e por isso conhece a verdadeira historia.", "atores": ["Vegapunk", "Nico Robin"], "temas": ["Ohara", "verdadeira historia", "Elbaf"], "corpo": "Cadeia de custodia do conhecimento de Ohara ate a transmissao global de Egghead."}, {"id": "EV-1066-04", "fonte": "cap 1066", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_1066", "tipo": "fala", "confiabilidade": "canonico", "texto": "Shaka afirma que o Governo Mundial tentou apagar todo conhecimento do Reino Antigo com a intencao de que absolutamente ninguem carregasse os ideais dele.", "atores": ["Vegapunk", "Nico Robin"], "temas": ["Reino Antigo", "ideais", "Governo Mundial"], "notas": "Nao e duplicata de EV-0395-02: outro capitulo, outro falante, outra cadeia de evidencia. O vinculador deve trata-los como duas fontes que convergem.", "corpo": "Atestacao independente, oitocentos capitulos depois e por outra boca, da mesma tese que Clover enuncia em EV-0395-02."}, {"id": "EV-1069-01", "fonte": "cap 1069", "fonte_url": "https://onepiece.fandom.com/wiki/Nika", "tipo": "fala", "confiabilidade": "canonico", "texto": "Segundo Vegapunk, a existencia de Nika so esta registrada nos textos mais antigos, tendo sido apagada dos documentos modernos.", "atores": ["Vegapunk"], "temas": ["Nika", "apagamento", "textos antigos"], "corpo": ""}, {"id": "EV-1084-01", "fonte": "cap 1084", "fonte_url": "https://onepiece.fandom.com/wiki/Void_Century", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Lili, rainha de Arabasta no Seculo Vazio, foi a unica dos vinte soberanos a nao se mudar para Mary Geoise, e desapareceu antes de voltar para casa; seus registros foram apagados.", "atores": ["Nefertari Lili"], "temas": ["Lili", "Arabasta", "vinte reinos"], "corpo": ""}, {"id": "EV-1085-01", "fonte": "cap 1085", "fonte_url": "https://onepiece.fandom.com/wiki/Great_Kingdom", "tipo": "fala", "confiabilidade": "canonico", "texto": "Imu afirma que a Vontade de D. tem alguma relacao com o Reino Antigo.", "atores": ["Imu"], "temas": ["Vontade de D.", "Reino Antigo"], "corpo": ""}, {"id": "EV-1085-02", "fonte": "cap 1085", "fonte_url": "https://onepiece.fandom.com/wiki/Void_Century", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Imu se interessa por Lili por causa de um erro dela que levou os Poneglyphs a se espalharem pelo mundo.", "atores": ["Imu", "Nefertari Lili"], "temas": ["Lili", "Poneglyphs", "Imu"], "corpo": "Se os Poneglyphs se espalharam por erro, a rede de pistas que leva a Laugh Tale nao foi planejada por Joy Boy sozinho."}, {"id": "EV-1085-03", "fonte": "cap 1085", "fonte_url": "https://onepiece.fandom.com/wiki/Great_Pirate_Era", "tipo": "narracao", "confiabilidade": "canonico", "texto": "O ato de Lili de espalhar os Poneglyphs pelo mundo e tido como o que influenciou piratas a persegui-los em busca de tesouro.", "atores": ["Nefertari Lili"], "temas": ["Lili", "Poneglyphs", "Era dos Piratas"], "corpo": "A cacada moderna ao tesouro nasce de um acidente do Seculo Vazio, nao de um convite de Joy Boy."}, {"id": "EV-1086-01", "fonte": "cap 1086", "fonte_url": "https://onepiece.fandom.com/wiki/Ancient_Weapons", "tipo": "fala", "confiabilidade": "canonico", "texto": "Dragon estranha que o Governo so agora tenha usado uma arma capaz de apagar o Reino de Lulusia em segundos.", "atores": ["Monkey D. Dragon", "Emporio Ivankov"], "temas": ["armas ancestrais", "Lulusia", "Governo Mundial"], "corpo": ""}, {"id": "EV-1089-01", "fonte": "cap 1089", "fonte_url": "https://onepiece.fandom.com/wiki/Mother_Flame", "tipo": "narracao", "confiabilidade": "canonico", "texto": "York roubou uma amostra da Mother Flame e a enviou aos Cinco Anciaos e a Imu, que a usaram para energizar uma arma ancestral desconhecida.", "atores": ["York", "Imu", "Cinco Anciaos"], "temas": ["Mother Flame", "armas ancestrais", "Uranus"], "corpo": "A arma energizada nunca foi nomeada no texto; a suposicao de que e Uranus e do fandom, nao da obra."}, {"id": "EV-1113-02", "fonte": "cap 1113", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_1113", "tipo": "fala", "confiabilidade": "canonico", "texto": "Vegapunk anuncia ao mundo que o nivel do mar vai subir e que o mundo enfrentara um afundamento global.", "atores": ["Vegapunk"], "temas": ["Século Vazio", "afundamento", "profecia"], "corpo": "Contexto: transmissao global de Egghead. Liga o destino do Reino Antigo a um\nevento futuro, nao apenas passado."}, {"id": "EV-1114-01", "fonte": "cap 1114", "fonte_url": "https://onepiece.fandom.com/wiki/Void_Century", "tipo": "fala", "confiabilidade": "canonico", "texto": "Vegapunk revela ao mundo que Joy Boy veio do Reino Antigo, foi o primeiro pirata da historia e portava a Hito Hito no Mi Modelo Nika.", "atores": ["Vegapunk", "Joy Boy"], "temas": ["Joy Boy", "Reino Antigo", "Nika"], "corpo": ""}, {"id": "EV-1115-01", "fonte": "cap 1115", "fonte_url": "https://onepiece.fandom.com/wiki/Void_Century", "tipo": "fala", "confiabilidade": "canonico", "texto": "Vegapunk conclui que o uso das armas ancestrais elevou o nivel do mar em 200 metros e que as ilhas de hoje sao os topos dos continentes submersos.", "atores": ["Vegapunk"], "temas": ["afundamento", "armas ancestrais", "geografia"], "corpo": "O mundo atual e literalmente o campo de batalha inundado da guerra anterior."}, {"id": "EV-1115-02", "fonte": "cap 1115", "fonte_url": "https://onepiece.fandom.com/wiki/Void_Century", "tipo": "fala", "confiabilidade": "canonico", "texto": "Como as armas ancestrais ainda existem e esperam para se erguer de novo, Vegapunk conclui que a Grande Guerra do Seculo Vazio nunca chegou ao fim.", "atores": ["Vegapunk"], "temas": ["Grande Guerra", "armas ancestrais", "Seculo Vazio"], "corpo": ""}, {"id": "EV-1115-03", "fonte": "cap 1115", "fonte_url": "https://onepiece.fandom.com/wiki/Void_Century", "tipo": "fala", "confiabilidade": "canonico", "texto": "A derrota de Joy Boy marcou o fim do Reino Antigo e, com ele, o fim do Seculo Vazio.", "atores": ["Joy Boy"], "temas": ["Joy Boy", "Reino Antigo", "Seculo Vazio"], "corpo": ""}, {"id": "EV-1116-01", "fonte": "cap 1116", "fonte_url": "https://onepiece.fandom.com/wiki/Ancient_Weapons", "tipo": "fala", "confiabilidade": "canonico", "texto": "Joy Boy teve papel na preservacao das tres armas ancestrais para que geracoes futuras pudessem acessa-las e usa-las, por razoes ate hoje desconhecidas.", "atores": ["Joy Boy", "Vegapunk"], "temas": ["armas ancestrais", "Joy Boy", "heranca"], "corpo": "O lado que perdeu a guerra guardou as armas para o futuro em vez de destrui-las."}, {"id": "EV-1116-02", "fonte": "cap 1116", "fonte_url": "https://onepiece.fandom.com/wiki/Mother_Flame", "tipo": "fala", "confiabilidade": "canonico", "texto": "A Mother Flame, chama que Vegapunk criou para ser um sol proprio e fonte de energia ilimitada, esta incompleta.", "atores": ["Vegapunk"], "temas": ["Mother Flame", "energia", "sol"], "corpo": ""}, {"id": "EV-1117-01", "fonte": "cap 1117", "fonte_url": "https://onepiece.fandom.com/wiki/Void_Century", "tipo": "narracao", url": "https://onepiece.fandom.com/wiki/Void_Century", "tipo": "fala", "confiabilidade": "canonico", "texto": "Vegapunk afirma que o destino do mundo sera decidido por quem conseguir reivindicar o One Piece, e que quem o encontrar pode nao ser aquele que Joy Boy esperava.", "atores": ["Vegapunk", "Joy Boy"], "temas": ["One Piece", "destino", "Joy Boy"], "corpo": "O tesouro e explicitamente instrumental: quem o pega decide o destino do mundo. Isso e mais compativel com poder do que com relato."}, {"id": "EV-1122-01", "fonte": "cap 1122", "fonte_url": "https://onepiece.fandom.com/wiki/Joy_Boy", "tipo": "fala", "confiabilidade": "canonico", "texto": "Emet, o gigante de ferro que conheceu pessoalmente o Joy Boy original, chama Luffy de Joy Boy.", "atores": ["Emet", "Monkey D. Luffy", "Joy Boy"], "temas": ["Joy Boy", "Emet", "retorno"], "corpo": ""}, {"id": "EV-1122-02", "fonte": "cap 1122", "fonte_url": "https://onepiece.fandom.com/wiki/Joy_Boy", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Joy Boy selou parte do seu Haki do Conquistador dentro de Emet, atado em no, para ser liberado seculos depois se o robo estivesse em perigo mortal.", "atores": ["Joy Boy", "Emet"], "temas": ["Joy Boy", "Haki", "Emet", "heranca"], "corpo": "Joy Boy planejou intervencoes com seculos de antecedencia — habito relevante para julgar o que ele deixaria em Laugh Tale."}, {"id": "EV-1125-01", "fonte": "cap 1125", "fonte_url": "https://onepiece.fandom.com/wiki/Void_Century", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Um robo gigante blindado criado no inicio do Seculo Vazio subiu a Red Line e invadiu Mary Geoise 200 anos atras, perdendo energia antes de causar dano.", "atores": ["Emet"], "temas": ["Emet", "Mary Geoise", "Seculo Vazio"], "corpo": ""}, {"id": "EV-1125-02", "fonte": "cap 1125", "fonte_url": "https://onepiece.fandom.com/wiki/Void_Century", "tipo": "fala", "confiabilidade": "canonico", "texto": "Vegapunk nunca conseguiu replicar a energia antiga que move o robo Emet, comum no Seculo Vazio, e a maquina so voltou a vida quando os Tambores da Libertacao soaram.", "atores": ["Vegapunk", "Emet"], "temas": ["energia antiga", "tecnologia", "Tambores da Libertacao"], "corpo": "Existe uma tecnologia perdida cuja chave de ativacao e um evento, nao um comando."}, {"id": "EV-1125-03", "fonte": "cap 1125", "fonte_url": "https://onepiece.fandom.com/wiki/Void_Century", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Escravos constroem ha 700 anos as megaestruturas Tequila Wolf, Vodka Wolf, Rum Wolf e Bourbon Wolf por encomenda dos Nobres Mundiais.", "temas": ["Governo Mundial", "afundamento", "escravidao"], "corpo": "Obras de 700 anos sugerem que o Governo se prepara para algo de escala geologica."}, {"id": "EV-1131-01", "fonte": "cap 1131", "fonte_url": "https://onepiece.fandom.com/wiki/Treasure_Tree_Adam", "tipo": "narracao", "confiabilidade": "canonico", "texto": "A Arvore Adam de Elbaf tem tres niveis habitados com nomes proprios: o Submundo na base da ilha, o Mundo do Sol nos galhos medios e o Mundo Celeste na copa.", "temas": ["Elbaf", "Arvore Adam", "Harley", "tres mundos"], "corpo": "Os tres niveis tem os mesmos nomes dos tres Mundos do Harley. O lugar foi construido com a forma da profecia, ou a profecia foi nomeada a partir do lugar."}, {"id": "EV-1136-01", "fonte": "cap 1136", "fonte_url": "https://onepiece.fandom.com/wiki/Harley", "tipo": "narracao", "confiabilidade": "canonico", "texto": "O Harley, texto religioso de Elbaf, divide sua historia em tres Mundos, sendo que o Segundo Mundo corresponde ao Seculo Vazio.", "atores": ["Jarul"], "temas": ["Harley", "Elbaf", "profecia", "Seculo Vazio"], "corpo": ""}, {"id": "EV-1138-01", "fonte": "cap 1138", "fonte_url": "https://onepiece.fandom.com/wiki/Void_Century", "tipo": "imagem", "confiabilidade": "ambiguo", "texto": "O mural esculpido na casca fossilizada da Arvore Adam em Elbaf parece representar visualmente o texto do Harley, que registra dois mundos ja passados e um ainda por ocorrer.", "atores": ["Ripley"], "temas": ["Harley", "mural", "Elbaf", "profecia"], "corpo": "Ambiguo: a leiga que apresenta o mural relata a teoria corrente de que teria sido esculpido por criancas fantasiando."}, {"id": "EV-1138-02", "fonte": "cap 1138", "fonte_url": "https://thelibraryofohara.com/2025/01/30/chapter-secrets-one-piece-chapter-1138-giga-analysis/", "tipo": "imagem", "confiabilidade": "ambiguo", "texto": "Na porcao do Terceiro Mundo do mural aparece uma figura de Nika ao centro, cercada por representantes de varias racas e por barcos, enfrentando uma figura demoniaca que segura o Sol enquanto os demais tentam liberta-lo.", "atores": ["Monkey D. Luffy", "Emet"], "temas": ["mural", "profecia", "Elbaf", "racas"], "corpo": "Reescrito em 2026-08-11. A versao anterior listava Luffy em Gear 5, Emet, Loki e\nZunesha lutando contra um monstro de dois chifres. Duas fontes secundarias\ndivergem sobre quem esta desenhado:\n\n- a One Piece Wiki lista Loki e Zunesha entre as figuras;\n- a analise painel a painel do Library of Ohara nao menciona Loki (descreve dois\n  gigantes distintos, um antigo e um de Elbaf com elmo viking) e afirma\n  explicitamente que Zunesha NAO aparece, tratando a ausencia como estranha.\n\nOs dois chifres que atribuiamos ao monstro provavelmente vieram de Emet, que a\nmesma analise descreve como estando no mural com os dois chifres intactos.\n\nO atomo foi reduzido ao que as duas fontes afirmam em comum. Pendencia para quem\ntiver o volume 112 em maos: conferir o painel e decidir. Ate la, nao usar este\natomo para afirmar presenca de personagem especifico."}, {"id": "EV-1138-03", "fonte": "cap 1138", "fonte_url": "https://onepiece.fandom.com/wiki/Harley", "tipo": "narracao", "confiabilidade": "traducao_disputada", "texto": "No texto do Terceiro Mundo do Harley, o deus do sol danca e ri guiando o mundo ao seu fim, o sol retorna trazendo uma nova manha, e diz-se que dessa vez eles certamente se encontrarao.", "temas": ["Harley", "profecia", "sol", "fim do mundo"], "corpo": "Marcado traducao_disputada: o tradutor oficial da VIZ afirmou publicamente que o texto poetico admite multiplas traducoes, e a propria VIZ trocou termos entre a edicao semanal e a encadernada.\n\nId corrigido em 2026-08-11: os versos do Harley sao mostrados no capitulo 1138, nao no 1136. O 1136 e onde Jarul menciona o livro pela primeira vez. Como o id codifica o capitulo, o atomo estava mal enderecado desde a rodada 1."}, {"id": "EV-1138-04", "fonte": "cap 1138", "fonte_url": "https://thelibraryofohara.com/2025/02/06/a-complete-translation-breakdown-of-the-harley/", "tipo": "narracao", "confiabilidade": "ambiguo", "texto": "No verso do Terceiro Mundo do Harley, o dia esperado e escrito com o termo Dia da Promessa, o mesmo termo que a obra usa para o dia em que Noah cumprira seu proposito.", "temas": ["Harley", "Dia da Promessa", "Noah", "profecia"], "corpo": "Identidade lexical verificavel no japones. A inferencia de que se trata da mesma promessa e interpretacao, por isso ambiguo e nao canonico.\n\nId corrigido em 2026-08-11: os versos do Harley sao mostrados no capitulo 1138, nao no 1136. O 1136 e onde Jarul menciona o livro pela primeira vez. Como o id codifica o capitulo, o atomo estava mal enderecado desde a rodada 1."}, {"id": "EV-1138-05", "fonte": "cap 1138", "fonte_url": "https://thelibraryofohara.com/2025/02/06/a-complete-translation-breakdown-of-the-harley/", "tipo": "narracao", "confiabilidade": "traducao_disputada", "texto": "O mesmo verso do Terceiro Mundo diz ouvir as vozes da lua crescente, e ouvir vozes e a expressao com que Roger descreve ler os Poneglyphs.", "atores": ["Gol D. Roger"], "temas": ["Harley", "Poneglyphs", "leitura", "lua"], "corpo": "A leitura de que a lua crescente designa o cla Kouzuki, cujo simbolo e a lua crescente, e conjectura do analista. O que e solido: o verso amarra o desfecho a ouvir vozes, nao a chegar.\n\nId corrigido em 2026-08-11: os versos do Harley sao mostrados no capitulo 1138, nao no 1136. O 1136 e onde Jarul menciona o livro pela primeira vez. Como o id codifica o capitulo, o atomo estava mal enderecado desde a rodada 1."}, {"id": "EV-1138-06", "fonte": "cap 1138", "fonte_url": "https://thelibraryofohara.com/2025/02/06/a-complete-translation-breakdown-of-the-harley/", "tipo": "narracao", "confiabilidade": "traducao_disputada", "texto": "No Primeiro Mundo do Harley, a chama que havia dentro da terra e escrita com o mesmo kanji usado para a Mother Flame, e o sol proibido que a humanidade tocou por ganancia e lido como sendo essa mesma chama.", "temas": ["Harley", "Mother Flame", "sol", "tecnologia"], "corpo": "O kanji compartilhado e fato; a identificacao com a Mother Flame e leitura do analista.\n\nId corrigido em 2026-08-11: os versos do Harley sao mostrados no capitulo 1138, nao no 1136. O 1136 e onde Jarul menciona o livro pela primeira vez. Como o id codifica o capitulo, o atomo estava mal enderecado desde a rodada 1."}, {"id": "EV-1138-07", "fonte": "cap 1138", "fonte_url": "https://thelibraryofohara.com/2025/01/30/chapter-secrets-one-piece-chapter-1138-giga-analysis/", "tipo": "imagem", "confiabilidade": "ambiguo", "texto": "O painel do Primeiro Mundo do mural mostra uma civilizacao industrial: arranha-ceus com chamines soltando fumaca, engrenagens gigantes girando sob a cidade, um objeto em forma de foguete, monitores, e escravos carregando cargas de Mother Flame.", "temas": ["mural", "tecnologia", "Mother Flame", "escravidao"], "corpo": "Se o desenho for confiavel, houve uma civilizacao industrial anterior ao Seculo Vazio — e a Mother Flame que Vegapunk julga ter criado ja existia."}, {"id": "EV-1138-08", "fonte": "cap 1138", "fonte_url": "https://thelibraryofohara.com/2025/01/30/chapter-secrets-one-piece-chapter-1138-giga-analysis/", "tipo": "imagem", "confiabilidade": "ambiguo", "texto": "No mesmo painel um elevador sobe ate uma terra alta e se divide em dois lados: de um, escravos levam Mother Flames ate uma plataforma no ceu onde constroem um navio; de outro, pessoas ganham um halo sobre a cabeca conforme sobem e sao recebidas no topo por quem mora nos arranha-ceus.", "temas": ["mural", "escravidao", "Mary Geoise", "deuses"], "corpo": "A imagem de subir para se tornar deus, com escravos do outro lado da mesma subida, e a estrutura de Mary Geoise desenhada antes de Mary Geoise existir."}, {"id": "EV-1138-09", "fonte": "cap 1138", "fonte_url": "https://thelibraryofohara.com/2025/01/30/chapter-secrets-one-piece-chapter-1138-giga-analysis/", "tipo": "imagem", "confiabilidade": "ambiguo", "texto": "Todas as figuras humanas desenhadas no painel do Primeiro Mundo sao humanas, sem nenhuma outra raca representada, ao contrario do painel do Terceiro Mundo.", "temas": ["mural", "racas", "segregacao"], "corpo": "O contraste entre os paineis e o proprio argumento do mural: comeca so com humanos e termina com todas as racas juntas."}, {"id": "EV-1138-10", "fonte": "cap 1138", "fonte_url": "https://thelibraryofohara.com/2025/01/30/chapter-secrets-one-piece-chapter-1138-giga-analysis/", "tipo": "imagem", "confiabilidade": "ambiguo", "texto": "No painel do Primeiro Mundo a Lua aparece desenhada e cercada de Mother Flames, com outros planetas acima dela.", "temas": ["mural", "lua", "Mother Flame", "planetas"], "corpo": "Um dos poucos atomos do eixo lunar, que nenhuma hipotese do repositorio cobre."}, {"id": "EV-1138-11", "fonte": "cap 1138", "fonte_url": "https://thelibraryofohara.com/2025/01/30/chapter-secrets-one-piece-chapter-1138-giga-analysis/", "tipo": "imagem", "confiabilidade": "ambiguo", "texto": "No painel do Terceiro Mundo a figura demoniaca segura o Sol no centro da cena enquanto todos os demais tentam liberta-lo, e dela descem gotas de chuva e varias Mother Flames.", "temas": ["mural", "sol", "profecia", "Mother Flame"], "corpo": "O objetivo desenhado da coalizao nao e tomar um tesouro nem ler um texto: e soltar o sol que alguem esta segurando."}, {"id": "EV-1138-12", "fonte": "cap 1138", "fonte_url": "https://thelibraryofohara.com/2025/01/30/chapter-secrets-one-piece-chapter-1138-giga-analysis/", "tipo": "imagem", "confiabilidade": "ambiguo", "texto": "A figura de Nika no centro do painel do Terceiro Mundo carrega um escudo com o simbolo do Reino Antigo, e um dos barcos da coalizao traz o mesmo simbolo.", "temas": ["mural", "Nika", "Reino Antigo"], "corpo": "Liga graficamente Nika ao Reino Antigo no proprio desenho, sem depender da revelacao de Vegapunk em EV-1114-01."}, {"id": "EV-1138-13", "fonte": "cap 1138", "fonte_url": "https://thelibraryofohara.com/2025/01/30/chapter-secrets-one-piece-chapter-1138-giga-analysis/", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Os dois primeiros Mundos do Harley terminam com a formula de que eles nao puderam se reencontrar, e o Terceiro termina dizendo que dessa vez eles certamente conseguirao se reencontrar, sem que o texto identifique quem sao.", "temas": ["Harley", "profecia", "reencontro"], "corpo": "A obra estrutura tres eras como um reencontro adiado duas vezes. Quem sao 'eles' e a lacuna central do texto."}, {"id": "EV-1138-14", "fonte": "cap 1138", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_1138", "tipo": "fala", "confiabilidade": "canonico", "texto": "Ripley considera o mural um sonho de crianca precisamente porque ele mostra varias racas diferentes trabalhando juntas, algo de que os gigantes nao tem registro.", "atores": ["Ripley", "Franky"], "temas": ["mural", "racas", "Elbaf"], "corpo": "O motivo pelo qual quem vive la descarta o mural e exatamente o conteudo mais relevante dele."}, {"id": "EV-1144-01", "fonte": "cap 1144", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_1144", "tipo": "fala", "confiabilidade": "canonico", "texto": "Lilith estima que a instalacao cientifica encontrada num galho da Arvore Adam de Elbaf tem tres mil anos, e Ripley confirma que os gigantes nao tem registro algum desse edificio.", "atores": ["Lilith", "Franky", "Ripley"], "temas": ["Elbaf", "tecnologia", "Arvore Adam"], "corpo": "Tres mil anos e mais de tres vezes a distancia ate o Seculo Vazio. Nenhuma hipotese do repositorio acomoda tecnologia dessa idade."}, {"id": "EV-1144-02", "fonte": "cap 1144", "fonte_url": "https://onepiece.fandom.com/wiki/Treasure_Tree_Adam", "tipo": "narracao", "confiabilidade": "canonico", "texto": "A Arvore Adam de Elbaf e a mais antiga do mundo por pelo menos tres mil anos.", "temas": ["Elbaf", "Arvore Adam"], "corpo": ""}, {"id": "EV-1154-01", "fonte": "cap 1154", "fonte_url": "https://onepiece.fandom.com/wiki/Marshall_D._Teach", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Marshall D. Teach e filho do pirata Rocks D. Xebec e de sua esposa Eris.", "atores": ["Marshall D. Teach", "Rocks D. Xebec", "Eris"], "temas": ["Davy Jones", "linhagem", "Teach"], "corpo": ""}, {"id": "EV-1155-01", "fonte": "cap 1155", "fonte_url": "https://onepiece.fandom.com/wiki/Davy_D._Jones", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Descendentes de Davy D. Jones se estabeleceram em God Valley, e o Governo Mundial, ao descobri-los, os incluiu como alvos na cacada dos Nobres Mundiais.", "atores": ["Rocks D. Xebec", "Davy D. Jones"], "temas": ["Davy Jones", "God Valley", "Governo Mundial"], "corpo": ""}, {"id": "EV-1159-01", "fonte": "cap 1159", "fonte_url": "https://onepiece.fandom.com/wiki/Marshall_D._Teach", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Marshall D. Teach e membro da quase extinta Familia Davy e descendente de Davy D. Jones.", "atores": ["Marshall D. Teach", "Davy D. Jones"], "temas": ["Davy Jones", "linhagem", "Teach"], "corpo": "Este e o atomo que faltava quando o Curador escreveu uma previsao sobre Barba Negra a partir da memoria."}, {"id": "EV-1164-01", "fonte": "cap 1164", "fonte_url": "https://onepiece.fandom.com/wiki/Davy_D._Jones", "tipo": "fala", "confiabilidade": "canonico", "texto": "Rocks declara que Davy D. Jones foi certa vez Rei do Mundo, e Imu nega furiosamente que Jones tenha sido rei de coisa alguma.", "atores": ["Rocks D. Xebec", "Imu", "Davy D. Jones"], "temas": ["Davy Jones", "Imu", "rei do mundo"], "corpo": "Existe uma disputa sobre quem reinou antes do Governo Mundial — outra coroa alem da de Joy Boy."}, {"id": "EV-1164-02", "fonte": "cap 1164", "fonte_url": "https://onepiece.fandom.com/wiki/Davy_D._Jones", "tipo": "fala", "confiabilidade": "canonico", "texto": "Rocks pergunta a Imu se ele teme mais Davy Jones ou Joy Boy, e sugere que Imu vive aterrorizado com a possibilidade de alguem herdar a vontade de Jones e cumprir a promessa de que ele falava.", "atores": ["Rocks D. Xebec", "Imu"], "temas": ["Imu", "promessa", "Joy Boy", "Davy Jones"], "corpo": "Ha uma promessa antiga associada a Davy Jones, distinta da promessa feita a Ilha dos Homens-Peixe."}, {"id": "EV-1164-03", "fonte": "cap 1164", "fonte_url": "https://onepiece.fandom.com/wiki/Void_Century", "tipo": "fala", "confiabilidade": "canonico", "texto": "Depois que Imu transformou Xebec em demonio em God Valley, Eris comentou que ainda era cedo demais.", "atores": ["Eris", "Rocks D. Xebec", "Imu"], "temas": ["cedo demais", "tempo determinado", "God Valley"], "corpo": "A expressao 'cedo demais' reaparece fora da boca de Roger, o que enfraquece a leitura de que era piada dele."}, {"id": "EV-1172-01", "fonte": "cap 1172", "fonte_url": "https://onepiece.fandom.com/wiki/Harley", "tipo": "fala", "confiabilidade": "canonico", "texto": "Jarul afirma que a profecia do Harley sugere que o mundo sera dividido em dois, e com isso declara Elbaf inimiga do Governo Mundial.", "atores": ["Jarul"], "temas": ["Harley", "profecia", "Elbaf", "Governo Mundial"], "corpo": "'O mundo dividido em dois' e a previsao mais concreta em circulacao dentro da obra."}, {"id": "EV-1173-01", "fonte": "cap 1173", "fonte_url": "https://thelibraryofohara.com/2026/02/15/chapter-secrets-one-piece-chapters-1174-1175-in-depth-analysis/", "tipo": "fala", "confiabilidade": "traducao_disputada", "texto": "Imu declara que Elbaf e incompativel com o Governo afirmando literalmente que Elbaf e D.", "atores": ["Imu"], "temas": ["Elbaf", "Vontade de D.", "Imu"], "corpo": "Marcado traducao_disputada porque a construcao japonesa e estranha em traducao direta e admite a leitura de que Elbaf e alinhada ao cla, nao identica a ele."}, {"id": "EV-1174-01", "fonte": "cap 1174", "fonte_url": "https://thelibraryofohara.com/2026/02/15/chapter-secrets-one-piece-chapters-1174-1175-in-depth-analysis/", "tipo": "fala", "confiabilidade": "canonico", "texto": "Jarul recita que num dia de nevasca e trovao uma besta colossal cobrira os ceus e, junto com os Tambores da Libertacao, o Deus do Sol aparecera — e a cena cumpre a descricao enquanto ele fala.", "atores": ["Jarul", "Loki", "Monkey D. Luffy"], "temas": ["profecia", "Elbaf", "Tambores da Libertacao"], "corpo": "Primeira vez na obra em que uma predicao da tradicao de Elbaf se cumpre em cena. ATENCAO: o capitulo nao diz que essa passagem esta no Harley; atribui-la ao livro e leitura de terceiro."}, {"id": "EV-1175-01", "fonte": "cap 1175", "fonte_url": "https://onepiece.fandom.com/wiki/Nika", "tipo": "narracao", "confiabilidade": "ambiguo", "texto": "Uma das lendas de Elbaf descreve Nika como inimigo do Deus Guerreiro do pais, contra quem batalhou, e parte da juventude o teme como Deus da Destruicao.", "atores": ["Nika", "Loki"], "temas": ["Nika", "Elbaf", "destruicao"], "corpo": "Ambiguo: a propria obra diz que a leitura depende de quem conta a historia."}, {"id": "EV-1175-02", "fonte": "cap 1175", "fonte_url": "https://thelibraryofohara.com/2026/02/15/chapter-secrets-one-piece-chapters-1174-1175-in-depth-analysis/", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Na lenda de Elbaf o Deus da Guerra empunhava a arma Ragnir, transformava-se num dragao gigante e se opunha ao Deus do Sol, com o termo da oposicao vindo graficamente destacado no texto japones.", "atores": ["Loki", "Nika"], "temas": ["Nika", "Elbaf", "Deus da Guerra", "oposicao"], "corpo": "Refina EV-1175-01: o destaque tipografico indica enfase autoral deliberada de que estavam em lados contrarios. E a mesma figura que, no presente, carrega Nika nas costas."}, {"id": "EV-1175-03", "fonte": "cap 1175", "fonte_url": "https://thelibraryofohara.com/2026/02/15/chapter-secrets-one-piece-chapters-1174-1175-in-depth-analysis/", "tipo": "narracao", "confiabilidade": "canonico", "texto": "O confidente do Deus da Guerra, o esquilo Ratatoskr, transferiu-se para dentro da arma com o termo japones usado para transmigracao de almas, e la aguardou o retorno de seu mestre ate reconhecer Loki.", "atores": ["Loki", "Ratatoskr"], "temas": ["Akuma no Mi", "vontade", "heranca"], "corpo": "A obra estabelece como fato de mundo que o poder de uma fruta pode sobreviver ao portador dentro de um objeto, esperar seculos e escolher a quem se entrega."}, {"id": "EV-1179-01", "fonte": "cap 1179", "fonte_url": "https://onepiece.fandom.com/wiki/Marshall_D._Teach", "tipo": "narracao", "confiabilidade": "canonico", "texto": "A ascendencia Davy de Marshall D. Teach e conhecida por um numero pequeno de pessoas, entre elas Imu.", "atores": ["Imu", "Marshall D. Teach"], "temas": ["Imu", "Davy Jones", "Teach"], "corpo": ""}, {"id": "EV-1179-02", "fonte": "cap 1179", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_1179", "tipo": "fala", "confiabilidade": "canonico", "texto": "Imu diz aos Cinco Anciaos que devem descartar arrogancia, preguica e orgulho porque tudo o que esta acontecendo ja foi posto em movimento, enquanto pensa na promessa de retorno de Rocks, na execucao de Roger, no roubo da Gomu Gomu no Mi por Shanks, no nascimento de Shirahoshi, na fruta de Loki e na existencia de Luffy e de Barba Negra.", "atores": ["Imu", "Cinco Anciaos"], "temas": ["Imu", "destino", "cadeia causal"], "corpo": "O proprio antagonista enumera a cadeia e a trata como ja disparada. E o atomo mais forte a favor de um processo agendado — dito por quem tenta impedi-lo."}, {"id": "EV-1179-03", "fonte": "cap 1179", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_1179", "tipo": "fala", "confiabilidade": "canonico", "texto": "Garling observa que desde que Nika apareceu Mary Geoise vive uma sucessao de desastres, e se pergunta se aquilo e obra do destino ou mera coincidencia.", "atores": ["Figarland Garling"], "temas": ["destino", "Nika", "coincidencia"], "corpo": "O par destino/coincidencia reaparece na boca de outro figurao do Governo, onze capitulos antes de Imu usa-lo em EV-1190-02. E vocabulario recorrente da obra, nao jargao de fandom."}, {"id": "EV-1179-04", "fonte": "cap 1179", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_1179", "tipo": "fala", "confiabilidade": "canonico", "texto": "Imu exige saber por que Joy Boy e Davy Jones continuam a faze-lo sofrer, dizendo que tudo o que ele quer e Vivi.", "atores": ["Imu", "Joy Boy", "Davy D. Jones", "Nefertari Vivi"], "temas": ["Imu", "Joy Boy", "Davy Jones", "Vivi"], "corpo": "Os dois nomes que Rocks usou para provocar Imu em EV-1164-02 reaparecem juntos, agora sem provocador — e o desejo declarado dele e uma pessoa."}, {"id": "EV-1180-04", "fonte": "cap 1180", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_1180", "tipo": "imagem", "confiabilidade": "ambiguo", "texto": "Imu demonstra em Elbaf um poder ligado a sua Akuma no Mi, apresentado como superior ao Haki do Conquistador.", "atores": ["Imu"], "temas": ["Imu", "poder", "Elbaf"], "corpo": "Marcado como ambiguo: a natureza exata da fruta ainda nao foi nomeada no texto."}, {"id": "EV-1181-01", "fonte": "cap 1181", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_1181", "tipo": "fala", "confiabilidade": "canonico", "texto": "Imu descreve seu poder Omen como algo que reside em todas as coisas e cujos fundamentos sao Corrupcao, Pacto e inveja, formando o poder da Dominacao.", "atores": ["Imu", "Loki"], "temas": ["Imu", "Omen", "Dominacao", "poder"], "corpo": ""}, {"id": "EV-1181-02", "fonte": "cap 1181", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_1181", "tipo": "fala", "confiabilidade": "canonico", "texto": "Imu declara que a Dominacao e a unica bem-aventuranca verdadeira do mundo, e ao dizer isso recorda uma conversa com Joy Boy e grita o nome dele com raiva.", "atores": ["Imu", "Joy Boy"], "temas": ["Imu", "Joy Boy", "Dominacao"], "corpo": "A oposicao entre os dois e apresentada como disputa de teses sobre o mundo, nao apenas de forcas."}, {"id": "EV-1181-03", "fonte": "cap 1181", "fonte_url": "https://onepiece.fandom.com/wiki/Joy_Boy", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Imu e Joy Boy se conheceram e a principio pareciam estar em bons termos, mas Imu desenvolveu por ele desprezo e medo profundos.", "atores": ["Imu", "Joy Boy"], "temas": ["Imu", "Joy Boy"], "corpo": ""}, {"id": "EV-1188-01", "fonte": "cap 1188", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_1188", "tipo": "fala", "confiabilidade": "canonico", "texto": "Imu diz a Luffy que ele nao e Joy Boy, porque Joy Boy era muito mais forte do que Luffy e agora.", "atores": ["Imu", "Monkey D. Luffy", "Joy Boy"], "temas": ["Imu", "Joy Boy", "Luffy"], "corpo": ""}, {"id": "EV-1190-01", "fonte": "cap 1190", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_1190", "tipo": "fala", "confiabilidade": "canonico", "texto": "Gaban afirma que a insistencia de Imu em matar Luffy prova o que Roger disse sobre terem chegado cedo demais, e que Luffy e a pessoa que ele e outros grandes nomes esperavam.", "atores": ["Scopper Gaban", "Imu", "Monkey D. Luffy"], "temas": ["cedo demais", "Roger", "Luffy"], "corpo": "Um sobrevivente da tripulacao de Roger interpreta o 'cedo demais' como sendo sobre uma pessoa que faltava nascer."}, {"id": "EV-1190-02", "fonte": "cap 1190", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_1190", "tipo": "fala", "confiabilidade": "canonico", "texto": "Imu admite que Luffy e mesmo quem esperavam e diz que foi tolo por ter confundido varias coincidencias com destino.", "atores": ["Imu", "Monkey D. Luffy"], "temas": ["Imu", "destino", "Luffy"], "corpo": ""}, {"id": "EV-1190-03", "fonte": "cap 1190", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_1190", "tipo": "fala", "confiabilidade": "canonico", "texto": "Gaban diz a Imu que conhece as palavras de Joy Boy, mas que nao tem intencao de seguir as palavras de um homem que nao conheceu: sua motivacao e realizar o sonho do seu capitao.", "atores": ["Scopper Gaban", "Imu", "Joy Boy"], "temas": ["Joy Boy", "palavras", "Laugh Tale", "Roger"], "corpo": "Peca central: o que a tripulacao de Roger trouxe de Laugh Tale inclui palavras de Joy Boy, e elas pedem alguma coisa de quem as le."}, {"id": "EV-1190-04", "fonte": "cap 1190", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_1190", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Imu recorda ter ordenado pessoalmente o encobrimento do verdadeiro nome de Gol D. Roger por ele ser um D.", "atores": ["Imu", "Gol D. Roger"], "temas": ["Imu", "Vontade de D.", "apagamento"], "corpo": ""}, {"id": "EV-1190-05", "fonte": "cap 1190", "fonte_url": "https://thelibraryofohara.com/2026/08/10/chapter-secrets-one-piece-chapters-1189-1190-in-depth-analysis/", "tipo": "fala", "confiabilidade": "canonico", "texto": "Gaban afirma que Luffy e o homem que sua geracao inteira esperava, e nomeia Rayleigh, Crocus, Shanks, Oden e Barba Branca como os que esperavam.", "atores": ["Scopper Gaban", "Monkey D. Luffy"], "temas": ["cedo demais", "Luffy", "sucessao"], "corpo": "A espera nao era de uma tripulacao so: cinco figuras de gerações diferentes convergiam na mesma expectativa."}], "hipoteses": [{"id": "H-05", "enunciado": "O One Piece e o legado dirigido de Joy Boy: palavras, um pedido e as condicoes de uma promessa, endereçados a quem chegasse depois dele.", "escopo": "one_piece", "status": "viva", "prior": 0.2, "apoia": [{"ev": "EV-1190-03", "peso": 0.5, "como": "Gaban diz a Imu que conhece as palavras de Joy Boy mas nao tem intencao de seguir as palavras de um homem que nao conheceu: o que a tripulacao de Roger trouxe de Laugh Tale sao palavras que pedem algo de quem as le."}, {"ev": "EV-0649-01", "peso": 0.35, "como": "Joy Boy escreveu num Poneglyph da Sea Forest um pedido de desculpas por nao ter cumprido sua parte da promessa: o unico texto dele que o leitor conhece e mensagem pessoal endereçada, nao inventario nem manual."}, {"ev": "EV-1122-02", "peso": 0.35, "como": "Joy Boy selou parte do seu Haki do Conquistador dentro de Emet atado em no, para ser liberado seculos depois: ele planejava intervencoes dirigidas a quem viesse muito tempo depois."}, {"ev": "EV-0972-01", "peso": 0.3, "como": "Ao aprender a verdadeira historia Roger riu e declarou que gostaria de ter vivido na mesma epoca que Joy Boy: a reacao natural de quem acaba de ler alguem, nao de quem encontrou um objeto."}, {"ev": "EV-1121-01", "peso": 0.3, "como": "Vegapunk afirma que quem encontrar o One Piece pode nao ser aquele que Joy Boy esperava, o que so faz sentido se a coisa deixada tiver um destinatario pretendido."}, {"ev": "EV-0506-02", "peso": 0.25, "como": "Na execucao Roger declarou que, tal como Joy Boy, havia escondido seu tesouro para que o proximo Rei dos Piratas o encontrasse: ele leu o gesto de Joy Boy como endereçado a um sucessor e o repetiu."}, {"ev": "EV-1116-01", "peso": 0.2, "como": "Joy Boy teve papel na preservacao das tres armas ancestrais para que geracoes futuras pudessem acessa-las, comportamento de quem legou instrucoes e meios a um sucessor."}, {"ev": "EV-0649-07", "peso": 0.35, "como": "Neptune diz que a mensagem deixada por Joy Boy era enderecada a princesa sereia que vivia na ilha naquela epoca: o unico texto conhecido dele tem destinatario nomeado, que e exatamente o enderecamento de que esta hipotese depende."}, {"ev": "EV-0628-01", "peso": 0.35, "como": "Robin observa que o poneglyph da Sea Forest tem forma de carta de desculpas e menciona alguem chamado Joy Boy, em vez do registro historico que ela ja lera nos outros: o legado dele aparece como mensagem pessoal, palavras e pedido, e nao como arquivo."}, {"ev": "EV-0649-03", "peso": 0.3, "como": "Neptune diz que a parte da Ilha dos Homens-Peixe na promessa era vigiar Noah e mante-la em seguranca: a promessa tem partes atribuidas a contrapartes, que e a forma de um legado com condicoes enderecadas a quem viesse depois."}, {"ev": "EV-0641-02", "peso": 0.25, "como": "Neptune explica que seculos atras foi feita uma promessa a um grande homem de manter o navio no fundo do mar e esperar, protegendo-o: o que Joy Boy deixou tem forma de pedido aceito por terceiros, e nao de objeto."}, {"ev": "EV-0649-05", "peso": 0.25, "como": "Neptune responde a Robin que Joy Boy nao tinha o poder de controlar Reis do Mar e que essa habilidade pertencia a princesa sereia daquela epoca: o que ele podia legar eram palavras e um pedido dirigidos a quem tinha o poder, nao o poder."}, {"ev": "EV-0653-01", "peso": 0.25, "como": "Shirahoshi pede para ver uma floresta de verdade na superficie e Luffy fecha com ela uma promessa de mindinho de leva-la ate la: a pendencia que a obra transmite ao sucessor tem forma de promessa assumida diante da mesma destinataria, e nao de objeto tomado."}, {"ev": "EV-0621-02", "peso": 0.2, "como": "Neptune diz que o mundo com que sua esposa sonha remonta a centenas de anos e que ancestrais distantes tentaram a mesma coisa, que terminou em sonho desperdicado e arrependimento: o que sobrou daquela tentativa e arrependimento, coerente com um legado cujo unico texto conhecido e um pedido de desculpas."}, {"ev": "EV-0395-05", "peso": 0.25, "como": "Clover afirma que a mensagem foi gravada em pedra porque, se tivesse sido escrita em papel, teria se perdido: a escolha do suporte e de quem endereca um recado a leitores muito distantes no tempo, que e a forma de um legado dirigido."}, {"ev": "EV-1066-04", "peso": 0.2, "como": "Shaka afirma que o Governo Mundial tentou apagar todo conhecimento do Reino Antigo com a intencao de que absolutamente ninguem carregasse os ideais dele: o que se teme e alguem assumir esses ideais, e ideal assumido por um herdeiro e legado dirigido, nao cronica."}], "contradiz": [{"ev": "EV-1085-03", "peso": 0.35, "como": "O ato de Lili de espalhar os Poneglyphs pelo mundo e tido como o que influenciou piratas a persegui-los em busca de tesouro: a rede de pistas que leva ao tesouro e acidente de outra pessoa, nao endereçamento de Joy Boy."}, {"ev": "EV-0576-01", "peso": 0.25, "como": "Barba Branca declarou que achar o One Piece desencadeara uma guerra indizivel que engolfara o mundo inteiro, efeito dificil de derivar de um recado por mais importante que seja."}, {"ev": "EV-1188-01", "peso": 0.15, "como": "Imu diz a Luffy que ele nao e Joy Boy porque Joy Boy era muito mais forte, sugerindo que o que importa na sucessao e capacidade de combate e nao a leitura de um legado."}, {"ev": "EV-0649-04", "peso": 0.3, "como": "Neptune afirma que nao conhece os detalhes da promessa e que sabe apenas, por lenda transmitida na familia real, que um dia alguem viria cumprir em lugar de Joy Boy o que ele prometeu: se as condicoes se perderam na propria contraparte, o que ele legou nao foi um conjunto de condicoes transmissiveis."}, {"ev": "EV-0632-01", "peso": 0.15, "como": "Vander Decken IX afirma que ha muito tempo o povo da Ilha dos Homens-Peixe construiu o navio gigante Noah: o meio material da promessa e obra de terceiros, e nao parte do que Joy Boy deixou."}, {"ev": "EV-0395-10", "peso": 0.25, "como": "Clover afirma que o povo do reino antigo, ao saber que seria derrotado, gravou os poneglyphs para que o mundo soubesse o que havia acontecido: o destinatario declarado e o mundo inteiro, e nao a pessoa esperada que este enunciado exige."}], "prediz": [{"texto": "Se verdadeiro, o conteudo revelado em Laugh Tale tera forma de mensagem dirigida a quem chegar, e Luffy respondera com uma decisao explicita em vez de tomar posse de algo.", "st
