fandom.com/wiki/Void_Century", "tipo": "fala", "confiabilidade": "canonico", "texto": "Vegapunk afirma que o destino do mundo sera decidido por quem conseguir reivindicar o One Piece, e que quem o encontrar pode nao ser aquele que Joy Boy esperava.", "atores": ["Vegapunk", "Joy Boy"], "temas": ["One Piece", "destino", "Joy Boy"], "corpo": "O tesouro e explicitamente instrumental: quem o pega decide o destino do mundo. Isso e mais compativel com poder do que com relato."}, {"id": "EV-1122-01", "fonte": "cap 1122", "fonte_url": "https://onepiece.fandom.com/wiki/Joy_Boy", "tipo": "fala", "confiabilidade": "canonico", "texto": "Emet, o gigante de ferro que conheceu pessoalmente o Joy Boy original, chama Luffy de Joy Boy.", "atores": ["Emet", "Monkey D. Luffy", "Joy Boy"], "temas": ["Joy Boy", "Emet", "retorno"], "corpo": ""}, {"id": "EV-1122-02", "fonte": "cap 1122", "fonte_url": "https://onepiece.fandom.com/wiki/Joy_Boy", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Joy Boy selou parte do seu Haki do Conquistador dentro de Emet, atado em no, para ser liberado seculos depois se o robo estivesse em perigo mortal.", "atores": ["Joy Boy", "Emet"], "temas": ["Joy Boy", "Haki", "Emet", "heranca"], "corpo": "Joy Boy planejou intervencoes com seculos de antecedencia — habito relevante para julgar o que ele deixaria em Laugh Tale."}, {"id": "EV-1125-01", "fonte": "cap 1125", "fonte_url": "https://onepiece.fandom.com/wiki/Void_Century", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Um robo gigante blindado criado no inicio do Seculo Vazio subiu a Red Line e invadiu Mary Geoise 200 anos atras, perdendo energia antes de causar dano.", "atores": ["Emet"], "temas": ["Emet", "Mary Geoise", "Seculo Vazio"], "corpo": ""}, {"id": "EV-1125-02", "fonte": "cap 1125", "fonte_url": "https://onepiece.fandom.com/wiki/Void_Century", "tipo": "fala", "confiabilidade": "canonico", "texto": "Vegapunk nunca conseguiu replicar a energia antiga que move o robo Emet, comum ario nem manual."}, {"ev": "EV-1122-02", "peso": 0.35, "como": "Joy Boy selou parte do seu Haki do Conquistador dentro de Emet atado em no, para ser liberado seculos depois: ele planejava intervencoes dirigidas a quem viesse muito tempo depois."}, {"ev": "EV-0972-01", "peso": 0.3, "como": "Ao aprender a verdadeira historia Roger achou hilaria e declarou que gostaria de ter vivido na mesma epoca que Joy Boy: a reacao natural de quem acaba de ler alguem, nao de quem encontrou um objeto."}, {"ev": "EV-1121-01", "peso": 0.3, "como": "Vegapunk afirma que quem encontrar o One Piece pode nao ser aquele que Joy Boy esperava, o que so faz sentido se a coisa deixada tiver um destinatario pretendido."}, {"ev": "EV-0506-02", "peso": 0.25, "como": "Na execucao Roger declarou que, tal como Joy Boy, havia escondido seu tesouro para que o proximo Rei dos Piratas o encontrasse: ele leu o gesto de Joy Boy como endereçado a um sucessor e o repetiu."}, {"ev": "EV-1116-01", "peso": 0.2, "como": "Joy Boy teve papel na preservacao das tres armas ancestrais para que geracoes futuras pudessem acessa-las, comportamento de quem legou instrucoes e meios a um sucessor."}], "contradiz": [{"ev": "EV-1085-03", "peso": 0.35, "como": "O ato de Lili de espalhar os Poneglyphs pelo mundo e tido como o que influenciou piratas a persegui-los em busca de tesouro: a rede de pistas que leva ao tesouro e acidente de outra pessoa, nao endereçamento de Joy Boy."}, {"ev": "EV-0576-01", "peso": 0.25, "como": "Barba Branca declarou que achar o One Piece desencadeara uma guerra indizivel que engolfara o mundo inteiro, efeito dificil de derivar de um recado por mais importante que seja."}, {"ev": "EV-1188-01", "peso": 0.15, "como": "Imu diz a Luffy que ele nao e Joy Boy porque Joy Boy era muito mais forte, sugerindo que o que importa na sucessao e capacidade de combate e nao a leitura de um legado."}], "prediz": [{"texto": "Se verdadeiro, o conteudo revelado em Laugh Tale tera forma de mensagem dirigida a quem chegar, e Luffy respondera com uma decisao explicita em vez de tomar posse de algo.", "status": "aberta"}, {"texto": "Se verdadeiro, o texto de Laugh Tale tera vocativo dirigido a quem chega e enunciara uma condicao a cumprir, e nenhum poder ou arma sera concedido por alcanca-lo — as duas clausulas juntas, que e o que separa esta hipotese de H-03, H-04 e H-08.", "status": "aberta"}], "concorrentes": ["H-01", "H-02", "H-03", "H-04", "H-06", "H-07", "H-08"], "redteam_ultimo": "2026-08-11", "corpo": "## O caso a favor\n\nO capitulo 1190 mudou o tabuleiro: Gaban nao diz que conhece a historia do mundo,\ndiz que conhece as palavras de Joy Boy, e que se recusa a segui-las. Palavras que\npodem ser seguidas ou recusadas sao instrucao dirigida, nao cronica. Isso tambem\nexplica o riso melhor que as concorrentes: le-se uma carta de alguem que morreu ha\n800 anos e que ja sabia que chegariam tarde.\n\n## O caso contra (Red Team, 2026-08-11)\n\nVeredito: ferida. Seis suposicoes nao evidenciadas. Tres golpes, dois aceitos:\n\n1. **Colapso em H-04** — mesmos atomos-ancora, mesmo formato de achado. O unico\n   discriminante e o endereçamento. Aceito em parte: o Curador discorda de que\n   nenhum atomo atribua destinatario, porque EV-1121-01 diz literalmente que quem\n   encontrar pode nao ser aquele que Joy Boy esperava, e isso pressupoe esperado.\n   Mas o ataque esta certo em que o discriminante e fino, e a previsao (2) foi\n   reescrita com duas clausulas para forcar a separacao.\n2. **Previsao (2) decorativa** — aceito e substituido.\n3. **Ponto unico de falha em EV-1190-03** — aceito. Sem esse atomo a hipotese perde\n   a palavra 'palavras' e desaba em H-04. E um unico capitulo, e recente.\n\nO Red Team recomendou deflacionar H-05 para baixo de H-04. O Curador deflacionou ate\no empate, nao abaixo: EV-1190-03 e canonico e recente, e nenhum atomo o contradiz.\n\n## O que a mataria\n\nUma revelacao em que o achado de Laugh Tale opere sozinho, sem exigir decisao de\nninguem — ou em que Joy Boy nao tenha deixado texto algum na ilha.\n\n## Nota de curadoria\n\nPrior 0.25 -&gt; 0.20, empatando com H-04. Motivo escrito: o endereçamento continua\nsendo a leitura mais economica de EV-1190-03 e EV-1121-01, mas a hipotese depende de\num atomo unico e nao explica sozinha o efeito global que EV-0576-01 preve. Entrou\nEV-1085-03 como contradicao: parte da rede que leva ao tesouro e acidente de Lili.", "redteam": "# Red team — H-05\n\n## Ataque 2026-08-11\n\n### Contra-evidência encontrada\n\n- EV-1190-03 — É o átomo de que a hipótese mais depende e ele corta contra ela. Gaban diz a Imu que conhece as palavras de Joy Boy, mas que **não tem intenção de seguir as palavras de um homem que não conheceu**: sua motivação é realizar o sonho do seu capitão. Um legado *dirigido* é definido pelo vínculo que cria em quem o recebe; aqui o único leitor documentado das palavras de Joy Boy declara em voz alta que o endereçamento não o obriga. Pior: o átomo não afirma que essas palavras vieram de Laugh Tale — isso é comentário do extrator, não o texto do átomo.\n- EV-1121-01 — Vegapunk afirma que o destino do mundo será decidido por quem conseguir **reivindicar** o One Piece, e que quem o encontrar pode não ser aquele que Joy Boy esperava. Isso fere a previsão (1) em cheio: o verbo canônico é reivindicar, isto é, tomar posse, e não responder; e a própria fala diz que quem chega pode não ser o esperado, ou seja, a expectativa de Joy Boy não seleciona nem vincula o destinatário.\n- EV-0972-02 — Os Piratas de Roger leram a mensagem em Laugh Tale, aprenderam a **verdadeira história** e decidiram deixar tudo como estava ao perceber que tinham chegado cedo demais. O único átomo que diz \"mensagem\" descreve o conteúdo dela como história verdadeira, não como pedido nem como condições. Circularidade: \"mensagem\" só vira \"mensagem endereçada a quem chegasse depois\" se a hipótese já estiver pressuposta. Este é exatamente o átomo que sustenta H-04.\n- EV-0966-01 — Roger especulou que o Governo Mundial proíbe a pesquisa dos Poneglyphs justamente para que ninguém chegue a Laugh Tale e **encontre o que está escondido lá**. O vocabulário interno é de coisa escondida a ser encontrada. Um legado deliberadamente endereçado a quem chegasse depois seria sinalizado, não escondido.\n- EV-1085-02 — Imu se interessa por Lili por causa de um **erro** dela que levou os Poneglyphs a se espalharem pelo mundo. A rede de pistas que leva a Laugh Tale, que a hipótese lê como canal de endereçamento, é atribuída em texto a um acidente histórico alheio a Joy Boy. Endereçamento por acidente não é endereçamento.\n- EV-1122-02 — Joy Boy selou parte do seu Haki do Conquistador dentro de Emet, atado em nó, para ser liberado séculos depois se o robô estivesse em perigo mortal. Este é o método de Joy Boy para alcançar o futuro efetivamente mostrado na obra: capacidade selada com gatilho automático, sem destinatário nomeado, sem pedido e sem leitura. Ele enfraquece a inferência de que o que Joy Boy deixaria em Laugh Tale teria forma de palavra dirigida.\n- EV-1116-01 — Joy Boy teve papel na preservação das três armas ancestrais para que gerações futuras pudessem acessá-las e **usá-las**, por razões até hoje desconhecidas. O legado de Joy Boy documentado na obra é de coisas utilizáveis entregues ao futuro, não de palavras e condições — o que serve melhor a H-03 e H-06 do que a H-05.\n- EV-0967-11 — A tripulação de Roger **gargalha** ao encontrar o tesouro em Laugh Tale, e Roger comenta que chegaram cedo demais. Gargalhada coletiva é reação pobre para um pedido acompanhado das condições de uma promessa; a hipótese herda de H-04 a mesma dificuldade com o riso, sem resolvê-la.\n- EV-1164-02 — Rocks pergunta a Imu se ele teme mais Davy Jones ou Joy Boy e sugere que Imu vive aterrorizado com a possibilidade de alguém herdar a vontade de Jones e cumprir **a promessa de que ele falava**. Existe portanto uma promessa antiga que não é a de Joy Boy à Ilha dos Homens-Peixe. O enunciado de H-05 usa \"uma promessa\" no singular como se o corpus tivesse uma só.\n\n### Veredito\n\nferida\n\nTrês feridas, em ordem de gravidade:\n\n1. **Quase colapsa em H-04.** Os dois enunciados partilham os mesmos átomos-âncora (EV-0972-02, EV-0301-01, EV-0507-01) e a mesma forma de achado — texto em Laugh Tale. O único discriminante é o *endereçamento*: H-04 diz registro, H-05 diz mensagem dirigida. Nenhum átomo do corpus atribui destinatário ao texto de Laugh Tale. O que mais se aproxima disso, EV-1121-01, fala de \"aquele que Joy Boy esperava\" e, na mesma frase, descreve o ato relevante como reivindicar — ou seja, o único átomo que sugere destinatário é também contra-evidência da previsão (1). Enquanto o discriminante não tiver átomo próprio, H-05 é H-04 mais uma camada interpretativa, e deve herdar prior *menor*, não o maior do repositório.\n\n2. **Previsão (2) é decorativa.** \"Outro sobrevivente dos Piratas de Roger citará textualmente palavras de Joy Boy antes do fim da saga\" pede algo que EV-1190-03 já deixou praticamente executado: um sobrevivente da tripulação de Roger já declarou, no capítulo mais recente do corpus e em confronto direto com Imu, que **conhece as palavras de Joy Boy**. Falta só a obra transcrevê-las, o que é escolha de encenação, não teste. Pior, a previsão não discrimina: H-03, H-04 e H-08 sobrevivem intactas a Gaban citando Joy Boy. Exijo substituição por algo que possa falhar e que separe H-05 das vizinhas, no espírito de: *o texto de Laugh Tale conterá vocativo ou imperativo dirigido a quem chega e nomeará uma condição a ser cumprida por ele; e o achado não conferirá arma, poder nem capacidade nova a quem o obtiver*. A segunda cláusula é o que separa de H-03/H-06; a primeira, de H-04.\n\n3. **Previsão (1) tem metade morta e metade contestada.** A primeira metade (\"conteúdo em forma de mensagem dirigida\") é satisfeita também por H-04 e por H-02, logo não testa H-05. A segunda (\"Luffy responderá com decisão explícita em vez de tom s e portanto sem poder discriminante.\n\nCadeia frágil: retirado EV-1190-03, a hipótese perde a palavra \"palavras\" e desaba em H-04. Ponto único de falha declarado.\n\n### Concorrente mais econômico\n\nH-04\n\nH-04 explica o mesmo conjunto de átomos-âncora — EV-0972-02 (leram a mensagem, aprenderam a verdadeira história), EV-0507-01, EV-0301-01 — sem precisar de destinatário, de pedido, de condições nem da unificação das promessas: quatro peças a menos. Tudo que H-05 acrescenta a H-04 é o endereçamento, e o endereçamento é justamente o que não tem átomo próprio no corpus. Enquanto isso, H-04 carrega uma previsão mais arriscada e mais barata de falsear (Robin indispensável na chegada). Recomendação ao Curador: deflacionar o prior de H-05 para baixo do de H-04 até que apareça átomo em que o texto de Laugh Tale se dirija a alguém.\n", "posterior": 0.701343906594001, "fatia": 0.3640644692994967}, {"id": "H-08", "enunciado": "O One Piece e o gatilho de um evento agendado: chegar la com a pessoa certa executa a virada que o Harley chama de Terceiro Mundo, independentemente do que esteja escrito ou guardado.", "escopo": "one_piece", "status": "viva", "prior": 0.13, "apoia": [{"ev": "EV-1190-01", "peso": 0.4, "como": "Gaban afirma que a insistencia de Imu em matar Luffy prova o que Roger disse sobre terem chegado cedo demais e que Luffy e a pessoa que eles esperavam: a condicao que faltava era uma pessoa, nao um objeto."}, {"ev": "EV-0968-01", "peso": 0.4, "como": "Roger e Oden ouviram os Reis do Mar falarem do nascimento, dali a 25 anos, de alguem que os lideraria junto com a nova Poseidon, o que da data e destinatario ao cedo demais."}, {"ev": "EV-0968-02", "peso": 0.35, "como": "Ao saber que tinham chegado cedo demais, Roger planejou gerar um filho que encontrasse o One Piece depois dele: a resposta dele a restricao foi produzir uma pessoa, o que so faz sentido se a condicao pendente for pessoal e datada."}, {"ev": "EV-1136-02", "peso": 0.3, "como": "No texto do Tercei  reduzido de 0.35 para 0.30 e a hipotese foi reescorada sem depender dele.\n2. **Circularidade**: nenhum dos atomos do Harley menciona Laugh Tale ou o One Piece.\n   A ponte e fornecida pela hipotese. Por isso a previsao (2) foi trocada: agora\n   exige que a obra faca a ponte explicitamente, o que e o teste da circularidade.\n\nA previsao (1) perdeu a clausula 'sem depender de leitura previa', que colidia com\nEV-0301-01 e EV-0818-01 — os dois entraram como contradicao.\n\n## O que a mataria\n\nA fala de Imu em EV-1190-02 ja e um golpe direto: ele proprio classifica a leitura de\ndestino como erro de quem confunde coincidencia com designo.\n\n## Nota de curadoria\n\nPrior 0.15 -&gt; 0.13. Ganhou EV-0968-02, que e forte e canonico, mas perdeu peso na\ncamada profetica e absorveu duas contradicoes novas.\n\n## Revisao de 2026-08-11 (rodada 3)\n\nA analise gramatical do texto japones do Harley mexeu nas duas direcoes ao mesmo\ntempo, e o Curador registra as duas:\n\n**A favor.** O Red Team tinha declarado circularidade — nenhum atomo do Harley\nmencionava Laugh Tale ou o One Piece, e a ponte era fornecida pela hipotese. Isso\ncaiu: o verso usa literalmente 約束の日, Dia da Promessa, que e o mesmo termo com que\na obra ja se referia ao dia em que Noah cumprira seu proposito (EV-0648-01). A ponte\nagora e lexical, nao conjectural. A previsao (2) foi reescrita para testar\nexatamente isso.\n\n**Contra.** O mesmo verso continua: 片われ月の声を聞く, ouvir as vozes da lua\ncrescente. E 'ouvir vozes' e como Roger descreve ler Poneglyph. Ou seja, o texto\nprofetico condiciona o desfecho a uma leitura — que e precisamente o que a\nprevisao (1) desta hipotese negava. EV-1136-04 entrou como contradicao com peso\n0.40, o maior peso permitido para um atomo `traducao_disputada` sem gerar aviso.\n\nSaldo: a hipotese fica mais honesta e nao mais forte. Ela ganhou uma ponte e\nperdeu a clausula que a distinguia de H-04 e H-05.", "redteam": "# H-08 — Red Team\n\n## Ataque 2026-08-11\n\n### Contra-evidência encontrada\n\n- EV-0301-01 — Diz-se que ao chegar a Laugh Tale o Rio Poneglyph só será finalmente revelado se a pessoa levou consigo as passagens dos Poneglyphs recolhidas na viagem. A condição de acesso canônica é o que o visitante trouxe lido, e o que a ilha entrega é um Poneglyph. Isso fere frontalmente a previsão (1), que exige que a virada ocorra \"sem depender de leitura prévia\", e fere o enunciado, que dispensa \"o que esteja escrito\".\n- EV-0818-01 — Os quatro Road Poneglyphs, lidos em conjunto, revelam quatro pontos cujo cruzamento indica a localização de Laugh Tale. Chegar já é, por construção, um ato de leitura de quatro textos distribuídos: uma hipótese que declara o resultado independente do que está escrito precisa da escrita para que a chegada sequer aconteça. A independência alegada é incoerente com o mecanismo de acesso.\n- EV-0972-02 — Os Piratas de Roger leram a mensagem em Laugh Tale, aprenderam a verdadeira história e decidiram deixar tudo como estava ao perceber que tinham chegado cedo demais. É a única chegada a Laugh Tale que a obra mostrou, e ela não disparou evento global algum: o gatilho postulado falhou no seu único teste observado. A hipótese só sobrevive a esse fato invocando a cláusula \"a pessoa certa\", que não foi derivada de átomo nenhum — foi acrescentada para absorver a falha.\n- EV-1190-03 — Gaban diz a Imu que conhece as palavras de Joy Boy, mas que não tem intenção de seguir as palavras de um homem que não conheceu, porque sua motivação é realizar o sonho do seu capitão. O que a tripulação trouxe de Laugh Tale são palavras que podem ser seguidas ou recusadas. Se a chegada executasse a virada independentemente do que está escrito, a recusa de Gaban seria irrelevante — e a obra a trata como decisão de peso.\n- EV-1190-02 — Imu admite que Luffy é mesmo quem esperavam e diz que foi tolo por ter confundido várias coincidências com destino. A obra desqualifica explicitamente, pela boca do personagem mais bem informado sobre o Século Vazio, a leitura de agendamento: coincidências não são destino. H-08 é precisamente uma leitura de destino agendado.\n- EV-1188-01 — Imu diz a Luffy que ele não é Joy Boy, porque Joy Boy era muito mais forte do que Luffy é agora. A \"pessoa certa\" da hipótese não tem critério objetivo no repositório; o único personagem que emite juízo sobre isso nega a identificação, e depois a concede (EV-1190-02) por motivo alheio a qualquer agenda.\n- EV-1113-02 — Vegapunk anuncia ao mundo que o nível do mar vai subir e que o mundo enfrentará um afundamento global. A previsão (2) de H-08 — mudança geográfica global no desfecho — já está garantida por um processo anunciado dentro da obra que nada tem a ver com chegar a Laugh Tale. Previsão que se cumpre igualmente se a hipótese for falsa é decorativa; exijo substituição.\n- EV-1115-01 — Vegapunk conclui que o uso das armas ancestrais elevou o nível do mar em 200 metros e que as ilhas de hoje são os topos dos continentes submersos. A mudança geográfica global já tem causa evidenciada e datada: as armas ancestrais. H-08 não precisa ser verdadeira para que o mundo mude de forma, o que confirma o caráter decorativo da previsão (2).\n- EV-1138-01 — O mural esculpido na casca fossilizada da Árvore Adam em Elbaf parece representar visualmente o texto do Harley, mas o átomo é `ambiguo` e a própria leiga que apresenta o mural relata a teoria corrente de que teria sido esculpido por crianças fantasiando. A corroboração visual da profecia é autodeclarada frágil pela obra.\n- EV-1175-01 — Uma das lendas de Elbaf descreve Nika como inimigo do Deus Guerreiro do país, e parte da juventude o teme como Deus da Destruição; a obra diz que a leitura depende de quem conta a história. O \"deus do sol que dança e ri\" do Harley não tem sequer sinal fixo dentro de Elbaf — pode ser libertador ou destruidor conforme o narrador.\n- EV-1136-02 — o ponto único de falha (ver abaixo).\n\n**Cadeia frágil — ponto único de falha.** O único átomo `trad ormação é não-rival, basta um\n  agente publicá-la e a posse deixa de importar. \"Reivindicar\" e \"destinatário\n  esperado\" são vocabulário de posse instrumental e de seleção de herdeiro,\n  incompatível com um documento cujo valor inteiro seria ser divulgado por\n  qualquer um.\n- EV-1114-01 — Vegapunk revela ao mundo que Joy Boy veio do Reino Antigo, foi o\n  primeiro pirata da história e portava a Hito Hito no Mi Modelo Nika. O mecanismo\n  central de H-04 — divulgação global de conteúdo do Século Vazio — já foi\n  executado dentro da obra, por alguém que nunca esteve em Laugh Tale. O teste\n  parcial já rodou.\n- EV-1115-01 — Vegapunk conclui, na mesma transmissão ao mundo, que o uso das armas\n  ancestrais elevou o nível do mar em 200 metros e que as ilhas de hoje são os topos\n  dos continentes submersos. A acusação implícita mais pesada possível foi ao ar; a\n  previsão (2) exigiria que a legitimidade do Governo Mundial começasse a ruir a\n  partir daí, e nenhum átomo registra essa consequência.\n- EV-1117-01 — Os Cinco Anciãos interromperam parte da transmissão global de\n  Vegapunk a qualquer custo. Corta contra H-04 pelo lado da premissa operacional:\n  a hipótese precisa de um canal de divulgação que o Governo não consiga cortar, e\n  a obra acabou de mostrar que ele consegue cortar.\n- EV-0576-01 — Barba Branca declarou que um dia o One Piece será encontrado e que\n  isso desencadeará uma guerra indizível que engolfará o mundo inteiro. É a única\n  previsão interna à obra sobre o efeito de achar o tesouro, e ela nomeia guerra,\n  não crise de legitimidade. Golpe direto na previsão (2).\n- EV-1172-01 — Jarul afirma que a profecia do Harley sugere que o mundo será\n  dividido em dois, e com isso declara Elbaf inimiga do Governo Mundial. A previsão\n  mais concreta em circulação dentro da obra é partição do mundo e inimizade\n  declarada — e a ruptura de Elbaf com o Governo nasceu do Harley, não de nenhuma\n  divulgação de registro histórico.\n- EV-1113-02 — Vegapunk anuncia ao mundo que o nível do mar vai subir e que o mundo\n  enfrentará um afundamento global. A previsão (2) exclui catástrofe física do\n  desfecho; a obra já pôs uma catástrofe física de escala global no calendário\n  anunciado, e H-04 teria de sustentar que ela é irrelevante para a queda do\n  Governo.\n- EV-1181-01 — Imu descreve seu poder Omen como algo que reside em todas as coisas\n  e cujos fundamentos são Corrupção, Pacto e inveja, formando o poder da Dominação.\n  O regime é apresentado como assentado em Dominação, não em consentimento\n  informado. Retirar legitimidade de um poder que se autodescreve como dominação\n  não o derruba — e H-04 depende exatamente dessa transmissão.\n- EV-1180-04 — Imu demonstra em Elbaf um poder ligado a sua Akuma no Mi,\n  apresentado como superior ao Haki do Conquistador. O Governo defende sua posição\n  pessoalmente e pela força, em campo, que é a via que a previsão (2) exclui.\n- EV-0972-02 — Os Piratas de Roger leram a mensagem em Laugh Tale, aprenderam a\n  verdadeira história e decidiram deixar tudo como estava ao perceber que tinham\n  chegado cedo demais. Se o tesouro fosse o registro, ele já saiu da ilha: o\n  conteúdo vai na cabeça de quem leu, e \"deixar tudo como estava\" é uma frase vazia\n  aplicada a um documento. A escolha ativa de não divulgar por motivo de calendário\n  só faz sentido se o valor do achado depender de tempo ou de pessoa, não de\n  publicação — e divulgação atrasada 25 anos não é o comportamento de quem segura\n  uma arma política pronta.\n- EV-0576-02 — Roger ofereceu a Barba Branca a informação de como chegar a Laugh\n  Tale, e Barba Branca recusou porque seu sonho era ter uma família. Um homem\n  informado do caminho recusa sem hesitar. Se o que está lá fosse o documento que\n  destrói a legitimidade do Governo Mundial, a recusa sairia caríssima; ela é\n  barata, o que sugere conteúdo não convertível em arma política.\n- EV-1164-02 — Rocks pergunta a Imu se ele teme mais Davy Jones ou Joy Boy, e sugere\n  que Imu vive aterrorizado com a possibilidade de alguém herdar a vontade de Jones\n  e cumprir a promessa de que ele falava. Aqui a obra nomeia o medo do Governo: um\n  herdeiro que cumpra uma promessa — uma pessoa e um ato. Não um leitor que\n  publique um arquivo. Isso rouba de H-04 sua melhor evidência circunstancial, que\n  é o tamanho do encobrimento.\n- EV-0966-01 — Roger especulou que o Governo Mundial proíbe a pesquisa dos\n  Poneglyphs justamente para que ninguém chegue a Laugh Tale e encontre o que está\n  escondido lá. A proibição é enunciada como bloqueio de acesso a um lugar e a uma\n  coisa escondida: encontrar, não publicar.\n- EV-0202-01 — Robin é uma das pouquíssimas pessoas vivas capazes de ler a língua\n  antiga dos Poneglyphs. \"Pouquíssimas\" é plural: o átomo estabelece raridade, não\n  unicidade. A previsão (1) trata a indispensabilidade de Robin como consequência\n  da hipótese, mas o único átomo sobre sua capacidade de leitura não a sustenta.\n\n### Veredito\n\nferida\n\nNão refutada, e é justo dizer por quê: nenhum átomo nega que haja documento em Laugh\nTale, e a componente documental tem apoio real — EV-0507-01 diz que os Piratas de\nRoger descobriram a verdadeira história, EV-0301-01 promete que o Rio Poneglyph será\nrevelado a quem chegar com as passagens recolhidas na viagem, e EV-0218-01 apresenta\no Rio Poneglyph como o que amarraria os fios da história. A metade *documental* do\nenunciado sobrevive.\n\nO que está ferido é a metade causal — \"cuja divulgação destrói a legitimidade do\nGoverno Mundial\" — e é ela que faz H-04 ser uma hipótese distinta em vez de um\nsubconjunto de H-05. O mecanismo de delegitimação não tem um único átomo que o\ndescreva; tem treze acima que empurram o desfecho para guerra, força, partição\ngeográfica e afundamento. Sem essa metade, H-04 colapsa numa versão mais cara de\nH-05.\n\n### Custo estrutural\n\n7 suposições não evidenciadas:\n\n1. **Completude e forma de arquiv om qualquer uma delas. O corte reflete que o pilar principal era circular e que\na doutrina da Dominacao explica os mesmos atomos sem postular trono roubado.", "redteam": "# H-09 — Red Team\n\n## Ataque 2026-08-11\n\n### Contra-evidência encontrada\n\n- EV-1164-01 — Rocks declara que Davy D. Jones foi certa vez Rei do Mundo, e Imu\n  nega furiosamente que Jones tenha sido rei de coisa alguma. Este é o átomo-mãe de\n  H-09 e ele é uma **disputa**, não um fato: o átomo registra uma declaração e uma\n  negação furiosa, e não arbitra entre as duas. H-09 escolhe o lado de Rocks sem\n  nenhum átomo que decida. Pior: o átomo não define nada — não diz o que é ser Rei\n  do Mundo, se é título transferível, sobre que território, nem quando. A hipótese\n  precisa que \"Rei do Mundo\" seja uma instituição com trono e sucessão; o átomo dá\n  uma frase de provocação e uma negação.\n\n- EV-1164-02 — Rocks pergunta a Imu se ele teme mais Davy Jones ou Joy Boy, e\n  sugere que Imu vive aterrorizado com a possibilidade de alguém herdar a vontade\n  de Jones e cumprir a promessa de que ele falava. Segundo pilar de H-09, e ele se\n  autodestrói em duas frentes. Primeira: o próprio átomo diz que Rocks **sugere** —\n  é especulação de um interlocutor hostil sobre o estado mental do adversário, não\n  registro de que Imu tema aquilo. Segunda: a pergunta é *Davy Jones ou Joy Boy*.\n  O átomo apresenta a atribuição como aberta entre dois nomes, e H-09 fecha a\n  atribuição em Jones para poder dizer \"distinta da promessa de Joy Boy\". A\n  hipótese usa como premissa exatamente o que o átomo deixa em aberto.\n\n- EV-1084-01 — Lili, rainha de Arabasta no Século Vazio, foi a única dos vinte\n  soberanos a não se mudar para Mary Geoise, e desapareceu antes de voltar para\n  casa. Isto mata a metade dianteira da previsão (1) sem esperar capítulo novo: a\n  obra **já** revelou soberanos anteriores ao Governo Mundial que não são Joy Boy —\n  vinte deles, um dos quais é uma rainha nomeada, do Século Vazio, com registros\n  apagados. Uma previsão cuja primeira cláusula já está cumprida por átomo\n  existente não é risco, é decoração.\n\n- EV-1115-03 — A derrota de Joy Boy marcou o fim do Reino Antigo e, com ele, o fim\n  do Século Vazio. O corpus documenta **uma** soberania anterior que caiu, e ela tem\n  nome: o Reino Antigo. H-09 postula uma segunda soberania anterior, paralela e\n  invisível, cuja queda a obra nunca registrou. Isso é acrescentar uma peça a um\n  quebra-cabeça que já tinha a peça.\n\n- EV-1114-01 — Vegapunk revela ao mundo que Joy Boy veio do Reino Antigo, foi o\n  primeiro pirata da história e portava a Hito Hito no Mi Modelo Nika. A revelação\n  pública mais completa que a obra já fez sobre o Século Vazio nomeia o Reino\n  Antigo, nomeia Joy Boy, nomeia Nika — e não nomeia trono nenhum, nem Rei do\n  Mundo, nem Davy. H-09 pode alegar que o trecho interrompido (EV-1117-01) continha\n  isso, mas essa saída é ela própria uma suposição não evidenciada, e está\n  igualmente disponível para qualquer hipótese: não discrimina nada.\n\n- EV-0395-01 — Clover afirma que o nome do Reino Antigo é de importância tremenda e\n  é a chave para entender o Século Vazio, mas é baleado antes de pronunciá-lo. O\n  segredo pelo qual o Governo mata é o **nome de um reino**, no singular, e é\n  declarado a chave do Século Vazio inteiro. Se a chave fosse um trono mundial\n  usurpado, a coisa interrompida a tiros seria o título de Imu, não o nome do reino.\n\n- EV-1085-01 — Imu afirma que a Vontade de D. tem alguma relação com o Reino Antigo.\n  Golpe pela boca do próprio Imu: quando Imu explica o que o ameaça na linhagem D.,\n  ele aponta para o Reino Antigo. Davy D. Jones é um D., e ainda assim a relação que\n  Imu enuncia não é com um reinado perdido de Jones — é com o Reino Antigo.\n\n- EV-1190-04 — Imu recorda ter ordenado pessoalmente o encobrimento do verdadeiro\n  nome de Gol D. Roger por ele ser um D. O apagamento que Imu executa e admite é\n  sobre a marca er e de\n  Luffy — tema de **tempo**, não de restauração dinástica. H-09 lê como trono o que\n  o corpus vem lendo como calendário.\n\n- **Previsão (2) não tem átomo — nenhum.** Nenhum dos 83 átomos menciona Barba\n  Negra, Marshall D. Teach, ou qualquer sobrevivente nomeado da linhagem Davy. A\n  premissa \"único sobrevivente conhecido da linhagem Davy\" não é derivada de átomo:\n  EV-1155-01 fala em descendentes no plural em God Valley e não nomeia nenhum. Pela\n  regra zero do repositório, isto é o erro fatal: uma previsão inteira construída\n  sobre memória do analista. E mesmo se o personagem existisse no corpus,\n  \"reivindicará algo distinto do One Piece\" é satisfeito por qualquer coisa que\n  qualquer personagem reivindique.\n\n### Veredito\n\nferida\n\nJustificativa do veredito. Não é refutada: EV-1164-01 e EV-1164-02 existem, são\ncanônicos, e é verdade que a obra pôs em cena uma disputa sobre quem reinou antes do\nGoverno Mundial e uma promessa antiga associada a Davy Jones. Isso é um dado real, e\nred team honesto não finge que não é. Mas o que os átomos sustentam é apenas:\n*alguém afirmou X e Imu negou*. O salto de \"há uma disputa\" para \"houve usurpação, e\no que Imu teme é a restauração desse trono\" não tem átomo em nenhum degrau.\n\n**Ataque de circularidade — o pedido explícito, e ele acerta.** O argumento de H-09\ntem esta forma: Imu se enfurece ao ouvir que Jones foi Rei do Mundo (EV-1164-01),\n*logo* Imu tem o que esconder sobre esse trono. A inferência só fecha com a premissa\nde que a fúria de um soberano diante de uma reivindicação rival indica consciência de\nroubo. Essa premissa não vem de átomo — e o corpus fornece ativamente a explicação\nconcorrente: EV-1181-01 diz que os fundamentos do poder de Imu são Corrupção, Pacto e\n**inveja**, e EV-1181-02 que ele declara a Dominação a única bem-aventurança\nverdadeira. Um ser assim nega que outro tenha sido rei de coisa alguma porque é isso\nque a doutrina dele afirma sobre o mundo, não porque tomou algo dele. Some-se\nEV-1181-02 (grita o nome de Joy Boy com raiva) e EV-1188-01 (rebaixa Luffy por força)\ne a fúria aparece como o modo padrão de Imu diante de qualquer rival — constante que\nnão discrimina hipótese nenhuma. Uma constante não pode ser evidência de um evento\nespecífico. O veredito sobre a circularidade é: **confirmada**. A fúria de Imu só é\nevidência de usurpação depois que a usurpação foi assumida.\n\n**Falseabilidade — as duas previsões são inservíveis como estão.**\n- Previsão (1) é conjunção de uma cláusula já cumprida com uma cláusula elástica. A\n  primeira metade (\"título ou trono anterior ao Governo Mundial ocupado por alguém\n  que não Joy Boy\") já é verdadeira por EV-1084-01: vinte soberanos, incluindo a\n  rainha Lili. A segunda metade (\"Imu será mostrado o tomando **ou** herdando\") é\n  uma disjunção que cobre os dois caminhos opostos — e nota-se que *herdar* é\n  compatível com a negação de qualquer usurpação, que é justamente a palavra do\n  enunciado. Uma previsão satisfeita por herança não testa uma hipótese de usurpação.\n  Exijo substituição por cláusula única e arriscada, do tipo: *a obra nomeará o\n  título que Imu ocupa, mostrará um ocupante anterior nomeado que não é Joy Boy, e\n  mostrará a transferência contra a vontade desse ocupante.*\n- Previsão (2) é pior que decorativa: é órfã de corpus. Refere um personagem sem\n  nenhum átomo e afirma sobre ele uma exclusividade (\"único sobrevivente conhecido\")\n  que nenhum átomo autoriza. Pela regra do repositório, ela deve ser retirada, e não\n  apenas reescrita — enquanto ela estiver lá, H-09 tem uma previsão inventada\n  ocupando o lugar de uma testável. Retirada a previsão (2) e cumprida metade da\n  previsão (1), sobra a H-09 **zero** previsão genuinamente arriscada, o que é\n  incompatível com status vivo sem reescrita.\n\n**Cadeia frágil — ponto único de falha.** Os dois átomos que sustentam a hipótese\ninteira, EV-1164-01 e EV-1164-02, são `fala`, do mesmo capítulo, da mesma boca —\nRocks D. Xebec — e ditos em provocação a Imu durante confronto. Nenhum é\n`traducao_disputada`, e o modo de falha aqui é pior que tradução: o átomo garante que\nRocks *disse*, não que seja assim; e EV-1164-02 registra explicitamente que Rocks\n**sugere**. Retire-se a veracidade de um provocador e não sobra nada de H-09. O\nrepositório já aplicou esse padrão de ceticismo em EV-1089-01, onde se recusa a\nnomear Uranus porque a suposição é do fandom e não da obra; o mesmo padrão aplicado\na EV-1164-01 impede tratar a fala de Rocks como fato institucional.\n\n### Custo estrutural\n\n8 suposições não evidenciadas:\n\n1. Que \"Rei do Mundo\" em EV-1164-01 designa um trono, uma instituição transferível\n   com sucessão, e não um epíteto na boca de Rocks. O átomo registra a declaração e\n   a negação furiosa, e não define coisa alguma.\n2. Que na disputa de EV-1164-01 Rocks diz a verdade e Imu mente. Nenhum átomo\n   arbitra; H-09 precisa do juízo para depois usá-lo como evidência.\n3. Que Imu tomou ou herdou esse título. Não há átomo ligando Imu à aquisição de\n   título nenhum: os atos de Imu que o corpus registra são ordenar o encobrimento do\n   nome de Roger por ele ser um D. (EV-1190-04) e energizar uma arma ancestral\n   desconhecida com a Mother Flame (EV-1089-01).\n4. Que \"a promessa de que ele falava\" (EV-1164-02) é de Davy Jones e não de Joy Boy,\n   quando o próprio átomo formula a pergunta como *Jones ou Joy Boy* e deixa a\n   atribuição aberta.\n5. Que o conteúdo dessa promessa é a restauração de um trono. Nenhum átomo enuncia\n   conteúdo algum para ela; a única promessa com conteúdo conhecido é a feita à Ilha\n   dos Homens-Peixe, cujo texto é um pedido de desculpas (EV-0649-01) e cujo prazo é\n   o tempo prometido (EV-0648-01).\n6. Que essa soberania é distinta do Reino Antigo, cuja queda a obra já registra com a\n   derrota de Joy Boy (EV-1115-03) e cujo nome Clover declara ser a chave do Século\n   Vazio (EV-0395-01). H-09 post rou que Joy Boy tinha retornado: o despertar ocorre por conta propria, sem que o portador saiba o que carrega."}, {"ev": "EV-1069-01", "peso": 0.25, "como": "Segundo Vegapunk, a existencia de Nika so esta registrada nos textos mais antigos, tendo sido apagada dos documentos modernos: um apagamento tao caro so se justifica se houver algo a temer no retorno dela."}], "contradiz": [{"ev": "EV-0001-01", "peso": 0.5, "como": "A fruta foi roubada de um navio do Governo pelos Piratas do Ruivo e um menino de sete anos a encontrou largada e a comeu por engano achando que era sobremesa: o trajeto documentado e roubo de terceiros mais engano infantil, sem nenhum ato da fruta."}, {"ev": "EV-1190-02", "peso": 0.4, "como": "Imu admite que Luffy e quem esperavam e diz que foi tolo por ter confundido varias coincidencias com destino: a obra coloca na boca do antagonista a advertencia contra ler selecao onde houve acaso."}, {"ev": "EV-1125-02", "peso": 0.25, "como": "Vegapunk nunca conseguiu replicar a energia antiga que move o robo Emet e a maquina so voltou a vida quando os Tambores da Libertacao soaram: ha rota evidenciada em que um artefato antigo reage a um evento sem querer nada."}, {"ev": "EV-1188-01", "peso": 0.15, "como": "Imu diz a Luffy que ele nao e Joy Boy porque Joy Boy era muito mais forte: se a fruta escolhesse o herdeiro certo, a diferenca de forca entre os dois portadores seria estranha."}], "prediz": [{"texto": "Se verdadeiro, antes do fim da saga a obra mostrara a fruta ou o poder dela recusando, fugindo ou escolhendo por conta propria numa cena em que nenhum evento externo e nenhuma pessoa a acione — as duas exclusoes juntas, porque EV-1125-02 e EV-0647-01 ja cobrem essas duas rotas sem vontade alguma.", "status": "aberta"}], "concorrentes": [], "redteam_ultimo": "2026-08-11", "corpo": "## Por que esta hipotese existe\n\nVeio do relatorio de orfaos: quatro atomos sobre a fruta que ninguem conseguia pegar\nnao pertenciam a nenhuma hipotese sobre o tesouro.\n\n## O caso contra (Red Team, 2026-08-11)\n\nVeredito: ferida, com recomendacao de `dormente`. Oito suposicoes nao evidenciadas.\nTres achados, todos aceitos:\n\n1. **O atomo ancora nao prova o que parece.** EV-1037-01 e fala de um dos Cinco\n   Anciaos que *cogita* a fuga na mesma frase em que duvida que a fruta seja mais que\n   lenda. E evidencia canonica do estado de crenca do Governo — eles perderam o rastro\n   — e nao da agencia da fruta. Peso reduzido de 0.50 para 0.40.\n2. **A hipotese negava um fato ausente da base.** Ela existe para dizer que a chegada\n   da fruta a Luffy nao foi acidente, e o trajeto nunca tinha sido extraido. Agora foi:\n   EV-0001-01, e ele contradiz a hipotese com peso 0.50. Este e o tipo de correcao que\n   justifica o sistema inteiro — a evidencia que faltava era desfavoravel.\n3. **Previsao decorativa.** A anterior era existencial, sem prazo e sem criterio de\n   reprovacao, e ja seria satisfeita por duas rotas sem vontade (EV-1125-02,\n   EV-0647-01). Substituida por uma com prazo e com as duas exclusoes explicitas.\n\n## Decisao sobre o status\n\nO Curador manteve `viva` em vez de `dormente`: `dormente` e definido como sem atomo\nnovo relevante ha 30+ capitulos, e EV-1043-01 e EV-1122-01 sao recentes. Mas registra\na discordancia — se a previsao unica nao se resolver, o proximo ciclo deve aposenta-la.\n\n## Nota de curadoria\n\nPrior 0.40 -&gt; 0.25, quase todo o corte causado por EV-0001-01.", "redteam": "# H-10 — Red Team\n\n## Ataque 2026-08-11\n\n### Contra-evidência encontrada\n\n- EV-1037-01 — O átomo âncora, lido inteiro, trabalha contra a hipótese. Um dos Cinco Anciãos **questiona se a fruta de Nika não seria apenas lenda**, já que **não desperta há séculos**, e só então **cogita** que a própria fruta esteja fugindo deles. Três problemas de uma vez: (i) a mesma frase põe em dúvida que a fruta sequer exista como coisa real, e uma hipótese sobre a vontade de um objeto não pode extrair autoridade de uma linha cuja primeira oração duvida do objeto; (ii) o verbo é *cogitar* — o átomo é canônico quanto ao fato de um Ancião ter dito aquilo, não quanto ao conteúdo do que ele disse; (iii) \"não desperta há séculos\" descreve **dormência**, que é o oposto operacional de um agente que passou oito séculos escapando ativamente. A hipótese precisa da fruta simultaneamente inerte (para explicar o silêncio) e ativa (para explicar a fuga), e o único átomo que ela tem afirma a primeira metade.\n- EV-1190-02 — Imu admite que Luffy é mesmo quem esperavam e diz que **foi tolo por ter confundido várias coincidências com destino**. É o personagem mais bem informado da obra sobre o Século Vazio desqualificando, em voz alta, exatamente a inferência que H-10 executa: transformar um encadeamento de coincidências em desígnio. H-10 é essa inferência aplicada a uma fruta.\n- EV-1188-01 — Imu diz a Luffy que **ele não é Joy Boy, porque Joy Boy era muito mais forte do que Luffy é agora**. Uma fruta que seleciona precisa de critério de seleção; o único personagem da base que emite juízo sobre a adequação de Luffy nega a identificação e depois a concede (EV-1190-02) por caminho alheio a qualquer escolha da fruta. Selecionadora sem critério declarado, cujo suposto acerto é contestado pelo único juiz disponível, não é selecionadora.\n- EV-1043-01 — Inconsciente, o **batimento cardíaco de Luffy adquiriu as qualidades dos Tambores da Libertação, e Zunesha declarou que Joy Boy tinha retornado**. Este é o átomo mais próximo de uma \"escolha\" e ele atribui a agência a outro lugar: o gatilho é o batimento com qualidade de Tambores da Libertação e o reconhecimento é uma declaração de Zunesha. Ler a cena como \"a fruta escolheu Luffy\" só funciona se a vontade da fruta já estiver pressuposta — circularidade pura.\n- EV-1125-02 — Vegapunk **nunca conseguiu replicar a energia antiga que move o robô Emet, comum no Século Vazio, e a máquina só voltou à vida quando os Tambores da Libertação soaram**. A obra já tem um precedente evidenciado de coisa do Século Vazio que ficou inerte por muito tempo e voltou à vida por um **evento**, não por vontade nem por comando — e o evento é o mesmo que EV-1043-01 associa a Luffy. Dormência longa seguida de despertar tem, no corpus, explicação mecânica pronta e barata. H-10 postula uma mente onde a base já oferece um gatilho.\n- EV-1125-01 — Um robô gigante blindado criado no início do Século Vazio **subiu a Red Line e invadiu Mary Geoise 200 anos atrás, perdendo energia antes de causar dano**. Quando um artefato daquela era age por conta própria, a obra mostra o ato: um deslocamento físico, um alvo, um lugar. Da fruta Nika não existe átomo algum equivalente. E note o desfecho: a autonomia acabou por **perda de energia** — neste mundo agir sozinho é caro e limitado, não uma vontade que se sustenta por oito séculos.\n- EV-0647-01 — A queda do navio Noah foi detida por **Reis do Mar convocados inconscientemente por Shirahoshi**. A obra já estabeleceu o padrão em que um acontecimento aparentemente autônomo tem por causa uma pessoa agindo sem saber. Qualquer cena futura de fruta \"fugindo\" ou \"recusando\" nasce com essa explicação alternativa já canonizada — o que destrói a previsão única (ver abaixo).\n- EV-1085-02 — Imu se interessa por Lili por causa de um **erro dela que levou os Poneglyphs a se espalharem pelo mundo**. O mecanismo evidenciado pelo qual objetos do Século Vazio atravessam séculos e chegam a mãos improváveis é, no corpus, **erro humano**. O acidente é o padrão documentado deste mundo; H-10 postula a exceção sem átomo que a sustente.\n- EV-1085-03 — O ato de Lili de espalhar os Poneglyphs pelo mundo **é tido como o que influenciou piratas a persegui-los em busca de tesouro**. Reforço do anterior: a própria cadeia que move a trama principal por oito séculos é atribuída em texto a um acidente, não à intenção de um objeto. A obra é explícita sobre quando algo foi acidente — e nunca disse isso da fruta em nenhuma direção.\n- EV-1069-01 — Segundo Vegapunk, a **existência de Nika só está registrada nos textos mais antigos, tendo sido apagada dos documentos modernos**. Aqui está a explicação canônica e barata para o sumiço de Nika ao longo dos séculos: **apagamento documental** executado pelo Governo. A hipótese precisa que o desaparecimento seja fuga da fruta; a base já explica o desaparecimento como censura de arquivo, sem atribuir estado mental a coisa nenhuma.\n- EV-0649-02 — Shirahoshi **herdou o título de Poseidon, o poder de falar com os Reis do Mar que aparece numa princesa sereia a cada vários séculos**. Quando a obra quer que um poder reapareça em um portador de tempos em tempos, ela diz isso e nomeia o mecanismo — herança de título, reaparecimento periódico — e a agência não é do poder. Nada remotamente equivalente foi dito da fruta Nika em átomo algum.\n- EV-1122-02 — Joy Boy **selou parte do seu Haki do Conquistador dentro de Emet, atado em nó, para ser liberado séculos depois se o robô estivesse em perigo mortal**. Este é o método de Joy Boy, mostrado na obra, para alcançar o futuro: um agente humano deposita e programa um gatilho. Se a chegada de algo de Joy Boy a alguém séculos depois não foi acidente, o corpus já nomeia quem foi o agente — e não é o objeto.\n- EV-1175-01 — Uma das lendas de Elbaf descreve **Nika como inimigo do Deus Guerreiro do país** e parte da juventude o teme como **Deus da Destruição**; o átomo é `ambiguo` e sua nota diz que a leitura depende de quem conta a história. Tudo que se fala de Nika dentro da obra é relato de narrador interessado. O Ancião de EV-1037-01 é mais um desses narradores, e dos mais interessados de todos.\n\n**Falseabilidade — a previsão única não pode falhar.** \"A obra mostrará a fruta agindo por\nconta própria em pelo menos um momento — recusando, fugindo ou escolhendo\" é uma previsão\nexistencial, sem prazo, sem cena obrigatória e sem critério de reprovação. Enquanto a obra\nnão terminar, ela nunca falha; e no momento em que qualquer painel ambíguo orno' é afirmado por uma testemunha, não por narração\"). Logo EV-1037-01 é evidência\nde **um estado de crença dos Cinco Anciãos**: eles não sabem onde a fruta está, não a veem\ndespertar, chegam a duvidar que exista, e verbalizam frustração numa figura de linguagem.\nIsso é excelente evidência de que o Governo perdeu o rastro da fruta — e é evidência\n*contra* a competência do Governo, não *a favor* da agência da fruta. Converter \"o\nperseguidor não a encontra\" em \"ela se esconde por vontade própria\" é a mesma operação que\nEV-1190-02 chama, pela boca de Imu, de confundir coincidências com destino.\n\n**A cena que a hipótese existe para explicar não está no repositório.** O enunciado afirma\nque \"a chegada dela a Luffy não foi acidente\". Não há nenhum átomo em `data/evidencias/`\nque descreva como a fruta chegou a Luffy: nem posse pelo Governo, nem transporte, nem\napreensão, nem roubo, nem ingestão. A hipótese nega o caráter acidental de um evento que a\nbase não registra. Pela regra zero do CLAUDE.md, esse evento não pode ser afirmado de\nmemória — e enquanto ele não tiver átomo, o contraste que a previsão usa (\"e não apenas\nsendo transportada por terceiros\") não tem referente no corpus. A hipótese está construída\nsobre um buraco.\n\n### Veredito\n\nferida\n\nNão digo refutada, e explico por quê para não virar ruído: nenhum átomo torna impossível que\numa Akuma no Mi tenha comportamento próprio. EV-0650-01 registra que as armas ancestrais têm\nnome de divindade e **não se limitam a objetos inanimados: incluem seres vivos** — a obra\nadmite, em pelo menos um caso, que aquilo que se toma por objeto seja vivo. E EV-1037-01 é\ncanônico: um dos Cinco Anciãos de fato levantou a hipótese, e a obra raramente coloca uma\nfrase dessas na boca do Governo por acaso.\n\nMas H-10 sai deste ataque sem previsão utilizável e sem base própria. Pelo CLAUDE.md,\nhipótese sem previsão falseável não entra no repositório; a previsão única de H-10 não pode\nreprovar em nenhum desfecho concebível e é satisfeita por duas alternativas já evidenciadas.\nRecomendação ao Curador: **prior baixo e status `dormente`** até que (a) a previsão seja\nsubstituída por uma com prazo e cláusula de exclusão, e (b) exista ao menos um átomo que\ndescreva o trajeto da fruta até Luffy. Sem (b), não há o que confirmar nem o que negar.\n\n### Custo estrutural\n\n8 suposições não evidenciadas:\n\n1. **Que uma Akuma no Mi possa querer, recusar ou escolher.** Nenhum átomo atribui estado\n   mental a uma fruta. O que mais se aproxima é EV-0650-01, e ele fala das três armas\n   ancestrais com nome de divindade, não de frutas — e a Nika não é nomeada arma em átomo\n   algum.\n2. **Que a fruta esteve em poder do Governo Mundial e escapou.** EV-1037-01 traz apenas um\n   dos Cinco Anciãos cogitando que a própria fruta esteja fugindo deles. Não há átomo de\n   posse, apreensão, guarda ou fuga.\n3. **Que o intervalo seja de oito séculos.** EV-1037-01 diz \"não desperta há séculos\", sem\n   número. Nenhum átomo do repositório data a fruta.\n4. **Que exista uma \"chegada\" da fruta a Luffy classificável como acidente ou não.** O\n   corpus é inteiramente mudo sobre esse evento. A hipótese nega o acidente de um fato que\n   ela mesma precisa importar de fora da base.\n5. **Que a fruta comida por Luffy seja a mesma unidade que Joy Boy portava.** EV-1114-01 diz\n   que Joy Boy portava a Hito Hito no Mi Modelo Nika; não diz que é a mesma fruta, nem que\n   ela é única, nem que reapareceu.\n6. **Que a dormência seja escolha e não indisponibilidade.** Ler \"não desperta há séculos\"\n   como recusa exige supor que a fruta podia despertar e optou por não fazê-lo — suposição\n   que ainda por cima colide com a metade \"fugiu ativamente\" do enunciado.\n7. **Que Luffy seja o destinatário selecionado pela fruta.** EV-1043-01 credita o\n   reconhecimento a Zunesha e o gatilho aos Tambores da Libertação; EV-1188-01 e EV-1190-02\n   dão os dois únicos juízos da obra sobre a adequação de Luffy, e nenhum menciona escolha da\n   fruta.\n8. **Que \"agir por conta própria\" seja distinguível de \"ser ativado por um evento\".** Sem\n   esse critério a previsão não tem conteúdo, e a base já mostra em EV-1125-02 que a segunda\n   opção existe e funciona. A hipótese precisa de uma distinção que ela não define.\n\nCusto comparado: H-03 explica a dormência longa e o despertar com **uma** peça (ativação por\ncondição/evento) e essa peça tem precedente evidenciado. H-08 explica o \"não foi acidente\"\ncom **uma** peça (uma pessoa esperada e datada) e essa peça tem três átomos canônicos.\n\n### Concorrente mais econômico\n\nH-03\n\nH-03 postula que o que interessa do Século Vazio é **artefato funcional cuja ativação depende\nde condições que não existiam na época de Roger** — e sustenta isso com EV-1125-02, em que\nVegapunk nunca conseguiu replicar a energia antiga que move o robô Emet e a máquina só voltou\nà vida quando os Tambores da Libertação soaram. Aplicada aos mesmos átomos que H-10 reivindica,\na tese de H-03 é estritamente mais barata: \"não desperta há séculos\" (EV-1037-01) vira\ndispositivo sem a condição de ativação; o despertar em Luffy vira EV-1043-01, em que o\nbatimento cardíaco dele adquiriu as qualidades dos Tambores da Libertação — **o mesmo gatilho\nque a obra já mostrou funcionando em Emet**. Zero suposições sobre vontade, zero sobre fuga,\nzero sobre seleção. Registro a ressalva honesta: H-03 tem escopo `one_piece` e H-10 tem escopo\n`joy_boy`, de modo que elas não são formalmente mutuamente exclusivas — o que nomeio como\nconcorrente é o *mecanismo* de H-03, que cobre o explanandum de H-10 com uma peça em vez de\noito.\n\nSegundo concorrente: **H-08**. A metade \"a chegada a Luffy não foi acidente\" já está explicada\nsem tocar na fruta por EV-0968-01 (Roger e Oden ouviram os Reis do Mar falarem do nascimento,\ndali a 25 anos, de alguém que os lideraria junto com a nova Poseidon), EV-0968-02 (ao saber que\ntinham chegado cedo demais, Roger planejou gerar um filho que encontrasse o One Piece depois\ndele) e EV-1190-01 (Gaban afirma que Luffy é a pessoa que ele e outros grandes nomes\nesperavam). Se a não-acidentalidade vem de uma pessoa esperada e datada, a fruta não precisa\nquerer nada — basta que o portador nasça. Entre H-03 e H-08, H-10 fica sem território próprio:\no mecanismo é de H-03, o encontro é de H-08, e o que sobra exclusivamente dela é a vontade da\nfruta, que tem por base uma única frase especulativa de um perseguidor que nem sabe se a fruta\nexiste.\n", "posterior": 0.235301802159619, "fatia": 0.0}, {"id": "H-03", "enunciado": "O One Piece e um artefato funcional do Reino Antigo, cuja ativacao depende de condicoes que nao existiam na epoca de Roger.", "escopo": "one_piece", "status": "viva", "prior": 0.14, "apoia": [{"ev": "EV-1125-02", "peso": 0.4, "como": "Vegapunk nunca conseguiu replicar a energia antiga que move o robo Emet, comum no Seculo Vazio, e a maquina so voltou a vida quando os Tambores da Libertacao soaram: ha precedente explicito de dispositivo antigo que espera um evento para ligar."}, {"ev": "EV-0967-11", "peso": 0.3, "como": "A fala de Roger sobre a tripulacao ter chegado cedo demais a Laugh Tale indica restricao temporal de acesso, compativel com algo que precisa ser ativado e ainda nao podia ser."}, {"ev": "EV-1065-01", "peso": 0.3, "como": "Vegapunk teoriza que o Reino Antigo era uma civilizacao tecnologicamente muito mais avancada que a do presente, o que torna plausivel que tenha deixado um artefato funcional."}, {"ev": "EV-1116-01", "peso": 0.2, "como": "Joy Boy teve papel na preservacao das tres armas ancestrais para que geracoes futuras pudessem acessa-las e usa-las, mostrando o habito de deixar coisas funcionais para o futuro."}, {"ev": "EV-1136-05", "peso": 0.3, "como": "No Primeiro Mundo do Harley a chama que havia dentro da terra e escrita com o mesmo kanji usado para a Mother Flame, e o sol proibido tocado por ganancia e lido como essa mesma chama: arcada como decorativa e\n   substituida por uma que exige mudanca de estado observavel.\n2. A clausula temporal foi refutada por substituicao: EV-1190-01 e EV-0968-02 dizem\n   que a condicao faltante era uma pessoa nascer, nao uma maquina poder ligar. O\n   Curador aceita — e o mesmo poder explicativo com uma peca a menos.\n\nSobrevive a casca: pode haver construcao operavel em Laugh Tale, e nenhum atomo\nafirma nem proibe isso.\n\n## O que a mataria\n\nUma cena mostrando Laugh Tale como sitio puramente documental.\n\n## Nota de curadoria\n\nPrior 0.16 -&gt; 0.14, e o peso de EV-0967-11 como apoio caiu de 0.35 para 0.30: o\nmesmo atomo agora sustenta melhor H-08, que explica o 'cedo demais' sem postular\nmaquina nenhuma.\n\n## Revisao de 2026-08-11 (rodada 3)\n\nA previsao sobre a Mother Flame tinha sido marcada como decorativa na rodada 1,\nporque EV-1116-02 mostra que ela e criacao moderna e incompleta. EV-1136-05\nreabre parcialmente a porta: o kanji da chama do Primeiro Mundo e o mesmo da\nMother Flame. Ainda assim e `traducao_disputada` e a leitura e do analista, entao\no prior segue em 0.14.", "redteam": "# Red Team — H-03\n\nEnunciado atacado: \"O One Piece e um artefato funcional do Reino Antigo, cuja\nativacao depende de condicoes que nao existiam na epoca de Roger.\"\n\n## Ataque 2026-08-11\n\n### Contra-evidência encontrada\n\n- EV-0301-01 — Diz-se que ao chegar a Laugh Tale, se a pessoa levou consigo as passagens\n  dos Poneglyphs recolhidas na viagem, o Rio Poneglyph sera finalmente revelado. O unico\n  conteudo que a obra promete explicitamente na ilha e um Poneglyph, isto e, registro\n  escrito. A previsao (2) — estrutura construida e operavel, nao apenas registros\n  escritos — nasce ja contrariada pela unica descricao canonica do que ha la.\n\n- EV-0972-02 — Os Piratas de Roger leram a mensagem em Laugh Tale, aprenderam a\n  verdadeira historia e decidiram deixar tudo como estava ao perceber que tinham chegado\n  cedo demais. O verbo da cena e ler
