cardíaco de Luffy adquiriu as qualidades dos Tambores da Libertação, e Zunesha declarou que Joy Boy tinha retornado**. Este é o átomo mais próximo de uma \"escolha\" e ele atribui a agência a outro lugar: o gatilho é o batimento com qualidade de Tambores da Libertação e o reconhecimento é uma declaração de Zunesha. Ler a cena como \"a fruta escolheu Luffy\" só funciona se a vontade da fruta já estiver pressuposta — circularidade pura.\n- EV-1125-02 — Vegapunk **nunca conseguiu replicar a energia antiga que move o robô Emet, comum no Século Vazio, e a máquina só voltou à vida quando os Tambores da Libertação soaram**. A obra já tem um precedente evidenciado de coisa do Século Vazio que ficou inerte por muito tempo e voltou à vida por um **evento**, não por vontade nem por comando — e o evento é o mesmo que EV-1043-01 associa a Luffy. Dormência longa seguida de despertar tem, no corpus, explicação mecânica pronta e barata. H-10 postula uma mente onde a base já oferece um gatilho.\n- EV-1125-01 — Um robô gigante blindado criado no início do Século Vazio **subiu a Red Line e invadiu Mary Geoise 200 anos atrás, perdendo energia antes de causar dano**. Quando um artefato daquela era age por conta própria, a obra mostra o ato: um deslocamento físico, um alvo, um lugar. Da fruta Nika não existe átomo algum equivalente. E note o desfecho: a autonomia acabou por **perda de energia** — neste mundo agir sozinho é caro e limitado, não uma vontade que se sustenta por oito séculos.\n- EV-0647-01 — A queda do navio Noah foi detida por **Reis do Mar convocados inconscientemente por Shirahoshi**. A obra já estabeleceu o padrão em que um acontecimento aparentemente autônomo tem por causa uma pessoa agindo sem saber. Qualquer cena futura de fruta \"fugindo\" ou \"recusando\" nasce com essa explicação alternativa já canonizada — o que destrói a previsão única (ver abaixo).\n- EV-1085-02 — Imu se interessa por Lili por causa de um **erro dela que levou os Poneglyphs a se espalharem pelo mundo**. O mecanismo evidenciado pelo qual objetos do Século Vazio atravessam séculos e chegam a mãos improváveis é, no corpus, **erro humano**. O acidente é o padrão documentado deste mundo; H-10 postula a exceção sem átomo que a sustente.\n- EV-1085-03 — O ato de Lili de espalhar os Poneglyphs pelo mundo **é tido como o que influenciou piratas a persegui-los em busca de tesouro**. Reforço do anterior: a própria cadeia que move a trama principal por oito séculos é atribuída em texto a um acidente, não à intenção de um objeto. A obra é explícita sobre quando algo foi acidente — e nunca disse isso da fruta em nenhuma direção.\n- EV-1069-01 — Segundo Vegapunk, a **existência de Nika só está registrada nos textos mais antigos, tendo sido apagada dos documentos modernos**. Aqui está a explicação canônica e barata para o sumiço de Nika ao longo dos séculos: **apagamento documental** executado pelo Governo. A hipótese precisa que o desaparecimento seja fuga da fruta; a base já explica o desaparecimento como censura de arquivo, sem atribuir estado mental a coisa nenhuma.\n- EV-0649-02 — Shirahoshi **herdou o título de Poseidon, o poder de falar com os Reis do Mar que aparece numa princesa sereia a cada vários séculos**. Quando a obra quer que um poder reapareça em um portador de tempos em tempos, ela diz isso e nomeia o mecanismo — herança de título, reaparecimento periódico — e a agência não é do poder. Nada remotamente equivalente foi dito da fruta Nika em átomo algum.\n- EV-1122-02 — Joy Boy **selou parte do seu Haki do Conquistador dentro de Emet, atado em nó, para ser liberado séculos depois se o robô estivesse em perigo mortal**. Este é o método de Joy Boy, mostrado na obra, para alcançar o futuro: um agente humano deposita e programa um gatilho. Se a chegada de algo de Joy Boy a alguém séculos depois não foi acidente, o corpus já nomeia quem foi o agente — e não é o objeto.\n- EV-1175-01 — Uma das lendas de Elbaf descreve **Nika como inimigo do Deus Guerreiro do país** e parte da juventude o teme como **Deus da Destruição**; o átomo é `ambiguo` e sua nota diz que a leitura depende de quem conta a história. Tudo que se fala de Nika dentro da obra é relato de narrador interessado. O Ancião de EV-1037-01 é mais um desses narradores, e dos mais interessados de todos.\n\n**Falseabilidade — a previsão única não pode falhar.** \"A obra mostrará a fruta agindo por\nconta própria em pelo menos um momento — recusando, fugindo ou escolhendo\" é uma previsão\nexistencial, sem prazo, sem cena obrigatória e sem critério de reprovação. Enquanto a obra\nnão terminar, ela nunca falha; e no momento em que qualquer painel ambíguo aparecer, ela se\ncumpre por leitura. Pior: os três verbos oferecidos — recusar, fugir, escolher — são\ndescrições *interpretativas* de comportamento, exatamente o tipo de coisa que este\nrepositório marca como `ambiguo` quando o extrator encontra (EV-1175-01, EV-1180-04,\nEV-1138-02 são todos assim). E a obra já forneceu duas rotas prontas para explicar uma cena\ndessas sem nenhuma vontade: gatilho por evento (EV-1125-02) e convocação inconsciente por\numa pessoa (EV-0647-01). Uma previsão que não discrimina a hipótese de duas alternativas já\nevidenciadas é decorativa por definição. Exijo substituição por algo que possa reprovar,\ncom prazo e com cláusula de exclusão, no espírito de: *a fruta se deslocará ou recusará um\nportador em cena, sem agente humano, animal ou robótico no quadro, e nenhum personagem\nnomeará um evento externo — tambor, batimento, despertar, ordem — como causa; e isso\nocorrerá antes do fim do arco em curso*. A segunda cláusula é o que separa H-10 de H-03; a\nprimeira, de EV-0647-01.\n\n**Cadeia frágil — um átomo, e ele é fala especulativa.** Todo o peso de H-10 recai sobre\nEV-1037-01. Retirado esse átomo, não sobra no repositório uma única linha que atribua\ncomportamento, vontade, recusa ou fuga a uma Akuma no Mi. O que resta sobre Nika é: a fruta\nexiste e Joy Boy a portava (EV-1114-01), o registro dela foi apagado dos documentos\nmodernos (EV-1069-01) e há lenda contraditória em Elbaf (EV-1175-01). Nenhum desses toca no\nenunciado. Ponto único de falha declarado — e o pior tipo, porque não é um átomo de\nnarração nem de imagem: é a fala de um personagem especulando.\n\n**Evidência de quê, exatamente.** Esta é a pergunta que H-10 não pode responder. EV-1037-01\né `fala`, `canonico`, atores `Cinco Anciaos`. A confiabilidade canônica cobre *que a fala\nocorreu*, não *que o conteúdo dela seja verdadeiro*: o mesmo repositório já trata assim\nEV-0966-01 (\"Roger **especulou** que o Governo proíbe...\") e a nota do próprio EV-1043-01\n(\"'Retorno' é afirmado por uma testemunha, não por narração\"). Logo EV-1037-01 é evidência\nde **um estado de crença dos Cinco Anciãos**: eles não sabem onde a fruta está, não a veem\ndespertar, chegam a duvidar que exista, e verbalizam frustração numa figura de linguagem.\nIsso é excelente evidência de que o Governo perdeu o rastro da fruta — e é evidência\n*contra* a competência do Governo, não *a favor* da agência da fruta. Converter \"o\nperseguidor não a encontra\" em \"ela se esconde por vontade própria\" é a mesma operação que\nEV-1190-02 chama, pela boca de Imu, de confundir coincidências com destino.\n\n**A cena que a hipótese existe para explicar não está no repositório.** O enunciado afirma\nque \"a chegada dela a Luffy não foi acidente\". Não há nenhum átomo em `data/evidencias/`\nque descreva como a fruta chegou a Luffy: nem posse pelo Governo, nem transporte, nem\napreensão, nem roubo, nem ingestão. A hipótese nega o caráter acidental de um evento que a\nbase não registra. Pela regra zero do CLAUDE.md, esse evento não pode ser afirmado de\nmemória — e enquanto ele não tiver átomo, o contraste que a previsão usa (\"e não apenas\nsendo transportada por terceiros\") não tem referente no corpus. A hipótese está construída\nsobre um buraco.\n\n### Veredito\n\nferida\n\nNão digo refutada, e explico por quê para não virar ruído: nenhum átomo torna impossível que\numa Akuma no Mi tenha comportamento próprio. EV-0650-01 registra que as armas ancestrais têm\nnome de divindade e **não se limitam a objetos inanimados: incluem seres vivos** — a obra\nadmite, em pelo menos um caso, que aquilo que se toma por objeto seja vivo. E EV-1037-01 é\ncanônico: um dos Cinco Anciãos de fato levantou a hipótese, e a obra raramente coloca uma\nfrase dessas na boca do Governo por acaso.\n\nMas H-10 sai deste ataque sem previsão utilizável e sem base própria. Pelo CLAUDE.md,\nhipótese sem previsão falseável não entra no repositório; a previsão única de H-10 não pode\nreprovar em nenhum desfecho concebível e é satisfeita por duas alternativas já evidenciadas.\nRecomendação ao Curador: **prior baixo e status `dormente`** até que (a) a previsão seja\nsubstituída por uma com prazo e cláusula de exclusão, e (b) exista ao menos um átomo que\ndescreva o trajeto da fruta até Luffy. Sem (b), não há o que confirmar nem o que negar.\n\n### Custo estrutural\n\n8 suposições não evidenciadas:\n\n1. **Que uma Akuma no Mi possa querer, recusar ou escolher.** Nenhum átomo atribui estado\n   mental a uma fruta. O que mais se aproxima é EV-0650-01, e ele fala das três armas\n   ancestrais com nome de divindade, não de frutas — e a Nika não é nomeada arma em átomo\n   algum.\n2. **Que a fruta esteve em poder do Governo Mundial e escapou.** EV-1037-01 traz apenas um\n   dos Cinco Anciãos cogitando que a própria fruta esteja fugindo deles. Não há átomo de\n   posse, apreensão, guarda ou fuga.\n3. **Que o intervalo seja de oito séculos.** EV-1037-01 diz \"não desperta há séculos\", sem\n   número. Nenhum átomo do repositório data a fruta.\n4. **Que exista uma \"chegada\" da fruta a Luffy classificável como acidente ou não.** O\n   corpus é inteiramente mudo sobre esse evento. A hipótese nega o acidente de um fato que\n   ela mesma precisa importar de fora da base.\n5. **Que a fruta comida por Luffy seja a mesma unidade que Joy Boy portava.** EV-1114-01 diz\n   que Joy Boy portava a Hito Hito no Mi Modelo Nika; não diz que é a mesma fruta, nem que\n   ela é única, nem que reapareceu.\n6. **Que a dormência seja escolha e não indisponibilidade.** Ler \"não desperta há séculos\"\n   como recusa exige supor que a fruta podia despertar e optou por não fazê-lo — suposição\n   que ainda por cima colide com a metade \"fugiu ativamente\" do enunciado.\n7. **Que Luffy seja o destinatário selecionado pela fruta.** EV-1043-01 credita o\n   reconhecimento a Zunesha e o gatilho aos Tambores da Libertação; EV-1188-01 e EV-1190-02\n   dão os dois únicos juízos da obra sobre a adequação de Luffy, e nenhum menciona escolha da\n   fruta.\n8. **Que \"agir por conta própria\" seja distinguível de \"ser ativado por um evento\".** Sem\n   esse critério a previsão não tem conteúdo, e a base já mostra em EV-1125-02 que a segunda\n   opção existe e funciona. A hipótese precisa de uma distinção que ela não define.\n\nCusto comparado: H-03 explica a dormência longa e o despertar com **uma** peça (ativação por\ncondição/evento) e essa peça tem precedente evidenciado. H-08 explica o \"não foi acidente\"\ncom **uma** peça (uma pessoa esperada e datada) e essa peça tem três átomos canônicos.\n\n### Concorrente mais econômico\n\nH-03\n\nH-03 postula que o que interessa do Século Vazio é **artefato funcional cuja ativação depende\nde condições que não existiam na época de Roger** — e sustenta isso com EV-1125-02, em que\nVegapunk nunca conseguiu replicar a energia antiga que move o robô Emet e a máquina só voltou\nà vida quando os Tambores da Libertação soaram. Aplicada aos mesmos átomos que H-10 reivindica,\na tese de H-03 é estritamente mais barata: \"não desperta há séculos\" (EV-1037-01) vira\ndispositivo sem a condição de ativação; o despertar em Luffy vira EV-1043-01, em que o\nbatimento cardíaco dele adquiriu as qualidades dos Tambores da Libertação — **o mesmo gatilho\nque a obra já mostrou funcionando em Emet**. Zero suposições sobre vontade, zero sobre fuga,\nzero sobre seleção. Registro a ressalva honesta: H-03 tem escopo `one_piece` e H-10 tem escopo\n`joy_boy`, de modo que elas não são formalmente mutuamente exclusivas — o que nomeio como\nconcorrente é o *mecanismo* de H-03, que cobre o explanandum de H-10 com uma peça em vez de\noito.\n\nSegundo concorrente: **H-08**. A metade \"a chegada a Luffy não foi acidente\" já está explicada\nsem tocar na fruta por EV-0968-01 (Roger e Oden ouviram os Reis do Mar falarem do nascimento,\ndali a 25 anos, de alguém que os lideraria junto com a nova Poseidon), EV-0968-02 (ao saber que\ntinham chegado cedo demais, Roger planejou gerar um filho que encontrasse o One Piece depois\ndele) e EV-1190-01 (Gaban afirma que Luffy é a pessoa que ele e outros grandes nomes\nesperavam). Se a não-acidentalidade vem de uma pessoa esperada e datada, a fruta não precisa\nquerer nada — basta que o portador nasça. Entre H-03 e H-08, H-10 fica sem território próprio:\no mecanismo é de H-03, o encontro é de H-08, e o que sobra exclusivamente dela é a vontade da\nfruta, que tem por base uma única frase especulativa de um perseguidor que nem sabe se a fruta\nexiste.\n", "posterior": 0.235301802159619, "fatia": 0.0}, {"id": "H-03", "enunciado": "O One Piece e um artefato funcional do Reino Antigo, cuja ativacao depende de condicoes que nao existiam na epoca de Roger.", "escopo": "one_piece", "status": "viva", "prior": 0.14, "apoia": [{"ev": "EV-1125-02", "peso": 0.4, "como": "Vegapunk nunca conseguiu replicar a energia antiga que move o robo Emet, comum no Seculo Vazio, e a maquina so voltou a vida quando os Tambores da Libertacao soaram: ha precedente explicito de dispositivo antigo que espera um evento para ligar."}, {"ev": "EV-0967-11", "peso": 0.3, "como": "A fala de Roger sobre a tripulacao ter chegado cedo demais a Laugh Tale indica restricao temporal de acesso, compativel com algo que precisa ser ativado e ainda nao podia ser."}, {"ev": "EV-1065 08-11\n\n### Contra-evidência encontrada\n\n- EV-0301-01 — Diz-se que ao chegar a Laugh Tale, se a pessoa levou consigo as passagens\n  dos Poneglyphs recolhidas na viagem, o Rio Poneglyph sera finalmente revelado. O unico\n  conteudo que a obra promete explicitamente na ilha e um Poneglyph, isto e, registro\n  escrito. A previsao (2) — estrutura construida e operavel, nao apenas registros\n  escritos — nasce ja contrariada pela unica descricao canonica do que ha la.\n\n- EV-0972-02 — Os Piratas de Roger leram a mensagem em Laugh Tale, aprenderam a\n  verdadeira historia e decidiram deixar tudo como estava ao perceber que tinham chegado\n  cedo demais. O verbo da cena e ler uma mensagem, nao operar um dispositivo; e \"deixar\n  tudo como estava\" descreve abstencao deliberada, nao falha de ativacao. H-03 precisa\n  reescrever uma escolha como um defeito tecnico, e nenhum atomo autoriza isso.\n\n- EV-1190-03 — Gaban diz a Imu que conhece as palavras de Joy Boy, mas que nao tem\n  intencao de seguir as palavras de um homem que nao conheceu. O que a tripulacao de\n  Roger trouxe de Laugh Tale sao palavras que podem ser seguidas ou recusadas. Palavras\n  que pedem alguma coisa de quem as le sao endereco, nao interface de maquina: um\n  artefato funcional nao produz um pedido que um sobrevivente possa declinar.\n\n- EV-1190-01 — Gaban afirma que a insistencia de Imu em matar Luffy prova o que Roger\n  disse sobre terem chegado cedo demais, e que Luffy e a pessoa que ele e outros grandes\n  nomes esperavam. Esta e a unica glosa interna a obra sobre a condicao que faltava a\n  Roger, e ela nomeia uma pessoa. H-03 depende de a condicao ausente ser material ou\n  energetica; a obra ja preencheu essa lacuna com outra coisa.\n\n- EV-0968-01 — Roger e Oden ouviram os Reis do Mar falarem do nascimento, dali a 25 anos,\n  de alguem que os lideraria, junto com a nova Poseidon. Segunda fonte independente\n  datando o \"cedo demais\" por nascimento de pessoas, nao por disponibilidade de energia\n  ou de tecnologia. O prazo de 25 anos e biografico, nao de engenharia.\n\n- EV-1116-02 — A Mother Flame e a chama que Vegapunk criou para ser um sol proprio e\n  fonte de energia ilimitada, e esta incompleta. Ela e invencao do presente, e nao energia\n  do Reino Antigo. A previsao (1) trata Mother Flame e energia antiga como intercambiaveis;\n  este atomo separa as duas na raiz.\n\n- EV-1125-02 — Vegapunk nunca conseguiu replicar a energia antiga que move o robo Emet,\n  comum no Seculo Vazio, e a maquina so voltou a vida quando os Tambores da Libertacao\n  soaram. Fecha o golpe anterior: quem criou a Mother Flame e exatamente quem declara nao\n  ter replicado a energia antiga. Alem disso, a unica reativacao de tecnologia perdida que\n  a obra mostrou aconteceu em Egghead, por um evento ja ocorrido, sem qualquer participacao\n  de Laugh Tale — o mecanismo que H-03 quer para a ilha ja foi gasto em outro lugar.\n\n- EV-1089-01 — York roubou uma amostra da Mother Flame e a enviou aos Cinco Anciaos e a\n  Imu, que a usaram para energizar uma arma ancestral desconhecida. O fio da Mother Flame\n  ja tem destino narrativo em Mary Geoise, em maos do Governo. Para cumprir a previsao (1)\n  seria preciso um segundo uso, no polo oposto do mundo, que nenhum atomo antecipa.\n\n- EV-1164-03 — Depois que Imu transformou Xebec em demonio em God Valley, Eris comentou\n  que ainda era cedo demais. A expressao \"cedo demais\" reaparece num contexto sem nenhum\n  artefato, nenhuma ilha final e nenhuma ativacao. H-03 se apropria dessa expressao como\n  se ela fosse tecnica; a obra a usa como marcador de calendario dramatico.\n\n- EV-0972-01 — Ao aprender a verdadeira historia, Roger achou a historia hilaria e declarou\n  que gostaria de ter vivido na mesma epoca que Joy Boy. A reacao registrada e riso mais\n  desejo de companhia. Diante de um artefato que nao liga, a reacao esperada seria\n  frustracao ou tentativa de conserto; a obra registra identificacao com uma pessoa inos. \"Nunca foi ocultado\" é insustentável contra EV-1190-04, EV-1069-01 e EV-1084-01 somados.\n\n- EV-0393-01 — **Nações inteiras são destruídas e apagadas do registro caso uma única pessoa tente aprender algo sobre o Século Vazio.** Este é o átomo pedido no vetor (b) e ele é devastador para a economia da hipótese. O Governo paga o preço de destruir uma nação inteira contra *uma* pessoa que tenta aprender; H-12 precisa que o mesmo Governo tolere, por oitocentos anos, o relato completo circulando cantado. A assimetria de custo não é implausível — é incoerente. Quem paga uma nação por um aprendiz não deixa de pagar um cantor.\n\n- EV-1066-01 — **Qualquer conhecimento dos eventos reais do Século Vazio é tratado como sentença de morte pelo Governo Mundial, independente da filiação de quem sabe.** A cláusula \"independente da filiação\" fecha a única saída retórica disponível a H-12, que seria alegar que o Governo tolera portadores inofensivos do relato. Não tolera nenhum. Se a canção é o registro, todo mundo que a canta está sob sentença — e a obra mostra a canção sendo tocada, não perseguida.\n\n- EV-0392-01 — **Pesquisar o Século Vazio é considerado pelo Governo Mundial o pior crime possível.** O regime é de proibição de pesquisa, não de proibição de decifração. H-12 exige que a política do Governo seja um controle de chave (guardar Laugh Tale) enquanto deixa o texto livre; o corpus descreve o inverso, um controle de acesso ao próprio ato de investigar.\n\n- EV-0966-01 — Roger especulou que o Governo Mundial proíbe a pesquisa dos Poneglyphs justamente para que ninguém chegue a Laugh Tale e **encontre o que está escondido lá**. \"Escondido\" é vocabulário do próprio corpus, em fala canônica, aplicado exatamente ao objeto de H-12. A hipótese precisa reler \"escondido\" como \"cifrado e à vista\", e não existe átomo que autorize a releitura.\n\n- EV-0301-01 — Diz-se que ao chegar a Laugh Tale, **se a pessoa levou consigo as passagens dos Poneglyphs recolhidas na viagem**, o Rio Poneglyph será finalmente revelado. Inversão fatal da direção chave/fechadura. No corpus, a chave é o que o visitante *traz* e o que a ilha entrega é o texto revelado. H-12 precisa do contrário — a ilha guarda a chave e o texto está fora, na canção. Nenhum átomo descreve Laugh Tale entregando um instrumento de leitura; o único átomo que descreve o que a ilha entrega descreve um documento.\n\n- EV-0972-02 — Os Piratas de Roger **leram a mensagem em Laugh Tale, aprenderam a verdadeira história** e decidiram deixar tudo como estava ao perceber que tinham chegado cedo demais. Único registro de alguém obtendo a verdadeira história, e ele localiza o aprendizado na leitura da mensagem *da ilha*. Se Laugh Tale fosse só a chave, o aprendizado ocorreria depois, ao aplicar a chave à letra da canção. O átomo põe o verbo \"aprenderam\" colado ao verbo \"leram a mensagem\", no mesmo lugar.\n\n- EV-0488-01 — A última linha de Binks' Sake termina em warai-banashi, escrito com os mesmos caracteres de Laugh Tale, e **Roger citou essa exata linha antes de nomear a ilha**. É o átomo em que H-12 inteira se apoia, e ele aponta para o lado contrário: a direção evidenciada é canção → nome da ilha. Roger batizou um lugar com uma expressão de uma canção. Isso é *nomeação*, não *codificação*. Além disso o átomo é `ambiguo`, e a própria nota de correção registra que a versão anterior estava errada e que o peso interpretativo dele caiu — é a base mais frágil que uma hipótese poderia escolher para carregar um enunciado inteiro.\n\n- EV-0967-04 — A canção Binks' Sake **toca ao longo de todo o capítulo** em que a tripulação de Roger chega a Laugh Tale. Este é um fato de encenação: a canção soa sobre a cena. Tratá-lo como prova de função arquivística é erro de categoria — a obra tocar uma música numa sequência não é a mesma coisa que um personagem consultar a letra dela. Note ainda que este átomo já está reivindicado por H-11 (sake, festa, partilha), com uma leitura que não precisa postular oito séculos de criptografia oral.\n\n- EV-1117-01 — Os Cinco Anciãos **interromperam parte da transmissão global de Vegapunk a qualquer custo**. Prova de capacidade e de disposição: o Governo intervém em tempo real, no meio de uma difusão mundial, para cortar conteúdo. Um veículo lento, repetitivo e identificável como uma canção seria o alvo mais fácil que esse aparato já enfrentou.\n\n### Veredito\n\nrefutada\n\nUso \"refutada\" pelo mesmo critério que o repositório já aplicou a H-07: o enunciado tem duas metades e há átomo canônico batendo em cada uma.\n\n**Metade 1 — \"nunca foi ocultado, apenas cifrado em folclore\".** Cai contra três átomos canônicos de ocultamento consumado e bem-sucedido: EV-1190-04 (encobrimento ordenado do nome de Roger), EV-1069-01 (Nika apagada dos documentos modernos) e EV-1084-01 (registros de Lili apagados). \"Nunca\" é um universal; três contraexemplos canônicos bastam. E a versão fraca da metade 1 — o Governo tolerou este veículo específico — colide com a estrutura de custos de EV-0393-01 e EV-1066-01: um aparato que destrói nações contra um aprendiz e trata qualquer conhecimento como sentença de morte não é um aparato que deixa passar o relato completo em circulação livre por oitocentos anos.\n\n**Metade 2 — \"o que se encontra em Laugh Tale é a chave que a torna legível\".** Cai contra EV-0301-01, que descreve a relação chave/texto na direção oposta (o visitante traz as passagens, a ilha revela o documento), e contra EV-0972-02, que localiza o aprendizado da verdadeira história na leitura da mensagem que está na ilha.\n\n**A previsão única é decorativa, e nos dois sentidos.** Primeiro, ela já está praticamente cumprida por retrodição: EV-0967-04 tem a canção tocando ao longo do capítulo da chegada a Laugh Tale, e EV-0488-01 tem Roger citando a última linha dela antes de nomear a ilha. Uma releitura com peso histórico já ocorreu; prever a repetição do que a base já registra não é risco. Segundo, \"sentido histórico explícito\" não tem critério, não tem prazo e não tem quantificador: qualquer painel que ligue a canção a Joy Boy, a Roger ou ao passado a satisfaz, e a hipótese decide depois se o que apareceu foi \"explícito\" o bastante. Terceiro — e é o defeito que a condena como teste — ela **não discrimina**: H-04, H-05, H-11 e H-02 sobrevivem todas intactas a Binks' Sake ganhando peso histórico. Uma previsão que se cumpre igualmente sob as quatro rivais não testa nada.\n\nPior: a previsão não testa a hipótese que diz testar. H-12 afirma duas coisas fortes — a letra **é** o registro, e Laugh Tale **é** a chave. A previsão pede apenas que a letra seja relida com sentido histórico. Mesmo o cumprimento integral da previsão deixa as duas afirmações centrais sem confirmação, e a metade \"chave\" fica inteiramente fora de teste. Pelo CLAUDE.md, hipótese viva precisa de previsão falseável; esta é uma só, elástica, já satisfeita e não discriminante. Exijo substituição por par de cláusulas conjuntas e arriscadas, no espírito de: *a obra transcreverá em painel um verso de Binks' Sake que nomeie um evento, um lugar ou uma pessoa do Século Vazio (não bastando \"sentido histórico\"); e o conteúdo obtido em Laugh Tale será mostrado operando sobre um texto externo à ilha, e não sendo lido na ilha* — a segunda cláusula é a que separa H-12 de H-04, e é justamente a que EV-0301-01 e EV-0972-02 já põem em risco.\n\n**O que sobrevive, e é honesto registrar.** A ligação lexical de EV-0488-01 é real e não deve ser descartada: warai-banashi e Laugh Tale são os mesmos caracteres, e Roger citou a linha antes de batizar a ilha. Isso é um fato de nomeação com peso temático, e explica por que a canção toca na cena (EV-0967-04). O que não existe é a ponte entre \"a ilha se chama assim por causa de um verso\" e \"o verso guarda o relato do Século Vazio\". Uma reformulação salvável de H-12 seria muito mais modesta — algo como \"Binks' Sake preserva um traço do Século Vazio\", sem \"registro\", sem \"nunca foi ocultado\" e sem chave. Essa versão poderia entrar como hipótese de escopo menor; a versão atual, não.\n\n### Custo estrutural\n\n8 suposições não evidenciadas:\n\n1. **Que a letra de Binks' Sake contenha conteúdo histórico.** Dos 108 átomos, apenas EV-0488-01 cita algo da letra, e o que cita é a última linha, que termina em warai-banashi — uma história de rir. Nenhum verso da canção com data, nome, evento ou reino aparece em átomo nenhum. A peça que dá nome à hipótese não tem base.\n2. **Que a canção seja contemporânea do Século Vazio.** O corpus data o Governo Mundial em 800 anos (EV-0722-01), os Poneglyphs no fim do Século Vazio (EV-0818-02) e a punição de Zunesha em 800 anos (EV-0821-01). Não data a canção. Os \"oitocentos anos\" de circulação são acréscimo integral da hipótese.\n3. **Que a canção circulou livre e ininterruptamente.** Nenhum átomo descreve taverna, transmissão popular, difusão ou continuidade da canção. EV-0967-04 diz que ela toca num capítulo, o que é fato de trilha, não de circulação social.\n4. **Que a transmissão oral preserva sem corromper por oito séculos.** O único átomo sobre sobrevivência de verdade antiga, EV-1069-01, diz o contrário: sobreviveu nos textos mais antigos e foi apagada dos documentos modernos. E o resíduo folclórico que restou virou objeto de dúvida dos próprios Cinco Anciãos (EV-1037-01, \"apenas lenda\").\n5. **Que o Governo tolerou deliberadamente esse veículo.** Suposição exigida por EV-0393-01 e EV-1066-01 e não sustentada por átomo algum. É a suposição mais cara do conjunto: ela pede que o aparato mais violento do corpus tenha feito uma exceção que ninguém no corpus menciona.\n6. **Que o Governo desconhece a cifra.** Alternativa à suposição 5, e igualmente sem átomo. Ela é ainda pior, porque EV-1190-04 mostra Imu descendo ao nível de um nome próprio individual e EV-1117-01 mostra os Cinco Anciãos cortando uma transmissão em curso: esse aparato não perde uma canção de vista por oito séculos.\n7. **Que existe em Laugh Tale um instrumento de leitura.** Nenhum átomo descreve chave, cifra, decodificador ou instrumento na ilha. EV-0301-01 promete a revelação de um documento, o Rio Poneglyph, e EV-0218-01 apresenta o Rio Poneglyph como o que amarraria os fios da história — texto, não chave.\n8. **Que a coincidência lexical é codificação e não nomeação.** EV-0488-01 registra a ordem dos fatos: Roger citou a linha e *depois* nomeou a ilha. H-12 precisa inverter a seta causal sem átomo que a inverta.\n\n**Cadeia frágil — ponto único de falha declarado.** Retire EV-0488-01 e não sobra nada: EV-0967-04 sozinho diz apenas que uma canção soa numa cena, o que é compatível com H-11 e com qualquer outra hipótese. E EV-0488-01 é `ambiguo`, é o único átomo do corpus que toca a letra, tem histórico registrado de correção por erro de tradução, e a nota do próprio átomo declara que seu peso interpretativo caiu. Uma hipótese de escopo `one_piece` inteira pendurada num átomo com essa ficha é a definição de cadeia frágil.\n\n**Circularidade.** O argumento tem a forma: a ilha se chama Laugh Tale, a canção termina em warai-banashi, logo a canção fala da ilha, logo a canção guarda o que a ilha guarda. O segundo \"logo\" só passa se já assumirmos que a canção codifica conteúdo — que é a conclusão. EV-0488-01 sustenta apenas que Roger tirou um nome de um verso; a passagem de \"nome\" para \"registro cifrado\" é fornecida pela própria hipótese. Modo de falha número 6 do manual.\n\n### Concorrente mais econômico\n\nH-04\n\nH-12 é H-04 com troca de veículo, e a troca custa caro sem comprar nada. As duas hipóteses concordam no essencial — o One Piece é o relato do Século Vazio, e ele se torna legível no fim da rota. A diferença é onde o texto está: H-04 o põe no documento que o corpus já nomeou e já colocou no fim da rota, EV-0301-01 (o Rio Poneglyph revelado a quem chega com as passagens) e EV-0218-01 (o Rio Poneglyph amarraria os fios da história); H-12 o tira dali e o põe numa letra de canção que nenhum átomo transcreve.\n\nContagem de peças. H-04 precisa de um texto no fim da rota — evidenciado por EV-0301-01, EV-0218-01 e EV-0972-02 — e de um Governo que suprime informação — evidenciado por EV-0393-01, EV-0395-01 e EV-1066-01. H-12 precisa de tudo isso *mais* oito suposições listadas acima, entre elas duas incompatíveis com os mesmos átomos de supressão que H-04 usa como apoio. É estritamente mais maquinaria explicando os mesmos átomos, e parte da maquinaria trabalha contra o resto: H-12 invoca o custo que o Governo paga para suprimir (é o que dá importância ao relato) e simultaneamente precisa que esse mesmo Governo não tenha pago custo nenhum contra o veículo principal do relato.\n\nRecomendação ao Curador: prior de H-12 abaixo do de qualquer hipótese `one_piece` viva, e status fora de `viva` enquanto a previsão única não for substituída — ela está simultaneamente já cumprida por EV-0967-04 e EV-0488-01 e incapaz de separar H-12 de H-04, H-05, H-11 e H-02.\n\nMenciono H-11 como segundo concorrente, restrito a um ponto: ela já explica EV-0967-04 e EV-0968-03 (Roger dá uma grande festa trocando bebidas com todos) pela via do sake e da partilha, sem postular criptografia, sem postular oito séculos de transmissão e sem precisar que o Governo tenha aberto uma exceção na sua política. Se a pergunta é \"por que Binks' Sake toca em Laugh Tale\", H-11 responde com zero suposições novas.\n", "posterior": 0.028200212275775093, "fatia": 0.0}, {"id": "H-06", "enunciado": "O One Piece e a terceira arma ancestral, Uranus, ou a chave de acesso a ela, guardada no fim da Grand Line.", "escopo": "one_piece", "status": "viva", "prior": 0.05, "apoia": [{"ev": "EV-0650-01", "peso": 0.35, "como": "As tres armas ancestrais tem nome de divindades e nao se limitam a objetos inanimados, incluindo seres vivos, o que permite que Uranus seja qualquer coisa guardada em Laugh Tale."}, {"ev": "EV-0967-02", "peso": 0.3, "como": "Joy Boy deixou Poneglyphs descrevendo o paradeiro das armas ancestrais, ligando a rede de Poneglyphs que leva a Laugh Tale ao tema das armas."}, {"ev": "EV-1116-01", "peso": 0.25, "como": "Joy Boy teve papel na preservacao das tres armas ancestrais para que geracoes futuras pudessem acessa-las e usa-las, o que torna coerente que tenha guardado a terceira no fim da rota."}], "contradiz": [{"ev": "EV-1089-01", "peso": 0.55, "como": "York roubou uma amostra da Mother Flame e a enviou aos Cinco Anciaos e a Imu, que a usaram para energizar uma arma ancestral: se o Governo ja opera uma das armas, ela nao esta esperando em Laugh Tale."}, {"ev": "EV-1053-01", "peso": 0.3, "como": "Pluton repousa numa caverna secreta ao pe do Monte Fuji submerso na antiga Wano, abaixo do Road Poneglyph do pais: o padrao da obra e guardar cada arma longe do fim da rota, nao nele."}, {"ev": "EV-0649-02", "peso": 0.3, "como": "Shirahoshi herdou o titulo de Poseidon, poder que aparece numa princesa sereia a cada varios seculos, o que reforca o mesmo padrao: as armas estao espalhadas e vivas no mundo, nao guardadas no fim da Grand Line."}, {"ev": "EV-1086-01", "peso": 0.25, "como": "Dragon estranha que o Governo so agora tenha usado uma arma capaz de apagar o Reino de Lulusia em segundos, o que reforca que a arma faltante ja estava em maos do Governo."}], "prediz": [{"texto": "Se verdadeiro, Uranus sera identificado como estando em Laugh Tale ou acessivel apenas a partir dela, e nao em Mary Geoise.", "status": "aberta"}, {"texto": "Se verdadeiro, a arma que destruiu o Reino de Lulusia sera nomeada como algo diferente de Uranus antes do desfecho da saga.", "status": "aberta"}], "concorrentes": ["H-01", "H-02", "H-03", "H-04", "H-05", "H-07", "H-08", "H-11", "H-12", "H-13"], "redteam_ultimo": "2026-08-11", "corpo": "## O caso a favor\n\nUranus e a unica peca do trio que a obra deixou em branco, e o fim da rota e o unico\nlugar que a obra deixou em branco. A tentacao de casar as duas lacunas e obvia — e e\nso isso que sustenta a hipotese.\n\n## O caso contra (Red Team, 2026-0 nde inteiramente de um átomo de\n  confiabilidade mínima, sobre a capa, cuja própria nota interna diz que a parte\n  usada é inferência.\n\n### Veredito\n\nrefutada\n\nA previsão única de H-13 tem duas metades e nenhuma sobrevive.\n\nA primeira metade — \"não haverá objeto algum em Laugh Tale\" — é a única parte\narriscada da hipótese, e já é contrafactual **hoje**, contra átomos canônicos\nexistentes, sem precisar de capítulo futuro: EV-0301-01 diz que o Rio Poneglyph\nserá revelado a quem chegar com as passagens recolhidas na viagem, EV-0967-11 diz\nque a tripulação de Roger gargalhou **ao encontrar o tesouro** em Laugh Tale, e\nEV-0967-03 tem Roger nomeando o tesouro inacreditável que Joy Boy **deixou**. Três\nátomos independentes colocam coisa na ilha.\n\nA segunda metade — \"a obra dará ao termo One Piece um referente geográfico ou\npolítico explícito no desfecho\" — é decorativa e deve ser marcada como tal. A\ndisjunção \"geográfico **ou** político\" é larga demais para correr risco: o corpus\njá garante mudança de forma do mundo independentemente do que o One Piece seja\n(EV-1113-02, afundamento global anunciado; EV-1115-01, ilhas que são topos de\ncontinentes submersos; EV-1055-01, muralhas montanhosas de Wano literalmente\nderrubadas; EV-1172-01, mundo dividido em dois). Toda hipótese viva do repositório\nconvive com esse pano de fundo, e H-08 o prevê explicitamente. Se o desfecho der\num referente político em vez de geográfico, a previsão também se cumpre — e\n\"referente político explícito\" é satisfeito por qualquer desfecho em que o Governo\nMundial caia. Uma previsão que se cumpre em quase todo desfecho não separa H-13 de\nnada. **Exijo substituição**: a previsão precisa nomear uma cena que só H-13\ntolera, por exemplo que nenhum personagem jamais aponte, pegue, leia ou entregue\nalgo a que chame One Piece, e que a última página não mostre objeto nomeado.\n\nRespondendo aos três ataques na ordem em que foram pedidos:\n\n(a) **Evidência sobre o autor, não sobre o mundo.** O campo `fonte` de EV-0001-02\né \"titulo da obra\". O átomo verifica uma escolha de grafia na capa. Isso é dado\nsobre decisões editoriais do autor, não sobre a ontologia do mundo ficcional, e é\no único átomo do corpus nesse registro. Uma hipótese sobre *o que existe no mundo*\nnão pode ter como âncora um fato sobre *como o mundo é anunciado ao leitor*.\n\n(b) **Trocadilho de leitura é evidência de trocadilho.** O corpus mostra o padrão\ncorreto em EV-0488-01: a coincidência de caracteres entre warai-banashi e Laugh\nTale conta porque **Roger cita a linha dentro da obra, antes de nomear a ilha**.\nComparado a isso, a leitura \"mar em calmaria\" nunca é usada em texto por ninguém —\né uma possibilidade fonética que a grafia em kana não exclui. Não excluir não é\nafirmar. Como evidência, ela sustenta no máximo \"o autor escolheu um título com\nleitura ambígua\", que é compatível com todas as hipóteses do repositório.\n\n(c) **Elasticidade.** Sim, e é o defeito estrutural. Removida a metade já\nfalseada, o que sobra de H-13 se acomoda a qualquer desfecho em que o mundo mude\nde forma — e o corpus já prometeu mudança de forma por quatro vias distintas.\nVale o precedente de H-07: aquela hipótese também identificava o One Piece com\numa configuração geográfica e caiu porque, retirada a identificação, o que sobrava\njá era carregado por outra hipótese com menos peças. H-13 repete o mesmo erro de\nestrutura num sentido invertido — H-07 apostou no mar baixando, H-13 no mar\núnico — e cai contra o mesmo par de átomos.\n\n### Custo estrutural\n\n8 suposições não evidenciadas:\n\n1. **Que a leitura correta de hitotsunagi é \"um mar em calmaria\"** e não as outras\n   duas que o próprio EV-0001-02 lista como igualmente abertas. Nenhum átomo\n   desempata; a escolha é livre.\n2. **Que a grafia em kana da capa é evidência sobre o mundo da obra.** Nenhum\n   átomo liga escolha tipográfica do título a fato interno da ficção, e nenhuma\n   outra hipótese do rep
