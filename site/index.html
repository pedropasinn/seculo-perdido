Barba Branca recusou porque seu sonho era ter uma família. Um homem\n  informado do caminho recusa sem hesitar. Se o que está lá fosse o documento que\n  destrói a legitimidade do Governo Mundial, a recusa sairia caríssima; ela é\n  barata, o que sugere conteúdo não convertível em arma política.\n- EV-1164-02 — Rocks pergunta a Imu se ele teme mais Davy Jones ou Joy Boy, e sugere\n  que Imu vive aterrorizado com a possibilidade de alguém herdar a vontade de Jones\n  e cumprir a promessa de que ele falava. Aqui a obra nomeia o medo do Governo: um\n  herdeiro que cumpra uma promessa — uma pessoa e um ato. Não um leitor que\n  publique um arquivo. Isso rouba de H-04 sua melhor evidência circunstancial, que\n  é o tamanho do encobrimento.\n- EV-0966-01 — Roger especulou que o Governo Mundial proíbe a pesquisa dos\n  Poneglyphs justamente para que ninguém chegue a Laugh Tale e encontre o que está\n  escondido lá. A proibição é enunciada como bloqueio de acesso a um lugar e a uma\n  coisa escondida: encontrar, não publicar.\n- EV-0202-01 — Robin é uma das pouquíssimas pessoas vivas capazes de ler a língua\n  antiga dos Poneglyphs. \"Pouquíssimas\" é plural: o átomo estabelece raridade, não\n  unicidade. A previsão (1) trata a indispensabilidade de Robin como consequência\n  da hipótese, mas o único átomo sobre sua capacidade de leitura não a sustenta.\n\n### Veredito\n\nferida\n\nNão refutada, e é justo dizer por quê: nenhum átomo nega que haja documento em Laugh\nTale, e a componente documental tem apoio real — EV-0507-01 diz que os Piratas de\nRoger descobriram a verdadeira história, EV-0301-01 promete que o Rio Poneglyph será\nrevelado a quem chegar com as passagens recolhidas na viagem, e EV-0218-01 apresenta\no Rio Poneglyph como o que amarraria os fios da história. A metade *documental* do\nenunciado sobrevive.\n\nO que está ferido é a metade causal — \"cuja divulgação destrói a legitimidade do\nGoverno Mundial\" — e é ela que faz H-04 ser uma hipótese distinta em vez de um\nsubconjunto de H-05. O mecanismo de delegitimação não tem um único átomo que o\ndescreva; tem treze acima que empurram o desfecho para guerra, força, partição\ngeográfica e afundamento. Sem essa metade, H-04 colapsa numa versão mais cara de\nH-05.\n\n### Custo estrutural\n\n7 suposições não evidenciadas:\n\n1. **Completude e forma de arquivo.** Os átomos atestam que a tripulação \"aprendeu a\n   verdadeira história\" (EV-0507-01) e leu \"a mensagem\" (EV-0972-02). Nenhum atesta\n   que se trate de um *registro completo*, nem de forma arquivística. \"Completo\" é\n   acréscimo do enunciado.\n2. **Identidade entre \"as palavras de Joy Boy\" e esse registro.** EV-1190-03 é o\n   único descritor direto e a obra o formula como palavras seguíveis ou recusáveis.\n   H-04 precisa assumir que crônica e recado são o mesmo objeto.\n3. **Que a autoridade do Governo Mundial repousa em crença pública.** Nenhum átomo\n   afirma isso. Os que descrevem o regime o mostram operando por Buster Call\n   (EV-0393-01), por sentença de morte a qualquer um que saiba (EV-1066-01) e pela\n   Dominação de Imu (EV-1181-01).\n4. **Que existe canal de divulgação ininterrompível.** EV-1117-01 mostra o oposto,\n   no exemplo mais recente disponível.\n5. **Que o conteúdo é auto-incriminatório.** O que a obra mostra suprimido é um\n   *nome* — Clover é baleado antes de pronunciar o do Reino Antigo (EV-0395-01) — e\n   a letra D. no nome de Roger (EV-1190-04). Supressão de identidade é compatível\n   com medo de sucessor tanto quanto com medo de acusação.\n6. **Que Robin é a leitora necessária**, e não uma entre pouquíssimas (EV-0202-01).\n7. **Que a audiência mundial acreditaria e agiria.** Nenhum átomo registra reação\n   alguma do público às revelações de EV-1114-01 e EV-1115-01.\n\n**Falseabilidade — previsão (1) é meia-decorativa.** \"Robin estará fisicamente\npresente\" não discrimina hipótese nenhuma: EV-1053-01 já a mostra acompanhando o\ngrupo que acessa o Road Poneglyph de Wano com Sukiyaki, e toda hipótese em que os\nChapéus de Palha chegam a Laugh Tale prevê a mesma presença. H-01, H-03, H-05, H-07 e\nH-08 pagam zero por essa previsão. Só \"indispensável\" carrega conteúdo, e\nindispensabilidade é julgada depois do fato e por leitura editorial. **Exigir\nsubstituição** por algo arriscado e datável: por exemplo, \"Robin lerá em cena um\ntexto que nomeia o Reino Antigo, e esse nome será tornado público antes do desfecho\"\n— previsão que EV-0395-01 torna verificável, já que o nome é justamente o que foi\ninterrompido a tiros.\n\n**Falseabilidade — previsão (2) é elástica no ponto errado.** Ela é uma previsão\nsobre *como o Governo Mundial cai*, não sobre *o que o One Piece é*. Se a queda vier\npor guerra (EV-0576-01) ou por partição do mundo (EV-1172-01), H-04 pode se declarar\nsobrevivente alegando que o registro existe mesmo assim. Uma previsão que não pode\nmatar a hipótese que ela adorna é decoração. Pior: as duas vias não são exclusivas —\nqualquer desfecho realista terá divulgação *e* violência, e a previsão se cumpre\nsozinha em quase todo cenário.\n\n**Cadeia frágil.** A âncora forte de H-04 é EV-0507-01, e mesmo esse átomo é\ncuidadoso: licencia que o que Roger achou *incluiu* informação histórica, não que\n*seja* o registro. O reforço natural, EV-0507-02, está marcado `ambiguo` e vem de\nseção de trívia. A hipótese depende de um átomo que, lido com honestidade, apoia uma\nafirmação mais fraca do que a que ela precisa.\n\n**Circularidade.** EV-0392-01 (pesquisar o Século Vazio é o pior crime possível),\nEV-0393-01 e EV-1066-01 só apoiam H-04 se já se assumir que o motivo do encobrimento\né auto-incriminação. Os mesmos átomos são explicados por EV-0966-01 (bloquear o\nacesso a um lugar) e por EV-1164-02 (medo de um herdeiro que cumpra uma promessa).\n\"O Governo esconde muito, logo o escondido o condena\" é inferência que já pressupõe a\nconclusão.\n\n### Concorrente mais econômico\n\nH-05\n\nH-05 lê EV-1190-03 sem tradução: palavras de Joy Boy são palavras de Joy Boy, e\n\"seguir ou recusar\" é o que se faz com um pedido. Ela cobre a mesma evidência\ndocumental que H-04 cobre — EV-0507-01, EV-0972-02 — e cobre melhor a decisão de\ndeixar tudo como estava e o destinatário esperado de EV-1121-01. E não paga nada\npelas suposições 3, 4, 5 e 7 acima, porque não faz afirmação alguma sobre o mecanismo\nde queda do Governo Mundial. Menos peças, mesma cobertura.\n\nH-08 é o segundo colocado pelo lado do \"cedo demais\", mas é mais caro que H-05:\nprecisa da profecia do Harley, cujo átomo central EV-1138-03 está marcado\n`traducao_disputada`.\n\nSe o Curador quiser manter H-04 viva, o caminho honesto é reduzi-la ao que os átomos\nsustentam — \"há em Laugh Tale um texto que fecha a lacuna do Século Vazio\" — e\nabandonar a cláusula de delegitimação. Mas essa versão reduzida é praticamente H-05\ncom outro nome, e duas hipóteses que fazem as mesmas previsões não deveriam consumir\nprior separado.\n\n## Ataque 2026-08-11 (segunda rodada)\n\nEscopo deste bloco: a versão reescrita depois do primeiro ataque. Os treze átomos de\ncontra-evidência do bloco anterior continuam valendo e não são repetidos — o que segue\né sobre o que mudou. Dois dos átomos abaixo foram importados pela própria hipótese como\napoio; eu os leio contra ela, e digo qual é qual.\n\n### Contra-evidência encontrada\n\n- EV-0395-02 — *importado como apoio, corta contra.* Clover afirma que o Governo\n  Mundial apagou o reino não por temer seu poder nem suas armas, mas por temer seus\n  ideais. Isso destrói a previsão (2). Ideais não são auto-incriminatórios: são rivais.\n  Um texto que preserva os ideais de um reino apagado não confessa um crime do Governo,\n  propõe outro Governo. A previsão exige que o conteúdo nomeie \"o crime fundador\"\n  exatamente onde o novo apoio diz \"ideais\", e a única testemunha que a obra deixou\n  falar sobre o motivo da censura escolheu a palavra que a hipótese não pode usar.\n- EV-1181-02 — Imu declara que a Dominação é a única bem-aventurança verdadeira do\n  mundo e, ao dizer isso, recorda uma conversa com Joy Boy e grita o nome dele com\n  raiva. É EV-0395-02 visto do outro lado do balcão: a obra formula a oposição entre os\n  dois lados como disputa de teses sobre o mundo. Nenhuma das duas falas — a de Clover,\n  a de Imu — trata de um crime a ser revelado.\n- EV-0967-03 — *tomado como contradição na reescrita; é mais grave do que a hipótese\n  admite.* Em Laugh Tale, Roger se dirige a Joy Boy e nomeia duas coisas na mesma fala:\n  o tesouro inacreditável que ele deixou e o inacreditável laugh tale. Se a estrutura\n  coordena dois itens, o relato e o tesouro são coisas distintas na mesma ilha — e H-04\n  identifica o One Piece com o relato, isto é, com o segundo item da coordenação. Some-se\n  EV-0105-01, onde Laugh Tale é a ilha que supostamente guarda o tesouro chamado One\n  Piece, e EV-0002-01, onde o título de Rei dos Piratas foi ligado por Roger ao tesouro:\n  nos átomos, o nome \"One Piece\" acompanha o tesouro, não o laugh tale. H-04 pode estar\n  certa sobre o que existe na ilha e errada sobre o referente do nome.\n- EV-1138-14 — Ripley considera o mural um sonho de criança precisamente porque ele\n  mostra várias raças diferentes trabalhando juntas, algo de que os gigantes não têm\n  registro. Isto fere mais fundo do que \"o Governo não apagou o mural\". É o único caso em\n  que a obra mostra o **efeito social** de um registro público e antigo: quem convive com\n  ele o descarta como fantasia infantil, e o motivo do descarte é justamente o conteúdo\n  mais forte que ele carrega. Divulgar não é ser acreditado. A suposição de audiência —\n  item 7 do primeiro ataque, ali apenas uma lacuna — passa a ter contraexemplo em cena.\n- EV-1138-01 — o mural é `ambiguo` e a própria leiga que o apresenta relata a teoria\n  corrente de que teria sido esculpido por crianças fantasiando. A rejeição não é\n  idiossincrasia de Ripley, é a leitura corrente do lugar. Exposição pública prolongada\n  produziu folclore, não crise de legitimidade.\n- EV-1085-02 e EV-1085-03 — Imu se interessa por Lili por causa de um erro dela que\n  levou os Poneglyphs a se espalharem pelo mundo, e esse ato de espalhar é tido como o\n  que influenciou piratas a persegui-los em busca de tesouro. O registro do Século Vazio\n  já está distribuído pelo mundo, por acidente e não por plano, e o efeito que a obra\n  mede é uma caçada ao tesouro. H-04 precisa que a divulgação derrube o regime; o\n  experimento já rodou em escala mundial e a obra registrou outro resultado.\n- EV-0649-01 — Joy Boy escreveu num Poneglyph da Sea Forest um pedido de desculpas por\n  não ter cumprido sua parte da promessa feita à Ilha dos Homens-Peixe. É a única amostra\n  de escrita de Joy Boy que o leitor viu, e ela não é crônica nem inventário: é desculpa\n  endereçada. \"Registro completo\" é uma forma de texto que a obra nunca exibiu; a forma\n  que ela exibiu é carta.\n- EV-0722-01 e EV-1084-01 — dezenove dos vinte monarcas se mudaram para Mary Geoise após\n  a fundação do Governo Mundial, e Lili, a única dos vinte soberanos a não se mudar,\n  desapareceu antes de voltar para casa e teve seus registros apagados. Eu ia usar isto\n  para dizer que os Vinte Reinos não têm crime nos átomos, só mudança de endereço. **Não\n  posso: EV-0395-08 chegou durante este ataque e diz o contrário** (ver abaixo). Fica só o\n  resíduo: o que os átomos dão sobre os vinte reinos em si continua sendo mudança e\n  desaparecimento, e o crime canônico é atribuído ao grupo, não aos vinte.\n- EV-0395-03 — no discurso de Clover o reino é descrito com um adjetivo comum, kyodai na\n  oukoku, ou seja um reino imenso, e não com um nome próprio. A previsão (2) diz que o\n  conteúdo \"nomeará o Reino Antigo\", e este átomo abre a possibilidade de que não haja\n  nome próprio a pronunciar, e de que estejamos fundindo o termo de Clover em 395 com o de\n  Vegapunk em 1114. Uma previsão sobre *nomear* não fica de pé enquanto a existência do\n  nome é pendência de raw.\n- EV-1114-01 — Vegapunk revela ao mundo que Joy Boy veio do Reino Antigo, foi o primeiro\n  pirata da história e portava a Hito Hito no Mi Modelo Nika. Já citado na primeira\n  rodada, agora com outra função: se a previsão (2) aceita \"nomeará o Reino Antigo\" como\n  cumprimento, esse ramo já está cumprido por uma transmissão global que não passou por\n  Laugh Tale, não passou por Robin e não produziu efeito registrado sobre o Governo. Num\n  ramo a previsão é retroativamente barata; no outro é contrariada por EV-0722-01. Foi a\n  disjunção \"ou\" que a barateou.\n- EV-1138-05 — *importado como apoio, e é o pior negócio da reescrita.* O átomo é\n  `traducao_disputada` — o validador avisa acima de peso 0.4 — e o que ele diz é que\n  ouvir vozes é a expressão com que **Roger** descreve ler os Poneglyphs. O leitor que o\n  átomo nomeia é Roger. Para sustentar a previsão (1), H-04 comprou um átomo cujo único\n  leitor identificado é o homem que já leu tudo em Laugh Tale sem Robin. Junto com\n  EV-1136-01, que só estabelece que o Harley divide sua história em três Mundos sendo o\n  Segundo o Século Vazio, a importação do Harley traz periodização e uma tradução\n  disputada, e nenhuma linha sobre divulgação.\n- EV-0972-02 — os Piratas de Roger leram a mensagem em Laugh Tale e aprenderam a\n  verdadeira história. É a única chegada mostrada, e nela a leitura foi executada por\n  completo sem Robin. A previsão (1) afirma que a revelação não avançará sem a tradução\n  de Robin; o único precedente existente é uma revelação que avançou inteira sem ela.\n  Com EV-0202-01 (\"uma das pouquíssimas pessoas vivas\", plural), a indispensabilidade não\n  é arriscada — é contrariada.\n- EV-1155-01 e EV-1179-01 — descendentes de Davy D. Jones se estabeleceram em God Valley\n  e o Governo Mundial, ao descobri-los, os incluiu como alvos na caçada dos Nobres\n  Mundiais; e a ascendência Davy de Marshall D. Teach é conhecida por um número pequeno de\n  pessoas, entre elas Imu. Com EV-1190-04 (Imu ordenou pessoalmente o encobrimento do\n  verdadeiro nome de Gol D. Roger por ele ser um D.), o padrão do que o Governo suprime é\n  linhagem: quem descende de quem. Nenhum dos três é sobre documento.\n\n**Átomos que entraram no repositório durante este ataque.** Enquanto eu escrevia, o\nextrator despejou o arco de Ohara (391–398), a Ilha dos Homens-Peixe (621–653) e um bloco\nde 1066/1120. Isso muda o caso dos dois lados e eu não vou fingir que só achei munição.\n\n*O que me obriga a devolver terreno — o melhor apoio que H-04 já teve, e ele chegou\ndepois da reescrita:*\n\n- EV-0395-10 — Clover afirma que o povo do reino antigo, ao saber que seria derrotado,\n  gravou os poneglyphs para que o mundo soubesse o que havia acontecido. É a primeira vez\n  que um átomo enuncia **finalidade de divulgação** para o registro. Eu vinha sustentando\n  que a metade causal de H-04 não tinha nenhum átomo que a descrevesse; agora tem um para\n  a intenção, e ele é `canonico`.\n- EV-0395-08 — Clover afirma que, antes de o Governo Mundial existir, o mundo era regido\n  por um reino imenso, e que esse reino foi exterminado por um grupo que veio a se tornar\n  o Governo Mundial. É o crime fundador, nomeado, na obra, por uma testemunha. A previsão\n  (2) deixa de ser uma aposta sobre conteúdo inexistente e passa a ter forma canônica.\n  Retiro a parte do meu ataque que dizia que os átomos não davam crime nenhum.\n\n*O que fere, e fere mais fundo do que o terreno devolvido:*\n\n- EV-0396-01 — Olvia afirma que Ohara nunca quis revelar a história ao mundo: queria\n  apenas ouvir as vozes do passado e transmiti-las adiante. Os arqueólogos que morreram\n  por esse conhecimento **recusam explicitamente a divulgação como objetivo**. E note o\n  vocabulário: *ouvir as vozes* do passado e *transmitir adiante* — a mesma expressão que\n  H-04 importou via EV-1138-05 aponta, no átomo canônico onde ela aparece com sujeito\n  identificado, para transmissão em cadeia, não para publicação ao mundo.\n- EV-0648-06 — um dos Reis do Mar percebe que Luffy ouviu a conversa deles, e o grupo\n  lembra que outro humano, Gol D. Roger, também ouvia suas vozes. Este é o golpe direto em\n  EV-1138-05 e, por tabela, na previsão (1): \"ouvir vozes\" tem referente `canonico` e\n  literal na obra — ouvir Reis do Mar — que não é ler, não é traduzir e não precisa de\n  Robin. A ponte \"ouvir vozes = ler poneglyph\" era a peça que ligava o Harley à leitura de\n  Robin, e ela agora tem um concorrente canônico melhor.\n- EV-1066-03 — Vegapunk visitou Elbaf em segredo e leu os livros salvos de Ohara, e por\n  isso conhece a verdadeira história. Com EV-1066-02 (os livros jogados no lago foram\n  recolhidos por gigantes liderados por Jaguar D. Saul e levados para Elbaf), a obra\n  registra uma **segunda rota completa até a verdadeira história**, que não passa por Laugh\n  Tale, não passa pelo Rio Poneglyph e não passa por Robin. A previsão (1) — a revelação não\n  avançará sem a tradução de Robin — é contrariada por um átomo `canonico` em que a\n  revelação já avançou sem ela.\n- EV-0395-09 — os estudiosos de Ohara só descobriram a existência de um país que não\n  existe mais cruzando vários documentos e poneglyphs, e não por uma única fonte. A\n  verdadeira história é reconstruída por cruzamento distribuído. \"Registro completo\",\n  singular e concentrado no fim da rota, é a forma que o método descrito na obra dispensa.\n- EV-0395-11 e EV-0394-04 — os Cinco Anciãos afirmam que a continuidade da pesquisa\n  acabará revivendo as armas ancestrais mesmo que os estudiosos não tenham essa intenção, e\n  Spandine acusa os estudiosos de Ohara de terem como objetivo despertar as armas\n  ancestrais. O motivo que o Governo **enuncia** para o encobrimento é revival de armas, não\n  medo de ser acusado. H-04 precisa que o motivo seja auto-incriminação; os dois átomos em\n  que o próprio Governo diz o motivo dizem outra coisa, e EV-1066-04 fecha o cerco: Shaka\n  afirma que o Governo tentou apagar todo conhecimento do Reino Antigo com a intenção de que\n  absolutamente ninguém carregasse os ideais dele. Carregar ideais, de novo.\n- EV-0395-13 — os Cinco Anciãos classificam a posição de Clover como idealismo, e ele\n  pergunta por que lhes negam o direito de sustentar ideais. O regime, confrontado em\n  tempo real com o crime fundador dito em voz alta por EV-0395-08, não responde defendendo\n  sua legitimidade: rotula o adversário de idealista, atira (EV-0395-15) e convoca o Buster\n  Call (EV-0395-16). O teste da metade causal de H-04 aconteceu em cena, com o conteúdo\n  certo dito à audiência certa, e o resultado foi força.\n- EV-0398-02 — a Marinha vistoriou as ruínas de Ohara, confirmou que não havia\n  sobreviventes e viu o lago cheio de livros sem dar importância a eles. O Governo tinha o\n  acervo à mão e não se interessou. Não é o comportamento de um regime cuja legitimidade\n  mora naqueles livros.\n- EV-0628-01 — Robin observa que o poneglyph da Sea Forest é diferente de todos os que já\n  lera: em vez de registro histórico tem forma de carta de desculpas e menciona alguém\n  chamado Joy Boy. A própria leitora que a previsão (1) chama de indispensável classifica o\n  texto de Joy Boy como **não sendo registro histórico**. Some-se EV-0649-07 — a mensagem\n  deixada por Joy Boy era endereçada à princesa sereia que vivia na ilha naquela época — e o\n  padrão do que Joy Boy escreve é correspondência endereçada, duas vezes seguidas.\n\n### Veredito\n\nferida\n\nMais fundo que na primeira rodada, e por um motivo que vale registrar: a reescrita\nrespondeu ao ataque importando dois apoios, e **cada importação comprou uma suposição\nnova**. EV-0395-02 entrou para explicar por que o Governo esconde e saiu contradizendo a\nprevisão (2). EV-1138-05 entrou para pôr a leitura no centro e trouxe junto a etiqueta\n`traducao_disputada` e o nome errado de leitor. As sete suposições da primeira rodada\ncontinuam todas de pé, em forma igual ou reformulada, e entraram duas: a ponte do Harley\naté a ilha (item 6) e a existência de um nome próprio a pronunciar (item 8), esta última\ncobrada pela redação da previsão (2). O custo estrutural subiu de 7 para 9.\n\n**O arco de Ohara mudou o eixo do problema e o Curador precisa ver isso separado.** A\nmetade documental, que eu já dava por sobrevivente, agora está forte: EV-0395-10 dá\nfinalidade de divulgação ao registro e EV-0395-08 dá o crime fundador com autor nomeado. Se\na hipótese fosse só \"há em Laugh Tale um texto que fecha a lacuna do Século Vazio e que\nincrimina os fundadores do Governo\", ela sairia desta rodada mais forte do que entrou. O que\nnão sobreviveu foi o **elo causal e o elo de leitura**, e os dois caíram por átomos novos e\ncanônicos: EV-1066-03 mostra a verdadeira história alcançada por outra rota, sem Robin e sem\nLaugh Tale, o que contraria a previsão (1) diretamente; e EV-0395-13 com EV-0395-15 e\nEV-0395-16 mostram o crime fundador sendo dito em voz alta ao próprio Governo, que responde\ncom rótulo, tiro e Buster Call — não com perda de legitimidade. A hipótese ganhou o conteúdo\nque previa e perdeu o mecanismo que a distinguia. É o pior arranjo possível para ela, porque\né exatamente o que a converte em H-05 com uma cláusula causal pendurada.\n\nHá um dano colateral que a hipótese talvez não tenha percebido. Rodei\n`tools/sensibilidade.py`: H-04 é a hipótese que menos depende de capítulos acima de 1100\n(12,4%, contra 69,3% de H-08 e 62,8% de H-05), e é por isso que ela lidera quando se\ncorta o arco de Elbaf. Essa independência era seu principal ativo estrutural — e a\nimportação de EV-1136-01 e EV-1138-05 é exatamente o gesto de gastá-lo. O primeiro\nataque penalizou H-08 por depender do Harley; H-04 acabou de comprar a mesma dívida.\n\nO que sobrevive continua sendo a metade documental: EV-0507-01 (os Piratas de Roger\ndescobriram a verdadeira história), EV-0218-01 (o Rio Poneglyph amarraria os fios da\nhistória) e EV-0301-01 (o Rio Poneglyph será revelado a quem chegar com as passagens\nrecolhidas). Nada disso caiu e não devo fingir que caiu.\n\n**Falseabilidade — previsão (1): melhorou de verdade, no lugar errado.** Exigir que Robin\nseja indispensável e não apenas presente é uma reparação honesta da crítica anterior, e\nagora a previsão discrimina: H-01 e H-11 preveem explicitamente que nenhuma capacidade de\nleitura de Poneglyph será necessária, e H-03 prevê mudança de estado \"sem depender de\nleitura\". Contra essas três, H-04 arrisca algo. Mas ela não discrimina contra H-05, que é\na hipótese na qual o primeiro ataque disse que H-04 colapsa — H-05 também precisa que a\nmensagem dirigida seja lida para que Luffy responda com uma decisão explícita. A previsão\nmelhorou contra as hipóteses que H-04 já vencia e continua muda onde precisa falar. E,\ncomo está, EV-0972-02 já a contraria no único precedente disponível: se \"indispensável\"\nsignifica que ninguém mais pode fazer o serviço, a tripulação de Roger fez o serviço.\n\n**Falseabilidade — previsão (2): a disjunção matou a previsão.** \"Nomeará o Reino Antigo\n**ou** o crime fundador dos Vinte Reinos\" tem um ramo barato e um ramo sem lastro. O ramo\nbarato já foi cumprido por EV-1114-01 sem nenhuma das consequências que a hipótese\npromete. O ramo caro é contrariado por EV-0722-01 e EV-1084-01, que descrevem mudança e\ndesaparecimento, não crime. E o adjetivo que carrega o peso — \"auto-incriminatória\" — é\nnegado pelo próprio apoio novo EV-0395-02. Substituição exigida: uma previsão de ramo\núnico, que teste a *consequência* e não a *menção*. Por exemplo: \"depois de o conteúdo ser\ntornado público, ao menos um Estado membro do Governo Mundial romperá com ele por causa do\nconteúdo, e a obra dirá que foi por causa do conteúdo\" — arriscada, datável e capaz de\nmatar a hipótese, ao contrário da atual.\n\n**Circularidade, segunda rodada.** EV-0395-02 só apoia H-04 se já se assumir que os ideais\ntemidos estão registrados no que há em Laugh Tale. O discurso de Clover é sobre o reino\napagado; ele não menciona Laugh Tale, o One Piece nem qualquer documento guardado no fim da\nrota. A ponte é fornecida pela hipótese. O mesmo vale, e pior, para EV-1136-01 e\nEV-1138-05: nenhum dos dois nomeia Laugh Tale ou o tesouro.\n\n### Custo estrutural\n\n9 suposições não evidenciadas (eram 7 na primeira rodada):\n\n1. **Que \"registro completo\" seja o referente do nome One Piece**, e não o outro item que\n   Roger nomeia na mesma fala (EV-0967-03), com EV-0105-01 e EV-0002-01 amarrando o nome ao\n   tesouro.\n2. **Que a autoridade do Governo Mundial repouse em crença pública.** Nenhum átomo o diz;\n   os que descrevem o regime o mostram operando por Buster Call (EV-0393-01), por sentença\n   de morte a quem sabe (EV-1066-01) e pela Dominação de Imu (EV-1181-01).\n3. **Que a audiência acreditaria e agiria** — agora com contraexemplo: EV-1138-14 e\n   EV-1138-01.\n4. **Que existe canal de divulgação ininterrompível** — EV-1117-01 mostra o oposto.\n5. **Que temer ideais se converte em conteúdo auto-incriminatório.** EV-0395-02 e\n   EV-1066-04 dizem ideais; EV-0395-11 e EV-0394-04 dizem armas; a hipótese precisa de\n   acusação. Três motivos declarados na obra e nenhum é o dela.\n6. **Que o \"ouvir vozes\" do Harley se refira a ler o que está em Laugh Tale.** EV-1138-05 é\n   `traducao_disputada` e nomeia Roger; EV-1136-01 é periodização; e agora EV-0648-06 dá à\n   expressão um referente canônico concorrente — ouvir Reis do Mar. Nenhum liga o Harley à\n   ilha.\n7. **Que Robin especificamente seja necessária**, contra EV-0202-01 (plural), EV-0972-02\n   (uma tripulação sem ela já leu tudo) e sobretudo EV-1066-03 (Vegapunk chegou à verdadeira\n   história pelos livros de Ohara salvos em Elbaf).\n8. **Que \"Reino Antigo\" seja um nome próprio pronunciável**, pendência aberta em\n   EV-0395-03 — e EV-0395-08, o átomo canônico mais recente, também o descreve como \"um\n   reino imenso\".\n9. **Que o registro seja completo e concentrado num só lugar.** EV-0395-09 descreve o\n   método que funcionou como cruzamento de vários documentos e poneglyphs, e EV-0628-01 tem\n   a própria Robin classificando o texto de Joy Boy como não sendo registro histórico.\n\n**Cadeia frágil.** Inalterada e agora mais exposta: a âncora forte continua sendo\nEV-0507-01, que licencia que o achado de Roger *incluiu* informação histórica, não que\n*seja* o registro; e o reforço natural EV-0507-02 é `ambiguo` e vem de seção de trívia. A\nhipótese ainda apoia uma afirmação forte num átomo que sustenta uma fraca.\n\n### Concorrente mais econômico\n\nH-05\n\nMantida a indicação da primeira rodada, e a reescrita a reforçou em vez de enfraquecê-la.\nEV-0395-02, o apoio novo de H-04, é lido por H-05 sem nenhuma peça extra: ideais são o que\nse segue ou se recusa, que é exatamente o que Gaban faz com as palavras de Joy Boy em\nEV-1190-03, e é a forma que EV-1181-02 dá à briga entre Imu e Joy Boy. H-05 também absorve\nEV-0649-01 de graça — o único texto de Joy Boy que existe é um pedido de desculpas\nendereçado — enquanto H-04 tem de tratá-lo como exceção. E H-05 não paga nada pelas\nsuposições 2, 3, 4 e 5, porque não faz afirmação alguma sobre como o Governo Mundial cai.\n\nSegundo colocado, e por um motivo específico: H-02. Ela é a única hipótese do repositório\nque já prevê o resultado de EV-1138-14 — valor relacional, efeito vindo do que a existência\ndo anúncio provocou e não do conteúdo. Se o Curador quiser um teste limpo entre as duas, a\npergunta é se a obra vai mostrar alguém *mudando de lado* por causa do conteúdo divulgado,\nou apenas mudando de rota.\n", "posterior": 0.40049745977535633, "fatia": 0.12755894591833059}, {"id": "H-03", "enunciado": "O One Piece e um artefato funcional do Reino Antigo, cuja ativacao depende de condicoes que nao existiam na epoca de Roger.", "escopo": "one_piece", "status": "viva", "prior": 0.14, "apoia": [{"ev": "EV-1125-02", "peso":  O que houver em Laugh Tale já está, na única promessa textual disponível,\n  datado **dentro** do Século Vazio e não antes dele.\n\n- EV-1190-03 — \"Gaban diz a Imu que conhece as palavras de Joy Boy, mas que nao tem\n  intencao de seguir as palavras de um homem que nao conheceu.\" Segundo golpe na\n  previsão (1), e este é canônico e recente. O que a tripulação trouxe de Laugh\n  Tale são **palavras de Joy Boy** — atribuídas a ele, seguíveis ou recusáveis,\n  produzidas por um homem do Século Vazio. A previsão exige que o conteúdo de\n  Laugh Tale não seja obra de Joy Boy; o corpus já registra conteúdo de Laugh Tale\n  que é obra de Joy Boy.\n\n- EV-1122-02 — \"Joy Boy selou parte do seu Haki do Conquistador dentro de Emet,\n  atado em no, para ser liberado seculos depois se o robo estivesse em perigo\n  mortal.\" O único depósito de Joy Boy para o futuro que a obra mostra em detalhe\n  é feito **do próprio Haki dele**, atado em nó por ele, com condição de disparo\n  definida por ele. Não é repasse de bem alheio: é autoria integral. \"Joy Boy\n  apenas passou adiante\" tem contra si o único caso documentado do que Joy Boy\n  deixou.\n\n- EV-0649-01 — \"Joy Boy escreveu num Poneglyph da Sea Forest um pedido de desculpas\n  por nao ter cumprido sua parte da promessa feita a Ilha dos Homens-Peixe.\" O\n  único texto de Joy Boy que o leitor viu é **escrito por ele**, sobre uma promessa\n  que era **sua parte** a cumprir. Um mero transmissor de herança não se desculpa\n  em primeira pessoa por obrigação própria.\n\n- EV-0967-03 — \"Em Laugh Tale, Roger se dirige a Joy Boy e nomeia duas coisas na\n  mesma fala: o tesouro inacreditavel que **ele deixou** e o inacreditavel laugh\n  tale.\" Quem viu o achado atribui o ato de deixar a Joy Boy, em segunda pessoa,\n  no lugar. `ambiguo`, e por isso não vale sozinho — mas é o único átomo do corpus\n  que diz de quem é o gesto de deixar, e ele diz Joy Boy.\n\n- EV-0506-02 — \"Na execucao Roger declarou que, tal como Joy Boy, havia escondido\n  **seu** tesouro para que o proximo Rei dos Piratas o encontrasse.\" Duas feridas.\n  O possessivo trata o tesouro como de quem esconde, nos dois casos. E, se\n  procede, o conteúdo de Laugh Tale inclui algo que **Roger acrescentou** — o que\n  quebra a cadeia de custódia intacta que a hipótese precisa, mesmo que tudo o\n  mais fosse verdade.\n\n- EV-1115-03 — \"A derrota de Joy Boy marcou o fim do Reino Antigo e, com ele, o fim\n  do Seculo Vazio.\" A obra, quando resume a queda, centra tudo em **Joy Boy e no\n  Reino Antigo**. Não há terceiro termo, não há herança recebida, não há ciclo\n  anterior no enunciado da própria transmissão global de Vegapunk.\n\n- EV-1115-01 — \"Vegapunk conclui que o uso das armas ancestrais elevou o nivel do\n  mar em 200 metros e que as ilhas de hoje sao os topos dos continentes\n  submersos.\" A explicação canônica da forma do mundo é **um evento, o uso das\n  armas ancestrais**, dentro do Século Vazio. Nenhum ciclo anterior é necessário\n  para nada do que a base precisa explicar.\n\n- EV-1138-14 — \"Ripley considera o mural um sonho de crianca precisamente porque ele\n  mostra varias racas diferentes trabalhando juntas, algo de que os gigantes nao\n  tem registro.\" Este átomo é canônico e é o rótulo que a obra pendura no objeto\n  de onde vem a premissa inteira. Ele não refuta o mural — H-11 e H-14 já\n  mostraram que a razão do descarte é fraca. Mas ele estabelece que **nenhum\n  personagem da obra trata o mural como registro histórico datado**, que é\n  exatamente o uso que a hipótese precisa fazer dele.\n\n- EV-1138-02 — \"Na porcao do Terceiro Mundo do mural aparece uma figura de Nika ao\n  centro...\" A nota do próprio átomo é o problema: duas fontes secundárias\n  divergem sobre quem está desenhado, e o átomo foi reduzido ao mínimo comum com a\n  instrução explícita de **não usar para afirmar presença de personagem\n  específico**. Se o corpus já não confia no mural para dizer quem aparece nele,\n  confiar nele para datar a origem do One Piece é pedir mais do que ele suporta.\n\n- EV-1116-01 — \"Joy Boy teve papel na preservacao das tres armas ancestrais para que\n  geracoes futuras pudessem acessa-las e usa-las, **por razoes ate hoje\n  desconhecidas**.\" A âncora é contra-evidência de si mesma pela cláusula final: a\n  obra declara o motivo em aberto, e a hipótese preenche a lacuna declarada com a\n  própria tese e depois cita o átomo como apoio. É a circularidade em forma pura.\n\n### Veredito\n\nrefutada\n\nRespondendo aos três ataques na ordem pedida.\n\n**(a) Não é distinta de H-03: é H-03 com uma etiqueta de data colada por fora.**\n\nH-03 diz que o One Piece é artefato funcional do Reino Antigo cuja ativação\ndepende de condições que não existiam na época de Roger. A hipótese atacada\nmantém o artefato, mantém a função, mantém a espera — e só troca o crachá do\nfabricante, empurrando a autoria um ciclo para trás e rebaixando o Reino Antigo a\ndepositário.\n\nO teste de distinção é mecânico: existe algum desfecho que confirme uma e refute a\noutra? Não. Um artefato do Primeiro Mundo, guardado pelo Reino Antigo, funcional,\nativado tarde, satisfaz H-03 **e** o enunciado atacado ao mesmo tempo. Não são\nhipóteses concorrentes: uma é modificador da outra. E o modificador não compra\ncobertura nova — todos os átomos que a hipótese quer explicar (EV-1125-02,\nEV-1065-01, EV-0967-11, EV-1116-01) já estão em H-03, e dois deles ela explica\n**pior**: EV-1065-01 atribui a tecnologia ao próprio Reino Antigo, e EV-1125-02\ndata a energia antiga como comum no Século Vazio.\n\nVale o precedente de H-06, deflacionada para 0.05 por dominância estrita de H-03:\n\"tudo que H-06 explica, H-03 explica sem precisar que a coisa seja especificamente\numa arma\". A mesma frase se aplica aqui trocando \"arma\" por \"de dois ciclos atrás\".\n\nSobre a falseabilidade das duas previsões:\n\n*Previsão (1) — \"o que houver em Laugh Tale será datado na obra como anterior ao\nSéculo Vazio, não como obra de Joy Boy ou do Reino Antigo\".* É a única metade\narriscada da hipótese, e já é contrafactual hoje. EV-1190-03 registra palavras de\nJoy Boy vindas de Laugh Tale; EV-0301-01 mais EV-0818-02 põem na ilha um Poneglyph,\nsuporte inventado pelo clã Kouzuki no fim do Século Vazio; EV-0967-03 tem Roger\natribuindo a Joy Boy o gesto de deixar. Para sobreviver, a previsão tem de se\nretrair para \"o One Piece propriamente dito, e não as outras coisas que estão em\nLaugh Tale\" — e essa retração só é disponível porque o quantificador \"o que\nhouver\" é elástico. **Exijo substituição**: a previsão precisa nomear o referente\n(a coisa a que a obra chamar One Piece, não qualquer objeto no sítio) e exigir\nnúmero dito por personagem. Só que, feita essa correção, a previsão vira\nliteralmente a previsão (1) de H-14 — \"a obra datara explicitamente algum\nartefato, ruina ou registro como sendo anterior a novecentos anos atras, com\nnumero dito por um personagem\" — que H-14 já carrega com prior 0.45 e **sem\nprecisar afirmar nada sobre o tesouro**.\n\n*Previsão (2) — \"Joy Boy será mostrado recebendo ou encontrando o One Piece em vez\nde criá-lo\".* Decorativa, por três defeitos somados. Primeiro, a disjunção\nelástica: \"recebendo **ou** encontrando\" cobre dois modos de aquisição\nincompatíveis entre si, e o repositório já corrigiu exatamente esse vício na\nprevisão (1) de H-09, onde \"tomando ou herdando\" foi rejeitado como disjunção que\na herança satisfaz. Segundo, não tem critério de reprovação: se a obra nunca\nmostrar Joy Boy adquirindo coisa alguma — e ela nunca mostrou Joy Boy em Laugh\nTale —, a previsão não falha, apenas fica aberta para sempre. Terceiro, o corpus\njá traz uma descrição do gesto de Joy Boy sobre o tesouro, em EV-0506-02, e o verbo\né **esconder**: esconder é compatível com receber, com encontrar e com criar, de\nmodo que nem a única frase disponível discrimina.\n\n**(b) \"Preservou\" não prova não-autoria. É leitura forçada do verbo, em s pelo valor de contraste do que pela plausibilidade:\nela e o lembrete de que 'o Governo esconde' e uma premissa nossa, nao um dado.\nAinda nao passou pelo Red Team.\n\n## Status: refutada em 2026-08-11\n\nOito suposicoes nao evidenciadas, e o golpe nao precisou discutir a cancao. O\nenunciado afirma um universal — 'nunca foi ocultado' — e a base tem tres\nocultamentos canonicos consumados: EV-1190-04 (Imu manda encobrir o nome de\nRoger), EV-1069-01 (Nika apagado dos documentos modernos) e EV-1084-01 (registros\nde Lili eliminados). Um universal cai com um contraexemplo; havia tres.\n\nSomam-se: EV-0393-01 e EV-1066-01 descrevem um aparato de censura que nao faz\nexcecao por filiacao, o que e incoerente com deixar o registro circular em bares\npor oitocentos anos; e EV-1037-01 mostra o que de fato acontece com residuo\nfolclorico sob esse aparato — degrada ate virar 'apenas lenda'.\n\nInverte tambem a direcao da chave: EV-0301-01 diz que quem chega leva as passagens\nrecolhidas na viagem, e EV-0972-02 diz que aprenderam a verdadeira historia lendo\na mensagem NA ilha.\n\n## O que a ressuscitaria\n\nUma cena em que a letra de Binks' Sake seja lida como registro historico. Fica no\ncemiterio como lembrete util: 'o Governo esconde' e premissa nossa, e vale a pena\nter tentado ataca-la.", "redteam": "# Red team — H-12\n\n## Ataque 2026-08-11\n\n### Contra-evidência encontrada\n\n- EV-1190-04 — Imu recorda ter ordenado **pessoalmente o encobrimento do verdadeiro nome de Gol D. Roger** por ele ser um D. Isto é ocultamento nominal, deliberado, executado no topo da cadeia de comando e sobre um dado que circulava no mundo inteiro. O enunciado de H-12 abre com um universal negativo — \"nunca foi ocultado\" — e este átomo canônico o falsifica sozinho. Não é uma ferida de detalhe: é a primeira metade do enunciado batendo em átomo.\n\n- EV-1069-01 — Segundo Vegapunk, a existência de Nika **só está registrada nos textos mais antigos, tendo sido apagada dos documentos modernos**  filiação\" fecha a única saída retórica disponível a H-12, que seria alegar que o Governo tolera portadores inofensivos do relato. Não tolera nenhum. Se a canção é o registro, todo mundo que a canta está sob sentença — e a obra mostra a canção sendo tocada, não perseguida.\n\n- EV-0392-01 — **Pesquisar o Século Vazio é considerado pelo Governo Mundial o pior crime possível.** O regime é de proibição de pesquisa, não de proibição de decifração. H-12 exige que a política do Governo seja um controle de chave (guardar Laugh Tale) enquanto deixa o texto livre; o corpus descreve o inverso, um controle de acesso ao próprio ato de investigar.\n\n- EV-0966-01 — Roger especulou que o Governo Mundial proíbe a pesquisa dos Poneglyphs justamente para que ninguém chegue a Laugh Tale e **encontre o que está escondido lá**. \"Escondido\" é vocabulário do próprio corpus, em fala canônica, aplicado exatamente ao objeto de H-12. A hipótese precisa reler \"escondido\" como \"cifrado e à vista\", e não existe átomo que autorize a releitura.\n\n- EV-0301-01 — Diz-se que ao chegar a Laugh Tale, **se a pessoa levou consigo as passagens dos Poneglyphs recolhidas na viagem**, o Rio Poneglyph será finalmente revelado. Inversão fatal da direção chave/fechadura. No corpus, a chave é o que o visitante *traz* e o que a ilha entrega é o texto revelado. H-12 precisa do contrário — a ilha guarda a chave e o texto está fora, na canção. Nenhum átomo descreve Laugh Tale entregando um instrumento de leitura; o único átomo que descreve o que a ilha entrega descreve um documento.\n\n- EV-0972-02 — Os Piratas de Roger **leram a mensagem em Laugh Tale, aprenderam a verdadeira história** e decidiram deixar tudo como estava ao perceber que tinham chegado cedo demais. Único registro de alguém obtendo a verdadeira história, e ele localiza o aprendizado na leitura da mensagem *da ilha*. Se Laugh Tale fosse só a chave, o aprendizado ocorreria depois, ao aplicar a chave à letra da canção. O átomo põe o verbo \"ap s de Lili apagados). \"Nunca\" é um universal; três contraexemplos canônicos bastam. E a versão fraca da metade 1 — o Governo tolerou este veículo específico — colide com a estrutura de custos de EV-0393-01 e EV-1066-01: um aparato que destrói nações contra um aprendiz e trata qualquer conhecimento como sentença de morte não é um aparato que deixa passar o relato completo em circulação livre por oitocentos anos.\n\n**Metade 2 — \"o que se encontra em Laugh Tale é a chave que a torna legível\".** Cai contra EV-0301-01, que descreve a relação chave/texto na direção oposta (o visitante traz as passagens, a ilha revela o documento), e contra EV-0972-02, que localiza o aprendizado da verdadeira história na leitura da mensagem que está na ilha.\n\n**A previsão única é decorativa, e nos dois sentidos.** Primeiro, ela já está praticamente cumprida por retrodição: EV-0967-04 tem a canção tocando ao longo do capítulo da chegada a Laugh Tale, e EV-0488-01 tem Roger citando a última linha dela antes de nomear a ilha. Uma releitura com peso histórico já ocorreu; prever a repetição do que a base já registra não é risco. Segundo, \"sentido histórico explícito\" não tem critério, não tem prazo e não tem quantificador: qualquer painel que ligue a canção a Joy Boy, a Roger ou ao passado a satisfaz, e a hipótese decide depois se o que apareceu foi \"explícito\" o bastante. Terceiro — e é o defeito que a condena como teste — ela **não discrimina**: H-04, H-05, H-11 e H-02 sobrevivem todas intactas a Binks' Sake ganhando peso histórico. Uma previsão que se cumpre igualmente sob as quatro rivais não testa nada.\n\nPior: a previsão não testa a hipótese que diz testar. H-12 afirma duas coisas fortes — a letra **é** o registro, e Laugh Tale **é** a chave. A previsão pede apenas que a letra seja relida com sentido histórico. Mesmo o cumprimento integral da previsão deixa as duas afirmações centrais sem confirmação, e a metade \"chave\" fica inteiramente fora de teste. Pelo CLAUDE.md, hipótese viva precisa de previsão falseável; esta é uma só, elástica, já satisfeita e não discriminante. Exijo substituição por par de cláusulas conjuntas e arriscadas, no espírito de: *a obra transcreverá em painel um verso de Binks' Sake que nomeie um evento, um lugar ou uma pessoa do Século Vazio (não bastando \"sentido histórico\"); e o conteúdo obtido em Laugh Tale será mostrado operando sobre um texto externo à ilha, e não sendo lido na ilha* — a segunda cláusula é a que separa H-12 de H-04, e é justamente a que EV-0301-01 e EV-0972-02 já põem em risco.\n\n**O que sobrevive, e é honesto registrar.** A ligação lexical de EV-0488-01 é real e não deve ser descartada: warai-banashi e Laugh Tale são os mesmos caracteres, e Roger citou a linha antes de batizar a ilha. Isso é um fato de nomeação com peso temático, e explica por que a canção toca na cena (EV-0967-04). O que não existe é a ponte entre \"a ilha se chama assim por causa de um verso\" e \"o verso guarda o relato do Século Vazio\". Uma reformulação salvável de H-12 seria muito mais modesta — algo como \"Binks' Sake preserva um traço do Século Vazio\", sem \"registro\", sem \"nunca foi ocultado\" e sem chave. Essa versão poderia entrar como hipótese de escopo menor; a versão atual, não.\n\n### Custo estrutural\n\n8 suposições não evidenciadas:\n\n1. **Que a letra de Binks' Sake contenha conteúdo histórico.** Dos 108 átomos, apenas EV-0488-01 cita algo da letra, e o que cita é a última linha, que termina em warai-banashi — uma história de rir. Nenhum verso da canção com data, nome, evento ou reino aparece em átomo nenhum. A peça que dá nome à hipótese não tem base.\n2. **Que a canção seja contemporânea do Século Vazio.** O corpus data o Governo Mundial em 800 anos (EV-0722-01), os Poneglyphs no fim do Século Vazio (EV-0818-02) e a punição de Zunesha em 800 anos (EV-0821-01). Não data a canção. Os \"oitocentos anos\" de circulação são acréscimo integral da hipótese.\n3. **Que a canção circulou livre e ininterruptamente.** Nenhum átomo descreve taverna, transmissão popular, difusão ou continuidade da canção. EV-0967-04 diz que ela toca num capítulo, o que é fato de trilha, não de circulação social.\n4. **Que a transmissão oral preserva sem corromper por oito séculos.** O único átomo sobre sobrevivência de verdade antiga, EV-1069-01, diz o contrário: sobreviveu nos textos mais antigos e foi apagada dos documentos modernos. E o resíduo folclórico que restou virou objeto de dúvida dos próprios Cinco Anciãos (EV-1037-01, \"apenas lenda\").\n5. **Que o Governo tolerou deliberadamente esse veículo.** Suposição exigida por EV-0393-01 e EV-1066-01 e não sustentada por átomo algum. É a suposição mais cara do conjunto: ela pede que o aparato mais violento do corpus tenha feito uma exceção que ninguém no corpus menciona.\n6. **Que o Governo desconhece a cifra.** Alternativa à suposição 5, e igualmente sem átomo. Ela é ainda pior, porque EV-1190-04 mostra Imu descendo ao nível de um nome próprio individual e EV-1117-01 mostra os Cinco Anciãos cortando uma transmissão em curso: esse aparato não perde uma canção de vista por oito séculos.\n7. **Que existe em Laugh Tale um instrumento de leitura.** Nenhum átomo descreve chave, cifra, decodificador ou instrumento na ilha. EV-0301-01 promete a revelação de um documento, o Rio Poneglyph, e EV-0218-01 apresenta o Rio Poneglyph como o que amarraria os fios da história — texto, não chave.\n8. **Que a coincidência lexical é codificação e não nomeação.** EV-0488-01 registra a ordem dos fatos: Roger citou a linha e *depois* nomeou a ilha. H-12 precisa inverter a seta causal sem átomo que a inverta.\n\n**Cadeia frágil — ponto único de falha declarado.** Retire EV-0488-01 e não sobra nada: EV-0967-04 sozinho diz apenas que uma canção soa numa cena, o que é compatível com H-11 e com qualquer outra hipótese. E EV-0488-01 é `ambiguo`, é o único átomo do corpus que toca a letra, tem histórico registrado de correção por erro de tradução, e a nota do próprio átomo declara que seu peso interpretativo caiu. Uma hipótese de escopo `one_piece` inteira pendurada num átomo com essa ficha é a definição de cadeia frágil.\n\n**Circularidade.** O argumento tem a forma: a ilha se chama Laugh Tale, a canção termina em warai-banashi, logo a canção fala da ilha, logo a canção guarda o que a ilha guarda. O segundo \"logo\" só passa se já assumirmos que a canção codifica conteúdo — que é a conclusão. EV-0488-01 sustenta apenas que Roger tirou um nome de um verso; a passagem de \"nome\" para \"registro cifrado\" é fornecida pela própria hipótese. Modo de falha número 6 do manual.\n\n### Concorrente mais econômico\n\nH-04\n\nH-12 é H-04 com troca de veículo, e a troca custa caro sem comprar nada. As duas hipóteses concordam no essencial — o One Piece é o relato do Século Vazio, e ele se torna legível no fim da rota. A diferença é onde o texto está: H-04 o põe no documento que o corpus já nomeou e já colocou no fim da rota, EV-0301-01 (o Rio Poneglyph revelado a quem chega com as passagens) e EV-0218-01 (o Rio Poneglyph amarraria os fios da história); H-12 o tira dali e o põe numa letra de canção que nenhum átomo transcreve.\n\nContagem de peças. H-04 precisa de um texto no fim da rota — evidenciado por EV-0301-01, EV-0218-01 e EV-0972-02 — e de um Governo que suprime informação — evidenciado por EV-0393-01, EV-0395-01 e EV-1066-01. H-12 precisa de tudo isso *mais* oito suposições listadas acima, entre elas duas incompatíveis com os mesmos átomos de supressão que H-04 usa como apoio. É estritamente mais maquinaria explicando os mesmos átomos, e parte da maquinaria trabalha contra o resto: H-12 invoca o custo que o Governo paga para suprimir (é o que dá importância ao relato) e simultaneamente precisa que esse mesmo Governo não tenha pago custo nenhum contra o veículo principal do relato.\n\nRecomendação ao Curador: prior de H-12 abaixo do de qualquer hipótese `one_piece` viva, e status fora de `viva` enquanto a previsão única não for subs
