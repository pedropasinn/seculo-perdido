<h1>Wiki de Evidências — One Piece</h1>
<div class="sub">Hipóteses ordenadas pelo posterior. A porcentagem grande é a fatia repartida

ela assume que a resposta certa está entre as listadas. Toda afirmação aponta para um
átomo verificável.</div>

<script id="dados" type="application/json">{"evidencias": [{"id": "EV-0001-01", "fonte": "cap 1", "fonte_url": "https://onepiece.fandom.com/wiki/Nika", "tipo": "narracao", "confiabilidade": "canonico", "texto": "A fruta foi roubada de um navio do Governo pelos Piratas do Ruivo, e um menino de sete anos chamado Monkey D. Luffy a encontrou largada e a comeu por engano, achando que era sobremesa.", "atores": ["Monkey D. Luffy", "Shanks"], "temas": ["Nika", "Akuma no Mi", "Luffy"], "corpo": "O trajeto da fruta ate Luffy: roubo por terceiros mais engano de crianca. Qualquer hipotese de selecao tem que explicar por que a escolha se pareceu tanto com acaso."}, {"id": "EV-0001-02", "fonte": "titulo da obra", "fonte_url": "https://thelibraryofohara.com/2022/01/04/what-is-the-one-piece-the-ultimate-one-piece-theory/", "tipo": "narracao", "confiabilidade": "traducao_disputada", "texto": "O titulo da obra e escrito hitotsunagi no daihihou, o grande tesouro oculto, com hitotsunagi grafado em kana e nao em kanji, o que deixa a leitura em aberto entre algo em uma peca so, aquilo que conecta pessoas e um mar em calmaria.", "temas": ["One Piece", "nome", "traducao"], "corpo": "A grafia em kana e fato verificavel na capa. As tres leituras sao inferencia. Nenhuma hipotese do repositorio tratava o nome da obra como evidencia."}, {"id": "EV-0002-01", "fonte": "cap 2", "fonte_url": "https://onepiece.fandom.com/wiki/Great_Pirate_Era", "tipo": "narracao", "confiabilidade": "canonico", "texto": "O titulo de Rei dos Piratas foi intrinsecamente ligado por Roger ao tesouro mitico conhecido como One Piece.", "atores": ["Gol D. Roger"], "temas": ["One Piece", "Rei dos Piratas"], "corpo": "O titulo e o tesouro sao a mesma aposta desde o inicio da obra."}, {"id": "EV-0096-01", "fonte": "cap 96", "fonte_url": "https://onepiece.fandom.com/wiki/Monkey_D._Luffy", "tipo": "fala", "confiabilidade": "canonico", "texto": "Woop Slap pergunta, sobre Luffy, se aquilo e o sonho dele ou o destino dele.", "atores": ["Woop Slap"], "temas": ["destino", "sonho", "Luffy"], "corpo": "A obra poe a oposicao sonho/destino em cena muito antes de Imu a formular em 1190."}, {"id": "EV-0099-01", "fonte": "cap 99", "fonte_url": "https://onepiece.fandom.com/wiki/Gol_D._Roger", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Testemunhas da execucao de Roger afirmam que ele sorriu pouco antes de morrer.", "atores": ["Gol D. Roger"], "temas": ["riso", "execucao", "Vontade de D."], "corpo": "O sorriso diante da morte e tratado na obra como marca dos portadores do D."}, {"id": "EV-0105-01", "fonte": "cap 105", "fonte_url": "https://onepiece.fandom.com/wiki/Laugh_Tale", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Laugh Tale e a ilha no fim do New World que supostamente guarda o tesouro chamado One Piece.", "temas": ["Laugh Tale", "One Piece"], "corpo": "O 'supostamente' e da propria wiki: a existencia do tesouro na ilha e afirmada por terceiros, nao mostrada."}, {"id": "EV-0202-01", "fonte": "cap 202", "fonte_url": "https://onepiece.fandom.com/wiki/Void_Century", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Nico Robin e uma das pouquissimas pessoas vivas capazes de ler a lingua antiga dos Poneglyphs.", "atores": ["Nico Robin"], "temas": ["Poneglyphs", "leitura"], "corpo": "Restricao de acesso: qualquer leitura do tesouro escrito depende de um numero minusculo de pessoas."}, {"id": "EV-0218-01", "fonte": "cap 218", "fonte_url": "https://onepiece.fandom.com/wiki/Void_Century", "tipo": "fala", "confiabilidade": "canonico", "texto": "O sonho de Robin e descobrir a verdade do Seculo Vazio encontrando o Rio Poneglyph, que amarraria os fios da historia.", "atores": ["Nico Robin", "Nefertari Cobra"], "temas": ["Rio Poneglyph", "Seculo Vazio"], "corpo": "O Rio Poneglyph e apresentado como o documento que fecha a lacuna historica."}, {"id": "EV-0261-01", "fonte": "cap 261", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_261", "tipo": "narracao", "confiabilidade": "canonico", "texto": "A lapide erguida nas ruinas registra que a cidade se chamava Shandora, que prosperou ha mais de 1100 anos e que seu povo desapareceu de forma inexplicada ha 800 anos.", "atores": ["Nico Robin"], "temas": ["Shandora", "Seculo Vazio", "datacao"], "corpo": "Contexto: Robin lendo a lapide da cidade no Upper Yard, provavelmente erguida pelos proprios descendentes. Relevante porque data a fundacao de Shandora antes do Seculo Vazio e o sumico do povo dentro dele."}, {"id": "EV-0261-02", "fonte": "cap 261", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_261", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Robin percebe que o desaparecimento do povo de Shandora ha 800 anos cai exatamente dentro dos cem anos ausentes da historia do mundo, e cogita que a ilha do ceu tenha feito parte dessa historia nao contada.", "atores": ["Nico Robin"], "temas": ["Shandora", "Seculo Vazio", "Skypiea"], "corpo": "A conexao e feita pela propria personagem dentro da cena, nao por interpretacao externa."}, {"id": "EV-0272-01", "fonte": "cap 272", "fonte_url": "https://onepiece.fandom.com/wiki/Void_Century", "tipo": "narracao", "confiabilidade": "ambiguo", "texto": "Ha indicacao de que a Grande Guerra do Seculo Vazio levou a queda da cidade de Shandora.", "temas": ["Shandora", "Grande Guerra"], "corpo": "A wiki usa 'has been indicated' — nao ha afirmacao direta em texto."}, {"id": "EV-0272-02", "fonte": "cap 272", "fonte_url": "https://onepiece.fandom.com/wiki/Poneglyph", "tipo": "imagem", "confiabilidade": "canonico", "texto": "Nas ruinas de Shandora ha uma parede coberta de escrita no mesmo sistema em que os Poneglyphs sao gravados.", "temas": ["Shandora", "Poneglyphs", "escrita antiga"], "corpo": "Importa porque mostra a escrita dos Poneglyphs sendo usada fora deles, em arquitetura comum da cidade."}, {"id": "EV-0272-03", "fonte": "cap 272", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_272", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Lendo as inscricoes das ruinas, Robin conclui que um Poneglyph foi trazido para Shandora na epoca em que a cidade lutava contra o inimigo, e que foi por causa disso que a cidade foi arruinada.", "atores": ["Nico Robin"], "temas": ["Shandora", "Poneglyphs", "Grande Guerra"], "corpo": "O resumo da fonte usa 'the enemy' sem nomear quem era. A pedra chega durante a guerra: nao e patrimonio antigo da cidade, e deposito de guerra."}, {"id": "EV-0272-04", "fonte": "cap 272", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_272", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Robin deduz das anotacoes de Noland que o Poneglyph de Shandora estava junto do grande sino, pendurado no centro dos quatro altares da cidade.", "atores": ["Nico Robin", "Mont Blanc Noland"], "temas": ["Shandora", "Poneglyphs", "sino de ouro"], "corpo": "Deducao que liga a pedra ao sino antes de qualquer um dos dois ser encontrado."}, {"id": "EV-0274-01", "fonte": "cap 274", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_274", "tipo": "fala", "confiabilidade": "canonico", "texto": "Enel descreve a Fairy Vearth como um lugar de terra ilimitada onde, segundo as lendas do lugar em que nasceu, mora Deus, e diz que voltar para la e voltar para onde pertence.", "atores": ["Enel"], "temas": ["Fairy Vearth", "lua", "Birka", "mito"], "corpo": "Primeira aparicao do destino lunar na obra, ainda como lenda de folclore birkano, sem qualquer mencao a lua."}, {"id": "EV-0274-02", "fonte": "cap 274", "fonte_url": "https://onepiece.fandom.com/wiki/Vearth", "tipo": "narracao", "confiabilidade": "traducao_disputada", "texto": "O nome do lugar procurado por Enel e escrito com kanji que se le como terra sem fim e furigana que se le Fairy Vearth, de modo que as duas traducoes correntes estao ambas no original.", "atores": ["Enel"], "temas": ["Fairy Vearth", "traducao", "lua"], "notas": "A wiki registra a divergencia Endless x Fairy como questao de traducao e dublagem. Nao construir argumento sobre a palavra 'fairy' sozinha.", "corpo": "Caso classico de escolha de tradutor virando teoria: em japones o mesmo termo carrega os dois sentidos."}, {"id": "EV-0274-03", "fonte": "cap 274", "fonte_url": "https://onepiece.fandom.com/wiki/Birka", "tipo": "narracao", "confiabilidade": "ambiguo", "texto": "Segundo a fonte, as tribos que vieram da lua perderam com o tempo qualquer registro da propria origem, e delas restou apenas um mito que trata a lua como Fairy Vearth, lugar de sonho.", "temas": ["Birka", "lua", "memoria perdida", "Fairy Vearth"], "notas": "A pagina da wiki cita o cap 274 para o mito, mas a afirmacao de que os registros se perderam mistura o capitulo com a historia de capa. Marcado ambiguo por isso.", "corpo": "O ponto estrutural: um povo que veio de outro corpo celeste e esqueceu que veio."}, {"id": "EV-0277-01", "fonte": "cap 277", "fonte_url": "https://onepiece.fandom.com/wiki/Shandora", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Enel escravizou o esquadrao divino de Gan Fall para extrair todo o ouro de Shandora, e usou esse ouro na construcao da arca Maxim.", "atores": ["Enel", "Gan Fall"], "temas": ["Shandora", "ouro", "Maxim", "lua"], "corpo": "Relevante porque a nave que depois alcanca a lua e feita do ouro da cidade que veio da lua."}, {"id": "EV-0279-01", "fonte": "cap 279", "fonte_url": "https://onepiece.fandom.com/wiki/Birka", "tipo": "narracao", "confiabilidade": "canonico", "texto": "A ilha do ceu onde Enel nasceu chamava-se Birka e foi destruida por ele seis anos antes da chegada dos Chapeus de Palha a Skypiea.", "atores": ["Enel"], "temas": ["Birka", "Skypiea"], "corpo": "Fixa o nome da ilha natal, que a historia de capa depois vai reencontrar na lua."}, {"id": "EV-0287-01", "fonte": "cap 287", "fonte_url": "https://onepiece.fandom.com/wiki/Harley", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Os Shandia antigos cultuavam deuses do sol, da terra, da floresta e da chuva.", "atores": ["Mousse"], "temas": ["Shandia", "deuses", "sol"], "corpo": "Paralelo estrutural com os deuses citados no Harley de Elbaf."}, {"id": "EV-0290-01", "fonte": "cap 290", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_290", "tipo": "fala", "confiabilidade": "canonico", "texto": "Kalgara explica a Noland que o que os Shandia guardam ha geracoes nao e o ouro nem a cidade em si, e sim o Poneglyph fincado na base do campanario.", "atores": ["Kalgara", "Mont Blanc Noland"], "temas": ["Shandia", "Poneglyphs", "Shandora"], "corpo": "Deixa explicito o objeto da guarda: a pedra, nao o tesouro. Kalgara autoriza a tripulacao a levar todo o ouro que conseguir carregar, menos o campanario."}, {"id": "EV-0290-02", "fonte": "cap 290", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_290", "tipo": "fala", "confiabilidade": "canonico", "texto": "Kalgara afirma ter certeza de que a cidade de Shandora foi dizimada por defender o Poneglyph, e que por isso a vontade de seu povo e proteger o passado e o que dele restou a qualquer custo.", "atores": ["Kalgara"], "temas": ["Shandora", "Poneglyphs", "Grande Guerra"], "corpo": "Motivo declarado da destruicao dito por um personagem, nao pelo narrador. Nao ha, na fonte, nome para quem atacou."}, {"id": "EV-0290-03", "fonte": "cap 290", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_290", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Nenhum dos Shandia consegue decifrar a mensagem da pedra que seu povo guarda ha geracoes.", "atores": ["Kalgara"], "temas": ["Shandia", "Poneglyphs", "leitura"], "corpo": "Guarda sem leitura: o dever sobreviveu ao conteudo."}, {"id": "EV-0290-04", "fonte": "cap 290", "fonte_url": "https://onepiece.fandom.com/wiki/Shandorian_Golden_Belfry_Bell", "tipo": "fala", "confiabilidade": "canonico", "texto": "Segundo Kalgara, o sino de ouro foi feito para anunciar ao mundo que eles estao ali, para mostrar aos espiritos dos ancestrais o caminho de volta a ilha e para avisar invasores de que os Shandia nao os temem; por isso e chamado a Luz de Shandora.", "atores": ["Kalgara"], "temas": ["Shandora", "sino de ouro", "ancestrais"], "corpo": "Tres funcoes declaradas do mesmo objeto: sinal, farol funerario e desafio. O titulo do cap 301 e justamente 'Eu estava aqui'."}, {"id": "EV-0300-01", "fonte": "cap 300", "fonte_url": "https://onepiece.fandom.com/wiki/Enel", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Depois de derrotado por Luffy, Enel recupera a consciencia, religa a arca Maxim e parte rumo a Fairy Vearth.", "atores": ["Enel"], "temas": ["Fairy Vearth", "Maxim", "lua"], "corpo": "Ultima aparicao de Enel na linha principal; tudo o que vem depois esta na historia de capa."}, {"id": "EV-0301-01", "fonte": "cap 301", "fonte_url": "https://onepiece.fandom.com/wiki/Laugh_Tale", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Diz-se que ao chegar a Laugh Tale, se a pessoa levou consigo as passagens dos Poneglyphs recolhidas na viagem, o Rio Poneglyph sera finalmente revelado.", "temas": ["Laugh Tale", "Rio Poneglyph", "Poneglyphs"], "corpo": "Condicao de acesso: o que ha em Laugh Tale se revela em funcao do que o visitante trouxe."}, {"id": "EV-0301-02", "fonte": "cap 301", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_301", "tipo": "narracao", "confiabilidade": "canonico", "texto": "O Poneglyph dos Shandia estava na base do Sino Dourado, e ao le-lo Robin encontra o registro de uma arma ancestral chamada Poseidon.", "atores": ["Nico Robin"], "temas": ["Poneglyphs", "Poseidon", "armas ancestrais", "Shandora"], "corpo": "Primeira mencao de Poseidon na obra. Robin comenta para si que e mais uma arma com nome de deus, como Pluton, e que nao lhe interessa."}, {"id": "EV-0301-03", "fonte": "cap 301", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_301", "tipo": "imagem", "confiabilidade": "canonico", "texto": "Ao lado do texto antigo ha uma segunda inscricao, assinada por Gol D. Roger, dizendo que eles estiveram ali, encontraram o texto e seguiram a orientacao dele.", "atores": ["Gol D. Roger", "Nico Robin"], "temas": ["Poneglyphs", "Roger", "Shandora"], "notas": "Este atomo registra o conteudo da inscricao; quem a gravou fisicamente so e revelado no flashback de Oden, no bloco do cap 966.", "corpo": "A mensagem esta gravada na propria pedra, ao lado do texto antigo. E o unico recado de Roger deixado num Poneglyph que a obra mostra sendo lido."}, {"id": "EV-0301-04", "fonte": "cap 301", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_301", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Robin recorda que existem dois tipos de Poneglyph: os que carregam informacao e os que revelam onde estao os outros.", "atores": ["Nico Robin"], "temas": ["Poneglyphs", "tipologia"], "corpo": "Distincao formulada dentro da cena, antes de a obra nomear Road Poneglyphs."}, {"id": "EV-0301-05", "fonte": "cap 301", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_301", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Robin conclui que a pedra de Shandora ja cumpriu sua funcao porque Roger ja achou aquilo que ela indicava, e que os Poneglyphs sao feitos para serem lidos em conjunto, preenchendo o trecho apagado da historia.", "atores": ["Nico Robin", "Gol D. Roger"], "temas": ["Poneglyphs", "Seculo Vazio", "Roger"], "corpo": "E a partir dessa conclusao que Robin decide seguir a orientacao das pedras que ja leu ate o fim da Grand Line."}, {"id": "EV-0301-06", "fonte": "cap 301", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_301", "tipo": "fala", "confiabilidade": "canonico", "texto": "A tabua de pedra que Robin encontrou no Upper Yard diz que diante do cerne da verdade nao ha necessidade de palavras e que seus autores sao os registradores da historia, existindo em harmonia com o som do grande sino, e aponta os Shandia como protetores antigos do texto.", "atores": ["Nico Robin"], "temas": ["Shandora", "Poneglyphs", "registradores", "sino de ouro"], "notas": "Traducao de uma citacao literaria curta; a formula 'recorders of history' pode variar entre tradutores.", "corpo": "O chefe Shandia reconhece a frase, o que prova que a formula sobreviveu na tradicao oral do povo mesmo depois de perdida a leitura."}, {"id": "EV-0301-07", "fonte": "cap 301", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_301", "tipo": "fala", "confiabilidade": "canonico", "texto": "Gan Fall diz a Robin que Roger esteve em Skypiea ha cerca de vinte anos.", "atores": ["Gan Fall", "Gol D. Roger"], "temas": ["Roger", "Skypiea", "cronologia"], "corpo": "Datacao da visita dita por testemunha direta."}, {"id": "EV-0301-08", "fonte": "cap 301", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_301", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Robin fica chocada ao descobrir que o Rei dos Piratas nao so chegou a ilha do ceu como sabia ler a escrita dos Poneglyphs.", "atores": ["Nico Robin", "Gol D. Roger"], "temas": ["Roger", "Poneglyphs", "leitura"], "corpo": "Ponto de virada: ate aqui a leitura da escrita antiga era tratada como exclusividade de Ohara."}, {"id": "EV-0301-09", "fonte": "cap 301", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_301", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Ao saber por Robin que o desejo de seus ancestrais ja foi cumprido, o chefe Shandia desaba em lagrimas, entendendo que seu povo nao precisa mais lutar pela pedra.", "atores": ["Nico Robin"], "temas": ["Shandia", "Poneglyphs", "guarda"], "corpo": "Encerramento formal de um dever de guarda que durou desde o Seculo Vazio."}, {"id": "EV-0302-01", "fonte": "cap 302", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_302", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Wyper e seus guerreiros juram a Kalgara que manterao o orgulho do povo e nao deixarao a Luz de Shandora se apagar outra vez.", "atores": ["Wyper", "Kalgara"], "temas": ["Shandia", "Shandora", "sino de ouro"], "corpo": "O juramento e feito depois de o dever de guardar a pedra ter sido declarado cumprido: o que continua nao e a guarda, e o sinal."}, {"id": "EV-0344-01", "fonte": "cap 344", "fonte_url": "https://onepiece.fandom.com/wiki/Ancient_Weapons", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Pluton e um navio de guerra ancestral construido na ilha de Water 7 durante o Seculo Vazio.", "temas": ["Pluton", "armas ancestrais", "Seculo Vazio"], "corpo": ""}, {"id": "EV-0391-01", "fonte": "cap 391", "fonte_url": "https://onepiece.fandom.com/wiki/Ohara", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Ohara foi destruida por um Buster Call vinte anos antes dos eventos de Enies Lobby.", "atores": ["Spandam", "Nico Robin"], "temas": ["Ohara", "Buster Call", "cronologia"], "corpo": "Ancora de cronologia do bloco: tudo o que Clover diz esta a vinte anos do presente narrativo de Enies Lobby, e a oitocentos do fim do Seculo Vazio."}, {"id": "EV-0392-01", "fonte": "cap 392", "fonte_url": "https://onepiece.fandom.com/wiki/Void_Century", "tipo": "fala", "confiabilidade": "canonico", "texto": "Pesquisar o Seculo Vazio e considerado pelo Governo Mundial o pior crime possivel.", "atores": ["Clou D. Clover"], "temas": ["Governo Mundial", "Seculo Vazio", "proibicao"], "corpo": ""}, {"id": "EV-0392-02", "fonte": "cap 392", "fonte_url": "https://onepiece.fandom.com/wiki/Tree_of_Knowledge", "tipo": "narracao", "confiabilidade": "canonico", "texto": "A Arvore do Conhecimento de Ohara era uma arvore-biblioteca de cinco mil anos que reunia arqueologos do mundo inteiro.", "atores": ["Clou D. Clover"], "temas": ["Ohara", "biblioteca", "Seculo Vazio"], "notas": "A wiki registra que o plantio da arvore antecede os dois calendarios conhecidos do mundo. Pista a verificar em fonte primaria.", "corpo": "Cinco mil anos e cerca de cinco vezes a distancia ate o Seculo Vazio: a instituicao que investigava o apagamento e mais velha que o apagamento."}, {"id": "EV-0392-03", "fonte": "cap 392", "fonte_url": "https://onepiece.fandom.com/wiki/Tree_of_Knowledge", "tipo": "imagem", "confiabilidade": "ambiguo", "texto": "A Arvore do Conhecimento guardava um modelo geocentrico do Planeta Azul com seis satelites, um deles com um segundo corpo em orbita, e o planeta inclinado cerca de vinte e quatro a vinte e cinco graus.", "temas": ["Ohara", "lua", "planetas"], "notas": "Confiabilidade ambigua porque a contagem de satelites e a inclinacao sao leitura de um desenho de painel feita pela wiki, nao texto.", "corpo": "Um artefato astronomico dentro da biblioteca acusada de estudar o passado proibido."}, {"id": "EV-0392-04", "fonte": "cap 392", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_392", "tipo": "fala", "confiabilidade": "canonico", "texto": "Os arqueologos de Ohara proibiram Robin de participar da pesquisa porque sabiam que a pena, caso fossem descobertos, era a decapitacao.", "atores": ["Clou D. Clover", "Nico Robin"], "temas": ["Ohara", "proibicao", "Seculo Vazio"], "corpo": "A pena declarada e capital e individual, antes ainda de qualquer Buster Call: o custo da pesquisa era conhecido de antemao por quem a fazia."}, {"id": "EV-0393-01", "fonte": "cap 393", "fonte_url": "https://onepiece.fandom.com/wiki/Void_Century", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Nacoes inteiras sao destruidas e apagadas do registro caso uma unica pessoa tente aprender algo sobre o Seculo Vazio.", "temas": ["Governo Mundial", "Buster Call", "Ohara"], "corpo": "O custo que o Governo aceita pagar e a medida indireta do que ele esta escondendo."}, {"id": "EV-0393-02", "fonte": "cap 393", "fonte_url": "https://onepiece.fandom.com/wiki/Nico_Olvia", "tipo": "narracao", "confiabilidade": "canonico", "texto": "A expedicao de Olvia passou seis anos no mar em busca de poneglyphs e terminou com os trinta e tres companheiros mortos pela Marinha, restando apenas ela viva.", "atores": ["Nico Olvia"], "temas": ["Ohara", "Poneglyphs", "Governo Mundial"], "corpo": "Escala do custo: trinta e quatro pesquisadores saem, um volta."}, {"id": "EV-0393-03", "fonte": "cap 393", "fonte_url": "https://onepiece.fandom.com/wiki/Poneglyphs", "tipo": "narracao", "confiabilidade": "canonico", "texto": "A Marinha rastreou pelos pertences dos arqueologos mortos a origem da equipe de Olvia ate Ohara, e so entao um destacamento do CP9 foi enviado a ilha.", "atores": ["Nico Olvia"], "temas": ["Ohara", "Governo Mundial", "CP9"], "corpo": "A cadeia causal do massacre comeca num detalhe material, nao numa denuncia."}, {"id": "EV-0393-04", "fonte": "cap 393", "fonte_url": "https://onepiece.fandom.com/wiki/Poneglyphs", "tipo": "narracao", "confiabilidade": "canonico", "texto": "O Governo Mundial ja desconfiava dos arqueologos de Ohara pelo que eles sabiam, e a pesquisa dos poneglyphs forneceu o pretexto para agir contra eles.", "temas": ["Ohara", "Governo Mundial", "proibicao"], "corpo": "Distingue motivo de pretexto: a vigilancia precede a infracao que a justifica."}, {"id": "EV-0393-05", "fonte": "cap 393", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_393", "tipo": "fala", "confiabilidade": "canonico", "texto": "Avisados por Olvia de que a Marinha vinha, Clover e os arqueologos decidiram nao fugir de Ohara porque fugir significaria abandonar os tesouros da ilha.", "atores": ["Clou D. Clover", "Nico Olvia"], "temas": ["Ohara", "biblioteca"], "corpo": "A escolha e explicita e antecipada: eles sabiam o que vinha e ficaram pelo acervo."}, {"id": "EV-0394-01", "fonte": "cap 394", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_394", "tipo": "fala", "confiabilidade": "canonico", "texto": "Agentes do Governo declararam aos moradores de Ohara que os estudiosos eram demonios que queriam a destruicao do mundo.", "temas": ["Ohara", "Governo Mundial", "propaganda"], "corpo": "A versao oficial do massacre e enunciada na propria ilha, antes do primeiro tiro de canhao, e diante de vizinhos que ate ali tinham os estudiosos como orgulho local."}, {"id": "EV-0394-02", "fonte": "cap 394", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_394", "tipo": "fala", "confiabilidade": "canonico", "texto": "Spandine afirma que o Governo Mundial vinha ha anos capturando estudiosos de poneglyphs pelo mundo tentando liga-los a Ohara.", "atores": ["Spandine"], "temas": ["Ohara", "Governo Mundial", "Poneglyphs"], "corpo": "Ohara nao foi descoberta por acaso: era o alvo procurado ha anos."}, {"id": "EV-0394-03", "fonte": "cap 394", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_394", "tipo": "fala", "confiabilidade": "canonico", "texto": "Spandine afirma que a destruicao de Ohara serviria de exemplo para desestimular qualquer um que estudasse os poneglyphs.", "atores": ["Spandine"], "temas": ["Ohara", "Governo Mundial", "proibicao"], "corpo": "A funcao declarada da operacao e pedagogica, dirigida a terceiros, e nao a neutralizacao de um perigo imediato."}, {"id": "EV-0394-04", "fonte": "cap 394", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_394", "tipo": "fala", "confiabilidade": "canonico", "texto": "Spandine acusa os estudiosos de Ohara de terem como objetivo despertar as armas ancestrais.", "atores": ["Spandine"], "temas": ["Ohara", "armas ancestrais", "Governo Mundial"], "corpo": "A acusacao formal do Governo, que sera contestada por Clover no capitulo seguinte."}, {"id": "EV-0394-05", "fonte": "cap 394", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_394", "tipo": "narracao", "confiabilidade": "canonico", "texto": "A confirmacao por chamada de que havia um poneglyph na Arvore do Conhecimento foi tratada por Spandine como a sentenca de morte dos estudiosos.", "atores": ["Spandine"], "temas": ["Ohara", "Poneglyphs", "proibicao"], "corpo": "O gatilho juridico e a posse do objeto, nao o conteudo lido nele."}, {"id": "EV-0394-06", "fonte": "cap 394", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_394", "tipo": "fala", "confiabilidade": "canonico", "texto": "Clover exigiu falar diretamente com os Cinco Anciaos.", "atores": ["Clou D. Clover", "Cinco Anciaos"], "temas": ["Ohara", "Cinco Anciaos"], "corpo": "Um arqueologo de uma ilha do West Blue pede e obtem linha direta com o topo do Governo Mundial; a conversa acontece no capitulo seguinte."}, {"id": "EV-0395-01", "fonte": "cap 395", "fonte_url": "https://onepiece.fandom.com/wiki/Great_Kingdom", "tipo": "fala", "confiabilidade": "canonico", "texto": "Clover afirma que o nome do Reino Antigo e de importancia tremenda e e a chave para entender o Seculo Vazio, mas e baleado antes de pronuncia-lo.", "atores": ["Clou D. Clover", "Cinco Anciaos"], "temas": ["Reino Antigo", "nome", "Seculo Vazio"], "corpo": "Um nome, e nao um objeto, e o que o Governo interrompeu a tiros."}, {"id": "EV-0395-02", "fonte": "cap 395", "fonte_url": "https://onepiece.fandom.com/wiki/Great_Kingdom", "tipo": "fala", "confiabilidade": "canonico", "texto": "Clover afirma que o Governo Mundial apagou o reino nao por temer seu poder nem suas armas, mas por temer seus ideais.", "atores": ["Clou D. Clover", "Cinco Anciaos"], "temas": ["Reino Antigo", "ideais", "Governo Mundial"], "corpo": "O atomo que faltava no mesmo discurso de EV-0395-01. Muda o alvo da censura: nao e um crime que o Governo esconde, e um projeto politico alternativo."}, {"id": "EV-0395-03", "fonte": "cap 395", "fonte_url": "https://thelibraryofohara.com/2022/01/04/what-is-the-one-piece-the-ultimate-one-piece-theory/", "tipo": "narracao", "confiabilidade": "traducao_disputada", "texto": "No discurso de Clover o reino e descrito com um adjetivo comum, kyodai na oukoku, ou seja um reino imenso, e nao com um nome proprio.", "atores": ["Clou D. Clover"], "temas": ["Reino Antigo", "nome", "traducao"], "corpo": "Se procede, Reino Antigo e rotulo de fandom e nao designacao da obra, e podemos estar fundindo dois termos japoneses distintos: o de Clover em 395 e o de Vegapunk em 1114. Pendencia: conferir o raw dos dois capitulos."}, {"id": "EV-0395-04", "fonte": "cap 395", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_395", "tipo": "narracao", "confiabilidade": "canonico", "texto": "O poneglyph de Ohara ficou intacto depois que uma bomba foi detonada ao seu redor dentro da Arvore do Conhecimento.", "temas": ["Poneglyphs", "Ohara"], "corpo": "Demonstracao em cena da indestrutibilidade dos poneglyphs: o suporte da mensagem sobrevive ao que destroi a biblioteca inteira."}, {"id": "EV-0395-05", "fonte": "cap 395", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_395", "tipo": "fala", "confiabilidade": "canonico", "texto": "Clover afirma que a mensagem foi gravada em pedra porque, se tivesse sido escrita em papel, teria se perdido.", "atores": ["Clou D. Clover"], "temas": ["Poneglyphs", "mensagem", "Seculo Vazio"], "corpo": "A escolha do suporte e apresentada como decisao consciente de quem escreveu, prevendo que alguem tentaria apagar o registro."}, {"id": "EV-0395-06", "fonte": "cap 395", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_395", "tipo": "fala", "confiabilidade": "canonico", "texto": "Clover afirma que o povo que gravou os poneglyphs foi derrotado por um inimigo, e que esse inimigo seguiu existindo na historia posterior.", "atores": ["Clou D. Clover"], "temas": ["Seculo Vazio", "Reino Antigo", "Grande Guerra"], "corpo": "O argumento e de assimetria: quem escreveu perdeu e sumiu do registro; quem venceu permaneceu para escrever o registro."}, {"id": "EV-0395-07", "fonte": "cap 395", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_395", "tipo": "narracao", "confiabilidade": "canonico", "texto": "O Governo Mundial foi formado ao fim do Seculo Vazio.", "temas": ["Governo Mundial", "Seculo Vazio"], "corpo": "Coincidencia temporal entre o fim do vazio documental e o inicio do regime que proibe documenta-lo."}, {"id": "EV-0395-08", "fonte": "cap 395", "fonte_url": "https://onepiece.fandom.com/wiki/Clover", "tipo": "fala", "confiabilidade": "canonico", "texto": "Clover afirma que, antes de o Governo Mundial existir, o mundo era regido por um reino imenso, e que esse reino foi exterminado por um grupo que veio a se tornar o Governo Mundial.", "atores": ["Clou D. Clover", "Cinco Anciaos"], "temas": ["Reino Antigo", "Governo Mundial", "Grande Guerra"], "notas": "A designacao do reino segue em aberto pela pendencia de traducao de EV-0395-03; aqui foi mantida a forma descritiva, sem nome proprio.", "corpo": "A tese central do discurso: o Governo Mundial e o sucessor direto do vencedor da guerra, e nao um poder neutro que veio depois."}, {"id": "EV-0395-09", "fonte": "cap 395", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_395", "tipo": "fala", "confiabilidade": "canonico", "texto": "Os estudiosos de Ohara so descobriram a existencia de um pais que nao existe mais cruzando varios documentos e poneglyphs, e nao por uma unica fonte.", "atores": ["Clou D. Clover"], "temas": ["Ohara", "Reino Antigo", "Poneglyphs"], "corpo": "Metodo: a existencia do reino e uma inferencia por triangulacao de fontes, o que explica por que nenhum poneglyph isolado basta e por que o Governo persegue o conjunto."}, {"id": "EV-0395-10", "fonte": "cap 395", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_395", "tipo": "fala", "confiabilidade": "canonico", "texto": "Clover afirma que o povo do reino antigo, ao saber que seria derrotado, gravou os poneglyphs para que o mundo soubesse o que havia acontecido.", "atores": ["Clou D. Clover"], "temas": ["Poneglyphs", "Reino Antigo", "mensagem"], "corpo": "Os poneglyphs sao apresentados como testamento deliberado de derrotados, escrito ja sob a expectativa da derrota."}, {"id": "EV-0395-11", "fonte": "cap 395", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_395", "tipo": "fala", "confiabilidade": "canonico", "texto": "Os Cinco Anciaos afirmam que a continuidade da pesquisa acabara revivendo as armas ancestrais, mesmo que os estudiosos nao tenham essa intencao.", "atores": ["Cinco Anciaos"], "temas": ["Cinco Anciaos", "armas ancestrais", "proibicao"], "corpo": "A justificativa oficial da proibicao, dita pela cupula em pessoa: risco objetivo, independente de intencao."}, {"id": "EV-0395-12", "fonte": "cap 395", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_395", "tipo": "fala", "confiabilidade": "canonico", "texto": "Clover responde que o passado e algo que a humanidade deve aceitar e contra o qual deve se precaver.", "atores": ["Clou D. Clover", "Cinco Anciaos"], "temas": ["Seculo Vazio", "proibicao"], "corpo": "Contra-argumento direto a EV-0395-11: conhecer o risco e a condicao de conter o risco."}, {"id": "EV-0395-13", "fonte": "cap 395", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_395", "tipo": "fala", "confiabilidade": "canonico", "texto": "Os Cinco Anciaos classificam a posicao de Clover como idealismo, e ele pergunta por que lhes negam o direito de sustentar ideais.", "atores": ["Cinco Anciaos", "Clou D. Clover"], "temas": ["Cinco Anciaos", "ideais", "Ohara"], "notas": "Nao confundir com EV-0395-02, que trata dos ideais do reino antigo; aqui o objeto e o direito dos estudiosos de hoje a ter ideais.", "corpo": "A palavra ideais aparece dos dois lados da chamada."}, {"id": "EV-0395-14", "fonte": "cap 395", "fonte_url": "https://onepiece.fandom.com/wiki/Clover", "tipo": "fala", "confiabilidade": "ambiguo", "texto": "Tres dos Cinco Anciaos reconhecem a contribuicao de Clover para a cultura universal e lamentam que ele tenha se desviado do bom caminho.", "atores": ["Cinco Anciaos", "Clou D. Clover"], "temas": ["Cinco Anciaos", "Ohara"], "notas": "Ambiguo porque a identificacao nominal dos tres anciaos que falam (Mars, Ju Peter e Warcury) e atribuicao retrospectiva da wiki, feita a partir dos desenhos, e nao aparece nomeada no capitulo.", "corpo": "A cupula sabia exatamente quem estava mandando matar e considerava o trabalho dele valioso para a cultura do mundo que governa."}, {"id": "EV-0395-15", "fonte": "cap 395", "fonte_url": "https://onepiece.fandom.com/wiki/Clover", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Clover foi baleado por Spandine, chefe do CP9 na epoca, imediatamente apos a ordem de atirar ser dada durante a chamada com os Cinco Anciaos.", "atores": ["Spandine", "Clou D. Clover", "Cinco Anciaos"], "temas": ["Ohara", "Cinco Anciaos"], "corpo": "Cadeia de comando explicita: a ordem vem da cupula pelo Den Den Mushi e a execucao e do chefe do CP9 presente na sala."}, {"id": "EV-0395-16", "fonte": "cap 395", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_395", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Logo depois do disparo contra Clover, Spandine acionou o botao do Den Den Mushi Dourado e convocou o Buster Call sobre Ohara.", "atores": ["Spandine"], "temas": ["Ohara", "Buster Call"], "corpo": "O gatilho da destruicao da ilha e acionado no minuto seguinte ao fim do discurso, e nao como resposta a qualquer resistencia armada."}, {"id": "EV-0395-17", "fonte": "cap 395", "fonte_url": "https://onepiece.fandom.com/wiki/Buster_Call", "tipo": "narracao", "confiabilidade": "canonico", "texto": "A autorizacao para Spandine convocar o Buster Call sobre Ohara, com o Den Den Mushi Dourado, foi concedida pelo entao almirante Sengoku.", "atores": ["Spandine", "Sengoku"], "temas": ["Buster Call", "Governo Mundial"], "corpo": "A convocacao so e possivel por delegacao de uma das poucas autoridades que a detem; houve, portanto, decisao previa de destruir Ohara antes de qualquer diligencia."}, {"id": "EV-0395-18", "fonte": "cap 395", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_395", "tipo": "fala", "confiabilidade": "canonico", "texto": "Robin declarou diante de Spandine que sabia ler poneglyphs.", "atores": ["Nico Robin", "Spandine"], "temas": ["Nico Robin", "Poneglyphs", "leitura"], "corpo": "A declaracao e o ato que cria a perseguicao a Robin: e por ela, e nao pela sobrevivencia ao Buster Call, que ela vira alvo permanente."}, {"id": "EV-0396-01", "fonte": "cap 396", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_396", "tipo": "fala", "confiabilidade": "canonico", "texto": "Olvia afirma que Ohara nunca quis revelar a historia ao mundo: queria apenas ouvir as vozes do passado e transmiti-las adiante.", "atores": ["Nico Olvia", "Nico Robin"], "temas": ["Ohara", "Seculo Vazio", "mensagem"], "notas": "Ouvir vozes e a mesma expressao com que Roger descreve ler poneglyphs (ver EV-1138-05). Pista a verificar no raw: se e o mesmo lexema japones.", "corpo": "Se procede, a acusacao de que Ohara pretendia divulgar a historia proibida descreve mal o proprio programa declarado da ilha."}, {"id": "EV-0396-02", "fonte": "cap 396", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_396", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Clover conclui que o Governo Mundial pretendia desde o inicio levar a operacao ao nivel da destruicao total da ilha.", "atores": ["Clou D. Clover"], "temas": ["Ohara", "Buster Call", "Governo Mundial"], "corpo": "Coerente com EV-0395-17: a autorizacao do Buster Call e anterior a chegada do CP9, logo a investigacao era formalidade."}, {"id": "EV-0396-03", "fonte": "cap 396", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_396", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Ao saber que Saul havia fugido com Olvia, Sengoku ordenou que os dois fossem mortos porque Saul conhecia a missao.", "atores": ["Sengoku", "Jaguar D. Saul", "Nico Olvia"], "temas": ["Governo Mundial", "segredo", "Marinha"], "corpo": "O sigilo alcanca os proprios executores: um vice-almirante vira alvo por saber para que a frota foi enviada."}, {"id": "EV-0396-04", "fonte": "cap 396", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_396", "tipo": "fala", "confiabilidade": "canonico", "texto": "Olvia acusa as pessoas de temerem o passado sem sequer perguntar do que ele trata.", "atores": ["Nico Olvia", "Jaguar D. Saul"], "temas": ["Seculo Vazio", "proibicao"], "corpo": "Formulacao do lado de Ohara sobre a natureza do tabu: o medo nao depende de conteudo conhecido."}, {"id": "EV-0397-01", "fonte": "cap 397", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_397", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Sob bombardeio, os arqueologos jogaram os livros pelas janelas no lago da ilha para que as palavras de mil anos nao se perdessem.", "atores": ["Clou D. Clover", "Nico Olvia"], "temas": ["Ohara", "biblioteca", "mensagem"], "corpo": "Mil anos e a escala que os proprios estudiosos atribuem ao acervo, e cobre o Seculo Vazio inteiro."}, {"id": "EV-0397-02", "fonte": "cap 397", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_397", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Sakazuki destruiu o navio de evacuacao com todos os civis de Ohara a bordo, para o caso de algum estudioso ter embarcado.", "atores": ["Sakazuki", "Kuzan"], "temas": ["Buster Call", "Ohara"], "corpo": "Mede o preco que o Governo aceita pagar: uma populacao inteira e morta pela possibilidade de um leitor a bordo."}, {"id": "EV-0397-03", "fonte": "cap 397", "fonte_url": "https://onepiece.fandom.com/wiki/Poneglyphs", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Robin aprendeu a ler a escrita antiga aos oito anos espionando o trabalho dos arqueologos, sem que nenhum deles soubesse.", "atores": ["Nico Robin"], "temas": ["Nico Robin", "Poneglyphs", "leitura"], "corpo": "Explica a sobrevivencia do conhecimento: a unica leitora que restou nunca foi formalmente ensinada, e por isso nao constava de nenhuma lista."}, {"id": "EV-0398-01", "fonte": "cap 398", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_398", "tipo": "narracao", "confiabilidade": "canonico", "texto": "A recompensa de setenta e nove milhoes posta sobre Robin aos oito anos foi pela capacidade de ler poneglyphs, e nao por ter afundado seis navios da Marinha como se divulgou.", "atores": ["Nico Robin", "Spandine"], "temas": ["Nico Robin", "Poneglyphs", "propaganda"], "corpo": "Caso documentado de falsificacao do motivo oficial: a razao real e a leitura, e a razao publicada e um feito militar inventado."}, {"id": "EV-0398-02", "fonte": "cap 398", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_398", "tipo": "narracao", "confiabilidade": "canonico", "texto": "A Marinha vistoriou as ruinas de Ohara, confirmou que nao havia sobreviventes e viu o lago cheio de livros sem dar importancia a eles.", "temas": ["Ohara", "biblioteca"], "corpo": "O acervo sobrevive porque os vencedores nao reconheceram o que estavam vendo."}, {"id": "EV-0399-01", "fonte": "cap 399", "fonte_url": "https://onepiece.fandom.com/wiki/Ancient_Weapons", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Franky queimou as plantas de Pluton depois de concluir que Robin, unica capaz de reviver as armas ancestrais, nao pretendia usa-las.", "atores": ["Franky", "Nico Robin", "Spandam"], "temas": ["Pluton", "armas ancestrais"], "corpo": ""}, {"id": "EV-0421-01", "fonte": "cap 421", "fonte_url": "https://onepiece.fandom.com/wiki/Buster_Call", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Uma vez anunciados os alvos, o Buster Call nao pode ser revogado, mas o almirante que o lidera pode poupar um ponto especifico mediante acordo previo com a frota.", "atores": ["Spandam"], "temas": ["Buster Call"], "corpo": "Mecanica: o procedimento e irreversivel por desenho, e a unica excecao passa por combinacao anterior ao disparo."}, {"id": "EV-0453-01", "fonte": "historia de capa cap 453 (Enel's Great Space Operations)", "fonte_url": "https://onepiece.fandom.com/wiki/Enel's_Great_Space_Operations", "tipo": "capa", "confiabilidade": "canonico", "texto": "Os quatro automatos construidos pelo professor Tsukimi na Ilha Karakuri viajaram do planeta ate a lua usando baloes, para vingar a morte do criador.", "atores": ["Enel"], "temas": ["lua", "automatos", "baloes", "Karakuri"], "notas": "Historia de capa. Confirma a mesma via de transporte descrita nos murais, agora no sentido inverso e na epoca presente.", "corpo": "Segundo caso de viagem planeta-lua por balao na mesma historia, o que trata a distancia como travessia atmosferica, nao espacial."}, {"id": "EV-0466-01", "fonte": "historia de capa cap 466 (Enel's Great Space Operations)", "fonte_url": "https://onepiece.fandom.com/wiki/Enel's_Great_Space_Operations", "tipo": "capa", "confiabilidade": "canonico", "texto": "Escavando a cratera aberta pelos piratas espaciais, Enel encontra sob a crosta da lua uma cidade antiga escondida e ha muito abandonada.", "atores": ["Enel"], "temas": ["lua", "Birka", "cidade antiga"], "notas": "Historia de capa, publicada nas paginas de titulo dos caps 428 a 474. Nao aparece na narrativa principal.", "corpo": "A cidade estava enterrada, nao na superficie: quem chegasse a lua sem cavar nao a encontraria."}, {"id": "EV-0468-01", "fonte": "historia de capa cap 468 (Enel's Great Space Operations)", "fonte_url": "https://onepiece.fandom.com/wiki/Enel's_Great_Space_Operations", "tipo": "capa", "confiabilidade": "canonico", "texto": "A descarga eletrica de Enel recarrega a cidade lunar e os automatos antigos parados dentro dela, que voltam a funcionar depois de seculos inertes.", "atores": ["Enel"], "temas": ["lua", "automatos", "tecnologia antiga"], "notas": "Historia de capa.", "corpo": "A maquinaria antiga estava intacta e so faltava energia: o problema da cidade era alimentacao, nao ruina tecnica."}, {"id": "EV-0470-01", "fonte": "historia de capa cap 470 (Enel's Great Space Operations)", "fonte_url": "https://onepiece.fandom.com/wiki/Enel's_Great_Space_Operations", "tipo": "capa", "confiabilidade": "canonico", "texto": "Os murais da cidade lunar mostram uma civilizacao antiga de gente alada que vivia na lua e que criou os automatos.", "atores": ["Enel"], "temas": ["lua", "automatos", "povo alado"], "notas": "Historia de capa. O titulo da pagina de capa fala em 'povo alado da lua dos tempos antigos'.", "corpo": "As asas sao o tracao que liga o povo lunar aos habitantes das ilhas do ceu."}, {"id": "EV-0470-02", "fonte": "historia de capa caps 470-472 (Enel's Great Space Operations)", "fonte_url": "https://onepiece.fandom.com/wiki/Enel's_Great_Space_Operations", "tipo": "capa", "confiabilidade": "canonico", "texto": "Pelos murais, Enel descobre que Skypieanos, Shandia e Birkanos se originaram todos da mesma cidade lunar e que foram eles que inventaram os automatos.", "atores": ["Enel"], "temas": ["lua", "Shandia", "Skypiea", "Birka", "origem comum"], "notas": "Historia de capa, nao narrativa principal. A wiki registra ainda, como trivia sem referencia de capitulo, que 'Shandora' remeteria ao sanscrito 'Chandra', lua; isso e observacao editorial, nao afirmacao da obra.", "corpo": "Une tres povos que, na linha principal, aparecem como estrangeiros uns aos outros e em guerra ha quatrocentos anos."}, {"id": "EV-0472-01", "fonte": "historia de capa cap 472 (Enel's Great Space Operations)", "fonte_url": "https://onepiece.fandom.com/wiki/Enel's_Great_Space_Operations", "tipo": "capa", "confiabilidade": "canonico", "texto": "Os murais dizem que o nome da cidade lunar era Birka e que seus habitantes partiram para a Estrela Azul porque os recursos da lua se esgotaram.", "atores": ["Enel"], "temas": ["lua", "Birka", "migracao", "recursos"], "notas": "Historia de capa. O nome repete o da ilha do ceu natal de Enel, registrada em EV-0279-01.", "corpo": "Motivo declarado da migracao: exaustao de recursos. Nao ha, na fonte, mencao a guerra como causa da saida."}, {"id": "EV-0472-02", "fonte": "historia de capa cap 472 (Enel's Great Space Operations)", "fonte_url": "https://onepiece.fandom.com/wiki/Enel's_Great_Space_Operations", "tipo": "capa", "confiabilidade": "canonico", "texto": "Segundo os murais, os habitantes da cidade lunar desceram ate a estrela azul usando baloes e deixaram para tras os automatos que haviam criado, numa despedida triste para os dois lados.", "atores": ["Enel"], "temas": ["lua", "automatos", "migracao", "baloes"], "notas": "Historia de capa.", "corpo": "O meio de transporte declarado e balao, nao nave: a descida da lua ao planeta e tratada como viagem possivel com tecnologia simples."}, {"id": "EV-0488-01", "fonte": "cap 488", "fonte_url": "https://thelibraryofohara.com/2022/01/04/what-is-the-one-piece-the-ultimate-one-piece-theory/", "tipo": "narracao", "confiabilidade": "ambiguo", "texto": "A ultima linha de Binks' Sake termina em warai-banashi, escrito com os mesmos caracteres de Laugh Tale, e Roger citou essa exata linha antes de nomear a ilha.", "atores": ["Gol D. Roger", "Brook"], "temas": ["Laugh Tale", "riso", "Binks' Sake", "nome"], "corpo": "Corrigido em 2026-08-11. A versao anterior dizia que a linha continha a expressao\n'funny tale' e classificava a ligacao como coincidencia de secao de trivia. O\ntermo japones e 笑i-banashi, literalmente historia de rir, e e o mesmo termo do\nnome da ilha: 'funny tale' era escolha de tradutor ingles, nao o texto. A\nconfiabilidade subiu de ambiguo-fraco para ambiguo com a ligacao lexical\nregistrada, e o peso interpretativo caiu."}, {"id": "EV-0506-01", "fonte": "cap 506", "fonte_url": "https://onepiece.fandom.com/wiki/Gol_D._Roger", "tipo": "fala", "confiabilidade": "canonico", "texto": "Roger usou suas palavras finais na execucao publica para declarar abertamente que o One Piece pertence a quem conseguir encontra-lo, e assim sozinho deu inicio a Grande Era dos Piratas.", "atores": ["Gol D. Roger"], "temas": ["One Piece", "Era dos Piratas", "anuncio"], "corpo": "O Governo montou a execucao como espetaculo para desencorajar a pirataria e obteve o contrario."}, {"id": "EV-0506-02", "fonte": "cap 506", "fonte_url": "https://onepiece.fandom.com/wiki/Great_Pirate_Era", "tipo": "narracao", "confiabilidade": "ambiguo", "texto": "Na execucao Roger declarou que, tal como Joy Boy, havia escondido seu tesouro para que o proximo Rei dos Piratas o encontrasse.", "atores": ["Gol D. Roger", "Joy Boy"], "temas": ["One Piece", "esconder", "sucessao"], "corpo": "Marcado ambiguo: e a formulacao de resumo da wiki, sem citacao de painel. Se confirmada, implica que o One Piece de hoje inclui algo que Roger acrescentou."}, {"id": "EV-0507-01", "fonte": "cap 507", "fonte_url": "https://onepiece.fandom.com/wiki/Void_Century", "tipo": "fala", "confiabilidade": "canonico", "texto": "Rayleigh revela que os Piratas de Roger descobriram a verdadeira historia, provando que preencher a lacuna do Seculo Vazio e possivel.", "atores": ["Silvers Rayleigh", "Nico Robin"], "temas": ["Seculo Vazio", "verdadeira historia", "Roger"], "corpo": "Ancora decisiva: o que Roger achou incluiu informacao historica, seja ou nao apenas isso."}, {"id": "EV-0507-02", "fonte": "cap 507", "fonte_url": "https://onepiece.fandom.com/wiki/Void_Century", "tipo": "fala", "confiabilidade": "ambiguo", "texto": "Rayleigh disse acreditar que sua tripulacao e os estudiosos de Ohara tinham sido apressados demais, e encorajou Robin a ver o mundo para chegar a conclusao diferente da deles.", "atores": ["Silvers Rayleigh", "Nico Robin"], "temas": ["Roger", "Ohara", "cedo demais"], "corpo": "Marcado ambiguo: a wiki traz na seccao de trivia, sem citar capitulo na frase."}, {"id": "EV-0576-01", "fonte": "cap 576", "fonte_url": "https://onepiece.fandom.com/wiki/Void_Century", "tipo": "fala", "confiabilidade": "canonico", "texto": "Barba Branca declarou que um dia o One Piece sera encontrado e que isso desencadeara uma guerra indizivel que engolfara o mundo inteiro.", "atores": ["Edward Newgate"], "temas": ["One Piece", "guerra", "profecia"], "corpo": "Previsao interna a obra sobre o efeito de achar o tesouro — util para discriminar hipoteses."}, {"id": "EV-0576-02", "fonte": "cap 576", "fonte_url": "https://onepiece.fandom.com/wiki/Laugh_Tale", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Roger ofereceu a Barba Branca a informacao de como chegar a Laugh Tale, e Barba Branca recusou porque seu sonho era ter uma familia.", "atores": ["Gol D. Roger", "Edward Newgate"], "temas": ["Laugh Tale", "recusa"], "corpo": "Alguem informado do caminho recusou o tesouro sem hesitar."}, {"id": "EV-0585-01", "fonte": "cap 585", "fonte_url": "https://onepiece.fandom.com/wiki/Monkey_D._Luffy", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Diante de Ace e Sabo, Luffy declara qual e o objetivo que esta no fim do seu sonho, mas o quadro corta antes da fala e mostra apenas a reacao dos dois, que em seguida trocam tacas de sake.", "atores": ["Monkey D. Luffy", "Portgas D. Ace", "Sabo"], "temas": ["sonho", "sake", "Luffy"], "corpo": "A obra esconde deliberadamente o conteudo da declaracao. Qualquer hipotese sobre o que Luffy quer no fim depende de uma fala que Oda cortou."}, {"id": "EV-0621-01", "fonte": "cap 621", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_621", "tipo": "fala", "confiabilidade": "canonico", "texto": "Otohime declara em praca publica que o Reino Ryugu vai para a superficie e recolhe assinaturas para levar a intencao de migrar ao Levely.", "atores": ["Otohime"], "temas": ["Otohime", "superficie", "migracao", "Levely"], "corpo": "O sonho de Otohime tem forma politica concreta: subir a ilha inteira para a superficie por via diplomatica."}, {"id": "EV-0621-02", "fonte": "cap 621", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_621", "tipo": "fala", "confiabilidade": "canonico", "texto": "Neptune diz ao Ministro da Esquerda que o mundo com que sua esposa sonha remonta a centenas de anos: ancestrais distantes tentaram a mesma coisa e aquilo terminou em sonho desperdicado e arrependimento.", "atores": ["Neptune"], "temas": ["Otohime", "superficie", "promessa", "Seculo Vazio"], "corpo": "Liga o sonho de Otohime a uma tentativa anterior, de seculos atras, que fracassou. Neptune nao nomeia Joy Boy aqui."}, {"id": "EV-0621-03", "fonte": "cap 621", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_621", "tipo": "imagem", "confiabilidade": "ambiguo", "texto": "Noah aparece ao fundo do quadro no momento em que Neptune fala do sonho fracassado dos ancestrais.", "atores": ["Neptune"], "temas": ["Noah", "superficie", "promessa"], "notas": "Detalhe de composicao descrito no resumo longo da wiki; nao verifiquei o painel.", "corpo": "A wiki registra a coincidencia de quadro. Justapor navio e fala nao e afirmar que o navio era o meio do sonho."}, {"id": "EV-0621-04", "fonte": "cap 621", "fonte_url": "https://onepiece.fandom.com/wiki/Noah", "tipo": "narracao", "confiabilidade": "ambiguo", "texto": "A wiki atribui a Otohime e a Neptune a crenca de que o proposito de Noah era a migracao em massa dos habitantes da ilha para a superficie.", "atores": ["Otohime", "Neptune"], "temas": ["Noah", "superficie", "migracao", "promessa"], "notas": "A pagina Noah cita cap 621 para essa crenca, mas o resumo do proprio cap 621 nao traz a afirmacao: nele Neptune so diz que o sonho e antigo e falhou. Pista a verificar no raw.", "corpo": "Se a crenca for real, o proposito de Noah declarado pelo casal real e o mesmo objetivo da campanha de Otohime, e a promessa de Joy Boy seria a promessa de levar a ilha para cima."}, {"id": "EV-0625-01", "fonte": "cap 625", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_625", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Aos seis anos, ao gritar de medo quando um Dragao Celestial aponta a arma para sua mae, Shirahoshi emite ondas de sonar e cinco Reis do Mar surgem.", "atores": ["Shirahoshi", "Otohime", "Mjosgard"], "temas": ["Poseidon", "Reis do Mar", "Shirahoshi"], "corpo": "Primeira manifestacao do poder, involuntaria e disparada por emocao, nao por comando."}, {"id": "EV-0625-02", "fonte": "cap 625", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_625", "tipo": "fala", "confiabilidade": "canonico", "texto": "Vander Decken IX recorda que foi a lenda de uma princesa sereia capaz de convocar Reis do Mar que levou o primeiro Vander Decken ao fundo do mar, e que a historia foi passada aos descendentes.", "atores": ["Vander Decken IX"], "temas": ["Poseidon", "lenda", "Reis do Mar"], "corpo": "A lenda da princesa sereia circula fora da familia real da Ilha dos Homens-Peixe: e conhecimento hereditario de ao menos uma linhagem de piratas."}, {"id": "EV-0626-01", "fonte": "cap 626", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_626", "tipo": "fala", "confiabilidade": "canonico", "texto": "Otohime conta aos filhos que a profecia diz que um dia alguem aparecera diante da princesa sereia para guia-la e ensina-la a usar seu poder para o bem, trazendo uma mudanca imensa ao mundo.", "atores": ["Otohime"], "temas": ["Poseidon", "profecia", "guia", "promessa"], "corpo": "A lenda que a familia real guarda nao promete um resgate: promete a chegada de um guia. Quem espera, espera uma pessoa."}, {"id": "EV-0626-02", "fonte": "cap 626", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_626", "tipo": "fala", "confiabilidade": "canonico", "texto": "Otohime diz que o mesmo poder da princesa sereia, se usado com intencao sinistra, pode causar grande destruicao.", "atores": ["Otohime"], "temas": ["Poseidon", "armas ancestrais", "destruicao"], "corpo": "A profecia e simetrica: o guia decide para que lado a arma vira."}, {"id": "EV-0626-03", "fonte": "cap 626", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_626", "tipo": "fala", "confiabilidade": "canonico", "texto": "Otohime pede aos tres filhos que protejam Shirahoshi com a propria vida quando a hora chegar, e Fukaboshi jura cumprir essa promessa a mae moribunda.", "atores": ["Otohime", "Fukaboshi"], "temas": ["Poseidon", "familia real", "promessa"], "corpo": "A guarda de Poseidon e transmitida como dever familiar, do mesmo modo que a guarda de Noah."}, {"id": "EV-0628-01", "fonte": "cap 628", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_628", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Robin observa que o poneglyph da Sea Forest e diferente de todos os que ja lera: em vez de registro historico tem forma de carta de desculpas e menciona alguem chamado Joy Boy.", "atores": ["Nico Robin", "Joy Boy"], "temas": ["Poneglyphs", "Joy Boy", "Sea Forest"], "corpo": "O suporte de pedra indestrutivel foi usado tambem como correspondencia pessoal, nao apenas como arquivo de historia."}, {"id": "EV-0632-01", "fonte": "cap 632", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_632", "tipo": "fala", "confiabilidade": "canonico", "texto": "Vander Decken IX afirma que ha muito tempo o povo da Ilha dos Homens-Peixe construiu o navio gigante Noah.", "atores": ["Vander Decken IX"], "temas": ["Noah", "Ilha dos Homens-Peixe"], "corpo": "Autoria do navio: os proprios habitantes da ilha, nao Joy Boy nem o Reino Antigo."}, {"id": "EV-0636-01", "fonte": "cap 636", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_636", "tipo": "fala", "confiabilidade": "canonico", "texto": "Ao ver Noah se mover, Neptune entra em panico e afirma que ninguem pode mover o navio e que ate o dia que tem de vir ele nao pode ser movido de forma alguma.", "atores": ["Neptune", "Fukaboshi"], "temas": ["Noah", "dia prometido", "promessa"], "corpo": "A regra que a familia real guarda e de imobilidade: o navio esperar parado ja e o cumprimento da parte deles."}, {"id": "EV-0636-02", "fonte": "cap 636", "fonte_url": "https://onepiece.fandom.com/wiki/Noah", "tipo": "narracao", "confiabilidade": "ambiguo", "texto": "Noah e tambem chamada de Navio da Promessa.", "temas": ["Noah", "promessa"], "notas": "Epiteto registrado pela pagina Noah da wiki com referencia ao cap 636; nao aparece no resumo do capitulo e nao conferi o termo japones.", "corpo": "Se o epiteto for do texto, o nome proprio do navio ja carrega a palavra promessa."}, {"id": "EV-0641-01", "fonte": "cap 641", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_641", "tipo": "fala", "confiabilidade": "canonico", "texto": "Fukaboshi diz que a missao de proteger Noah comecou seculos atras e que tudo o que fizeram por ela se perderia se o navio esmagasse a ilha.", "atores": ["Fukaboshi"], "temas": ["Noah", "promessa", "familia real"], "corpo": "A guarda e contada como missao continua e datada, nao como costume vago."}, {"id": "EV-0641-02", "fonte": "cap 641", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_641", "tipo": "fala", "confiabilidade": "canonico", "texto": "Em flashback, Neptune explica que Noah nao e um navio velho qualquer: seculos atras foi feita uma promessa a um grande homem de manter o navio no fundo do mar e esperar, protegendo-o ate que aquele dia chegue.", "atores": ["Neptune"], "temas": ["Noah", "promessa", "dia prometido", "Joy Boy"], "corpo": "Aqui a contraparte da promessa ainda e anonima, chamada apenas de um grande homem. So no cap 649 Neptune a nomeia."}, {"id": "EV-0647-01", "fonte": "cap 647", "fonte_url": "https://onepiece.fandom.com/wiki/Joy_Boy", "tipo": "narracao", "confiabilidade": "canonico", "texto": "A queda do navio Noah foi detida por Reis do Mar convocados inconscientemente por Shirahoshi, preservando a promessa da Ilha dos Homens-Peixe.", "atores": ["Shirahoshi", "Monkey D. Luffy"], "temas": ["Noah", "promessa", "Poseidon"], "corpo": ""}, {"id": "EV-0648-01", "fonte": "cap 648", "fonte_url": "https://onepiece.fandom.com/wiki/Joy_Boy", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Os Reis do Mar levaram Noah ate a Sea Forest esperando conserta-la antes que chegue o tempo prometido.", "temas": ["Noah", "tempo determinado", "Sea Forest"], "corpo": "O 'tempo prometido' aparece aqui como marco futuro agendado, nao como metafora."}, {"id": "EV-0648-02", "fonte": "cap 648", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_648", "tipo": "fala", "confiabilidade": "canonico", "texto": "Os Reis do Mar dizem a Shirahoshi que ha muito tempo estavam esperando por ela.", "atores": ["Shirahoshi"], "temas": ["Reis do Mar", "Poseidon", "dia prometido"], "corpo": "Do lado dos Reis do Mar a espera nao e por um dia no calendario, e por uma pessoa."}, {"id": "EV-0648-03", "fonte": "cap 648", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_648", "tipo": "fala", "confiabilidade": "canonico", "texto": "Os Reis do Mar afirmam que Noah foi feita para ser puxada por eles, e que isso lhes foi dito ha muito tempo.", "temas": ["Noah", "Reis do Mar", "promessa"], "corpo": "O navio depende do poder de Poseidon por engenharia, nao por simbolismo: sem Reis do Mar ele nao vai a lugar nenhum. Alguem tambem falou com eles no passado."}, {"id": "EV-0648-04", "fonte": "cap 648", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_648", "tipo": "fala", "confiabilidade": "canonico", "texto": "Os Reis do Mar explicam que a cada varias centenas de anos a rainha deles nasce em forma de sereia, por um motivo que eles proprios desconhecem.", "temas": ["Reis do Mar", "Poseidon", "lenda"], "corpo": "A recorrencia de Poseidon e descrita pelos proprios Reis do Mar como um fato inexplicado, nao como um plano de alguem."}, {"id": "EV-0648-05", "fonte": "cap 648", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_648", "tipo": "fala", "confiabilidade": "canonico", "texto": "Os Reis do Mar concluem que Noah pode ser consertada, mas que eles mesmos nao conseguem faze-lo e dependem da ajuda de outros.", "temas": ["Noah", "Reis do Mar", "conserto"], "notas": "As notas do capitulo dizem que pretendem pedir ajuda a uma certa familia; o resumo da pagina Noah diz que a fonte de ajuda e antiga e talvez ja nao possa ajudar. Divergencia a verificar no raw.", "corpo": "Quem e a parte capaz de consertar Noah e a peca aberta mais concreta desse bloco."}, {"id": "EV-0648-06", "fonte": "cap 648", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_648", "tipo": "fala", "confiabilidade": "canonico", "texto": "Um dos Reis do Mar percebe que Luffy ouviu a conversa deles, e o grupo lembra que outro humano, Gol D. Roger, tambem ouvia suas vozes.", "atores": ["Monkey D. Luffy", "Gol D. Roger"], "temas": ["Reis do Mar", "vozes", "Voz de Todas as Coisas"], "corpo": "A capacidade de ouvir Reis do Mar e apresentada como raridade compartilhada por Roger e Luffy."}, {"id": "EV-0648-07", "fonte": "cap 648", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_648", "tipo": "fala", "confiabilidade": "canonico", "texto": "Ao ver a filha conversando com os Reis do Mar, Neptune declara que despertou o poder capaz de destruir o mundo.", "atores": ["Neptune", "Shirahoshi"], "temas": ["Poseidon", "armas ancestrais", "destruicao"], "corpo": "Neptune reconhece o poder como arma antes de a conversa com Robin nomear Poseidon."}, {"id": "EV-0649-01", "fonte": "cap 649", "fonte_url": "https://onepiece.fandom.com/wiki/Joy_Boy", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Joy Boy escreveu num Poneglyph da Sea Forest um pedido de desculpas por nao ter cumprido sua parte da promessa feita a Ilha dos Homens-Peixe.", "atores": ["Joy Boy"], "temas": ["Joy Boy", "promessa", "Poneglyphs", "desculpas"], "corpo": "O unico texto de Joy Boy que o leitor viu ate agora e um pedido de desculpas, nao um mapa nem um inventario."}, {"id": "EV-0649-02", "fonte": "cap 649", "fonte_url": "https://onepiece.fandom.com/wiki/Ancient_Weapons", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Shirahoshi herdou o titulo de Poseidon, o poder de falar com os Reis do Mar que aparece numa princesa sereia a cada varios seculos.", "atores": ["Shirahoshi", "Neptune"], "temas": ["Poseidon", "armas ancestrais"], "corpo": ""}, {"id": "EV-0649-03", "fonte": "cap 649", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_649", "tipo": "fala", "confiabilidade": "canonico", "texto": "Neptune diz que a parte da Ilha dos Homens-Peixe na promessa era vigiar Noah e mante-la em seguranca, e que so quando chegar o tempo prometido o proposito do navio sera conhecido.", "atores": ["Neptune", "Nico Robin"], "temas": ["Noah", "promessa", "dia prometido"], "corpo": "A obrigacao dos que esperam e custodia, e o conteudo da promessa e explicitamente selado ate o dia."}, {"id": "EV-0649-04", "fonte": "cap 649", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_649", "tipo": "fala", "confiabilidade": "canonico", "texto": "Neptune afirma que nao conhece os detalhes da promessa e que sabe apenas, por lenda transmitida na familia real, que um dia alguem viria cumprir em lugar de Joy Boy o que ele prometeu.", "atores": ["Neptune", "Joy Boy"], "temas": ["promessa", "Joy Boy", "familia real", "dia prometido"], "corpo": "O guardiao nao sabe o que guarda. Qualquer leitura que atribua a Neptune conhecimento dos termos contraria essa fala."}, {"id": "EV-0649-05", "fonte": "cap 649", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_649", "tipo": "fala", "confiabilidade": "canonico", "texto": "Perguntado por Robin, Neptune responde que Joy Boy nao tinha o poder de controlar Reis do Mar e que essa habilidade pertencia a princesa sereia daquela epoca.", "atores": ["Neptune", "Joy Boy", "Nico Robin"], "temas": ["Joy Boy", "Poseidon", "Reis do Mar", "promessa"], "corpo": "Joy Boy dependia de terceiros para o que prometeu: a execucao exigia Poseidon e os Reis do Mar."}, {"id": "EV-0649-06", "fonte": "cap 649", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_649", "tipo": "fala", "confiabilidade": "canonico", "texto": "Robin conta que o poneglyph que leu em Skypiea dois anos antes dava a localizacao de uma das armas ancestrais e dizia que ela estava na Ilha dos Homens-Peixe.", "atores": ["Nico Robin"], "temas": ["Poneglyphs", "armas ancestrais", "Poseidon", "Skypiea"], "corpo": "O poneglyph de Skypiea aponta um lugar, e o lugar contem uma pessoa. E o passo que permite a Robin identificar Shirahoshi como Poseidon."}, {"id": "EV-0649-07", "fonte": "cap 649", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_649", "tipo": "fala", "confiabilidade": "canonico", "texto": "Neptune diz que a mensagem deixada por Joy Boy era enderecada a princesa sereia que vivia na ilha naquela epoca.", "atores": ["Neptune", "Joy Boy"], "temas": ["Joy Boy", "Poseidon", "Poneglyphs", "promessa"], "corpo": "O destinatario do unico texto conhecido de Joy Boy e Poseidon, nao a humanidade nem um sucessor generico."}, {"id": "EV-0649-08", "fonte": "cap 649", "fonte_url": "https://onepiece.fandom.com/wiki/Noah", "tipo": "narracao", "confiabilidade": "ambiguo", "texto": "A wiki descreve os termos da promessa como um acordo em que os habitantes da ilha construiram Noah para que o poder de Poseidon a erguesse ate a superficie.", "atores": ["Joy Boy"], "temas": ["Noah", "promessa", "Poseidon", "superficie"], "notas": "A pagina Noah cita caps 649, 626 e 641 para esses termos, mas nesses capitulos Neptune diz justamente que os detalhes da promessa sao desconhecidos. Provavel interpolacao da wiki; verificar antes de dar peso.", "corpo": "Se os termos forem interpolacao, some do corpus a unica afirmacao direta de que a promessa era erguer o navio ate a superficie."}, {"id": "EV-0650-01", "fonte": "cap 650", "fonte_url": "https://onepiece.fandom.com/wiki/Ancient_Weapons", "tipo": "narracao", "confiabilidade": "canonico", "texto": "As tres armas ancestrais tem nome de divindades e nao se limitam a objetos inanimados: incluem seres vivos.", "temas": ["armas ancestrais", "Uranus", "Poseidon", "Pluton"], "corpo": "Consequencia direta: Uranus pode ser pessoa, criatura, lugar ou coisa."}, {"id": "EV-0650-02", "fonte": "cap 650", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_650", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Caribou, depois de descobrir que Shirahoshi e a arma ancestral Poseidon, tenta sequestra-la no palacio e e impedido pelos Chapeus de Palha.", "atores": ["Caribou", "Shirahoshi"], "temas": ["Poseidon", "armas ancestrais", "sequestro"], "corpo": "Uma arma que e pessoa fica exposta a captura no minuto seguinte ao vazamento da informacao."}, {"id": "EV-0653-01", "fonte": "cap 653", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_653", "tipo": "fala", "confiabilidade": "canonico", "texto": "Ao se despedirem, Shirahoshi pede para ver uma floresta de verdade na superficie e Luffy fecha com ela uma promessa de mindinho de leva-la ate la, gesto repetido pelo restante da tripulacao exceto Zoro e Franky.", "atores": ["Monkey D. Luffy", "Shirahoshi"], "temas": ["promessa", "Poseidon", "superficie"], "corpo": "Uma segunda promessa de levar Poseidon a superficie, feita por Luffy, com a mesma forma de mindinho que Otohime usava com os filhos."}, {"id": "EV-0722-01", "fonte": "cap 722", "fonte_url": "https://onepiece.fandom.com/wiki/Void_Century", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Ha 800 anos, dezenove dos vinte monarcas se mudaram para Mary Geoise apos a fundacao do Governo Mundial, e apenas os Nefertari permaneceram.", "atores": ["Nefertari Lili"], "temas": ["vinte reinos", "Mary Geoise", "Governo Mundial"], "corpo": "Data a fundacao da cidade e ancora EV-1084-01 num capitulo proprio."}, {"id": "EV-0763-01", "fonte": "cap 763", "fonte_url": "https://onepiece.fandom.com/wiki/Void_Century", "tipo": "fala", "confiabilidade": "canonico", "texto": "Rosinante afirma que o 'D.' foi herdado secretamente pelo mundo ao longo da historia e que numa certa terra o Cla de D. era chamado de Inimigo Natural de Deus.", "atores": ["Donquixote Rosinante"], "temas": ["Vontade de D.", "Deus"], "corpo": ""}, {"id": "EV-0818-01", "fonte": "cap 818", "fonte_url": "https://onepiece.fandom.com/wiki/Laugh_Tale", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Os quatro Road Poneglyphs, lidos em conjunto, revelam quatro pontos cujo cruzamento indica a localizacao de Laugh Tale.", "temas": ["Road Poneglyphs", "Laugh Tale"], "corpo": "O acesso e criptografico e distribuido: quatro chaves em maos diferentes."}, {"id": "EV-0818-02", "fonte": "cap 818", "fonte_url": "https://onepiece.fandom.com/wiki/Poneglyph", "tipo": "fala", "confiabilidade": "canonico", "texto": "Os Poneglyphs foram inventados pelo cla Kouzuki, cujos ancestrais os esculpiram no fim do Seculo Vazio.", "atores": ["Nekomamushi", "Kouzuki"], "temas": ["Poneglyphs", "Kouzuki", "Seculo Vazio"], "corpo": "Elo material entre Wano e a preservacao da historia."}, {"id": "EV-0818-03", "fonte": "cap 818", "fonte_url": "https://onepiece.fandom.com/wiki/Kozuki_Sukiyaki", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Sukiyaki, da familia Kouzuki, herdou dos ancestrais a habilidade de ler e de escrever a lingua dos Poneglyphs, e a transmitiu ao filho Oden.", "atores": ["Kouzuki Sukiyaki", "Kouzuki Oden"], "temas": ["Poneglyphs", "leitura", "Kouzuki", "Wano"], "corpo": "A linhagem da leitura nao morreu com Oden: o pai dele, tido por morto, ainda a possui."}, {"id": "EV-0820-01", "fonte": "cap 820", "fonte_url": "https://onepiece.fandom.com/wiki/Laugh_Tale", "tipo": "fala", "confiabilidade": "ambiguo", "texto": "Inuarashi afirma que a ilha final da Grand Line, Lodestar, explicaria como buscar os quatro Road Poneglyphs, e Nami objeta que Crocus dissera que a ilha final era Laugh Tale.", "atores": ["Inuarashi", "Nami", "Crocus"], "temas": ["Laugh Tale", "Lodestar", "Road Poneglyphs"], "corpo": "Tensao textual entre Lodestar e Laugh Tale que EV-0818-01 nao registra."}, {"id": "EV-0821-01", "fonte": "cap 821", "fonte_url": "https://onepiece.fandom.com/wiki/Zunesha", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Zunesha foi sentenciada a caminhar eternamente e a so agir sob ordem, como punicao por um crime cometido ha 800 anos.", "atores": ["Zunesha"], "temas": ["Zunesha", "Seculo Vazio", "punicao"], "corpo": "Uma testemunha viva da guerra, condenada a obedecer. EV-1040-01 so registra a camaradagem com Joy Boy."}, {"id": "EV-0821-02", "fonte": "cap 821", "fonte_url": "https://onepiece.fandom.com/wiki/Zunesha", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Zunesha possui a Voz de Todas as Coisas e so consegue falar telepaticamente com quem tem a mesma habilidade; foi assim que pediu a Momonosuke permissao para revidar.", "atores": ["Zunesha", "Kouzuki Momonosuke"], "temas": ["Zunesha", "Voz de Todas as Coisas", "Kouzuki Momonosuke"], "corpo": "Um ser de mais de mil anos so pode ser interrogado por quem tem a habilidade. Limita quem, no presente, pode obter testemunho direto do Seculo Vazio."}, {"id": "EV-0822-01", "fonte": "cap 822", "fonte_url": "https://onepiece.fandom.com/wiki/Zunesha", "tipo": "fala", "confiabilidade": "canonico", "texto": "Miyagi especula que Zunesha nao caminha ao acaso e pode estar procurando um lugar determinado.", "atores": ["Miyagi", "Zunesha"], "temas": ["Zunesha", "destino", "Seculo Vazio"], "corpo": "Especulacao de personagem, nao narracao. O que e canonico e que Miyagi diz isso, nao que seja verdade."}, {"id": "EV-0908-01", "fonte": "cap 908", "fonte_url": "https://onepiece.fandom.com/wiki/Void_Century", "tipo": "imagem", "confiabilidade": "canonico", "texto": "Imu demonstra interesse particular por Vivi, descendente da rainha Lili de Arabasta.", "atores": ["Imu", "Nefertari Vivi"], "temas": ["Imu", "Lili", "Arabasta"], "corpo": ""}, {"id": "EV-0966-01", "fonte": "cap 966", "fonte_url": "https://onepiece.fandom.com/wiki/Laugh_Tale", "tipo": "fala", "confiabilidade": "canonico", "texto": "Roger especulou que o Governo Mundial proibe a pesquisa dos Poneglyphs justamente para que ninguem chegue a Laugh Tale e encontre o que esta escondido la.", "atores": ["Gol D. Roger"], "temas": ["Governo Mundial", "Laugh Tale", "Poneglyphs"], "corpo": "A proibicao e apresentada como bloqueio de acesso a um lugar, nao so de acesso a uma informacao."}, {"id": "EV-0966-02", "fonte": "cap 966", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_966", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Treze anos antes do encontro com Barba Branca, a tripulacao de Roger chegou a Lodestar, a ultima ilha do Novo Mundo que o Log Pose aponta, e descobriu ali que ainda existia uma ilha depois dela.", "atores": ["Gol D. Roger"], "temas": ["Laugh Tale", "Lodestar", "navegacao"], "corpo": "Resolve em favor de Laugh Tale a tensao textual registrada em EV-0820-01: Lodestar\ne o fim da rota do Log Pose, nao o fim da Grand Line."}, {"id": "EV-0966-03", "fonte": "cap 966", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_966", "tipo": "narracao", "confiabilidade": "canonico", "texto": "O Log Pose nao consegue travar em Laugh Tale, e o motivo nao e explicado.", "temas": ["Laugh Tale", "navegacao", "Log Pose"], "corpo": "A ilha final e inacessivel pelo instrumento que rege toda a navegacao da Grand Line.\nQualquer hipotese sobre o que Laugh Tale e precisa acomodar essa anomalia fisica ou\nmagnetica, que a obra deixa declaradamente sem explicacao."}, {"id": "EV-0966-04", "fonte": "cap 966", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_966", "tipo": "fala", "confiabilidade": "canonico", "texto": "Roger concluiu que so alcancaria a ultima ilha com a informacao gravada nos Poneglyphs, e apresentou a Barba Branca e a Oden a transcricao de um deles.", "atores": ["Gol D. Roger", "Kouzuki Oden", "Edward Newgate"], "temas": ["Poneglyphs", "Laugh Tale", "navegacao"], "corpo": "O caminho ate o tesouro passa obrigatoriamente pela leitura de um texto antigo. Nao e\numa rota que se descubra navegando."}, {"id": "EV-0966-05", "fonte": "cap 966", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_966", "tipo": "fala", "confiabilidade": "canonico", "texto": "Roger pediu a Barba Branca que lhe emprestasse Oden por um ano, com a finalidade declarada de decifrar os Road Poneglyphs.", "atores": ["Gol D. Roger", "Kouzuki Oden", "Edward Newgate"], "temas": ["Road Poneglyphs", "Laugh Tale", "Oden"], "corpo": "O prazo e curto e a funcao e especifica: Oden entra na tripulacao como leitor, nao como\nguerreiro."}, {"id": "EV-0966-06", "fonte": "cap 966", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_966", "tipo": "fala", "confiabilidade": "canonico", "texto": "Segundo Oden, a lingua antiga dos Poneglyphs e uma cifra secreta ensinada a apenas um filho da familia Kouzuki.", "atores": ["Kouzuki Oden"], "temas": ["Poneglyphs", "Kouzuki", "escrita antiga"], "corpo": "A escassez de leitores nao e acidente historico: e politica de transmissao da propria\nfamilia que esculpiu as pedras."}, {"id": "EV-0966-07", "fonte": "cap 966", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_966", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Roger localizou o Poneglyph de Skypiea ouvindo as vozes que vinham de dentro dele.", "atores": ["Gol D. Roger"], "temas": ["Poneglyphs", "vozes", "Skypiea"], "corpo": "Achar a pedra e capacidade auditiva de Roger; ler a pedra e capacidade de Oden. Sao duas\ncompetencias distintas, e a tripulacao precisou das duas."}, {"id": "EV-0966-08", "fonte": "cap 966", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_966", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Foi Oden quem gravou, na escrita antiga, a mensagem que Roger ditou junto ao Poneglyph do sino de ouro de Shandora, registrando que estivera ali.", "atores": ["Kouzuki Oden", "Gol D. Roger"], "temas": ["Poneglyphs", "escrita antiga", "Skypiea", "mensagem"], "corpo": "Um Kouzuki escreveu na escrita antiga a mando de um pirata: a inscricao de Poneglyphs nao\ne capacidade extinta com o Seculo Vazio, continuou disponivel na era moderna."}, {"id": "EV-0967-02", "fonte": "cap 967", "fonte_url": "https://onepiece.fandom.com/wiki/Joy_Boy", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Joy Boy deixou Poneglyphs descrevendo o paradeiro das armas ancestrais.", "atores": ["Joy Boy"], "temas": ["Poneglyphs", "armas ancestrais", "Joy Boy"], "corpo": "Quem esconde armas tambem deixou o mapa delas — o gesto e de transmissao, nao de ocultacao."}, {"id": "EV-0967-03", "fonte": "cap 967", "fonte_url": "https://thelibraryofohara.com/2022/01/04/what-is-the-one-piece-the-ultimate-one-piece-theory/", "tipo": "fala", "confiabilidade": "ambiguo", "texto": "Em Laugh Tale, Roger se dirige a Joy Boy e nomeia duas coisas na mesma fala: o tesouro ina
