nde: 900 anos atrás havia uma civilização\n  tecnologicamente muito mais avançada que a de hoje, e ela tem nome, data e um\n  personagem que a descreve. Toda tecnologia antiga do corpus cabe dentro dessa\n  janela sem que se postule ninguém antes dela. Uma hipótese que acrescenta uma\n  civilização a mais precisa mostrar um artefato que a janela de 900 anos não\n  comporta — e o único candidato é uma estimativa (EV-1144-01, abaixo).\n\n- EV-1115-02 — \"Como as armas ancestrais ainda existem e esperam para se erguer de\n  novo, Vegapunk conclui que a Grande Guerra do Seculo Vazio nunca chegou ao fim.\"\n  A periodização que a obra coloca na boca do seu maior reconstrutor do passado\n  não é cíclica: é *uma* Grande Guerra que **nunca chegou ao fim**. H-14 precisa\n  de colapsos concluídos e recomeços — pelo menos dois antes do atual. A moldura\n  canônica é a oposta: um conflito único, ainda aberto, com as armas ancestrais\n  esperando para se erguer de novo. Não há \"antes do atual\" num relato em que o\n  atual nunca terminou.\n\n- EV-1115-03 — \"A derrota de Joy Boy marcou o fim do Reino Antigo e, com ele, o fim\n  do Seculo Vazio.\" O corpus tem exatamente um fim de era com agente, data e\n  mecanismo nomeados, e ele é a derrota de Joy Boy. H-14 precisa de mais dois fins\n  de era; a obra, quando enuncia um, enuncia este e para aqui.\n\n- EV-1115-01 — \"Vegapunk conclui que o uso das armas ancestrais elevou o nivel do\n  mar em 200 metros e que as ilhas de hoje sao os topos dos continentes\n  submersos.\" Este é o único colapso do corpus com mecanismo explicado, e o\n  mecanismo é o **uso das armas ancestrais** numa guerra datada. A geografia do\n  mundo inteiro — ilhas que são topos de continentes submersos — é atribuída a esse\n  evento e só a ele. Se houvesse dois colapsos anteriores, a explicação da forma\n  atual do planeta teria camadas; a obra a dá em uma. Pior para H-14: qualquer\n  ruína industrial que se ache submersa já tem causa e data atribuídas por este\n  átomo, e não precisa de era nova.\n\n- EV-1114-01 — \"Vegapunk revela ao mundo que Joy Boy veio do Reino Antigo, foi o\n  primeiro pirata da historia e portava a Hito Hito no Mi Modelo Nika.\" A\n  transmissão global é a cena em que a obra escolheu contar ao mundo o que estava\n  escondido, e o objeto da revelação é o Reino Antigo. Note o superlativo:\n  **primeiro pirata da historia**. A obra usa \"primeiro\" e \"história\" na mesma\n  frase e ancora o começo no Reino Antigo. Um mundo com dois colapsos industriais\n  anteriores teria piratas anteriores — ou, no mínimo, uma história cujo primeiro\n  pirata não coincide com a era imediatamente anterior à nossa.\n\n- EV-1144-01 — \"Lilith estima que a instalacao cientifica encontrada num galho da\n  Arvore Adam de Elbaf tem tres mil anos, e Ripley confirma que os gigantes nao tem\n  registro algum desse edificio.\" O átomo mais forte da hipótese se fere sozinho em\n  duas metades. Primeira: o verbo é **estima**. Uma estimativa é evidência\n  canônica do *estado de crença de quem estima* — aqui, do que Lilith acha ao olhar\n  um edifício —, não da idade do edifício. O repositório já aplicou exatamente esse\n  corte em H-10, onde EV-1037-01 foi rebaixado por ser um dos Cinco Anciãos que\n  *cogita* a fuga da fruta: cogitação é dado sobre o cogitante. Segunda metade, e é\n  a pior: o mesmo átomo diz que **os gigantes não têm registro algum desse\n  edifício**. H-14 precisa que o mundo tenha memória de eras anteriores; o átomo\n  que ela usa como prova de era anterior é justamente o registro de que não há\n  registro. Ausência de registro é compatível com prédio antigo, com prédio\n  escondido e com prédio recente construído por quem não avisou os gigantes — e\n  Lilith não tem como distinguir os três olhando.\n\n- EV-0395-09 — \"Os estudiosos de Ohara so descobriram a existencia de um pais que nao\n  existe mais cruzando varios documentos e poneglyphs, e nao por uma unica fonte.\"\n  É o padrão de prova que a obra estabelece **para exatamente esta pergunta**: como\n  se estabelece que existiu um país que não existe mais. A resposta canônica é\n  cruzamento de vários documentos e poneglyphs, e a negação explícita de que uma\n  fonte única baste. H-14 afirma duas civilizações desaparecidas a partir de um\n  painel de mural e de uma estimativa. Pelo critério que a própria obra enuncia,\n  isso não é uma descoberta: é o que Ohara levou décadas para não fazer.\n\n- EV-0395-08 — \"Clover afirma que, antes de o Governo Mundial existir, o mundo era\n  regido por um reino imenso, e que esse reino foi exterminado por um grupo que veio\n  a se tornar o Governo Mundial.\" A reconstrução mais rigorosa que a obra encena —\n  feita por triangulação, paga com uma ilha inteira, dita na cara dos Cinco Anciãos\n  — chega a **um** regime anterior e para nele. Some-se EV-0395-06 (o povo que\n  gravou os poneglyphs foi derrotado por um inimigo que seguiu existindo na história\n  posterior) e EV-0395-10 (gravaram para que o mundo soubesse o que havia\n  acontecido): o testamento dos derrotados relata uma derrota, não uma série. Se o\n  mundo tivesse acabado duas vezes antes, o discurso de Clover é o lugar da obra\n  onde isso apareceria.\n\n- EV-1066-02 — \"Os livros que os arqueologos de Ohara jogaram no lago foram\n  recolhidos por gigantes liderados por Jaguar D. Saul e levados para Elbaf.\" Golpe\n  de localização, e é irônico. O arquivo mais bem construído do mundo da obra está\n  **em Elbaf** — na mesma ilha do mural e da instalação de três mil anos. E\n  EV-1066-03 fecha a cadeia: Vegapunk visitou Elbaf em segredo, leu os livros\n  salvos de Ohara, e por isso conhece a verdadeira história. O que saiu dessa\n  leitura foi a transmissão global: um reino, uma guerra, 900 anos (EV-1114-01,\n  EV-1115-01, EV-1115-03). Ou seja: quem leu o acervo de Ohara **dentro de Elbaf**\n  não relatou nenhum colapso anterior. H-14 precisa que a resposta estivesse na\n  casca de uma árvore da mesma ilha, invisível para o único homem que leu os livros\n  ali guardados.\n\n- EV-0392-02 — \"A Arvore do Conhecimento de Ohara era uma arvore-biblioteca de cinco\n  mil anos que reunia arqueologos do mundo inteiro.\" Contra-evidência dupla.\n  Primeiro, à falseabilidade: aqui está mais um objeto do corpus datado muito antes\n  de 900 anos, e a previsão (1) volta a se cumprir sem que nada de novo aconteça.\n  Segundo, e mais grave, ao enunciado: uma árvore-biblioteca de cinco mil anos que\n  reunia arqueólogos do mundo inteiro é **continuidade** de cinco milênios, não\n  ruína. O mundo de H-14 teria de ter sido destruído duas vezes por baixo dessa\n  árvore sem que ela caísse e sem que o acervo registrasse. E o que os próprios\n  estudiosos atribuem ao acervo, em EV-0397-01, são \"palavras de mil anos\" — a\n  mesma ordem de grandeza de todo o resto.\n\n- EV-1144-02 — \"A Arvore Adam de Elbaf e a mais antiga do mundo por pelo menos tres\n  mil anos.\" Contra-evidência à segunda metade do enunciado. A coisa que o corpus\n  aponta como a mais antiga do mundo é uma árvore, e ela está **de pé**, íntegra e\n  habitada (EV-1131-01, três níveis habitados com nomes próprios). Três mil anos de\n  continuidade sem interrupção é o contrário de dois colapsos: o item mais velho do\n  mundo atravessou inteiro o período em que H-14 precisa que o mundo tenha sido\n  destruído duas vezes. Antiguidade não é catástrofe, e este átomo é a prova\n  interna disso. Registre-se ainda o atrito com EV-0392-02, que dá cinco mil anos à\n  Árvore do Conhecimento de Ohara: os números de tempo profundo do corpus não\n  formam cronologia, formam ordens de grandeza soltas — e H-14 quer construir\n  periodização com elas.\n\n- EV-1138-01 — \"O mural esculpido na casca fossilizada da Arvore Adam em Elbaf\n  parece representar visualmente o texto do Harley, que registra dois mundos ja\n  passados e um ainda por ocorrer.\" O verbo é **parece representar**, e a\n  confiabilidade é `ambiguo`. Ora: o painel só se chama \"Primeiro Mundo\" se o mural\n  representar o Harley. Sem essa equação, o que existe na casca é um desenho de\n  cidade sem data e sem legenda. H-14 usa a identificação mural=Harley para batizar\n  o painel e depois usa o painel para datar a civilização — a legenda que ela\n  precisa provar é a legenda que ela assume. Isso é circularidade no ponto exato\n  em que a hipótese nasce.\n\n- EV-1138-02 — \"Na porcao do Terceiro Mundo do mural aparece uma figura de Nika ao\n  centro, cercada por representantes de varias racas e por barcos, enfrentando uma\n  figura demoniaca que segura o Sol enquanto os demais tentam liberta-lo.\" A nota\n  do átomo é a contra-evidência: ele **teve de ser reescrito em 2026-08-11** porque\n  a One Piece Wiki e a análise painel a painel do Library of Ohara divergem sobre\n  quem está desenhado no mural — uma lista Loki e Zunesha, a outra afirma\n  explicitamente que Zunesha não aparece. O repositório já se enganou uma vez lendo\n  este mural, e a pendência está aberta (\"nao usar este atomo para afirmar presenca\n  de personagem especifico\"). Um suporte de imagem que já produziu erro documentado\n  sobre *o que está desenhado* não pode sustentar uma tese sobre *o que aconteceu*.\n\n- EV-1138-09 — \"Todas as figuras humanas desenhadas no painel do Primeiro Mundo sao\n  humanas, sem nenhuma outra raca representada, ao contrario do painel do Terceiro\n  Mundo.\" Este é o átomo que classifica o gênero do mural, e o gênero não é\n  documental. O contraste entre os painéis — só humanos no começo, todas as raças\n  no fim — é composição argumentativa: o mural foi esculpido para dizer alguma\n  coisa. Um desenho construído para argumentar tem seus detalhes escolhidos pelo\n  argumento. As chaminés, as engrenagens e os escravos do primeiro painel são\n  exatamente os detalhes de que a tese \"começamos separados e gananciosos\" precisa,\n  e por isso não podem ser lidos como inventário técnico de uma era.\n\n- EV-1138-11 — \"No painel do Terceiro Mundo a figura demoniaca segura o Sol no\n  centro da cena enquanto todos os demais tentam liberta-lo, e dela descem gotas de\n  chuva e varias Mother Flames.\" Golpe de gênero, decisivo. O Terceiro Mundo **não\n  aconteceu**: esse painel é aspiração, não registro. Logo, pelo menos um terço do\n  mural é comprovadamente não documental, e a iconografia é de figura demoníaca\n  segurando o Sol — vocabulário de mito, não de crônica. Se o painel 3 não é\n  fotografia, o painel 1 não ganha esse estatuto de graça. H-14 precisa aplicar dois\n  regimes de leitura ao mesmo objeto, sem nenhum átomo que autorize a separação.\n\n- EV-1138-14 — \"Ripley considera o mural um sonho de crianca precisamente porque ele\n  mostra varias racas diferentes trabalhando juntas, algo de que os gigantes nao tem\n  registro.\" A única personagem que a obra coloca diante do mural para avaliá-lo o\n  descarta, e o descarta por um critério explícito: falta de registro. O mesmo\n  critério, aplicado ao painel do Primeiro Mundo, o descarta também — não há\n  registro gigante de civilização industrial nenhuma. H-14 tem de aceitar o critério\n  de Ripley para o que lhe convém e recusá-lo para o resto.\n\n- EV-1116-02 — \"A Mother Flame, chama que Vegapunk criou para ser um sol proprio e\n  fonte de energia ilimitada, esta incompleta.\" Bifurcação sem saída boa. O painel\n  do Primeiro Mundo mostra escravos carregando cargas de Mother Flame; mas a obra\n  afirma que a Mother Flame é chama que **Vegapunk criou**, e que está incompleta.\n  Ou o mural põe uma invenção do presente no passado mais remoto — e então é\n  fantasia, como Ripley diz —, ou a etiqueta \"Mother Flame\" no desenho é projeção\n  de quem leu o painel, exatamente como a nota de EV-1138-06 já admite ao dizer que\n  \"a identificacao com a Mother Flame e leitura do analista\". Nas duas saídas H-14\n  perde o átomo, e numa delas perde o mural inteiro.\n\n- EV-1136-01 — \"O Harley, texto religioso de Elbaf, divide sua historia em tres\n  Mundos, sendo que o Segundo Mundo corresponde ao Seculo Vazio.\" O átomo diz, com\n  todas as letras, **texto religioso**, e diz que ele divide **sua** história — a\n  história do próprio texto e do seu povo, não a do planeta. Que um texto religioso\n  numere três Mundos é fato sobre o texto. Gênesis, éddas e cosmogonias numeram eras\n  sem que se conclua estratigrafia. E o corpus já registra que a tradição de Elbaf\n  compartilha repertório com outras religiões do mundo da obra: EV-0287-01 mostra os\n  Shandia antigos cultuando deuses do sol, da terra, da floresta e da chuva, o mesmo\n  panteão que o Harley mobiliza.\n\n- EV-1138-13 — \"Os dois primeiros Mundos do Harley terminam com a formula de que\n  eles nao puderam se reencontrar, e o Terceiro termina dizendo que dessa vez eles\n  certamente conseguirao se reencontrar, sem que o texto identifique quem sao.\" A\n  palavra do átomo é **fórmula**, e fórmula repetida com variação final é a forma\n  litúrgica por excelência. O que o Harley periodiza é um **reencontro adiado**\n  entre um \"eles\" que o texto **não identifica**. Uma estrutura de três tempos\n  organizada em torno de um refrão sobre pessoas não nomeadas é evidência de forma\n  poética; para virar cronologia geológica precisaria que alguém, dentro da obra,\n  datasse o Primeiro Mundo. Ninguém data.\n\n- EV-1131-01 — \"A Arvore Adam de Elbaf tem tres niveis habitados com nomes proprios:\n  o Submundo na base da ilha, o Mundo do Sol nos galhos medios e o Mundo Celeste na\n  copa.\" Alternativa canônica e mais barata para os três Mundos do Harley: eles\n  podem ser **lugares**, não épocas. Três níveis habitados com nomes próprios, no\n  mesmo lugar onde o Harley é escrito e onde o mural é esculpido. A própria nota do\n  átomo registra a bifurcação — o lugar foi construído com a forma da profecia, ou a\n  profecia foi nomeada a partir do lugar. Se a segunda, \"Primeiro Mundo\" designa a\n  base da árvore, e a periodização histórica de H-14 evapora sem contra-fato nenhum:\n  bastou ler o mesmo termo como topografia.\n\n- EV-1125-02 — \"Vegapunk nunca conseguiu replicar a energia antiga que move o robo\n  Emet, comum no Seculo Vazio, e a maquina so voltou a vida quando os Tambores da\n  Libertacao soaram.\" O átomo que parece amigo é hostil ao ponto decisivo: a energia\n  antiga irreplicável é datada por Vegapunk como **comum no Século Vazio**. Ou seja,\n  a obra já explicou tecnologia perdida sem sair da janela de 900 anos. Some-se\n  EV-1125-01, o robô gigante blindado **criado no inicio do Seculo Vazio**: o\n  artefato mais espetacular do corpus tem data, e a data é dentro do Século Vazio.\n\n- EV-1023-01 — \"Barba Branca contou a Marco que existiu um Kami no Kuni, um pais dos\n  deuses, no alto da Red Line muito antes de Mary Geoise existir.\" É o átomo que\n  mais se parece com apoio e é o que melhor mostra o problema. \"Muito antes de Mary\n  Geoise existir\" não é número: EV-0722-01 data a mudança dos dezenove monarcas para\n  Mary Geoise em 800 anos, e o Século Vazio a antecede. Um país dos deuses anterior\n  a Mary Geoise cabe folgadamente dentro do Século Vazio e do Reino Antigo. A única\n  coisa que este átomo estabelece é que havia algo antes da capital — o que a obra já\n  dizia em EV-1115-03.\n\n- EV-0621-02 — \"Neptune diz ao Ministro da Esquerda que o mundo com que sua esposa\n  sonha remonta a centenas de anos: ancestrais distantes tentaram a mesma coisa e\n  aquilo terminou em sonho desperdicado e arrependimento.\" É a outra tentativa\n  fracassada que o corpus registra, e a medida que a obra dá para ela é **centenas\n  de anos** — dentro do horizonte de 800 a 900, não antes dele. Quando a obra quer\n  falar de um esforço anterior que deu errado, ela põe a frase na boca de um rei,\n  em prosa, com ordem de grandeza declarada. Esse é o formato do dado que H-14\n  precisaria ter para os seus dois colapsos, e não tem.\n\n- EV-0648-04 — \"Os Reis do Mar explicam que a cada varias centenas de anos a rainha\n  deles nasce em forma de sereia, por um motivo que eles proprios desconhecem.\"\n  Contraprova de método sobre recorrências. Aqui a obra tem uma recorrência real de\n  várias centenas de anos, e o tratamento é: personagens a enunciam diretamente e\n  **declaram desconhecer o motivo**. Recorrência longa, quando existe neste mundo,\n  é dita em fala e fica marcada como inexplicada — não é cifrada em painel nem\n  deduzida da contagem de estrofes de um texto religioso.\n\n### Veredito\n\nferida\n\nNão encontrei átomo que diga \"não houve civilização antes do Reino Antigo\", e digo\nisso claramente: a hipótese não está refutada no conteúdo. O que ela está é sem\nsuporte que a distinga e, pior, sem previsão que a teste. Os três achados que a\nferem, na ordem em que foram pedidos:\n\n**(a) Estimativa é evidência do estimador, não do estimado.** EV-1144-01 diz que\nLilith **estima** três mil anos, e Ripley confirma que os gigantes não têm registro\nalgum do edifício. O que o átomo prova é o estado de crença de Lilith diante de uma\ninstalação científica achada num galho — nada mais. Não há método declarado, não há\nsegunda opinião, não há registro contra o qual conferir, e a própria frase que\ncarrega a estimativa carrega também a ausência de registro. O repositório já fez\nesse corte antes: em H-10, EV-1037-01 foi rebaixado porque um dos Cinco Anciãos\n*cogitar* que a fruta foge é dado sobre o Governo e não sobre a fruta. Aqui é pior,\nporque a estimativa de Lilith é o **único** número do corpus fora da janela de 900\nanos, e H-14 inteira depende de ele ser um dado e não uma impressão. Ponto único de\nfalha, e o ponto é um verbo de opinião. Compare com o outro número: EV-1065-01 tem\nVegapunk *teorizando* 900 anos — e ali a teoria coincide com a cronologia densa que\no corpus repete em EV-0722-01 (800 anos), EV-0821-01 (crime de 800 anos atrás) e\nEV-1125-01 (robô do início do Século Vazio). Um número isolado, num verbo fraco,\ncontra um feixe de números convergentes.\ aberto.\n\n- EV-1084-01 — Lili, rainha de Arabasta no Século Vazio, foi a única dos vinte\n  soberanos a não se mudar para Mary Geoise, e desapareceu antes de voltar para\n  casa. Isto mata a metade dianteira da previsão (1) sem esperar capítulo novo: a\n  obra **já** revelou soberanos anteriores ao Governo Mundial que não são Joy Boy —\n  vinte deles, um dos quais é uma rainha nomeada, do Século Vazio, com registros\n  apagados. Uma previsão cuja primeira cláusula já está cumprida por átomo\n  existente não é risco, é decoração.\n\n- EV-1115-03 — A derrota de Joy Boy marcou o fim do Reino Antigo e, com ele, o fim\n  do Século Vazio. O corpus documenta **uma** soberania anterior que caiu, e ela tem\n  nome: o Reino Antigo. H-09 postula uma segunda soberania anterior, paralela e\n  invisível, cuja queda a obra nunca registrou. Isso é acrescentar uma peça a um\n  quebra-cabeça que já tinha a peça.\n\n- EV-1114-01 — Vegapunk revela ao mundo que Joy Boy veio do Reino Antigo, foi o\n  primeiro pirata da história e portava a Hito Hito no Mi Modelo Nika. A revelação\n  pública mais completa que a obra já fez sobre o Século Vazio nomeia o Reino\n  Antigo, nomeia Joy Boy, nomeia Nika — e não nomeia trono nenhum, nem Rei do\n  Mundo, nem Davy. H-09 pode alegar que o trecho interrompido (EV-1117-01) continha\n  isso, mas essa saída é ela própria uma suposição não evidenciada, e está\n  igualmente disponível para qualquer hipótese: não discrimina nada.\n\n- EV-0395-01 — Clover afirma que o nome do Reino Antigo é de importância tremenda e\n  é a chave para entender o Século Vazio, mas é baleado antes de pronunciá-lo. O\n  segredo pelo qual o Governo mata é o **nome de um reino**, no singular, e é\n  declarado a chave do Século Vazio inteiro. Se a chave fosse um trono mundial\n  usurpado, a coisa interrompida a tiros seria o título de Imu, não o nome do reino.\n\n- EV-1085-01 — Imu afirma que a Vontade de D. tem alguma relação com o Reino Antigo.\n  Golpe pela boca do próprio Imu vy D. Jones — nenhum encontro, nenhum termo, nenhum\n  desprezo. O medo de Imu já tem causa evidenciada, e ela não é um trono.\n\n- EV-1188-01 — Imu diz a Luffy que ele não é Joy Boy, porque Joy Boy era muito mais\n  forte do que Luffy é agora. O vocabulário com que Imu ordena rivais é **força**, e\n  não título, sangue ou legitimidade. Um usurpador confrontado com o herdeiro do\n  trono discute direito; este personagem discute potência.\n\n- EV-1190-02 — Imu admite que Luffy é mesmo quem esperavam e diz que foi tolo por\n  ter confundido várias coincidências com destino. A obra coloca na boca do\n  personagem mais bem informado sobre o Século Vazio a advertência exata contra o\n  movimento inferencial de H-09: ler desígnio onde houve coincidência. E mostra que\n  Imu **erra** sobre quem é quem — o que rebaixa o valor probatório da sua negação\n  em EV-1164-01, que H-09 trata como confissão involuntária.\n\n- EV-0649-01 — Joy Boy escreveu num Poneglyph da Sea Forest um pedido de desculpas\n  por não ter cumprido sua parte da promessa feita à Ilha dos Homens-Peixe.\n\n- EV-0648-01 — Os Reis do Mar levaram Noah até a Sea Forest esperando consertá-la\n  antes que chegue o tempo prometido. Os dois juntos: a única promessa cujo\n  **conteúdo** o corpus conhece é uma dívida não cumprida com um destinatário\n  concreto e um prazo. H-09 precisa de uma segunda promessa, com outro autor e\n  outro conteúdo (restauração de trono), e não tem um único átomo que enuncie esse\n  conteúdo. EV-1164-02 diz \"a promessa de que ele falava\" e não diz do que ela era.\n\n- EV-1155-01 — Descendentes de Davy D. Jones se estabeleceram em God Valley, e o\n  Governo Mundial, **ao descobri-los**, os incluiu como alvos na caçada dos Nobres\n  Mundiais. Único átomo do corpus sobre a linhagem Davy, e ele contradiz o quadro de\n  H-09 em dois pontos. Primeiro: os descendentes são tratados como presa numa\n  caçada, não como dinastia deposta com pretensão. Segundo: o Governo precisou\n  **descobri-los** — um poder que houvesse tomado o trono deles saberia onde\n  estavam os herdeiros; não os encontra por acaso numa ilha ao organizar uma caçada\n  esportiva.\n\n- EV-1164-03 — Depois que Imu transformou Xebec em demônio em God Valley, Eris\n  comentou que ainda era cedo demais. O próprio material Davy/God Valley é\n  enquadrado pela obra no relógio do \"cedo demais\", o mesmo relógio de Roger e de\n  Luffy — tema de **tempo**, não de restauração dinástica. H-09 lê como trono o que\n  o corpus vem lendo como calendário.\n\n- **Previsão (2) não tem átomo — nenhum.** Nenhum dos 83 átomos menciona Barba\n  Negra, Marshall D. Teach, ou qualquer sobrevivente nomeado da linhagem Davy. A\n  premissa \"único sobrevivente conhecido da linhagem Davy\" não é derivada de átomo:\n  EV-1155-01 fala em descendentes no plural em God Valley e não nomeia nenhum. Pela\n  regra zero do repositório, isto é o erro fatal: uma previsão inteira construída\n  sobre memória do analista. E mesmo se o personagem existisse no corpus,\n  \"reivindicará algo distinto do One Piece\" é satisfeito por qualquer coisa que\n  qualquer personagem reivindique.\n\n### Veredito\n\nferida\n\nJustificativa do veredito. Não é refutada: EV-1164-01 e EV-1164-02 existem, são\ncanônicos, e é verdade que a obra pôs em cena uma disputa sobre quem reinou antes do\nGoverno Mundial e uma promessa antiga associada a Davy Jones. Isso é um dado real, e\nred team honesto não finge que não é. Mas o que os átomos sustentam é apenas:\n*alguém afirmou X e Imu negou*. O salto de \"há uma disputa\" para \"houve usurpação, e\no que Imu teme é a restauração desse trono\" não tem átomo em nenhum degrau.\n\n**Ataque de circularidade — o pedido explícito, e ele acerta.** O argumento de H-09\ntem esta forma: Imu se enfurece ao ouvir que Jones foi Rei do Mundo (EV-1164-01),\n*logo* Imu tem o que esconder sobre esse trono. A inferência só fecha com a premissa\nde que a fúria de um soberano diante de uma reivindicação rival indica consciência de\nroubo. Essa premissa não vem de átomo — e o corpus fornece ativamente a explicação\nconcorrente: EV-1181-01 diz que os fundamentos do poder de Imu são Corrupção, Pacto e\n**inveja**, e EV-1181-02 que ele declara a Dominação a única bem-aventurança\nverdadeira. Um ser assim nega que outro tenha sido rei de coisa alguma porque é isso\nque a doutrina dele afirma sobre o mundo, não porque tomou algo dele. Some-se\nEV-1181-02 (grita o nome de Joy Boy com raiva) e EV-1188-01 (rebaixa Luffy por força)\ne a fúria aparece como o modo padrão de Imu diante de qualquer rival — constante que\nnão discrimina hipótese nenhuma. Uma constante não pode ser evidência de um evento\nespecífico. O veredito sobre a circularidade é: **confirmada**. A fúria de Imu só é\nevidência de usurpação depois que a usurpação foi assumida.\n\n**Falseabilidade — as duas previsões são inservíveis como estão.**\n- Previsão (1) é conjunção de uma cláusula já cumprida com uma cláusula elástica. A\n  primeira metade (\"título ou trono anterior ao Governo Mundial ocupado por alguém\n  que não Joy Boy\") já é verdadeira por EV-1084-01: vinte soberanos, incluindo a\n  rainha Lili. A segunda metade (\"Imu será mostrado o tomando **ou** herdando\") é\n  uma disjunção que cobre os dois caminhos opostos — e nota-se que *herdar* é\n  compatível com a negação de qualquer usurpação, que é justamente a palavra do\n  enunciado. Uma previsão satisfeita por herança não testa uma hipótese de usurpação.\n  Exijo substituição por cláusula única e arriscada, do tipo: *a obra nomeará o\n  título que Imu ocupa, mostrará um ocupante anterior nomeado que não é Joy Boy, e\n  mostrará a transferência contra a vontade desse ocupante.*\n- Previsão (2) é pior que decorativa: é órfã de corpus. Refere um personagem sem\n  nenhum átomo e afirma sobre ele uma exclusividade (\"único sobrevivente conhecido\")\n  que nenhum átomo autoriza. Pela regra do repositório, ela deve ser retirada, e não\n  apenas reescrita — enquanto ela estiver lá, H-09 tem uma previsão inventada\n  ocupando o lugar de uma testável. Retirada a previsão (2) e cumprida metade da\n  previsão (1), sobra a H-09 **zero** previsão genuinamente arriscada, o que é\n  incompatível com status vivo sem reescrita.\n\n**Cadeia frágil — ponto único de falha.** Os dois átomos que sustentam a hipótese\ninteira, EV-1164-01 e EV-1164-02, são `fala`, do mesmo capítulo, da mesma boca —\nRocks D. Xebec — e ditos em provocação a Imu durante confronto. Nenhum é\n`traducao_disputada`, e o modo de falha aqui é pior que tradução: o átomo garante que\nRocks *disse*, não que seja assim; e EV-1164-02 registra explicitamente que Rocks\n**sugere**. Retire-se a veracidade de um provocador e não sobra nada de H-09. O\nrepositório já aplicou esse padrão de ceticismo em EV-1089-01, onde se recusa a\nnomear Uranus porque a suposição é do fandom e não da obra; o mesmo padrão aplicado\na EV-1164-01 impede tratar a fala de Rocks como fato institucional.\n\n### Custo estrutural\n\n8 suposições não evidenciadas:\n\n1. Que \"Rei do Mundo\" em EV-1164-01 designa um trono, uma instituição transferível\n   com sucessão, e não um epíteto na boca de Rocks. O átomo registra a declaração e\n   a negação furiosa, e não define coisa alguma.\n2. Que na disputa de EV-1164-01 Rocks diz a verdade e Imu mente. Nenhum átomo\n   arbitra; H-09 precisa do juízo para depois usá-lo como evidência.\n3. Que Imu tomou ou herdou esse título. Não há átomo ligando Imu à aquisição de\n   título nenhum: os atos de Imu que o corpus registra são ordenar o encobrimento do\n   nome de Roger por ele ser um D. (EV-1190-04) e energizar uma arma ancestral\n   desconhecida com a Mother Flame (EV-1089-01).\n4. Que \"a promessa de que ele falava\" (EV-1164-02) é de Davy Jones e não de Joy Boy,\n   quando o próprio átomo formula a pergunta como *Jones ou Joy Boy* e deixa a\n   atribuição aberta.\n5. Que o conteúdo dessa promessa é a restauração de um trono. Nenhum átomo enuncia\n   conteúdo algum para ela; a única promessa com conteúdo conhecido é a feita à Ilha\n   dos Homens-Peixe, cujo texto é um pedido de desculpas (EV-0649-01) e cujo prazo é\n   o tempo prometido (EV-0648-01).\n6. Que essa soberania é distinta do Reino Antigo, cuja queda a obra já registra com a\n   derrota de Joy Boy (EV-1115-03) e cujo nome Clover declara ser a chave do Século\n   Vazio (EV-0395-01). H-09 postula um segundo reino caído num corpus que documenta\n   um.\n7. Que a fúria e o medo de Imu são consciência de roubo, e não a doutrina que ele\n   mesmo enuncia — Dominação fundada em Corrupção, Pacto e inveja (EV-1181-01,\n   EV-1181-02) — nem o desprezo e medo profundos nascidos da relação pessoal com Joy\n   Boy que a obra já datou (EV-1181-03).\n8. Que Barba Negra existe neste corpus e é o único sobrevivente conhecido da linhagem\n   Davy. Zero átomos: nenhum dos 83 o menciona, e EV-1155-01 fala em descendentes no\n   plural estabelecidos em God Valley, descobertos pelo Governo e incluídos como\n   alvos na caçada.\n\nCusto agregado: H-09 gasta oito peças para explicar dois átomos de um único capítulo,\nditos por um único personagem hostil. Cada átomo que ela recruta fora desse par\n(EV-0908-01, EV-1085-01, EV-1190-04) é igualmente ou melhor explicado sem trono\nnenhum: interesse por Vivi e por Lili se explica pelo erro que espalhou os Poneglyphs\n(EV-1085-02, já usado por outras hipóteses), e a perseguição ao D. se explica pela\nrelação que o próprio Imu declara entre a Vontade de D. e o Reino Antigo.\n\n### Concorrente mais econômico\n\nH-05\n\nRegistro primeiro a ressalva honesta: H-09 tem escopo `imu` e é a única hipótese\ndesse escopo no repositório, de modo que não há concorrente formal na mesma\ncontagem. Mas o Red Team foi encarregado de nomear quem explica os mesmos átomos com\nmenos peças, e para o explanandum de H-09 — *que promessa é essa que Imu teme, e por\nque ele teme herança* — a resposta é H-05, \"o One Piece é o legado dirigido de Joy\nBoy: palavras, um
