nico atomo `traducao_disputada` do\n   repositorio, e e justamente ele que carrega 'dessa vez', 'certamente' e 'se\n   encontrarao' — as tres expressoes que sustentam agendamento e necessidade. Peso\n   reduzido de 0.35 para 0.30 e a hipotese foi reescorada sem depender dele.\n2. **Circularidade**: nenhum dos atomos do Harley menciona Laugh Tale ou o One Piece.\n   A ponte e fornecida pela hipotese. Por isso a previsao (2) foi trocada: agora\n   exige que a obra faca a ponte explicitamente, o que e o teste da circularidade.\n\nA previsao (1) perdeu a clausula 'sem depender de leitura previa', que colidia com\nEV-0301-01 e EV-0818-01 — os dois entraram como contradicao.\n\n## O que a mataria\n\nA fala de Imu em EV-1190-02 ja e um golpe direto: ele proprio classifica a leitura de\ndestino como erro de quem confunde coincidencia com designo.\n\n## Nota de curadoria\n\nPrior 0.15 -&gt; 0.13. Ganhou EV-0968-02, que e forte e canonico, mas perdeu peso na\ncamada profetica e absorveu duas contradicoes novas.\n\n## Revisao de 2026-08-11 (rodada 3)\n\nA analise gramatical do texto japones do Harley mexeu nas duas direcoes ao mesmo\ntempo, e o Curador registra as duas:\n\n**A favor.** O Red Team tinha declarado circularidade — nenhum atomo do Harley\nmencionava Laugh Tale ou o One Piece, e a ponte era fornecida pela hipotese. Isso\ncaiu: o verso usa literalmente 約束の日, Dia da Promessa, que e o mesmo termo com que\na obra ja se referia ao dia em que Noah cumprira seu proposito (EV-0648-01). A ponte\nagora e lexical, nao conjectural. A previsao (2) foi reescrita para testar\nexatamente isso.\n\n**Contra.** O mesmo verso continua: 片われ月の声を聞く, ouvir as vozes da lua\ncrescente. E 'ouvir vozes' e como Roger descreve ler Poneglyph. Ou seja, o texto\nprofetico condiciona o desfecho a uma leitura — que e precisamente o que a\nprevisao (1) desta hipotese negava. EV-1138-05 entrou como contradicao com peso\n0.40, o maior peso permitido para um atomo `traducao_disputada` sem gerar aviso.\n\nSaldo: a hipotese fica mais honesta e nao mais forte. Ela ganhou uma ponte e\nperdeu a clausula que a distinguia de H-04 e H-05.\n\n## Revisao de 2026-08-11 (rodada 5)\n\nDuas coisas, e a segunda incomoda.\n\n**A profecia funciona.** EV-1174-01 e o primeiro caso na obra em que uma predicao\nda tradicao de Elbaf se cumpre em cena, com precisao coreografica. Isso eleva o\nvalor probatorio de todo o eixo Harley, que ate aqui podia ser lido como alegoria\nretrospectiva.\n\n**Mas o gatilho observado nao foi chegar a lugar nenhum.** A condicao que se\ncumpriu foi a co-presenca das pessoas certas com os poderes certos — o portador do\nNidhoggr e o portador da Nika no mesmo ceu. Se e esse o padrao do Harley, o evento\ne disparado por quem esta reunido, e nao por onde alguem chega. Isso empurra a\nhipotese para longe de Laugh Tale e a aproxima de H-02 e H-11.\n\n**Pendencia de custodia:** a analise de terceiro atribui essa profecia ao Harley, e\no capitulo nao diz isso. O atomo foi registrado como fala de Jarul com fonte\ntextual nao identificada, de proposito.\n\n## Revisao de 2026-08-11 (Red Team, segundo ataque)\n\nVeredito: ferida. Oito suposicoes nao evidenciadas. O ataque retratou duas\nacusacoes da rodada 1 — o ponto unico de falha caiu, porque EV-1138-13 e canonico,\ne a circularidade virou indeterminacao de referente, porque EV-1138-04 e\nidentidade lexical real. Mas trouxe um problema maior que os dois.\n\n**O enunciado nao descreve o que a evidencia mostra.** Ele afirma que *chegar la*\ncom a pessoa certa executa a virada. EV-1174-01, o unico caso em que uma profecia\nse cumpre em cena, registra co-presenca de pessoas **fora de Laugh Tale**, sem\nchegada e sem o One Piece. EV-1138-13 confirma pelo verbo: o desfecho e\nreencontrar-se, nao chegar. E o bloco da Ilha dos Homens-Peixe, extraido hoje,\nfecha o cerco — EV-0649-04 espera uma pessoa que cumpra em lugar de Joy Boy, e\nEV-0626-01 poe o gatilho em alguem *aparecer diante* de outra pessoa.\n\nNao reescrevi o enunciado. Reescrever em torno de co-presenca expulsa Laugh Tale\ndo mecanismo e transforma H-08 em outra hipotese — provavelmente uma que se\nsobrepoe a H-05 e a H-10. O caminho honesto e deflacionar e deixar a tensao\nvisivel para a proxima rodada decidir.\n\n## Nota de curadoria\n\nPrior 0.13 -&gt; 0.09, o maior corte desta rodada. A parte 'evento agendado' da\nhipotese esta mais forte do que nunca; a parte 'chegar la' e que nao tem evidencia\n— e ela e a unica coisa que faz de H-08 uma resposta sobre o One Piece em vez de\numa tese sobre a profecia.", "redteam": "# H-08 — Red Team\n\n## Ataque 2026-08-11\n\n### Contra-evidência encontrada\n\n- EV-0301-01 — Diz-se que ao chegar a Laugh Tale o Rio Poneglyph só será finalmente revelado se a pessoa levou consigo as passagens dos Poneglyphs recolhidas na viagem. A condição de acesso canônica é o que o visitante trouxe lido, e o que a ilha entrega é um Poneglyph. Isso fere frontalmente a previsão (1), que exige que a virada ocorra \"sem depender de leitura prévia\", e fere o enunciado, que dispensa \"o que esteja escrito\".\n- EV-0818-01 — Os quatro Road Poneglyphs, lidos em conjunto, revelam quatro pontos cujo cruzamento indica a localização de Laugh Tale. Chegar já é, por construção, um ato de leitura de quatro textos distribuídos: uma hipótese que declara o resultado independente do que está escrito precisa da escrita para que a chegada sequer aconteça. A independência alegada é incoerente com o mecanismo de acesso.\n- EV-0972-02 — Os Piratas de Roger leram a mensagem em Laugh Tale, aprenderam a verdadeira história e decidiram deixar tudo como estava ao perceber que tinham chegado cedo demais. É a única chegada a Laugh Tale que a obra mostrou, e ela não disparou evento global algum: o gatilho postulado falhou no seu único teste observado. A hipótese só sobrevive a esse fato invocando a cláusula \"a pessoa certa\", que não foi derivada de átomo nenhum — foi acrescentada para absorver a falha.\n- EV-1190-03 — Gaban diz a Imu que conhece as palavras de Joy Boy, mas que não tem intenção de seguir as palavras de um homem que não conheceu, porque sua motivação é realizar o sonho do seu capitão. O que a tripulação trouxe de Laugh Tale são palavras que podem ser seguidas ou recusadas. Se a chegada executasse a virada independentemente do que está escrito, a recusa de Gaban seria irrelevante — e a obra a trata como decisão de peso.\n- EV-1190-02 — Imu admite que Luffy é mesmo quem esperavam e diz que foi tolo por ter confundido várias coincidências com destino. A obra desqualifica explicitamente, pela boca do personagem mais bem informado sobre o Século Vazio, a leitura de agendamento: coincidências não são destino. H-08 é precisamente uma leitura de destino agendado.\n- EV-1188-01 — Imu diz a Luffy que ele não é Joy Boy, porque Joy Boy era muito mais forte do que Luffy é agora. A \"pessoa certa\" da hipótese não tem critério objetivo no repositório; o único personagem que emite juízo sobre isso nega a identificação, e depois a concede (EV-1190-02) por motivo alheio a qualquer agenda.\n- EV-1113-02 — Vegapunk anuncia ao mundo que o nível do mar vai subir e que o mundo enfrentará um afundamento global. A previsão (2) de H-08 — mudança geográfica global no desfecho — já está garantida por um processo anunciado dentro da obra que nada tem a ver com chegar a Laugh Tale. Previsão que se cumpre igualmente se a hipótese for falsa é decorativa; exijo substituição.\n- EV-1115-01 — Vegapunk conclui que o uso das armas ancestrais elevou o nível do mar em 200 metros e que as ilhas de hoje são os topos dos continentes submersos. A mudança geográfica global já tem causa evidenciada e datada: as armas ancestrais. H-08 não precisa ser verdadeira para que o mundo mude de forma, o que confirma o caráter decorativo da previsão (2).\n- EV-1138-01 — O mural esculpido na casca fossilizada da Árvore Adam em Elbaf parece representar visualmente o texto do Harley, mas o átomo é `ambiguo` e a própria leiga que apresenta o mural relata a teoria corrente de que teria sido esculpido por crianças fantasiando. A corroboração visual da profecia é autodeclarada frágil pela obra.\n- EV-1175-01 — Uma das lendas de Elbaf descreve Nika como inimigo do Deus Guerreiro do país, e parte da juventude o teme como Deus da Destruição; a obra diz que a leitura depende de quem conta a história. O \"deus do sol que dança e ri\" do Harley não tem sequer sinal fixo dentro de Elbaf — pode ser libertador ou destruidor conforme o narrador.\n- EV-1138-03 — o ponto único de falha (ver abaixo).\n\n**Cadeia frágil — ponto único de falha.** O único átomo `traducao_disputada` de todo o\nrepositório (76 átomos) é exatamente o que carrega o conteúdo do Terceiro Mundo:\nEV-1138-03, \"o deus do sol dança e ri guiando o mundo ao seu fim, o sol retorna trazendo\numa nova manhã, e diz-se que dessa vez eles certamente se encontrarão\". A nota do próprio\nátomo registra que o tradutor oficial da VIZ afirmou publicamente que o texto poético admite\nmúltiplas traduções e que a VIZ trocou termos entre a edição semanal e a encadernada.\n\nToda a força de H-08 mora em três palavras desse verso: \"dessa vez\" (agendamento),\n\"certamente\" (necessidade) e \"se encontrarão\" (o evento a ser executado). Nenhuma das três\nsobrevive a uma tradução alternativa: sem \"dessa vez\" não há agenda, sem \"certamente\" não há\ngatilho, e sem \"se encontrarão\" não há virada a executar. Retire EV-1138-03 e o que resta do\nHarley no repositório é EV-1136-01 (a história dividida em três Mundos, o Segundo sendo o\nSéculo Vazio) e EV-1172-01 (Jarul afirma que a profecia *sugere* que o mundo será dividido em\ndois) — periodização e conjectura de um personagem, sem nenhum mecanismo. Note ainda que\n`tools/validate.py` emite aviso para peso acima de 0.4 em átomo `traducao_disputada`: a\nhipótese não pode nem declarar formalmente o quanto depende desse átomo sem acusar o\nproblema. Dos cinco átomos do Harley, um é disputado (EV-1138-03) e dois são ambíguos\n(EV-1138-01, EV-1138-02); a base canônica é só periodização.\n\n**Circularidade.** Sim, e é a falha decisiva. Nenhum dos cinco átomos do Harley menciona\nLaugh Tale, o One Piece ou uma chegada: EV-1136-01 e EV-1138-03 falam de Mundos e do deus do\nsol; EV-1172-01 tem Jarul lendo aí uma divisão do mundo em dois e declarando Elbaf inimiga do\nGoverno Mundial; EV-1138-01 e EV-1138-02 são leitura visual de semelhanças num mural\n`ambiguo`. A ponte entre \"Terceiro Mundo\" e \"chegar a Laugh Tale\" não existe em átomo nenhum\n— ela é fornecida pela própria hipótese. O verso não diz quem são \"eles\" que certamente se\nencontrarão; supor que sejam Luffy e o One Piece (ou Luffy e Joy Boy) é assumir a conclusão.\nA profecia só apoia H-08 depois que H-08 é assumida verdadeira, que é o modo de falha\nnúmero 6 do manual.\n\n### Veredito\n\nferida\n\nNão digo \"refutada\" por honestidade: nenhum átomo torna impossível que a chegada de alguém a\nLaugh Tale coincida com uma virada global. Mas H-08 sai deste ataque sem nenhuma previsão\nutilizável — a previsão (1) é incompatível com EV-0301-01 e EV-0818-01 na parte \"sem depender\nde leitura prévia\", e a previsão (2) é decorativa porque EV-1113-02 e EV-1115-01 já a\ngarantem por caminho independente. Pelo CLAUDE.md, hipótese sem previsão falseável não entra\nno repositório; H-08 precisa ser reescrita com duas previsões novas e arriscadas — algo do\ntipo \"o evento ocorrerá antes de qualquer leitura na ilha e será datado no mesmo capítulo da\nchegada\" — ou desce para dormente. Além disso, a única chegada já mostrada (EV-0972-02)\nfalhou em produzir o efeito, e a hipótese sobreviveu a isso por cláusula de escape, não por\nevidência.\n\n### Custo estrutural\n\n7 suposições não evidenciadas:\n\n1. Que o Terceiro Mundo do Harley se refira ao One Piece ou a Laugh Tale. Nenhum átomo do\n   Harley (EV-1136-01, EV-1138-03, EV-1172-01, EV-1138-01, EV-1138-02) nomeia a ilha ou o\n   tesouro. É a ponte que a hipótese inteira atravessa e ela não está construída.\n2. Que exista em Laugh Tale um mecanismo a ser executado pela chegada. Nenhum átomo descreve\n   dispositivo na ilha; EV-0301-01 promete um Poneglyph e EV-1190-03 descreve palavras.\n3. Que a chegada seja causa e não coincidência — precisamente o que EV-1190-02 desmonta.\n4. Que \"a pessoa certa\" seja critério objetivo, identificável antes do fato e satisfeito por\n   Luffy num sentido mecânico. EV-1188-01 e EV-1190-02 dão juízos opostos sobre isso e nenhum\n   dos dois é mecânico.\n5. Que o efeito seja simultâneo e visível fora da ilha. Nada no repositório sustenta a\n   simultaneidade nem a visibilidade remota; é exigência inventada para dar aparência de\n   risco à previsão (1).\n6. Que a agenda de 25 anos que Roger e Oden ouviram dos Reis do Mar (EV-0968-01) e a agenda do\n   Terceiro Mundo sejam a mesma agenda. São duas fontes independentes tratadas como uma.\n7. Que a profecia seja verídica enquanto profecia, e não folclore de Elbaf — contra\n   EV-1138-01 (crianças fantasiando) e EV-1175-01 (a leitura depende de quem conta) — e que\n   sua tradução seja estável, contra a nota do próprio EV-1138-03.\n\nCusto comparado: H-05 opera com zero suposições dessa lista, e H-03 com uma sozinha (a de\nnúmero 2), que ainda por cima tem precedente evidenciado.\n\n### Concorrente mais econômico\n\nH-03\n\nH-03 é H-08 menos a camada do Harley: também postula que o que há em Laugh Tale espera uma\ncondição que não existia na época de Roger, e explica o \"cedo demais\" (EV-0967-11) com o\nmesmo movimento. Mas paga por isso com evidência em vez de profecia — EV-1125-02 mostra que\nVegapunk nunca conseguiu replicar a energia antiga que move o robô Emet e que a máquina só\nvoltou à vida quando os Tambores da Libertação soaram, isto é, a obra já exibiu um\ndispositivo do Século Vazio cuja chave de ativação é um evento, não um comando. H-08 postula\no mesmo mecanismo sem precedente e ainda anexa uma profecia disputada e uma cláusula de\npessoa certa. Estritamente mais peças, nenhum poder explicativo adicional.\n\nMenciono H-05 como segundo concorrente: ela cobre melhor a parte \"a pessoa certa\" —\nEV-1121-01 tem Vegapunk dizendo que quem encontrar o One Piece pode não ser aquele que Joy\nBoy esperava, o que já dá destinatário pretendido sem precisar de agenda, gatilho ou Harley.\nEntre as duas, H-08 fica sem território próprio: o que ela explica bem, ou H-03 ou H-05\nexplica com menos.\n\n## Ataque 2026-08-11 (segunda rodada)\n\nEscopo deste bloco: a versão reescrita depois do primeiro ataque. Começo retirando duas\nacusações minhas que a reescrita respondeu — red team que não retrata nada não está\nlendo, está batendo. Em troca, apresento uma acusação nova que é mais grave que as duas\nretiradas juntas, porque atinge o enunciado e não os apoios.\n\n**Retratação 1 — o ponto único de falha em EV-1138-03 caiu.** Eu disse que todo o conteúdo\ndo Terceiro Mundo dependia de um átomo `traducao_disputada`. EV-1138-13 é `canonico` e\ncarrega a mesma estrutura: os dois primeiros Mundos terminam com a fórmula de que eles não\npuderam se reencontrar, e o Terceiro termina dizendo que dessa vez eles certamente\nconseguirão se reencontrar. \"Dessa vez\" e \"certamente\" já não são reféns do tradutor.\n\n**Retratação 2 — a circularidade sobre o termo cai para indeterminação.** EV-1138-04\nregistra que o dia esperado é escrito com o termo Dia da Promessa, o mesmo termo que a obra\nusa para o dia em que Noah cumprirá seu propósito, e a identidade lexical é verificável no\njaponês. O termo não é invenção da hipótese. Mas ver abaixo o que ele custa.\n\n### Contra-evidência encontrada\n\n- EV-1138-13 — o mesmo átomo que resgata H-08 a sentencia. O verbo do desfecho é\n  **reencontrar-se**, e reencontro é uma relação entre partes, não um deslocamento até uma\n  coordenada: pode-se chegar sem reencontrar e reencontrar sem chegar. O enunciado de H-08\n  usa \"chegar lá\" como operador; o texto que ela cita usa \"se reencontrarão\". E a mesma\n  frase carimba a lacuna que permanece — sem que o texto identifique quem são —, de modo\n  que quem são \"eles\" continua sendo escolha da hipótese.\n- EV-1174-01 — *importado como apoio; é a peça central deste ataque.* Jarul recita que num\n  dia de nevasca e trovão uma besta colossal cobrirá os céus e, junto com os Tambores da\n  Libertação, o Deus do Sol aparecerá — e a cena cumpre a descrição enquanto ele fala. O que\n  se cumpriu foi uma **conjunção de condições e presenças simultâneas**: um dia com certo\n  clima, uma besta colossal, os Tambores da Libertação, o Deus do Sol aparecendo. Nenhum\n  átomo descreve esse cumprimento como consequência de alguém ter chegado a algum lugar\n  levando alguma coisa, e ele ocorre onde Laugh Tale não está e sem o One Piece. Se este é o\n  modelo de gatilho que a obra exibe, o gatilho é co-presença — e \"chegar lá com a pessoa\n  certa\" troca o operador de encontro por operador de trajeto e realoca o evento para Laugh\n  Tale, duas trocas que nenhum átomo autoriza. Pior: o corpo do átomo avisa que o capítulo\n  não diz que essa passagem está no Harley, e atribuí-la ao livro é leitura de terceiro.\n  O único cumprimento em cena não pode nem ser creditado ao Harley, que é o texto que o\n  enunciado nomeia.\n- EV-1043-01 — inconsciente, o batimento cardíaco de Luffy adquiriu as qualidades dos\n  Tambores da Libertação, e Zunesha declarou que Joy Boy tinha retornado. Segunda ocorrência\n  do mesmo padrão: um efeito de escala disparado pelo estado de uma pessoa, sem chegada a\n  lugar nenhum.\n- EV-1125-02 — Vegapunk nunca conseguiu replicar a energia antiga que move o robô Emet, e a\n  máquina só voltou à vida quando os Tambores da Libertação soaram: a chave de ativação é um\n  evento, não um comando. Terceira ocorrência, e a mais explícita. Os três átomos que a obra\n  oferece sobre ativação convergem no mesmo som e nenhum deles requer que alguém chegue a\n  algum lugar. H-08 é a única hipótese que insiste em pôr a chegada no lugar do evento.\n- EV-1138-04 — o resgate cobra caro. Concedida a identidade lexical com o dia em que Noah\n  cumprirá seu propósito, H-08 herda o referente junto com o termo: em EV-0648-01 os Reis do\n  Mar levaram Noah até a Sea Forest esperando consertá-la antes que chegue o tempo prometido,\n  e em EV-0649-01 Joy Boy pediu desculpas por não ter cumprido sua parte da promessa feita à\n  Ilha dos Homens-Peixe. O evento agendado que o termo ancora tem maquinaria descrita,\n  executores nomeados (EV-0647-01, EV-0649-02) e endereço — e o endereço não é Laugh Tale.\n  A identidade que tira H-08 da circularidade a tira também do seu assunto.\n- EV-1164-02 — Rocks pergunta a Imu se ele teme mais Davy Jones ou Joy Boy, e sugere que Imu\n  vive aterrorizado com a possibilidade de alguém herdar a vontade de Jones e cumprir a\n  promessa de que ele falava; o corpo do átomo registra que essa é uma promessa antiga\n  distinta da promessa feita à Ilha dos Homens-Peixe. O repositório sustenta pelo menos duas\n  promessas. Identidade de termo não fixa referente: saber que o Harley escreve Dia da\n  Promessa não diz de qual promessa se trata, e H-08 precisa que seja uma terceira, a dela,\n  que nenhum átomo enuncia.\n- EV-1138-05 — o mesmo verso do Terceiro Mundo diz ouvir as vozes da lua crescente, e ouvir\n  vozes é a expressão com que Roger descreve ler os Poneglyphs. O enunciado declara o\n  desfecho independente \"do que esteja escrito ou guardado\" citando um texto cuja instrução\n  final é ler. A incoerência agora é interna à fonte: H-08 usa o Harley para o calendário e\n  descarta o Harley na cláusula. EV-0301-01 e EV-0818-01, do primeiro ataque, seguem valendo\n  pelo lado do acesso e não são reargumentados aqui.\n- EV-0968-02 — ao saber que tinham chegado cedo demais, Roger planejou gerar um filho que\n  encontrasse o One Piece depois dele. A resposta do único homem que esteve lá e diagnosticou\n  o \"cedo demais\" foi produzir uma pessoa: não armar mecanismo, não marcar data, não deixar\n  instrução de disparo. Se houvesse dispositivo agendado esperando a pessoa certa, era ali\n  que a condição seria enunciada.\n- EV-0967-11 e EV-0968-03 — a tripulação de Roger gargalha ao encontrar o tesouro e Roger\n  comenta que chegaram cedo demais; ao completar o feito, Roger dá uma grande festa trocando\n  bebidas com todos. É o que a obra registra como consequência imediata de chegar ao fim da\n  rota. A previsão (1) exige evento global visível fora de Laugh Tale no mesmo capítulo da\n  chegada; no único capítulo de chegada que existe, o que ficou visível foi uma festa.\n- EV-1190-05 — Gaban afirma que Luffy é o homem que sua geração inteira esperava e nomeia\n  Rayleigh, Crocus, Shanks, Oden e Barba Branca como os que esperavam. A espera é real, mas\n  é juízo compartilhado por cinco figuras de gerações diferentes e nenhuma delas enuncia\n  critério. Com EV-1190-02 — Imu admite que Luffy é mesmo quem esperavam e diz que foi tolo\n  por ter confundido várias coincidências com destino — a obra concede o reconhecimento e\n  nega o mecanismo na mesma cena. \"A pessoa certa\" continua sem definição operável, e\n  EV-1188-01 registra o juízo oposto do mesmo personagem.\n- EV-1164-03 — depois que Imu transformou Xebec em demônio em God Valley, Eris comentou que\n  ainda era cedo demais. A expressão circula entre personagens sem vínculo com Laugh Tale,\n  com chegada ou com tesouro. H-08 a lê como sinal de agenda; o átomo mostra que é vocabulário\n  comum de quem observa que falta gente ou falta tempo.\n\n**Átomos que entraram no repositório durante este ataque.** O extrator despejou a Ilha dos\nHomens-Peixe (621–653) enquanto eu escrevia. Esse bloco é quase todo sobre o Dia da Promessa,\ne é o pior lugar possível para H-08 receber evidência nova, porque ele **especifica por\ncompleto o evento agendado da obra — e o especifica em outro endereço**.\n\n- EV-0641-02 — em flashback, Neptune explica que Noah não é um navio velho qualquer: séculos\n  atrás foi feita uma promessa a um grande homem de manter o navio no fundo do mar e esperar,\n  protegendo-o até que aquele dia chegue. Promessa, custódia, espera e um dia que há de\n  chegar: a estrutura inteira que H-08 postula para Laugh Tale já existe montada, com\n  personagens, em outro lugar.\n- EV-0649-03 — Neptune diz que a parte da Ilha dos Homens-Peixe na promessa era vigiar Noah\n  e mantê-la em segurança, e que só quando chegar o tempo prometido o propósito do navio será\n  conhecido. O agendamento tem partes contratantes e uma cláusula de revelação diferida. Nada\n  disso está em Laugh Tale.\n- EV-0649-04 — Neptune afirma que não conhece os detalhes da promessa e que sabe apenas, por\n  lenda transmitida na família real, que **um dia alguém viria cumprir em lugar de Joy Boy o\n  que ele prometeu**. Este é o átomo mais caro para H-08 de toda a rodada. A obra tem uma\n  fórmula canônica para \"a pessoa certa chega e o agendado acontece\" — e nessa fórmula o que\n  a pessoa faz é **cumprir uma promessa em lugar de outro**, não acionar um gatilho ao pisar\n  numa ilha. Cumprir em lugar de alguém é ato de vontade dirigido por um pedido: é H-05\n  escrita com todas as letras dentro do próprio vocabulário do agendamento que H-08 invoca.\n- EV-0636-01 e EV-0636-02 — ao ver Noah se mover, Neptune entra em pânico e afirma que\n  ninguém pode mover o navio e que até o dia que tem de vir ele não pode ser movido de forma\n  alguma; e Noah é também chamada de Navio da Promessa. Se o Dia da Promessa do Harley é o\n  mesmo termo (EV-1138-04), então o objeto que o dia governa é este navio, cuja regra é\n  ficar parado até a data. H-08 herdou um calendário que manda **esperar**, não chegar.\n- EV-0626-01 — Otohime conta aos filhos que a profecia diz que um dia alguém aparecerá\n  diante da princesa sereia para guiá-la e ensiná-la a usar seu poder para o bem, trazendo\n  uma mudança imensa ao mundo. Uma profecia canônica, com evento de escala mundial, cujo\n  gatilho é literalmente **alguém aparecer diante de outra pessoa**. É a confirmação\n  independente da leitura de co-presença: quando a obra escreve um gatilho profético, ela o\n  escreve como encontro entre duas pessoas, e o encontro não acontece em Laugh Tale.\n- EV-0648-02 — os Reis do Mar dizem a Shirahoshi que há muito tempo estavam esperando por\n  ela. Terceira formulação da espera, e outra vez o objeto esperado é uma pessoa que aparece,\n  não uma ilha que se alcança.\n- EV-0648-06 — um dos Reis do Mar percebe que Luffy ouviu a conversa deles, e o grupo lembra\n  que outro humano, Gol D. Roger, também ouvia suas vozes. Corta os dois lados e H-08 precisa\n  saber disso: dá referente canônico e literal a \"ouvir vozes\" — ouvir Reis do Mar — o que\n  enfraquece a leitura de EV-1138-05 como \"ler poneglyph\"; mas o que sobra é pior para H-08,\n  porque a capacidade que o átomo distribui entre Roger e Luffy continua sendo **ouvir**, e\n  o enunciado segue declarando o desfecho independente do que está escrito ou guardado\n  enquanto o verso que ele cita manda ouvir.\n- EV-0649-07 e EV-0628-01 — a mensagem deixada por Joy Boy era endereçada à princesa sereia\n  que vivia na ilha naquela época, e Robin observa que o poneglyph da Sea Forest é diferente\n  de todos os que já lera: em vez de registro histórico tem forma de carta de desculpas. O\n  que Joy Boy deixa, nas duas amostras que a obra exibe, é correspondência com destinatário.\n  A cláusula \"independentemente do que esteja escrito ou guardado\" pede que se ignore\n  justamente o tipo de objeto que ele comprovadamente deixa.\n\n### Veredito\n\nferida\n\nFerida no enunciado, que é pior do que ferida nos apoios. Duas acusações da primeira rodada\ncaíram, e mesmo assim a hipótese sai daqui em pior estado, porque o ataque agora não é\n\"seus átomos são fracos\", é \"seu verbo principal não é o verbo da evidência\".\n\n**Resposta direta à pergunta do encargo: não, o enunciado não descreve o que a evidência\nmostra.** Duas rotas independentes dão o mesmo veredito. (i) O enunciado *canônico* da\nprofecia, EV-1138-13, diz que eles conseguirão se reencontrar — um encontro entre partes.\n(ii) O único cumprimento em cena, EV-1174-01, é a coincidência simultânea de um dia, uma\nbesta colossal, os Tambores da Libertação e o Deus do Sol aparecendo, num lugar que não é\nLaugh Tale, sem chegada descrita e sem o One Piece. O operador da evidência é *encontrar-se*;\no operador do enunciado é *chegar lá*. Não são paráfrases: a hipótese fixa um lugar onde a\nevidência fixa uma companhia.\n\nUma terceira rota chegou durante o ataque e diz o mesmo com mais força: EV-0626-01, uma\nprofecia `canonico` de mudança imensa ao mundo cujo gatilho é alguém **aparecer diante** da\nprincesa sereia, e EV-0649-04, em que o cumprimento do agendado é alguém vir **cumprir em\nlugar de Joy Boy** o que ele prometeu. Nas três vezes em que a obra descreve o disparo de um\nevento agendado — Elbaf, Ilha dos Homens-Peixe, Sea Forest — o disparo é uma pessoa diante de\noutra ou uma promessa sendo cumprida por um substituto. Nenhuma vez é uma coordenada\nalcançada. H-08 é a única hipótese do repositório que escreve o gatilho como deslocamento, e\nela o faz sem átomo.\n\nE o conserto tem preço, o que o Curador precisa saber antes de autorizá-lo. Reescrever H-08\nem torno de co-presença expulsa \"chegar lá\" e Laugh Tale do mecanismo — e com eles a razão de\nH-08 estar no escopo `one_piece`, já que a hipótese deixa de dizer o que o One Piece é. A\nversão consertada passa a disputar terreno com H-10 (a fruta seleciona quem a come) e com\nH-09 (a promessa que Imu teme), onde já há hipótese instalada e mais barata. A alternativa é\nmanter \"chegar lá\" e perder o único precedente em cena que a hipótese tem. Não há reescrita\nque fique com os dois.\n\n**Falseabilidade — previsão (1): boa, e eu registro isso.** \"Evento global visível fora de\nLaugh Tale no mesmo capítulo da chegada\" é a cláusula mais arriscada e mais datável de\nqualquer hipótese `one_piece` do repositório, e responde bem à crítica anterior, que era\nsobre a cláusula \"sem depender de leitura prévia\" — retirada com acerto diante de EV-0301-01\ne EV-0818-01. Deixo um aviso preventivo em vez de uma objeção: essa previsão só pode ser\ntestada uma vez, e a hipótese já demonstrou o hábito de absorver falha por cláusula quando\nEV-0972-02 falsificou o gatilho no seu único teste observado. Fica registrado agora, com\ndata, que \"o evento ocorreu fora de quadro\" não é reparo aceitável.\n\n**Falseabilidade — previsão (2): decorativa, e de um jeito novo.** Ela testa um *termo*, não\num mecanismo. O conteúdo de H-08 é causal — a chegada executa a virada — e a previsão\nverifica se uma palavra aparece perto de outro assunto. Três problemas somados: (a) \"promessa\"\né o substantivo mais distribuído do repositório (EV-0648-01, EV-0649-01, EV-1164-02,\nEV-1138-04), e H-05 e H-09 cobrariam esse cheque tão bem quanto H-08 — H-05 fala literalmente\ndas condições de uma promessa; (b) a condição de cena, \"que trate do One Piece ou de Laugh\nTale\", é largníssima, já que EV-0002-01 liga o título de Rei dos Piratas ao tesouro e\nEV-0105-01 faz de Laugh Tale a ilha que supostamente o guarda — quase todo capítulo final\nqualifica; (c) previsão cujo critério de sucesso é um termo fica refém da escolha do\ntradutor, que é o modo de falha que este repositório documenta como o mais barato de todos\n(EV-0001-02, EV-0488-01). **Substituição exigida**, testando o mecanismo e não o vocabulário:\n\"o Dia da Promessa será datado ou contado em cena — um prazo, uma contagem, um marco — e essa\ndata não dependerá de ninguém ter chegado a Laugh Tale\". Se a obra der a data e ela for\ndisparada por chegada, H-08 ganha; se der a data ancorada em outra coisa, H-08 morre.\n\n### Custo estrutural\n\n8 suposições não evidenciadas (eram 7 na primeira rodada; duas saíram, três entraram):\n\n1. **Que a virada do Terceiro Mundo passe por Laugh Tale ou pelo One Piece.** Segue sem\n   ponte, e agora com duas setas apontando para fora: EV-1138-04 leva a promessa para Noah e\n   EV-1174-01 põe o cumprimento em Elbaf. Nenhum dos átomos do Harley — EV-1136-01,\n   EV-1138-13, EV-1138-05 — nomeia a ilha ou o tesouro.\n2. **Que o operador seja chegada e não reencontro** — contra EV-1138-13 e EV-1174-01.\n   *Suposição nova, e a mais cara das oito.*\n3. **Que exista em Laugh Tale um mecanismo a ser executado pela chegada.** Nenhum átomo\n   descreve dispositivo na ilha; EV-0301-01 promete um Poneglyph e EV-1190-03 descreve\n   palavras.\n4. **Que \"a pessoa certa\" seja critério objetivo e identificável antes do fato** —\n   EV-1190-02, EV-1190-05 e EV-1188-01 dão reconhecimento sem critério, ou critério negado.\n5. **Que a promessa do Dia da Promessa seja a de H-08** e não a de Noah nem a de Davy\n   Jones (EV-1164-02). *Suposição nova, herdada do próprio resgate, e a que mais encareceu\n   durante o ataque:* a promessa de Noah passou de dois átomos a um dossiê com partes\n   contratantes (EV-0649-03), custódia e prazo (EV-0641-02), regra de imobilidade até a data\n   (EV-0636-01), nome do objeto (EV-0636-02) e fórmula de cumprimento por substituto\n   (EV-0649-04). H-08 precisa que o Harley esteja falando de uma promessa **diferente** de\n   uma que a obra agora especifica quase inteira, e não tem átomo para essa diferença.\n6. **Que o efeito seja simultâneo e visível fora da ilha.** Nada sustenta simultaneidade nem\n   visibilidade remota; a previsão (1) a inventa — que é justamente o que a torna arriscada,\n   e por isso eu a mantenho, mas o custo é da hipótese.\n7. **Que a passagem cumprida em EV-1174-01 pertença ao Harley** — o corpo do átomo diz que o\n   capítulo não afirma isso. *Suposição nova.*\n8. **Que a virada seja independente do que está escrito** — contra o próprio verso em\n   EV-1138-05 e contra a condição de acesso em EV-0301-01.\n\nSaíram da lista: a suposição de que a tradução do Harley fosse estável (retirada por\nEV-1138-13, `canonico`) e a de fusão entre a agenda de 25 anos de EV-0968-01 e a do Terceiro\nMundo, que a reescrita não usa mais.\n\n### Concorrente mais econômico\n\nH-05\n\nMudo a indicação: na primeira rodada nomeei H-03, porque o ponto fraco de H-08 era o\nmecanismo. O ponto fraco agora é o operador, e no operador H-05 é mais barata. Ela lê \"eles\nnão puderam se reencontrar\" com um átomo `canonico` que já está no repositório e não precisa\nde profecia nenhuma: EV-0972-01, em que Roger, ao aprender a verdadeira história, riu e\ndeclarou que gostaria de ter vivido na mesma época que Joy Boy. É literalmente o reencontro\nque não aconteceu, dito pelo homem que leu o texto. H-05 também absorve o Dia da Promessa via\nEV-0649-01 — a promessa que Joy Boy não cumpriu — e explica EV-1190-03, onde Gaban conhece as\npalavras de Joy Boy e recusa segui-las, coisa que só faz sentido diante de um pedido dirigido.\nE paga zero pelas suposições 1, 2, 5, 6 e 7 acima.\n\nOs átomos que chegaram durante o ataque acabaram de entregar a H-05 a peça que faltava:\nEV-0649-04 põe na boca de Neptune, como lenda transmitida na família real, que um dia alguém\nviria cumprir em lugar de Joy Boy o que ele prometeu. É o desfecho de H-08 — a pessoa certa,\na data que chega, a virada — escrito inteiro no vocabulário de H-05, sem gatilho, sem\nchegada e sem Harley. Quando a hipótese concorrente formula sua tese usando as palavras que\na obra escolheu e a nossa precisa traduzi-las, a nossa é a cara.\n\nH-03 continua em segundo, com o mesmo argumento da primeira rodada: mantém a leitura de\nmecanismo e tem precedente evidenciado em EV-1125-02. Entre as duas, H-08 segue sem\nterritório próprio — e o achado desta rodada é que o pouco de território que ela tinha,\no gatilho por evento, é justamente o que EV-1043-01 e EV-1125-02 entregam a H-03 sem\ncobrar chegada.\n", "posterior": 0.6903266039764965, "fatia": 0.21986989378663}, {"id": "H-11", "enunciado": "O One Piece e um objeto fisico comum e sem poder proprio, e seu valor esta no ato de partilha-lo: quem o encontra reune o mundo ao distribui-lo, nao ao possui-lo.", "escopo": "one_piece", "status": "viva", "prior": 0.08, "apoia": [{"ev": "EV-0968-03", "peso": 0.4, "como": "Ao completar o feito Roger da uma grande festa com a tripulacao, trocando bebidas com todos: a reacao registrada de quem chegou ao fim da rota foi partilhar, nao guardar."}, {"ev": "EV-1000-01", "peso": 0.4, "como": "O titulo do capitulo 1000 e o sake que preparei enquanto esperava por voce, Luffy Chapeu de Palha: a obra nomeia um objeto comum preparado e guardado para ser oferecido a alguem que chegaria."}, {"ev": "EV-0585-01", "peso": 0.35, "como": "Diante de Ace e Sabo, Luffy declara o objetivo que esta no fim do seu sonho, o quadro corta antes da fala e os tres trocam tacas de sake: o gesto que a obra mostra no lugar da fala e a partilha."}, {"ev": "EV-0967-04", "peso": 0.3, "como": "A cancao Binks' Sake toca ao longo de todo o capitulo em que a tripulacao de Roger chega a Laugh Tale, ligando o achado a uma cancao de bebida partilhada."}, {"ev": "EV-1121-01", "peso": 0.25, "como": "Vegapunk afirma que o destino do mundo sera decidido por quem reivindicar o One Piece e que quem o encontrar pode nao ser aquele que Joy Boy esperava: e o uso que se faz da coisa, e nao a coisa, que decide."}, {"ev": "EV-1138-03", "peso": 0.3, "como": "No texto do Terceiro Mundo do Harley o deus do sol danca e ri, o sol retorna trazendo uma nova manha e diz-se que dessa vez eles certamente se encontrarao: o desfecho profetizado e um encontro, que e o que uma partilha produz."}, {"ev": "EV-1138-11", "peso": 0.35, "como": "No painel do Terceiro Mundo a figura demoniaca segura o Sol enquanto todos os demais tentam liberta-lo: o objetivo desenhado da coalizao nao e tomar posse de nada, e devolver ao mundo algo que estava retido."}, {"ev": "EV-1138-14", "peso": 0.35, "como": "Ripley considera o mural um sonho de crianca precisamente porque ele mostra varias racas diferentes trabalhando juntas, algo de que os gigantes nao tem registro: a reuniao entre povos e tratada dentro da obra como o que ha de mais improvavel."}, {"ev": "EV-1138-09", "peso": 0.25, "como": "Todas as figuras do painel do Primeiro Mundo sao humanas, sem nenhuma outra raca, ao contrario do Terceiro Mundo: o proprio mural narra a passagem da segregacao para a reuniao."}, {"ev": "EV-0626-02", "peso": 0.2, "como": "Otohime diz que o mesmo poder da princesa sereia, se usado com intencao sinistra, pode causar grande destruicao: e o uso e a intencao de quem tem a coisa que decidem o efeito, e nao a coisa."}], "contradiz": [{"ev": "EV-0972-02", "peso": 0.35, "como": "Os Piratas de Roger leram a mensagem e decidiram deixar tudo como estava por terem chegado cedo demais: se bastasse partilhar o objeto, nada impedia que o levassem e o partilhassem 25 anos depois."}, {"ev": "EV-0576-01", "peso": 0.25, "como": "Barba Branca declarou que achar o One Piece desencadeara uma guerra indizivel que engolfara o mundo inteiro, efeito dificil de derivar da distribuicao de um objeto comum."}, {"ev": "EV-0966-01", "peso": 0.2, "como": "Roger especulou que o Governo Mundial proibe a pesquisa dos Poneglyphs para que ninguem chegue a Laugh Tale e encontre o que esta escondido la: nao se sustenta uma politica de estado de 800 anos contra um objeto sem poder."}], "prediz": [{"texto": "Se verdadeiro, o One Piece sera mostrado sendo distribuido ou consumido, e nao guardado, exibido nem instalado em algum lugar.", "status": "aberta"}, {"texto": "Se verdadeiro, o One Piece mudara de maos ou sera repartido entre pessoas de mais de uma raca ou faccao no mesmo arco em que for encontrado, sem que nenhuma leitura de Poneglyph seja necessaria para isso.", "status": "aberta"}], "concorrentes": ["H-01", "H-02", "H-03", "H-04", "H-05", "H-06", "H-07", "H-08", "H-12", "H-13"], "corpo": "## Por que esta hipotese existe\n\nEla nao veio da nossa base: veio de fora, de um teorico que sustenta ha anos que\no tesouro e sake deixado por Joy Boy. Formulei-a em termos mais gerais do que ele\nusa — objeto comum, valor no ato de partilhar — porque a substancia especifica e\na parte mais fraca do argumento dele e a parte mais forte e o padrao.\n\nEla e a resposta ao teste de exaustividade: as fatias do repositorio assumem que\na resposta certa esta entre as hipoteses listadas, e esta nao estava. Nao e H-01\n(o valor nao e a riqueza), nao e H-02 (o objeto e indispensavel, e o efeito vem\ndo uso e nao do anuncio), nao e H-05 (nao sao palavras).\n\n## O caso a favor\n\nO gesto que a obra repete na cena do achado nao e tomar posse: Roger ri e da uma\nfesta. E o capitulo 1000 nomeia literalmente um objeto preparado e guardado a\nespera de alguem.\n\n## O que a mataria\n\nUma revelacao em que o One Piece exija leitura, ativacao ou habilidade — ou seja,\nquase qualquer coisa que confirme H-03, H-04 ou H-05.\n\n## Nota de curadoria\n\nPrior 0.10, o terceiro maior entre as vivas apesar de recem-criada, porque ela\nexplica de graca as duas coisas que as concorrentes explicam com esforco: o riso\ne a decisao de nao levar nada. Ainda nao passou pelo Red Team.\n\n## Revisao de 2026-08-11 (Red Team)\n\nVeredito: ferida. Seis suposicoes nao evidenciadas. Sobrevive por um motivo\ndesconfortavel — nenhum atomo mostra a cena de Laugh Tale, entao nada pode\nfalsifica-la hoje. Tres golpes, os tres aceitos:\n\n1. **Nao e distinta o bastante.** O objeto e declarado inerte por estipulacao e\n   nao entra em nenhuma previsao. A unica cena candidata (EV-0968-03, a festa de\n   Roger) e igualmente compativel com H-02 e H-05. O ataque registra que H-02\n   domina H-11 por parcimonia: mesma cobertura, duas pecas a menos.\n2. **A previsao (2) era decorativa nas duas metades.** 'Caber numa frase' e\n   propriedade da descricao, nao do objeto; 'nenhuma habilidade especial para\n   usa-lo' e vacuo porque o enunciado ja declara o objeto sem poder. Substituida\n   por uma previsao com pessoas, racas e prazo de arco.\n3. **O apoio distintivo e quase todo simbolico.** Cinco atomos de sake sustentam\n   praticamente sozinhos a hipotese, e tres deles carregam ressalva na propria\n   nota: EV-0585-01 (a fala foi cortada pelo quadro), EV-1000-01 (o falante nao e\n   nomeado) e EV-0488-01 (ambiguo). O repositorio ja errou exatamente assim uma\n   vez, em EV-0972-01.\n\n## Nota de curadoria\n\nPrior 0.10 -&gt; 0.08. Ela continua sendo a unica que explica o riso e a decisao de\nnao levar nada sem esforco, e foi a unica das tres importadas que sobreviveu — mas\no Red Team esta certo em que ela paga caro por pouca distincao.\n\n## Revisao de 2026-08-11 (rodada 5)\n\nO mural de Elbaf, lido a fundo, e a melhor evidencia que esta hipotese ja teve — e\nela nao veio de cena de sake, que era a fraqueza apontada pelo Red Team. O painel\ndo Terceiro Mundo desenha uma coalizao de racas cujo objetivo e soltar um sol que\nalguem retem, e o painel do Primeiro Mundo, so com humanos, monta o contraste.\n\nVale registrar o que isso NAO resolve: o mural nao mostra objeto algum sendo\npartilhado, e continua sem responder o que ha em Laugh Tale. A hipotese ganhou\nmotivo e nao ganhou objeto.", "redteam": "# Red team — H-11\n\n## Ataque 2026-08-11\n\n### Contra-evidência encontrada\n\n- EV-0576-01 — Barba Branca declarou que um dia o One Piece será encontrado e que\n  isso desencadeará uma guerra indizível que engolfará o mundo inteiro. É a\n  colisão frontal com a metade positiva do enunciado: a única declaração canônica\n  da obra sobre o efeito de encontrar o tesouro diz que ele engolfa o mundo em\n  guerra, não que reúne o mundo. H-11 precisa que \"encontrar\" produza partilha; o\n  átomo diz que produz guerra.\n\n- EV-1172-01 — Jarul afirma que a profecia do Harley sugere que o mundo será\n  dividido em dois, e com isso declara Elbaf inimiga do Governo Mundial. Segunda\n  previsão interna à obra sobre o desfecho, e também de divisão. Duas fontes\n  independentes dentro da obra apontam para cisão; nenhuma aponta para reunião.\n  \"Reúne o mundo\" é a peça do enunciado com pior lastro na base.\n\n- EV-1121-01 — Vegapunk afirma que o destino do mundo será decidido por quem\n  conseguir reivindicar o One Piece, e que quem o encontrar pode não ser aquele\n  que Joy Boy esperava. Fere duas vezes. Primeiro o verbo: reivindicar é o\n  vocabulário de posse que o enunciado nega (\"não ao possuí-lo\"). Segundo a\n  identidade: se importa quem encontra, e se o encontrador pode ser o errado, o\n  objeto não é indiferente a quem o toca — e um objeto comum e sem poder próprio,\n  usável por qualquer um, seria exatamente indiferente.\n\n- EV-0972-02 — Os Piratas de Roger leram a mensagem em Laugh Tale, aprenderam a\n  verdadeira história e decidiram deixar tudo como estava ao perceber que tinham\n  chegado cedo demais. Este é o átomo mais caro para H-11: é a única tripulação\n  que a obra registra tendo chegado ao fim da rota, e o que ela fez com o achado\n  foi o oposto exato da previsão (1) — não distribuiu, não consumiu, deixou como\n  estava. Se o valor estivesse no ato de partilhar, a tripulação mais numerosa e\n  mais capaz de partilhar da obra escolheu não realizar o valor, sem que nenhum\n  átomo diga por quê em termos de partilha.\n\n- EV-0506-01 — Roger usou suas palavras finais na execução pública para declarar\n  abertamente que o One Piece pertence a quem conseguir encontrá-lo. O verbo que\n  o próprio Roger escolheu, no ato que abriu a caçada, é pertencer: propriedade\n  do encontrador, singular. É o contrário da fórmula \"reúne o mundo ao\n  distribuí-lo, não ao possuí-lo\", e vem de quem tinha visto o objeto.\n\n- EV-0202-01 — Nico Robin é uma das pouquíssimas pessoas vivas capazes de ler a\n  língua antiga dos Poneglyphs. Ataca diretamente a previsão (2): a obra já\n  estabeleceu que o acesso ao fim da rota passa por uma habilidade que quase\n  ninguém vivo tem. Para salvar \"ninguém precisará de habilidade especial\", H-11\n  tem de separar chegar de usar — distinção que nenhum átomo faz.\n\n- EV-0301-01 — Diz-se que ao chegar a Laugh Tale, se a pessoa levou consigo as\n  passagens dos Poneglyphs recolhidas na viagem, o Rio Poneglyph será finalmente\n  revelado. O que espera na ilha tem condição de acesso: revela-se em função do\n  que o visitante trouxe. Objeto trivial não tem cláusula de desbloqueio.\n\n- EV-0818-01 — Os quatro Road Poneglyphs, lidos em conjunto, revelam quatro\n  pontos cujo cruzamento indica a localização de Laugh Tale. O acesso é\n  criptográfico e distribuído em quatro chaves. A obra investiu oitocentos anos\n  de arquitetura de acesso em cima de uma coisa que H-11 declara trivial o\n  bastante para caber numa frase e usável sem habilidade nenhuma.\n\n- EV-0966-01 — Roger especulou que o Governo Mundial proíbe a pesquisa dos\n  Poneglyphs justamente para que ninguém chegue a Laugh Tale e encontre o que\n  está escondido lá. O Governo bloqueia acesso a uma coisa escondida num lugar.\n  Uma coisa comum e sem poder próprio não justifica a política; H-11 precisa que\n  o Governo esteja bloqueando o ato de partilhar, e não a coisa — leitura que\n  nenhum átomo autoriza.\n\n- EV-1122-02 — Joy Boy selou parte do seu Haki do Conquistador dentro de Emet,\n  atado em nó, para ser liberado séculos depois se o robô estivesse em perigo\n  mortal. É o único registro que a base tem do que Joy Boy faz quando quer\n  alcançar o futuro: ele instala poder dentro de um objeto e agenda a liberação.\n  A previsão (1) proíbe exatamente \"instalado\". O comportamento documentado do\n  autor do legado é o comportamento que a hipótese declara impossível.\n\n### Veredito\n\nferida\n\nNão digo refutada, e explico por quê para não virar ruído: nenhum átomo mostra a\ncena de Laugh Tale, então nenhuma hipótese sobre o conteúdo pode ser falsificada\nhoje, e H-11 não é exceção. Mas ela sai deste ataque em pior estado que as\nconcorrentes vivas, por cinco motivos.\n\n1. **A metade positiva do enunciado colide com os dois únicos átomos que falam do\n   efeito.** \"Reúne o mundo\" enfrenta EV-0576-01 (guerra que engolfa o mundo) e\n   EV-1172-01 (mundo dividido em dois). H-11 tem de tratar as duas como hipérbole\n   de personagem sem nenhum átomo que as desminta. As demais hipóteses vivas\n   convivem com EV-0576-01; H-11 é a única que precisa que ela seja falsa.\n\n2. **A previsão (2) é decorativa nas duas metades — respondendo (b) do encargo.**\n   \"Trivial o bastante para caber numa frase\" não é propriedade do objeto, é\n   propriedade da descrição: qualquer objeto cabe numa frase. Pluton cabe numa\n   frase (EV-0344-01 é uma frase). O registro completo do Século Vazio cabe numa\n   frase. O Rio Poneglyph cabe numa frase. A cláusula não separa H-11 de nenhuma\n   concorrente porque é satisfeita por todas — inclusive por H-01, que já está\n   refutada. E \"ninguém precisará de habilidade especial para usá-lo\" é vácuo por\n   construção: o enunciado já declara o objeto sem poder próprio, e o que não tem\n   poder não tem uso a ser executado, logo não há habilidade que possa ser\n   exigida. A cláusula se cumpre pela definição do sujeito, não por um estado do\n   mundo. Somando: a previsão (2) não é arriscada, é quase impossível de\n   reprovar. **Exijo substituição.** Uma previsão que discriminaria de verdade:\n   \"mais de uma pessoa fora da tripulação que chega receberá materialmente o One\n   Piece na mesma cena da revelação, e a obra mostrará a transferência\" — isso\n   EV-0972-02 e EV-1121-01 podem reprovar, e H-02 e H-05 não preveem.\n\n3. **A previsão (1) é metade arriscada e metade retrodição.** A parte proibitiva\n   (\"não guardado, exibido nem instalado\") é honesta e é onde EV-1122-02 acerta.\n   Mas a parte positiva (\"distribuído ou consumido\") já está satisfeita pelo único\n   registro existente de alguém chegando ao fim da rota: EV-0968-03, em que Roger\n   ao completar o feito dá uma grande festa com a tripulação, trocando bebidas com\n   todos. Prever a repetição da única cena que a obra já mostrou é retrodição\n   vestida de previsão.\n\n4. **Circularidade no motor da hipótese.** \"O valor está no ato de partilhá-lo\" é\n   afirmação sobre valor, não sobre fato, e por isso absorve qualquer desfecho:\n   se o objeto for entregue, confirma; se for guardado, a hipótese pode dizer que\n   o valor não foi realizado ainda. É o modo de falha que o CLAUDE.md deste\n   repositório nomeia — teoria elástica que não pode estar errada — e H-11 o\n   herda de H-02 sem corrigi-lo.\n\n5. **Respondendo (c) do encargo: o apoio é padrão projetado, não evidência.** A\n   base inteira tem cinco átomos de sake ou bebida — EV-0585-01, EV-0967-04,\n   EV-0968-03, EV-1000-01 e EV-0488-01 — e é dali que qualquer caso a favor de\n   \"partilha\" tem de sair, porque não existe outro lugar. Os cinco falham como\n   apoio, cada um por um motivo diferente:\n   - **EV-0968-03** é o mais forte e ainda assim não serve: a festa é posterior\n     (\"ao completar o feito\"), é reação ao feito e não o feito, e as bebidas\n     circulam entre a tripulação, não entre o mundo. Reunir a própria tripulação\n     na festa depois de uma conquista não é o mecanismo do enunciado.\n   - **EV-0585-01** tem, na própria nota do átomo, o aviso de que o quadro corta\n     antes da fala: Luffy declara o objetivo no fim do sonho e a obra esconde o\n     conteúdo, mostrando apenas a reação de Ace e Sabo e as taças de sake. Ler as\n     taças como sendo sobre o One Piece exige assumir que a fala cortada era sobre\n     o One Piece — a hipótese preenchendo o vazio que ela deveria explicar.\n   - **EV-1000-01** é título de capítulo cujo falante a própria nota do átomo diz\n     não ser nomeado, com a leitura corrente atribuindo a Yamato pelo pronome. Usá-lo\n     como promessa de sake partilhado exige comprar uma atribuição que o átomo\n     registra como disputada.\n   - **EV-0967-04** é fato de trilha sonora: a canção Binks' Sake toca ao longo do\n     capítulo em que a tripulação de Roger chega a Laugh Tale. Que uma canção sobre\n     dividir bebida toque na cena não é afirmação sobre o que há na ilha.\n   - **EV-0488-01** é `ambiguo` e, mesmo aceito, liga Laugh Tale a *riso*\n     (warai-banashi), não a partilha. Convertê-lo em apoio a \"partilha\" é um\n     segundo salto além do que o átomo licencia.\n\n   Ou seja: a fração de apoio que vem de cena de sake lida simbolicamente é\n   essencialmente a totalidade do apoio distintivo — o resto de qualquer caso a\n   favor (riso, \"cedo demais\") é apoio compartilhado com H-02 e H-05 e não\n   discrimina. E este repositório já tem precedente documentado desta exata falha:\n   EV-0972-01 foi corrigido em 2026-08-11 porque a paráfrase \"hilária\" da wiki\n   estava sustentando peso em três hipóteses, e a nota de leitura do átomo avisa\n   que a distinção entre sorrir e gargalhar nas nossas traduções é artefato. A\n   mesma disciplina aplicada ao sake derruba o apoio de H-11.\n\n6. **Respondendo (a) do encargo: H-11 é H-02 com um objeto pendurado.** As duas\n   afirmam \"sem poder próprio\" quase nas mesmas palavras. H-02 diz que o valor é\n   relacional; H-11 diz que o valor está num ato relacional específico. O acréscimo\n   de H-11 é (i) o objeto físico e (ii) o nome da relação. Nenhum dos dois carrega\n   carga: o objeto é declarado inerte por estipulação, e objeto inerte não entra em\n   nenhuma previsão a não ser pela cláusula \"trivial\", que é indeformável (item 2);\n   e o nome da relação só compraria falseabilidade se a base distinguisse partilhar\n   de outras relações, o que ela não faz — a única cena candidata, EV-0968-03, é\n   igualmente compatível com o efeito relacional de H-02 e com a reação a um legado\n   dirigido de H-05. Veio de fora do repositório e o repositório generalizou o\n   enunciado: essa generalização é justamente o que apagou o pouco de risco que a\n   versão do teórico de fandom podia ter. Conclusão: **não é genuinamente distinta\n   de H-02**; é H-02 mais duas peças que não pagam aluguel.\n\n### Custo estrutural\n\n6 suposições não evidenciadas:\n\n1. **Que existe objeto físico em Laugh Tale.** O único átomo que fala do conteúdo\n   da ilha ressalva: EV-0105-01 diz que Laugh Tale é a ilha no fim do New World\n   que *supostamente* guarda o tesouro chamado One Piece — a ressalva é da própria\n   fonte. H-11 é a hipótese que mais depende da materialidade e ela a assume onde a\n   base hesita.\n\n2. **Que a obra associa partilha ao One Piece.** Nenhum átomo liga sake, festa ou\n   distribuição ao tesouro. EV-0968-03 põe a festa como reação posterior ao feito.\n   O elo entre \"bebida partilhada\" e \"o que é o One Piece\" é fornecido pela\n   hipótese, não pela base — é a suposição mais cara do conjunto.\n\n3. **Que existe canal pelo qual o achado alcança o mundo.** Distribuir ao mundo\n   exige logística que a base não registra e cuja arquitetura registrada aponta no\n   sentido oposto: EV-0818-01 (quatro chaves cruzadas), EV-0301-01 (revelação\n   condicionada ao que o visitante trouxe) e EV-0202-01 (leitura restrita a\n   pouquíssimos vivos) descrevem uma rota estreita, não um canal de difusão.\n\n4. **Que o efeito de encontrar é reunir.** Contra EV-0576-01 e EV-1172-01, que são\n   os dois únicos enunciados internos à obra sobre o efeito, e ambos dizem cindir.\n   H-11 precisa reler os dois sem átomo que autorize a releitura.\n\n5. **Que \"nenhuma habilidade especial\" sobrevive à cadeia de acesso.** Só sobrevive\n   via distinção entre chegar e usar. Nenhum átomo faz essa distinção; ela é\n   introduzida pela hipótese para blindar a própria previsão.\n\n6. **Que \"sem poder próprio\" é verdadeiro apesar de EV-1121-01.** Herança direta de\n   H-02: é preciso que Vegapunk esteja errado ou falando por hipérbole ao dizer que\n   o destino do mundo será decidido por quem reivindicar o One Piece. H-11 paga\n   este custo sem ganhar nada em troca que H-02 já não tivesse.\n\n### Concorrente mais econômico\n\nH-05\n\nH-05 explica o mesmo núcleo de átomos com menos peças. O riso de Roger\n(EV-0972-01), a festa como reação ao feito (EV-0968-03), o \"cedo demais\"\n(EV-0967-11), o pedido de desculpas de Joy Boy num Poneglyph (EV-0649-01) e,\nsobretudo, Gaban dizendo conhecer as palavras de Joy Boy e recusar-se a seguir as\npalavras de um homem que não conheceu (EV-1190-03) são todos acomodados por uma\npeça só: o que está em Laugh Tale é mensagem dirigida a quem chega. H-11 precisa\ndessa mesma acomodação **mais** um objeto físico, **mais** um ato de distribuição,\n**mais** um mecanismo de difusão ao mundo — e o átomo de maior canonicidade da\nregião, EV-1190-03, é apoio central de H-05 e é neutro ou hostil a H-11, já que\npalavras guardadas por décadas por um sobrevivente não são coisa comum\ndistribuída.\n\nRegistro ainda, por honestidade de comparação: dentro da própria família \"sem\npoder próprio\", **H-02 domina H-11 por parcimônia** — mesma cobertura, duas peças\na menos. Que H-11 seja menos econômica que uma hipótese já classificada como\nferida é o argumento mais direto para rebaixar sua prior. Enquanto a previsão (2)\nnão for substituída por uma que H-02 e H-05 possam reprovar, H-11 não paga o\npróprio custo e não deveria estar acima de H-03 na fatia.\n", "posterior": 0.6265987873715982, "fatia": 0.1995725038447383}, {"id": "H-10", "enunciado": "A fruta Nika seleciona quem a come: ela escapou do Governo Mundial por oito seculos por vontade propria, e a chegada dela a Luffy nao foi acidente.", "escopo": "joy_boy", "status": "viva", "prior": 0.32, "apoia": [{"ev": "EV-1037-01", "peso": 0.4, "como": "Um dos Cinco Anciaos questiona se a fruta de Nika nao seria apenas lenda, ja que nao desperta ha seculos, e cogita que a propria fruta esteja fugindo deles: a hipotese e levantada dentro da obra pelos proprios perseguidores."}, {"ev": "EV-1122-01", "peso": 0.3, "como": "Emet, o gigante de ferro que conheceu pessoalmente o Joy Boy original, chama Luffy de Joy Boy: uma testemunha do primeiro portador reconhece o segundo."}, {"ev": "EV-1043-01", "peso": 0.3, "como": "Inconsciente, o batimento cardiaco de Luffy adquiriu as qualidades dos Tambores da Libertacao e Zunesha declarou que Joy Boy tinha retornado: o despertar ocorre por conta propria, sem que o portador saiba o que carrega."}, {"ev": "EV-1069-01", "peso": 0.25, "como": "Segundo Vegapunk, a existencia de Nika so esta registrada nos textos mais antigos, tendo sido apagada dos documentos modernos: um apagamento tao caro so se justifica se houver algo a temer no retorno dela."}, {"ev": "EV-1175-03", "peso": 0.45, "como": "O confidente do Deus da Guerra, o esquilo Ratatoskr, transferiu-se para dentro da arma com o termo japones usado para transmigracao de almas e la aguardou o retorno de seu mestre ate reconhecer Loki: a obra estabelece como fato de mundo que o poder de uma fruta sobrevive ao portador, espera seculos e escolhe a quem se entrega."}, {"ev": "EV-0648-04", "peso": 0.15, "como": "Os Reis do Mar explicam que a cada varias centenas de anos a rainha deles nasce em forma de sereia, por um motivo que eles proprios desconhecem: a obra ja estabelece um poder que reaparece sozinho atraves dos seculos, sem que ninguem o administre."}], "contradiz": [{"ev": "EV-0001-01", "peso": 0.5, "como": "A fruta foi roubada de um navio do Governo pelos Piratas do Ruivo e um menino de sete anos a encontrou largada e a comeu por engano achando que era sobremesa: o trajeto documentado e roubo de terceiros mais engano infantil, sem nenhum ato da fruta."}, {"ev": "EV-1190-02", "peso": 0.4, "como": "Imu admite que Luffy e quem esperavam e diz que foi tolo por ter confundido varias coincidencias com destino: a obra coloca na boca do antagonista a advertencia contra ler selecao onde houve acaso."}, {"ev": "EV-1125-02", "peso": 0.25, "como": "Vegapunk nunca conseguiu replicar a energia antiga que move o robo Emet e a maquina so voltou a vida quando os Tambores da Libertacao soaram: ha rota evidenciada em que um artefato antigo reage a um evento sem querer nada."}, {"ev": "EV-1188-01", "peso": 0.15, "como": "Imu diz a Luffy que ele nao e Joy Boy porque Joy Boy era muito mais forte: se a fruta escolhesse o herdeiro certo, a diferenca de forca entre os dois portadores seria estranha."}], "prediz": [{"texto": "Se verdadeiro, antes do fim da saga a obra mostrara a fruta ou o poder dela recusando, fugindo ou escolhendo por conta propria numa cena em que nenhum evento externo e nenhuma pessoa a acione — as duas exclusoes juntas, porque EV-1125-02 e EV-0647-01 ja cobrem essas duas rotas sem vontade alguma.", "status": "aberta"}], "concorrentes": [], "redteam_ultimo": "2026-08-11", "corpo": "## Por que esta hipotese existe\n\nVeio do relatorio de orfaos: quatro atomos sobre a fruta que ninguem conseguia pegar\nnao pertenciam a nenhuma hipotese sobre o tesouro.\n\n## O caso contra (Red Team, 2026-08-11)\n\nVeredito: ferida, com recomendacao de `dormente`. Oito suposicoes nao evidenciadas.\nTres achados, todos aceitos:\n\n1. **O atomo ancora nao prova o que parece.** EV-1037-01 e fala de um dos Cinco\n   Anciaos que *cogita* a fuga na mesma frase em que duvida que a fruta seja mais que\n   lenda. E evidencia canonica do estado de crenca do Governo — eles perderam o rastro\n   — e nao da agencia da fruta. Peso reduzido de 0.50 para 0.40.\n2. **A hipotese negava um fato ausente da base.** Ela existe para dizer que a chegada\n   da fruta a Luffy nao foi acidente, e o trajeto nunca tinha sido extraido. Agora foi:\n   EV-0001-01, e ele contradiz a hipotese com peso 0.50. Este e o tipo de correcao que\n   justifica o sistema inteiro — a evidencia que faltava era desfavoravel.\n3. **Previsao decorativa.** A anterior era existencial, sem prazo e sem criterio de\n   reprovacao, e ja seria satisfeita por duas rotas sem vontade (EV-1125-02,\n   EV-0647-01). Substituida por uma com prazo e com as duas exclusoes explicitas.\n\n## Decisao sobre o status\n\nO Curador manteve `viva` em vez de `dormente`: `dormente` e definido como sem atomo\nnovo relevante ha 30+ capitulos, e EV-1043-01 e EV-1122-01 sao recentes. Mas registra\na discordancia — se a previsao unica nao se resolver, o proximo ciclo deve aposenta-la.\n\n## Nota de curadoria\n\nPrior 0.40 -&gt; 0.25, quase todo o corte causado por EV-0001-01.\n\n## Revisao de 2026-08-11 (rodada 5)\n\nReforco forte e inesperado, vindo de outra fruta. O Red Team tinha dito que\nEV-1037-01 e so especulacao de personagem e que a chegada da fruta a Luffy tem\ntrajeto documentado e banal (EV-0001-01). EV-1175-03 muda o terreno: nao e mais\npreciso postular que frutas escolhem, porque a obra acabou de mostrar uma fazendo\nexatamente isso, com vocabulario de transmigracao de almas.\n\nPrior 0.25 -&gt; 0.32. E o unico movimento para cima desta rodada.", "redteam": "# H-10 — Red Team\n\n## Ataque 2026-08-11\n\n### Contra-evidência encontrada\n\n- EV-1037-01 — O átomo âncora, lido inteiro, trabalha contra a hipótese. Um dos Cinco Anciãos **questiona se a fruta de Nika não seria apenas lenda**, já que **não desperta há séculos**, e só então **cogita** que a própria fruta esteja fugindo deles. Três problemas de uma vez: (i) a mesma frase põe em dúvida que a fruta sequer exista como coisa real, e uma hipótese sobre a vontade de um objeto não pode extrair autoridade de uma linha cuja primeira oração duvida do objeto; (ii) o verbo é *cogitar* — o átomo é canônico quanto ao fato de um Ancião ter dito aquilo, não quanto ao conteúdo do que ele disse; (iii) \"não desperta há séculos\" descreve **dormência**, que é o oposto operacional de um agente que passou oito séculos escapando ativamente. A hipótese precisa da fruta simultaneamente inerte (para explicar o silêncio) e ativa (para explicar a fuga), e o único átomo que ela tem afirma a primeira metade.\n- EV-1190-02 — Imu admite que Luffy é mesmo quem esperavam e diz que **foi tolo por ter confundido várias coincidências com destino**. É o personagem mais bem i o não se segue nem se\n  recusa — confere-se ou desmente-se. H-04 precisa reinterpretar o único descritor\n  direto que a obra ofereceu.\n- EV-1121-01 — Vegapunk afirma que o destino do mundo será decidido por quem\n  conseguir reivindicar o One Piece, e que quem o encontrar pode não ser aquele que\n  Joy Boy esperava. Registro não se reivindica: informação é não-rival, basta um\n  agente publicá-la e a posse deixa de importar. \"Reivindicar\" e \"destinatário\n  esperado\" são vocabulário de posse instrumental e de seleção de herdeiro,\n  incompatível com um documento cujo valor inteiro seria ser divulgado por\n  qualquer um.\n- EV-1114-01 — Vegapunk revela ao mundo que Joy Boy veio do Reino Antigo, foi o\n  primeiro pirata da história e portava a Hito Hito no Mi Modelo Nika. O mecanismo\n  central de H-04 — divulgação global de conteúdo do Século Vazio — já foi\n  executado dentro da obra, por alguém que nunca esteve em Laugh Tale. O teste\n  parcial já rodou.\n- EV-1115-01 — Vegapunk conclui, na mesma transmissão ao mundo, que o uso das armas\n  ancestrais elevou o nível do mar em 200 metros e que as ilhas de hoje são os topos\n  dos continentes submersos. A acusação implícita mais pesada possível foi ao ar; a\n  previsão (2) exigiria que a legitimidade do Governo Mundial começasse a ruir a\n  partir daí, e nenhum átomo registra essa consequência.\n- EV-1117-01 — Os Cinco Anciãos interromperam parte da transmissão global de\n  Vegapunk a qualquer custo. Corta contra H-04 pelo lado da premissa operacional:\n  a hipótese precisa de um canal de divulgação que o Governo não consiga cortar, e\n  a obra acabou de mostrar que ele consegue cortar.\n- EV-0576-01 — Barba Branca declarou que um dia o One Piece será encontrado e que\n  isso desencadeará uma guerra indizível que engolfará o mundo inteiro. É a única\n  previsão interna à obra sobre o efeito de achar o tesouro, e ela nomeia guerra,\n  não crise de legitimidade. Golpe direto na previsão (2).\n- EV-1172-01 — Jaru
