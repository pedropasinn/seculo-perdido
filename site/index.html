<script id="dados" type="application/json">{"evidencias": [{"id": "EV-0001-01", "fonte": "cap 1", "fonte_url": "https://onepiece.fandom.com/wiki/Nika", "tipo": "narracao", "confiabilidade": "canonico", "texto": "A fruta foi roubada de um navio do Governo pelos Piratas do Ruivo, e um menino de sete anos chamado Monkey D. Luffy a encontrou largada e a comeu por engano, achando que era sobremesa.", "atores": ["Monkey D. Luffy", "Shanks"], "temas": ["Nika", "Akuma no Mi", "Luffy"], "corpo": "O trajeto da fruta ate Luffy: roubo por terceiros mais engano de crianca. Qualquer hipotese de selecao tem que explicar por que a escolha se pareceu tanto com acaso."}, {"id": "EV-0001-02", "fonte": "titulo da obra", "fonte_url": "https://thelibraryofohara.com/2022/01/04/what-is-the-one-piece-the-ultimate-one-piece-theory/", "tipo": "narracao", "confiabilidade": "traducao_disputada", "texto": "O titulo da obra e escrito hitotsunagi no daihihou, o grande tesouro oculto, com hitotsunagi grafado em kana e nao em kanji, o que deixa a leitura em aberto entre algo em uma peca so, aquilo que conecta pessoas e um mar em calmaria.", "temas": ["One Piece", "nome", "traducao"], "corpo": "A grafia em kana e fato verificavel na capa. As tres leituras sao inferencia. Nenhuma hipotese do repositorio tratava o nome da obra como evidencia."}, {"id": "EV-0002-01", "fonte": "cap 2", "fonte_url": "https://onepiece.fandom.com/wiki/Great_Pirate_Era", "tipo": "narracao", "confiabilidade": "canonico", "texto": "O titulo de Rei dos Piratas foi intrinsecamente ligado por Roger ao tesouro mitico conhecido como One Piece.", "atores": ["Gol D. Roger"], "temas": ["One Piece", "Rei dos Piratas"], "corpo": "O titulo e o tesouro sao a mesma aposta desde o inicio da obra."}, {"id": "EV-0096-01", "fonte": "cap 96", "fonte_url": "https://onepiece.fandom.com/wiki/Monkey_D._Luffy", "tipo": "fala", "confiabilidade": "canonico", "texto": "Woop Slap pergunta, sobre Luffy, se aquilo e o sonho dele ou o destino dele.", "atores": ["Woop Slap"], "temas": ["destino", "sonho", "Luffy"], "corpo": "A obra poe a oposicao sonho/destino em cena muito antes de Imu a formular em 1190."}, {"id": "EV-0099-01", "fonte": "cap 99", "fonte_url": "https://onepiece.fandom.com/wiki/Gol_D._Roger", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Testemunhas da execucao de Roger afirmam que ele sorriu pouco antes de morrer.", "atores": ["Gol D. Roger"], "temas": ["riso", "execucao", "Vontade de D."], "corpo": "O sorriso diante da morte e tratado na obra como marca dos portadores do D."}, {"id": "EV-0105-01", "fonte": "cap 105", "fonte_url": "https://onepiece.fandom.com/wiki/Laugh_Tale", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Laugh Tale e a ilha no fim do New World que supostamente guarda o tesouro chamado One Piece.", "temas": ["Laugh Tale", "One Piece"], "corpo": "O 'supostamente' e da propria wiki: a existencia do tesouro na ilha e afirmada por terceiros, nao mostrada."}, {"id": "EV-0202-01", "fonte": "cap 202", "fonte_url": "https://onepiece.fandom.com/wiki/Void_Century", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Nico Robin e uma das pouquissimas pessoas vivas capazes de ler a lingua antiga dos Poneglyphs.", "atores": ["Nico Robin"], "temas": ["Poneglyphs", "leitura"], "corpo": "Restricao de acesso: qualquer leitura do tesouro escrito depende de um numero minusculo de pessoas."}, {"id": "EV-0218-01", "fonte": "cap 218", "fonte_url": "https://onepiece.fandom.com/wiki/Void_Century", "tipo": "fala", "confiabilidade": "canonico", "texto": "O sonho de Robin e descobrir a verdade do Seculo Vazio encontrando o Rio Poneglyph, que amarraria os fios da historia.", "atores": ["Nico Robin", "Nefertari Cobra"], "temas": ["Rio Poneglyph", "Seculo Vazio"], "corpo": "O Rio Poneglyph e apresentado como o documento que fecha a lacuna historica."}, {"id": "EV-0272-01", "fonte": "cap 272", "fonte_url": "https://onepiece.fandom.com/wiki/Void_Century", "tipo": "narracao", "confiabilidade": "ambiguo", "texto": "Ha indicacao de que a Grande Guerra do Seculo Vazio levou a queda da cidade de Shandora.", "temas": ["Shandora", "Grande Guerra"], "corpo": "A wiki usa 'has been indicated' — nao ha afirmacao direta em texto."}, {"id": "EV-0287-01", "fonte": "cap 287", "fonte_url": "https://onepiece.fandom.com/wiki/Harley", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Os Shandia antigos cultuavam deuses do sol, da terra, da floresta e da chuva.", "atores": ["Mousse"], "temas": ["Shandia", "deuses", "sol"], "corpo": "Paralelo estrutural com os deuses citados no Harley de Elbaf."}, {"id": "EV-0301-01", "fonte": "cap 301", "fonte_url": "https://onepiece.fandom.com/wiki/Laugh_Tale", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Diz-se que ao chegar a Laugh Tale, se a pessoa levou consigo as passagens dos Poneglyphs recolhidas na viagem, o Rio Poneglyph sera finalmente revelado.", "temas": ["Laugh Tale", "Rio Poneglyph", "Poneglyphs"], "corpo": "Condicao de acesso: o que ha em Laugh Tale se revela em funcao do que o visitante trouxe."}, {"id": "EV-0344-01", "fonte": "cap 344", "fonte_url": "https://onepiece.fandom.com/wiki/Ancient_Weapons", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Pluton e um navio de guerra ancestral construido na ilha de Water 7 durante o Seculo Vazio.", "temas": ["Pluton", "armas ancestrais", "Seculo Vazio"], "corpo": ""}, {"id": "EV-0392-01", "fonte": "cap 392", "fonte_url": "https://onepiece.fandom.com/wiki/Void_Century", "tipo": "fala", "confiabilidade": "canonico", "texto": "Pesquisar o Seculo Vazio e considerado pelo Governo Mundial o pior crime possivel.", "atores": ["Clou D. Clover"], "temas": ["Governo Mundial", "Seculo Vazio", "proibicao"], "corpo": ""}, {"id": "EV-0393-01", "fonte": "cap 393", "fonte_url": "https://onepiece.fandom.com/wiki/Void_Century", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Nacoes inteiras sao destruidas e apagadas do registro caso uma unica pessoa tente aprender algo sobre o Seculo Vazio.", "temas": ["Governo Mundial", "Buster Call", "Ohara"], "corpo": "O custo que o Governo aceita pagar e a medida indireta do que ele esta escondendo."}, {"id": "EV-0395-01", "fonte": "cap 395", "fonte_url": "https://onepiece.fandom.com/wiki/Great_Kingdom", "tipo": "fala", "confiabilidade": "canonico", "texto": "Clover afirma que o nome do Reino Antigo e de importancia tremenda e e a chave para entender o Seculo Vazio, mas e baleado antes de pronuncia-lo.", "atores": ["Clou D. Clover", "Cinco Anciaos"], "temas": ["Reino Antigo", "nome", "Seculo Vazio"], "corpo": "Um nome, e nao um objeto, e o que o Governo interrompeu a tiros."}, {"id": "EV-0395-02", "fonte": "cap 395", "fonte_url": "https://onepiece.fandom.com/wiki/Great_Kingdom", "tipo": "fala", "confiabilidade": "canonico", "texto": "Clover afirma que o Governo Mundial apagou o reino nao por temer seu poder nem suas armas, mas por temer seus ideais.", "atores": ["Clou D. Clover", "Cinco Anciaos"], "temas": ["Reino Antigo", "ideais", "Governo Mundial"], "corpo": "O atomo que faltava no mesmo discurso de EV-0395-01. Muda o alvo da censura: nao e um crime que o Governo esconde, e um projeto politico alternativo."}, {"id": "EV-0395-03", "fonte": "cap 395", "fonte_url": "https://thelibraryofohara.com/2022/01/04/what-is-the-one-piece-the-ultimate-one-piece-theory/", "tipo": "narracao", "confiabilidade": "traducao_disputada", "texto": "No discurso de Clover o reino e descrito com um adjetivo comum, kyodai na oukoku, ou seja um reino imenso, e nao com um nome proprio.", "atores": ["Clou D. Clover"], "temas": ["Reino Antigo", "nome", "traducao"], "corpo": "Se procede, Reino Antigo e rotulo de fandom e nao designacao da obra, e podemos estar fundindo dois termos japoneses distintos: o de Clover em 395 e o de Vegapunk em 1114. Pendencia: conferir o raw dos dois capitulos."}, {"id": "EV-0399-01", "fonte": "cap 399", "fonte_url": "https://onepiece.fandom.com/wiki/Ancient_Weapons", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Franky queimou as plantas de Pluton depois de concluir que Robin, unica capaz de reviver as armas ancestrais, nao pretendia usa-las.", "atores": ["Franky", "Nico Robin", "Spandam"], "temas": ["Pluton", "armas ancestrais"], "corpo": ""}, {"id": "EV-0488-01", "fonte": "cap 488", "fonte_url": "https://thelibraryofohara.com/2022/01/04/what-is-the-one-piece-the-ultimate-one-piece-theory/", "tipo": "narracao", "confiabilidade": "ambiguo", "texto": "A ultima linha de Binks' Sake termina em warai-banashi, escrito com os mesmos caracteres de Laugh Tale, e Roger citou essa exata linha antes de nomear a ilha.", "atores": ["Gol D. Roger", "Brook"], "temas": ["Laugh Tale", "riso", "Binks' Sake", "nome"], "corpo": "Corrigido em 2026-08-11. A versao anterior dizia que a linha continha a expressao\n'funny tale' e classificava a ligacao como coincidencia de secao de trivia. O\ntermo japones e 笑i-banashi, literalmente historia de rir, e e o mesmo termo do\nnome da ilha: 'funny tale' era escolha de tradutor ingles, nao o texto. A\nconfiabilidade subiu de ambiguo-fraco para ambiguo com a ligacao lexical\nregistrada, e o peso interpretativo caiu."}, {"id": "EV-0506-01", "fonte": "cap 506", "fonte_url": "https://onepiece.fandom.com/wiki/Gol_D._Roger", "tipo": "fala", "confiabilidade": "canonico", "texto": "Roger usou suas palavras finais na execucao publica para declarar abertamente que o One Piece pertence a quem conseguir encontra-lo, e assim sozinho deu inicio a Grande Era dos Piratas.", "atores": ["Gol D. Roger"], "temas": ["One Piece", "Era dos Piratas", "anuncio"], "corpo": "O Governo montou a execucao como espetaculo para desencorajar a pirataria e obteve o contrario."}, {"id": "EV-0506-02", "fonte": "cap 506", "fonte_url": "https://onepiece.fandom.com/wiki/Great_Pirate_Era", "tipo": "narracao", "confiabilidade": "ambiguo", "texto": "Na execucao Roger declarou que, tal como Joy Boy, havia escondido seu tesouro para que o proximo Rei dos Piratas o encontrasse.", "atores": ["Gol D. Roger", "Joy Boy"], "temas": ["One Piece", "esconder", "sucessao"], "corpo": "Marcado ambiguo: e a formulacao de resumo da wiki, sem citacao de painel. Se confirmada, implica que o One Piece de hoje inclui algo que Roger acrescentou."}, {"id": "EV-0507-01", "fonte": "cap 507", "fonte_url": "https://onepiece.fandom.com/wiki/Void_Century", "tipo": "fala", "confiabilidade": "canonico", "texto": "Rayleigh revela que os Piratas de Roger descobriram a verdadeira historia, provando que preencher a lacuna do Seculo Vazio e possivel.", "atores": ["Silvers Rayleigh", "Nico Robin"], "temas": ["Seculo Vazio", "verdadeira historia", "Roger"], "corpo": "Ancora decisiva: o que Roger achou incluiu informacao historica, seja ou nao apenas isso."}, {"id": "EV-0507-02", "fonte": "cap 507", "fonte_url": "https://onepiece.fandom.com/wiki/Void_Century", "tipo": "fala", "confiabilidade": "ambiguo", "texto": "Rayleigh disse acreditar que sua tripulacao e os estudiosos de Ohara tinham sido apressados demais, e encorajou Robin a ver o mundo para chegar a conclusao diferente da deles.", "atores": ["Silvers Rayleigh", "Nico Robin"], "temas": ["Roger", "Ohara", "cedo demais"], "corpo": "Marcado ambiguo: a wiki traz na seccao de trivia, sem citar capitulo na frase."}, {"id": "EV-0576-01", "fonte": "cap 576", "fonte_url": "https://onepiece.fandom.com/wiki/Void_Century", "tipo": "fala", "confiabilidade": "canonico", "texto": "Barba Branca declarou que um dia o One Piece sera encontrado e que isso desencadeara uma guerra indizivel que engolfara o mundo inteiro.", "atores": ["Edward Newgate"], "temas": ["One Piece", "guerra", "profecia"], "corpo": "Previsao interna a obra sobre o efeito de achar o tesouro — util para discriminar hipoteses."}, {"id": "EV-0576-02", "fonte": "cap 576", "fonte_url": "https://onepiece.fandom.com/wiki/Laugh_Tale", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Roger ofereceu a Barba Branca a informacao de como chegar a Laugh Tale, e Barba Branca recusou porque seu sonho era ter uma familia.", "atores": ["Gol D. Roger", "Edward Newgate"], "temas": ["Laugh Tale", "recusa"], "corpo": "Alguem informado do caminho recusou o tesouro sem hesitar."}, {"id": "EV-0585-01", "fonte": "cap 585", "fonte_url": "https://onepiece.fandom.com/wiki/Monkey_D._Luffy", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Diante de Ace e Sabo, Luffy declara qual e o objetivo que esta no fim do seu sonho, mas o quadro corta antes da fala e mostra apenas a reacao dos dois, que em seguida trocam tacas de sake.", "atores": ["Monkey D. Luffy", "Portgas D. Ace", "Sabo"], "temas": ["sonho", "sake", "Luffy"], "corpo": "A obra esconde deliberadamente o conteudo da declaracao. Qualquer hipotese sobre o que Luffy quer no fim depende de uma fala que Oda cortou."}, {"id": "EV-0647-01", "fonte": "cap 647", "fonte_url": "https://onepiece.fandom.com/wiki/Joy_Boy", "tipo": "narracao", "confiabilidade": "canonico", "texto": "A queda do navio Noah foi detida por Reis do Mar convocados inconscientemente por Shirahoshi, preservando a promessa da Ilha dos Homens-Peixe.", "atores": ["Shirahoshi", "Monkey D. Luffy"], "temas": ["Noah", "promessa", "Poseidon"], "corpo": ""}, {"id": "EV-0648-01", "fonte": "cap 648", "fonte_url": "https://onepiece.fandom.com/wiki/Joy_Boy", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Os Reis do Mar levaram Noah ate a Sea Forest esperando conserta-la antes que chegue o tempo prometido.", "temas": ["Noah", "tempo determinado", "Sea Forest"], "corpo": "O 'tempo prometido' aparece aqui como marco futuro agendado, nao como metafora."}, {"id": "EV-0649-01", "fonte": "cap 649", "fonte_url": "https://onepiece.fandom.com/wiki/Joy_Boy", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Joy Boy escreveu num Poneglyph da Sea Forest um pedido de desculpas por nao ter cumprido sua parte da promessa feita a Ilha dos Homens-Peixe.", "atores": ["Joy Boy"], cao", "confiabilidade": "canonico", "texto": "Os quatro Road Poneglyphs, lidos em conjunto, revelam quatro pontos cujo cruzamento indica a localizacao de Laugh Tale.", "temas": ["Road Poneglyphs", "Laugh Tale"], "corpo": "O acesso e criptografico e distribuido: quatro chaves em maos diferentes."}, {"id": "EV-0818-02", "fonte": "cap 818", "fonte_url": "https://onepiece.fandom.com/wiki/Poneglyph", "tipo": "fala", "confiabilidade": "canonico", "texto": "Os Poneglyphs foram inventados pelo cla Kouzuki, cujos ancestrais os esculpiram no fim do Seculo Vazio.", "atores": ["Nekomamushi", "Kouzuki"], "temas": ["Poneglyphs", "Kouzuki", "Seculo Vazio"], "corpo": "Elo material entre Wano e a preservacao da historia."}, {"id": "EV-0820-01", "fonte": "cap 820", "fonte_url": "https://onepiece.fandom.com/wiki/Laugh_Tale", "tipo": "fala", "confiabilidade": "ambiguo", "texto": "Inuarashi afirma que a ilha final da Grand Line, Lodestar, explicaria como buscar os quatro Road Poneglyphs, e Nami objeta que Crocus dissera que a ilha final era Laugh Tale.", "atores": ["Inuarashi", "Nami", "Crocus"], "temas": ["Laugh Tale", "Lodestar", "Road Poneglyphs"], "corpo": "Tensao textual entre Lodestar e Laugh Tale que EV-0818-01 nao registra."}, {"id": "EV-0821-01", "fonte": "cap 821", "fonte_url": "https://onepiece.fandom.com/wiki/Zunesha", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Zunesha foi sentenciada a caminhar eternamente e a so agir sob ordem, como punicao por um crime cometido ha 800 anos.", "atores": ["Zunesha"], "temas": ["Zunesha", "Seculo Vazio", "punicao"], "corpo": "Uma testemunha viva da guerra, condenada a obedecer. EV-1040-01 so registra a camaradagem com Joy Boy."}, {"id": "EV-0908-01", "fonte": "cap 908", "fonte_url": "https://onepiece.fandom.com/wiki/Void_Century", "tipo": "imagem", "confiabilidade": "canonico", "texto": "Imu demonstra interesse particular por Vivi, descendente da rainha Lili de Arabasta.", "atores": ["Imu", "Nefertari Vivi"], "temas": ["Imu" ://onepiece.fandom.com/wiki/Great_Kingdom", "tipo": "fala", "confiabilidade": "canonico", "texto": "Imu afirma que a Vontade de D. tem alguma relacao com o Reino Antigo.", "atores": ["Imu"], "temas": ["Vontade de D.", "Reino Antigo"], "corpo": ""}, {"id": "EV-1085-02", "fonte": "cap 1085", "fonte_url": "https://onepiece.fandom.com/wiki/Void_Century", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Imu se interessa por Lili por causa de um erro dela que levou os Poneglyphs a se espalharem pelo mundo.", "atores": ["Imu", "Nefertari Lili"], "temas": ["Lili", "Poneglyphs", "Imu"], "corpo": "Se os Poneglyphs se espalharam por erro, a rede de pistas que leva a Laugh Tale nao foi planejada por Joy Boy sozinho."}, {"id": "EV-1085-03", "fonte": "cap 1085", "fonte_url": "https://onepiece.fandom.com/wiki/Great_Pirate_Era", "tipo": "narracao", "confiabilidade": "canonico", "texto": "O ato de Lili de espalhar os Poneglyphs pelo mundo e tido como o que influenciou piratas a persegui-los em busca de tesouro.", "atores": ["Nefertari Lili"], "temas": ["Lili", "Poneglyphs", "Era dos Piratas"], "corpo": "A cacada moderna ao tesouro nasce de um acidente do Seculo Vazio, nao de um convite de Joy Boy."}, {"id": "EV-1086-01", "fonte": "cap 1086", "fonte_url": "https://onepiece.fandom.com/wiki/Ancient_Weapons", "tipo": "fala", "confiabilidade": "canonico", "texto": "Dragon estranha que o Governo so agora tenha usado uma arma capaz de apagar o Reino de Lulusia em segundos.", "atores": ["Monkey D. Dragon", "Emporio Ivankov"], "temas": ["armas ancestrais", "Lulusia", "Governo Mundial"], "corpo": ""}, {"id": "EV-1089-01", "fonte": "cap 1089", "fonte_url": "https://onepiece.fandom.com/wiki/Mother_Flame", "tipo": "narracao", "confiabilidade": "canonico", "texto": "York roubou uma amostra da Mother Flame e a enviou aos Cinco Anciaos e a Imu, que a usaram para energizar uma arma ancestral desconhecida.", "atores": ["York", "Imu", "Cinco Anciaos"], "temas": ["Mother Flame", "armas ances la", "confiabilidade": "canonico", "texto": "A derrota de Joy Boy marcou o fim do Reino Antigo e, com ele, o fim do Seculo Vazio.", "atores": ["Joy Boy"], "temas": ["Joy Boy", "Reino Antigo", "Seculo Vazio"], "corpo": ""}, {"id": "EV-1116-01", "fonte": "cap 1116", "fonte_url": "https://onepiece.fandom.com/wiki/Ancient_Weapons", "tipo": "fala", "confiabilidade": "canonico", "texto": "Joy Boy teve papel na preservacao das tres armas ancestrais para que geracoes futuras pudessem acessa-las e usa-las, por razoes ate hoje desconhecidas.", "atores": ["Joy Boy", "Vegapunk"], "temas": ["armas ancestrais", "Joy Boy", "heranca"], "corpo": "O lado que perdeu a guerra guardou as armas para o futuro em vez de destrui-las."}, {"id": "EV-1116-02", "fonte": "cap 1116", "fonte_url": "https://onepiece.fandom.com/wiki/Mother_Flame", "tipo": "fala", "confiabilidade": "canonico", "texto": "A Mother Flame, chama que Vegapunk criou para ser um sol proprio e fonte de energia ilimitada, esta incompleta.", "atores": ["Vegapunk"], "temas": ["Mother Flame", "energia", "sol"], "corpo": ""}, {"id": "EV-1117-01", "fonte": "cap 1117", "fonte_url": "https://onepiece.fandom.com/wiki/Void_Century", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Os Cinco Anciaos interromperam parte da transmissao global de Vegapunk a qualquer custo.", "atores": ["Cinco Anciaos", "Vegapunk"], "temas": ["transmissao", "Governo Mundial", "censura"], "corpo": "O trecho interrompido e uma lacuna conhecida: sabemos que existe algo que nao foi dito."}, {"id": "EV-1121-01", "fonte": "cap 1121", "fonte_url": "https://onepiece.fandom.com/wiki/Void_Century", "tipo": "fala", "confiabilidade": "canonico", "texto": "Vegapunk afirma que o destino do mundo sera decidido por quem conseguir reivindicar o One Piece, e que quem o encontrar pode nao ser aquele que Joy Boy esperava.", "atores": ["Vegapunk", "Joy Boy"], "temas": ["One Piece", "destino", "Joy Boy"], "corpo": "O tesouro e explicitamente instrumental: quem o pega decide o destino do mundo. Isso e mais compativel com poder do que com relato."}, {"id": "EV-1122-01", "fonte": "cap 1122", "fonte_url": "https://onepiece.fandom.com/wiki/Joy_Boy", "tipo": "fala", "confiabilidade": "canonico", "texto": "Emet, o gigante de ferro que conheceu pessoalmente o Joy Boy original, chama Luffy de Joy Boy.", "atores": ["Emet", "Monkey D. Luffy", "Joy Boy"], "temas": ["Joy Boy", "Emet", "retorno"], "corpo": ""}, {"id": "EV-1122-02", "fonte": "cap 1122", "fonte_url": "https://onepiece.fandom.com/wiki/Joy_Boy", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Joy Boy selou parte do seu Haki do Conquistador dentro de Emet, atado em no, para ser liberado seculos depois se o robo estivesse em perigo mortal.", "atores": ["Joy Boy", "Emet"], "temas": ["Joy Boy", "Haki", "Emet", "heranca"], "corpo": "Joy Boy planejou intervencoes com seculos de antecedencia — habito relevante para julgar o que ele deixaria em Laugh Tale."}, {"id": "EV-1125-01", "fonte": "cap 1125", "fonte_url": "https://onepiece.fandom.com/wiki/Void_Century", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Um robo gigante blindado criado no inicio do Seculo Vazio subiu a Red Line e invadiu Mary Geoise 200 anos atras, perdendo energia antes de causar dano.", "atores": ["Emet"], "temas": ["Emet", "Mary Geoise", "Seculo Vazio"], "corpo": ""}, {"id": "EV-1125-02", "fonte": "cap 1125", "fonte_url": "https://onepiece.fandom.com/wiki/Void_Century", "tipo": "fala", "confiabilidade": "canonico", "texto": "Vegapunk nunca conseguiu replicar a energia antiga que move o robo Emet, comum no Seculo Vazio, e a maquina so voltou a vida quando os Tambores da Libertacao soaram.", "atores": ["Vegapunk", "Emet"], "temas": ["energia antiga", "tecnologia", "Tambores da Libertacao"], "corpo": "Existe uma tecnologia perdida cuja chave de ativacao e um evento, nao um comando."}, {"id": "EV-1125-03", "fonte": "cap 1125", "fonte_url": "https://onepiece.fandom.com/wiki/Void_Century", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Escravos constroem ha 700 anos as megaestruturas Tequila Wolf, Vodka Wolf, Rum Wolf e Bourbon Wolf por encomenda dos Nobres Mundiais.", "temas": ["Governo Mundial", "afundamento", "escravidao"], "corpo": "Obras de 700 anos sugerem que o Governo se prepara para algo de escala geologica."}, {"id": "EV-1136-01", "fonte": "cap 1136", "fonte_url": "https://onepiece.fandom.com/wiki/Harley", "tipo": "narracao", "confiabilidade": "canonico", "texto": "O Harley, texto religioso de Elbaf, divide sua historia em tres Mundos, sendo que o Segundo Mundo corresponde ao Seculo Vazio.", "atores": ["Jarul"], "temas": ["Harley", "Elbaf", "profecia", "Seculo Vazio"], "corpo": ""}, {"id": "EV-1136-02", "fonte": "cap 1136", "fonte_url": "https://onepiece.fandom.com/wiki/Harley", "tipo": "narracao", "confiabilidade": "traducao_disputada", "texto": "No texto do Terceiro Mundo do Harley, o deus do sol danca e ri guiando o mundo ao seu fim, o sol retorna trazendo uma nova manha, e diz-se que dessa vez eles certamente se encontrarao.", "temas": ["Harley", "profecia", "sol", "fim do mundo"], "corpo": "Marcado traducao_disputada: o tradutor oficial da VIZ afirmou publicamente que o texto poetico admite multiplas traducoes, e a propria VIZ trocou termos entre a edicao semanal e a encadernada."}, {"id": "EV-1136-03", "fonte": "cap 1136", "fonte_url": "https://thelibraryofohara.com/2025/02/06/a-complete-translation-breakdown-of-the-harley/", "tipo": "narracao", "confiabilidade": "ambiguo", "texto": "No verso do Terceiro Mundo do Harley, o dia esperado e escrito com o termo Dia da Promessa, o mesmo termo que a obra usa para o dia em que Noah cumprira seu proposito.", "temas": ["Harley", "Dia da Promessa", "Noah", "profecia"], "corpo": "Identidade lexical verificavel no japones. A inferencia de que se trata da mesma promessa e interpretacao, por isso ambiguo e nao canonico."}, {"id": "EV-1136-04", "fonte": "cap 1136", "fonte_url": "https://thelibraryofohara.com/2025/02/06/a-complete-translation-breakdown-of-the-harley/", "tipo": "narracao", "confiabilidade": "traducao_disputada", "texto": "O mesmo verso do Terceiro Mundo diz ouvir as vozes da lua crescente, e ouvir vozes e a expressao com que Roger descreve ler os Poneglyphs.", "atores": ["Gol D. Roger"], "temas": ["Harley", "Poneglyphs", "leitura", "lua"], "corpo": "A leitura de que a lua crescente designa o cla Kouzuki, cujo simbolo e a lua crescente, e conjectura do analista. O que e solido: o verso amarra o desfecho a ouvir vozes, nao a chegar."}, {"id": "EV-1136-05", "fonte": "cap 1136", "fonte_url": "https://thelibraryofohara.com/2025/02/06/a-complete-translation-breakdown-of-the-harley/", "tipo": "narracao", "confiabilidade": "traducao_disputada", "texto": "No Primeiro Mundo do Harley, a chama que havia dentro da terra e escrita com o mesmo kanji usado para a Mother Flame, e o sol proibido que a humanidade tocou por ganancia e lido como sendo essa mesma chama.", "temas": ["Harley", "Mother Flame", "sol", "tecnologia"], "corpo": "O kanji compartilhado e fato; a identificacao com a Mother Flame e leitura do analista."}, {"id": "EV-1138-01", "fonte": "cap 1138", "fonte_url": "https://onepiece.fandom.com/wiki/Void_Century", "tipo": "imagem", "confiabilidade": "ambiguo", "texto": "O mural esculpido na casca fossilizada da Arvore Adam em Elbaf parece representar visualmente o texto do Harley, que registra dois mundos ja passados e um ainda por ocorrer.", "atores": ["Ripley"], "temas": ["Harley", "mural", "Elbaf", "profecia"], "corpo": "Ambiguo: a leiga que apresenta o mural relata a teoria corrente de que teria sido esculpido por criancas fantasiando."}, {"id": "EV-1138-02", "fonte": "cap 1138", "fonte_url": "https://onepiece.fandom.com/wiki/Harley", "tipo": "imagem", "confiabilidade": "ambiguo", "texto": "Na porcao do mural correspondente ao terceiro mundo aparecem figuras semelhantes a Luffy em Gear 5, Emet, Loki e Zunesha lutando contra um monstro demoniaco de dois chifres que segura um sol.", "atores": ["Monkey D. Luffy", "Emet", "Loki", "Zunesha"], "temas": ["mural", "profecia", "Elbaf"], "corpo": "Ambiguo por ser leitura visual de semelhancas, nao texto."}, {"id": "EV-1154-01", "fonte": "cap 1154", "fonte_url": "https://onepiece.fandom.com/wiki/Marshall_D._Teach", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Marshall D. Teach e filho do pirata Rocks D. Xebec e de sua esposa Eris.", "atores": ["Marshall D. Teach", "Rocks D. Xebec", "Eris"], "temas": ["Davy Jones", "linhagem", "Teach"], "corpo": ""}, {"id": "EV-1155-01", "fonte": "cap 1155", "fonte_url": "https://onepiece.fandom.com/wiki/Davy_D._Jones", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Descendentes de Davy D. Jones se estabeleceram em God Valley, e o Governo Mundial, ao descobri-los, os incluiu como alvos na cacada dos Nobres Mundiais.", "atores": ["Rocks D. Xebec", "Davy D. Jones"], "temas": ["Davy Jones", "God Valley", "Governo Mundial"], "corpo": ""}, {"id": "EV-1159-01", "fonte": "cap 1159", "fonte_url": "https://onepiece.fandom.com/wiki/Marshall_D._Teach", "tipo": "narracao", "confiabilidade": "canonico", "texto": "Marshall D. Teach e membro da quase extinta Familia Davy e descendente de Davy D. Jones.", "atores": ["Marshall D. Teach", "Davy D. Jones"], "temas": ["Davy Jones", "linhagem", "Teach"], "corpo": "Este e o atomo que faltava quando o Curador escreveu uma previsao sobre Barba Negra a partir da memoria."}, {"id": "EV-1164-01", "fonte": "cap 1164", "fonte_url": "https://onepiece.fandom.com/wiki/Davy_D._Jones", "tipo": "fala", "confiabilidade": "canonico", "texto": "Rocks declara que Davy D. Jones foi certa vez Rei do Mundo, e Imu nega furiosamente que Jones tenha sido rei de coisa alguma.", "atores": ["Rocks D. Xebec", "Imu", "Davy D. Jones"], "temas": ["Davy Jones", "Imu", "rei do mundo"], "corpo": "Existe uma disputa sobre quem reinou antes do Governo Mundial — outra coroa alem da de Joy Boy."}, {"id": "EV-1164-02", "fonte": "cap 1164", "fonte_url": "https://onepiece.fandom.com/wiki/Davy_D._Jones", "tipo": "fala", "confiabilidade": "canonico", "texto": "Rocks pergunta a Imu se ele teme mais Davy Jones ou Joy Boy, e sugere que Imu vive aterrorizado com a possibilidade de alguem herdar a vontade de Jones e cumprir a promessa de que ele falava.", "atores": ["Rocks D. Xebec", "Imu"], "temas": ["Imu", "promessa", "Joy Boy", "Davy Jones"], "corpo": "Ha uma promessa antiga associada a Davy Jones, distinta da promessa feita a Ilha dos Homens-Peixe."}, {"id": "EV-1164-03", "fonte": "cap 1164", "fonte_url": "https://onepiece.fandom.com/wiki/Void_Century", "tipo": "fala", "confiabilidade": "canonico", "texto": "Depois que Imu transformou Xebec em demonio em God Valley, Eris comentou que ainda era cedo demais.", "atores": ["Eris", "Rocks D. Xebec", "Imu"], "temas": ["cedo demais", "tempo determinado", "God Valley"], "corpo": "A expressao 'cedo demais' reaparece fora da boca de Roger, o que enfraquece a leitura de que era piada dele."}, {"id": "EV-1172-01", "fonte": "cap 1172", "fonte_url": "https://onepiece.fandom.com/wiki/Harley", "tipo": "fala", "confiabilidade": "canonico", "texto": "Jarul afirma que a profecia do Harley sugere que o mundo sera dividido em dois, e com isso declara Elbaf inimiga do Governo Mundial.", "atores": ["Jarul"], "temas": ["Harley", "profecia", "Elbaf", "Governo Mundial"], "corpo": "'O mundo dividido em dois' e a previsao mais concreta em circulacao dentro da obra."}, {"id": "EV-1175-01", "fonte": "cap 1175", "fonte_url": "https://onepiece.fandom.com/wiki/Nika", "tipo": "narracao", "confiabilidade": "ambiguo", "texto": "Uma das lendas de Elbaf descreve Nika como inimigo do Deus Guerreiro do pais, contra quem batalhou, e parte da juventude o teme como Deus da Destruicao.", "atores": ["Nika", "Loki"], "temas": ["Nika", "Elbaf", "destruicao"], "corpo": "Ambiguo: a propria obra diz que a leitura depende de quem conta a historia."}, {"id": "EV-1179-01", "font Joy Boy"], "corpo": ""}, {"id": "EV-1188-01", "fonte": "cap 1188", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_1188", "tipo": "fala", "confiabilidade": "canonico", "texto": "Imu diz a Luffy que ele nao e Joy Boy, porque Joy Boy era muito mais forte do que Luffy e agora.", "atores": ["Imu", "Monkey D. Luffy", "Joy Boy"], "temas": ["Imu", "Joy Boy", "Luffy"], "corpo": ""}, {"id": "EV-1190-01", "fonte": "cap 1190", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_1190", "tipo": "fala", "confiabilidade": "canonico", "texto": "Gaban afirma que a insistencia de Imu em matar Luffy prova o que Roger disse sobre terem chegado cedo demais, e que Luffy e a pessoa que ele e outros grandes nomes esperavam.", "atores": ["Scopper Gaban", "Imu", "Monkey D. Luffy"], "temas": ["cedo demais", "Roger", "Luffy"], "corpo": "Um sobrevivente da tripulacao de Roger interpreta o 'cedo demais' como sendo sobre uma pessoa que faltava nascer."}, {"id": "EV-1190-02", "fonte": "cap 1190", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_1190", "tipo": "fala", "confiabilidade": "canonico", "texto": "Imu admite que Luffy e mesmo quem esperavam e diz que foi tolo por ter confundido varias coincidencias com destino.", "atores": ["Imu", "Monkey D. Luffy"], "temas": ["Imu", "destino", "Luffy"], "corpo": ""}, {"id": "EV-1190-03", "fonte": "cap 1190", "fonte_url": "https://onepiece.fandom.com/wiki/Chapter_1190", "tipo": "fala", "confiabilidade": "canonico", "texto": "Gaban diz a Imu que conhece as palavras de Joy Boy, mas que nao tem intencao de seguir as palavras de um homem que nao conheceu: sua motivacao e realizar o sonho do seu capitao.", "atores": ["Scopper Gaban", "Imu", "Joy Boy"], "temas": ["Joy Boy", "palavras", "Laugh Tale", "Roger"], "corpo": "Peca central: o que a tripulacao de Roger trouxe de Laugh Tale inclui palavras de Joy Boy, e elas pedem alguma coisa de quem as le."}, {"id": "EV-1190-04", "fonte": "cap 1190", "fonte_url": "https://onepiece.fandom.com/wiki/Chapte  Boy: a reacao natural de quem acaba de ler alguem, nao de quem encontrou um objeto."}, {"ev": "EV-1121-01", "peso": 0.3, "como": "Vegapunk afirma que quem encontrar o One Piece pode nao ser aquele que Joy Boy esperava, o que so faz sentido se a coisa deixada tiver um destinatario pretendido."}, {"ev": "EV-0506-02", "peso": 0.25, "como": "Na execucao Roger declarou que, tal como Joy Boy, havia escondido seu tesouro para que o proximo Rei dos Piratas o encontrasse: ele leu o gesto de Joy Boy como endereçado a um sucessor e o repetiu."}, {"ev": "EV-1116-01", "peso": 0.2, "como": "Joy Boy teve papel na preservacao das tres armas ancestrais para que geracoes futuras pudessem acessa-las, comportamento de quem legou instrucoes e meios a um sucessor."}], "contradiz": [{"ev": "EV-1085-03", "peso": 0.35, "como": "O ato de Lili de espalhar os Poneglyphs pelo mundo e tido como o que influenciou piratas a persegui-los em busca de tesouro: a rede de pistas que leva ao tesouro e acidente de outra pessoa, nao endereçamento de Joy Boy."}, {"ev": "EV-0576-01", "peso": 0.25, "como": "Barba Branca declarou que achar o One Piece desencadeara uma guerra indizivel que engolfara o mundo inteiro, efeito dificil de derivar de um recado por mais importante que seja."}, {"ev": "EV-1188-01", "peso": 0.15, "como": "Imu diz a Luffy que ele nao e Joy Boy porque Joy Boy era muito mais forte, sugerindo que o que importa na sucessao e capacidade de combate e nao a leitura de um legado."}], "prediz": [{"texto": "Se verdadeiro, o conteudo revelado em Laugh Tale tera forma de mensagem dirigida a quem chegar, e Luffy respondera com uma decisao explicita em vez de tomar posse de algo.", "status": "aberta"}, {"texto": "Se verdadeiro, o texto de Laugh Tale tera vocativo dirigido a quem chega e enunciara uma condicao a cumprir, e nenhum poder ou arma sera concedido por alcanca-lo — as duas clausulas juntas, que e o que separa esta hipotese de H-03, H-04 e H-08.", "status": "aberta"}], "concorrentes": ["H-01", "H-02", "H-03", "H-04", "H-06", "H-07", "H-08", "H-11", "H-12", "H-13"], "redteam_ultimo": "2026-08-11", "corpo": "## O caso a favor\n\nO capitulo 1190 mudou o tabuleiro: Gaban nao diz que conhece a historia do mundo,\ndiz que conhece as palavras de Joy Boy, e que se recusa a segui-las. Palavras que\npodem ser seguidas ou recusadas sao instrucao dirigida, nao cronica. Isso tambem\nexplica o riso melhor que as concorrentes: le-se uma carta de alguem que morreu ha\n800 anos e que ja sabia que chegariam tarde.\n\n## O caso contra (Red Team, 2026-08-11)\n\nVeredito: ferida. Seis suposicoes nao evidenciadas. Tres golpes, dois aceitos:\n\n1. **Colapso em H-04** — mesmos atomos-ancora, mesmo formato de achado. O unico\n   discriminante e o endereçamento. Aceito em parte: o Curador discorda de que\n   nenhum atomo atribua destinatario, porque EV-1121-01 diz literalmente que quem\n   encontrar pode nao ser aquele que Joy Boy esperava, e isso pressupoe esperado.\n   Mas o ataque esta certo em que o discriminante e fino, e a previsao (2) foi\n   reescrita com duas clausulas para forcar a separacao.\n2. **Previsao (2) decorativa** — aceito e substituido.\n3. **Ponto unico de falha em EV-1190-03** — aceito. Sem esse atomo a hipotese perde\n   a palavra 'palavras' e desaba em H-04. E um unico capitulo, e recente.\n\nO Red Team recomendou deflacionar H-05 para baixo de H-04. O Curador deflacionou ate\no empate, nao abaixo: EV-1190-03 e canonico e recente, e nenhum atomo o contradiz.\n\n## O que a mataria\n\nUma revelacao em que o achado de Laugh Tale opere sozinho, sem exigir decisao de\nninguem — ou em que Joy Boy nao tenha deixado texto algum na ilha.\n\n## Nota de curadoria\n\nPrior 0.25 -&gt; 0.20, empatando com H-04. Motivo escrito: o endereçamento continua\nsendo a leitura mais economica de EV-1190-03 e EV-1121-01, mas a hipotese depende de\num atomo unico e nao explica sozinha o efeito global que EV-0576-01 preve. Entrou\nEV-1085-03 como contradicao: parte da rede que leva ao tesouro e acidente de Lili.", "redteam": "# Red team — H-05\n\n## Ataque 2026-08-11\n\n### Contra-evidência encontrada\n\n- EV-1190-03 — É o átomo de que a hipótese mais depende e ele corta contra ela. Gaban diz a Imu que conhece as palavras de Joy Boy, mas que **não tem intenção de seguir as palavras de um homem que não conheceu**: sua motivação é realizar o sonho do seu capitão. Um legado *dirigido* é definido pelo vínculo que cria em quem o recebe; aqui o único leitor documentado das palavras de Joy Boy declara em voz alta que o endereçamento não o obriga. Pior: o átomo não afirma que essas palavras vieram de Laugh Tale — isso é comentário do extrator, não o texto do átomo.\n- EV-1121-01 — Vegapunk afirma que o destino do mundo será decidido por quem conseguir **reivindicar** o One Piece, e que quem o encontrar pode não ser aquele que Joy Boy esperava. Isso fere a previsão (1) em cheio: o verbo canônico é reivindicar, isto é, tomar posse, e não responder; e a própria fala diz que quem chega pode não ser o esperado, ou seja, a expectativa de Joy Boy não seleciona nem vincula o destinatário.\n- EV-0972-02 — Os Piratas de Roger leram a mensagem em Laugh Tale, aprenderam a **verdadeira história** e decidiram deixar tudo como estava ao perceber que tinham chegado cedo demais. O único átomo que diz \"mensagem\" descreve o conteúdo dela como história verdadeira, não como pedido nem como condições. Circularidade: \"mensagem\" só vira \"mensagem endereçada a quem chegasse depois\" se a hipótese já estiver pressuposta. Este é exatamente o átomo que sustenta H-04.\n- EV-0966-01 — Roger especulou que o Governo Mundial proíbe a pesquisa dos Poneglyphs justamente para que ninguém chegue a Laugh Tale e **encontre o que está escondido lá**. O vocabulário interno é de coisa escondida a ser encontrada. Um legado deliberadamente endereçado a quem chegasse depois seria sinalizado, não escondido.\n- EV-1085-02 — Imu se interessa por Lili por causa de um **erro** dela que levou os Poneglyphs a se espalharem pelo mundo. A rede de pistas que leva a Laugh Tale, que a hipótese lê como canal de endereçamento, é atribuída em texto a um acidente histórico alheio a Joy Boy. Endereçamento por acidente não é endereçamento.\n- EV-1122-02 — Joy Boy selou parte do seu Haki do Conquistador dentro de Emet, atado em nó, para ser liberado séculos depois se o robô estivesse em perigo mortal. Este é o método de Joy Boy para alcançar o futuro efetivamente mostrado na obra: capacidade selada com gatilho automático, sem destinatário nomeado, sem pedido e sem leitura. Ele enfraquece a inferência de que o que Joy Boy deixaria em Laugh Tale teria forma de palavra dirigida.\n- EV-1116-01 — Joy Boy teve papel na preservação das três armas ancestrais para que gerações futuras pudessem acessá-las e **usá-las**, por razões até hoje desconhecidas. O legado de Joy Boy documentado na obra é de coisas utilizáveis entregues ao futuro, não de palavras e condições — o que serve melhor a H-03 e H-06 do que a H-05.\n- EV-0967-11 — A tripulação de Roger **gargalha** ao encontrar o tesouro em Laugh Tale, e Roger comenta que chegaram cedo demais. Gargalhada coletiva é reação pobre para um pedido acompanhado das condições de uma promessa; a hipótese herda de H-04 a mesma dificuldade com o riso, sem resolvê-la.\n- EV-1164-02 — Rocks pergunta a Imu se ele teme mais Davy Jones ou Joy Boy e sugere que Imu vive aterrorizado com a possibilidade de alguém herdar a vontade de Jones e cumprir **a promessa de que ele falava**. Existe portanto uma promessa antiga que não é a de Joy Boy à Ilha dos Homens-Peixe. O enunciado de H-05 usa \"uma promessa\" no singular como se o corpus tivesse uma só.\n\n### Veredito\n\nferida\n\nTrês feridas, em ordem de gravidade:\n\n1. **Quase colapsa em H-04.** Os dois enunciados partilham os mesmos átomos-âncora (EV-0972-02, EV-0301-01, EV-0507-01) e a mesma forma de achado — texto em Laugh Tale. O único discriminante é o *endereçamento*: H-04 diz registro, H-05 diz mensagem dirigida. Nenhum átomo do corpus atribui destinatário ao texto de Laugh Tale. O que mais se aproxima disso, EV-1121-01, fala de \"aquele que Joy Boy esperava\" e, na mesma frase, descreve o ato relevante como reivindicar — ou seja, o único átomo que sugere destinatário é também contra-evidência da previsão (1). Enquanto o discriminante não tiver átomo próprio, H-05 é H-04 mais uma camada interpretativa, e deve herdar prior *menor*, não o maior do repositório.\n\n2. **Previsão (2) é decorativa.** \"Outro sobrevivente dos Piratas de Roger citará textualmente palavras de Joy Boy antes do fim da saga\" pede algo que EV-1190-03 já deixou praticamente executado: um sobrevivente da tripulação de Roger já declarou, no capítulo mais recente do corpus e em confronto direto com Imu, que **conhece as palavras de Joy Boy**. Falta só a obra transcrevê-las, o que é escolha de encenação, não teste. Pior, a previsão não discrimina: H-03, H-04 e H-08 sobrevivem intactas a Gaban citando Joy Boy. Exijo substituição por algo que possa falhar e que separe H-05 das vizinhas, no espírito de: *o texto de Laugh Tale conterá vocativo ou imperativo dirigido a quem chega e nomeará uma condição a ser cumprida por ele; e o achado não conferirá arma, poder nem capacidade nova a quem o obtiver*. A segunda cláusula é o que separa de H-03/H-06; a primeira, de H-04.\n\n3. **Previsão (1) tem metade morta e metade contestada.** A primeira metade (\"conteúdo em forma de mensagem dirigida\") é satisfeita também por H-04 e por H-02, logo não testa H-05. A segunda (\"Luffy responderá com decisão explícita em vez de tomar posse\") é o único conteúdo arriscado da hipótese inteira — e colide de frente com EV-1121-01, que descreve o ato como reivindicar e faz o destino do mundo depender de quem reivindica.\n\nNão é refutada: EV-0649-01 e EV-1190-03 garantem que existem palavras de Joy Boy, e que pelo menos uma delas é um pedido de desculpas por não ter cumprido sua parte de uma promessa. O gênero \"palavra de Joy Boy\" está evidenciado. O que não está evidenciado é que *isso* seja o One Piece.\n\n### Custo estrutural\n\n6 suposições não evidenciadas:\n\n1. **Que o texto de Laugh Tale tem destinatário.** EV-0972-02 diz apenas que leram a mensagem e aprenderam a verdadeira história. Nenhum átomo dá vocativo, endereço ou destinatário ao conteúdo da ilha.\n2. **Que as palavras de Joy Boy conhecidas por Gaban vieram de Laugh Tale.** EV-1190-03 não diz onde ele as conheceu. A ponte entre \"palavras de Joy Boy\" e \"conteúdo de Laugh Tale\" é acréscimo da hipótese.\n3. **Que o pedido de desculpas do Poneglyph da Sea Forest é do mesmo gênero do que está em Laugh Tale.** EV-0649-01 situa aquele texto num Poneglyph da Sea Forest e o endereça à Ilha dos Homens-Peixe — a um credor específico do passado, não a quem chegasse depois.\n4. **Que existe uma promessa, no singular.** EV-0648-01 fala do tempo prometido ligado a Noah e à Ilha dos Homens-Peixe; EV-1164-02 fala de uma promessa associada a Davy D. Jones. Unificá-las exige um átomo que não existe.\n5. **Que as \"condições\" da promessa estão escritas em Laugh Tale.** O que EV-0301-01 promete na chegada é a revelação do Rio Poneglyph, e EV-0218-01 apresenta o Rio Poneglyph como o documento que amarraria os fios da história — registro, não cláusula contratual.\n6. **Que haverá um protocolo de resposta para quem lê.** Nenhum átomo mostra pergunta, escolha ou aceite oferecidos ao leitor. O único precedente, EV-0972-02, é uma tripulação inteira que decidiu deixar tudo como estava — decisão de não agir, compatível com quase todas as hipóteses rivais e portanto sem poder discriminante.\n\nCadeia frágil: retirado EV-1190-03, a hipótese perde a palavra \"palavras\" e desaba em H-04. Ponto único de falha declarado.\n\n### Concorrente mais econômico\n\nH-04\n\nH-04 explica o mesmo conjunto de átomos-âncora — EV-0972-02 (leram a mensagem, aprenderam a verdadeira história), EV-0507-01, EV-0301-01 — sem precisar de destinatário, l — EV-0507-01 diz que os Piratas de\nRoger descobriram a verdadeira história, EV-0301-01 promete que o Rio Poneglyph será\nrevelado a quem chegar com as passagens recolhidas na viagem, e EV-0218-01 apresenta\no Rio Poneglyph como o que amarraria os fios da história. A metade *documental* do\nenunciado sobrevive.\n\nO que está ferido é a metade causal — \"cuja divulgação destrói a legitimidade do\nGoverno Mundial\" — e é ela que faz H-04 ser uma hipótese distinta em vez de um\nsubconjunto de H-05. O mecanismo de delegitimação não tem um único átomo que o\ndescreva; tem treze acima que empurram o desfecho para guerra, força, partição\ngeográfica e afundamento. Sem essa metade, H-04 colapsa numa versão mais cara de\nH-05.\n\n### Custo estrutural\n\n7 suposições não evidenciadas:\n\n1. **Completude e forma de arquivo.** Os átomos atestam que a tripulação \"aprendeu a\n   verdadeira história\" (EV-0507-01) e leu \"a mensagem\" (EV-0972-02). Nenhum atesta\n   que se trate de um *registro completo*, nem de forma arquivística. \"Completo\" é\n   acréscimo do enunciado.\n2. **Identidade entre \"as palavras de Joy Boy\" e esse registro.** EV-1190-03 é o\n   único descritor direto e a obra o formula como palavras seguíveis ou recusáveis.\n   H-04 precisa assumir que crônica e recado são o mesmo objeto.\n3. **Que a autoridade do Governo Mundial repousa em crença pública.** Nenhum átomo\n   afirma isso. Os que descrevem o regime o mostram operando por Buster Call\n   (EV-0393-01), por sentença de morte a qualquer um que saiba (EV-1066-01) e pela\n   Dominação de Imu (EV-1181-01).\n4. **Que existe canal de divulgação ininterrompível.** EV-1117-01 mostra o oposto,\n   no exemplo mais recente disponível.\n5. **Que o conteúdo é auto-incriminatório.** O que a obra mostra suprimido é um\n   *nome* — Clover é baleado antes de pronunciar o do Reino Antigo (EV-0395-01) — e\n   a letra D. no nome de Roger (EV-1190-04). Supressão de identidade é compatível\n   com medo de sucessor tanto q nder o Século Vazio, mas é baleado antes de pronunciá-lo. O\n  segredo pelo qual o Governo mata é o **nome de um reino**, no singular, e é\n  declarado a chave do Século Vazio inteiro. Se a chave fosse um trono mundial\n  usurpado, a coisa interrompida a tiros seria o título de Imu, não o nome do reino.\n\n- EV-1085-01 — Imu afirma que a Vontade de D. tem alguma relação com o Reino Antigo.\n  Golpe pela boca do próprio Imu: quando Imu explica o que o ameaça na linhagem D.,\n  ele aponta para o Reino Antigo. Davy D. Jones é um D., e ainda assim a relação que\n  Imu enuncia não é com um reinado perdido de Jones — é com o Reino Antigo.\n\n- EV-1190-04 — Imu recorda ter ordenado pessoalmente o encobrimento do verdadeiro\n  nome de Gol D. Roger por ele ser um D. O apagamento que Imu executa e admite é\n  sobre a marca D., não sobre linhagem dinástica nem sobre reivindicação de trono.\n  H-09 precisa que a obsessão de Imu seja com legitimidade; a obsessão registrada é\n  com o D.\n\n- EV-1181-01 — Imu descreve seu poder Omen como algo que reside em todas as coisas e\n  cujos fundamentos são Corrupção, Pacto e inveja, formando o poder da Dominação.\n  Este é o átomo que quebra a espinha do argumento de H-09. Um ser cujo poder tem\n  por fundamento declarado a **inveja** e cujo nome é **Dominação** nega reinados\n  alheios por doutrina, não por culpa. A fúria de EV-1164-01 é predita pelo caráter\n  que Imu enuncia de si mesmo, sem que nenhuma usurpação precise ter ocorrido.\n\n- EV-1181-02 — Imu declara que a Dominação é a única bem-aventurança verdadeira do\n  mundo, e ao dizer isso recorda uma conversa com Joy Boy e grita o nome dele com\n  raiva. Vire a faca: a maior explosão de raiva de Imu registrada no corpus tem\n  endereço, e o endereço é **Joy Boy** — exatamente quem H-09 exclui do trono ao\n  exigir \"alguém que não Joy Boy\". Se fúria indexa usurpação, então o átomo mais\n  forte de fúria indica que o usurpado foi Joy Boy, e H-09 se refuta sozinha. Se\n  fúria não indexa usurpação, o argumento central de H-09 some. A hipótese precisa\n  que a mesma emoção signifique coisas diferentes conforme o alvo.\n\n- EV-1181-03 — Imu e Joy Boy se conheceram e a princípio pareciam estar em bons\n  termos, mas Imu desenvolveu por ele desprezo e medo profundos. A obra fornece uma\n  gênese explícita e barata do medo de Imu: uma relação pessoal que azedou. Não há\n  átomo análogo ligando Imu a Davy D. Jones — nenhum encontro, nenhum termo, nenhum\n  desprezo. O medo de Imu já tem causa evidenciada, e ela não é um trono.\n\n- EV-1188-01 — Imu diz a Luffy que ele não é Joy Boy, porque Joy Boy era muito mais\n  forte do que Luffy é agora. O vocabulário com que Imu ordena rivais é **força**, e\n  não título, sangue ou legitimidade. Um usurpador confrontado com o herdeiro do\n  trono discute direito; este personagem discute potência.\n\n- EV-1190-02 — Imu admite que Luffy é mesmo quem esperavam e diz que foi tolo por\n  ter confundido várias coincidências com destino. A obra coloca na boca do\n  personagem mais bem informado sobre o Século Vazio a advertência exata contra o\n  movimento inferencial de H-09: ler desígnio onde houve coincidência. E mostra que\n  Imu **erra** sobre quem é quem — o que rebaixa o valor probatório da sua negação\n  em EV-1164-01, que H-09 trata como confissão involuntária.\n\n- EV-0649-01 — Joy Boy escreveu num Poneglyph da Sea Forest um pedido de desculpas\n  por não ter cumprido sua parte da promessa feita à Ilha dos Homens-Peixe.\n\n- EV-0648-01 — Os Reis do Mar levaram Noah até a Sea Forest esperando consertá-la\n  antes que chegue o tempo prometido. Os dois juntos: a única promessa cujo\n  **conteúdo** o corpus conhece é uma dívida não cumprida com um destinatário\n  concreto e um prazo. H-09 precisa de uma segunda promessa, com outro autor e\n  outro conteúdo (restauração de trono), e não tem um único átomo que enuncie esse\n  conteúdo. EV-1164-02 diz \"a promessa de que ele falava\" e não diz do que ela era.\n\n- EV-1155-01 — Descendentes de Davy D. Jones se estabeleceram em God Valley, e o\n  Governo Mundial, **ao descobri-los**, os incluiu como alvos na caçada dos Nobres\n  Mundiais. Único átomo do corpus sobre a linhagem Davy, e ele contradiz o quadro de\n  H-09 em dois pontos. Primeiro: os descendentes são tratados como presa numa\n  caçada, não como dinastia deposta com pretensão. Segundo: o Governo precisou\n  **descobri-los** — um poder que houvesse tomado o trono deles saberia onde\n  estavam os herdeiros; não os encontra por acaso numa ilha ao organizar uma caçada\n  esportiva.\n\n- EV-1164-03 — Depois que Imu transformou Xebec em demônio em God Valley, Eris\n  comentou que ainda era cedo demais. O próprio material Davy/God Valley é\n  enquadrado pela obra no relógio do \"cedo demais\", o mesmo relógio de Roger e de\n  Luffy — tema de **tempo**, não de restauração dinástica. H-09 lê como trono o que\n  o corpus vem lendo como calendário.\n\n- **Previsão (2) não tem átomo — nenhum.** Nenhum dos 83 átomos menciona Barba\n  Negra, Marshall D. Teach, ou qualquer sobrevivente nomeado da linhagem Davy. A\n  premissa \"único sobrevivente conhecido da linhagem Davy\" não é derivada de átomo:\n  EV-1155-01 fala em descendentes no plural em God Valley e não nomeia nenhum. Pela\n  regra zero do repositório, isto é o erro fatal: uma previsão inteira construída\n  sobre memória do analista. E mesmo se o personagem existisse no corpus,\n  \"reivindicará algo distinto do One Piece\" é satisfeito por qualquer coisa que\n  qualquer personagem reivindique.\n\n### Veredito\n\nferida\n\nJustificativa do veredito. Não é refutada: EV-1164-01 e EV-1164-02 existem, são\ncanônicos, e é verdade que a obra pôs em cena uma disputa sobre quem reinou antes do\nGoverno Mundial e uma promessa antiga associada a Davy Jones. Isso é um dado real, e\nred team honesto não finge que não é. Mas o que os átomos sustentam é apenas:\n*alguém afirmou X e Imu negou*. O salto de \"há uma disputa\" para \"houve usurpação, e\no que Imu teme é a restauração desse trono\" não tem átomo em nenhum degrau.\n\n**Ataque de circularidade — o pedido explícito, e ele acerta.** O argumento de H-09\ntem esta forma: Imu se enfurece ao ouvir que Jones foi Rei do Mundo (EV-1164-01),\n*logo* Imu tem o que esconder sobre esse trono. A inferência só fecha com a premissa\nde que a fúria de um soberano diante de uma reivindicação rival indica consciência de\nroubo. Essa premissa não vem de átomo — e o corpus fornece ativamente a explicação\nconcorrente: EV-1181-01 diz que os fundamentos do poder de Imu são Corrupção, Pacto e\n**inveja**, e EV-1181-02 que ele declara a Dominação a única bem-aventurança\nverdadeira. Um ser assim nega que outro tenha sido rei de coisa alguma porque é isso\nque a doutrina dele afirma sobre o mundo, não porque tomou algo dele. Some-se\nEV-1181-02 (grita o nome de Joy Boy com raiva) e EV-1188-01 (rebaixa Luffy por força)\ne a fúria aparece como o modo padrão de Imu diante de qualquer rival — constante que\nnão discrimina hipótese nenhuma. Uma constante não pode ser evidência de um evento\nespecífico. O veredito sobre a circularidade é: **confirmada**. A fúria de Imu só é\nevidência de usurpação depois que a usurpação foi assumida.\n\n**Falseabilidade — as duas previsões são inservíveis como estão.**\n- Previsão (1) é conjunção de uma cláusula já cumprida com uma cláusula elástica. A\n  primeira metade (\"título ou trono anterior ao Governo Mundial ocupado por alguém\n  que não Joy Boy\") já é verdadeira por EV-1084-01: vinte soberanos, incluindo a\n  rainha Lili. A segunda metade (\"Imu será mostrado o tomando **ou** herdando\") é\n  uma disjunção que cobre os dois caminhos opostos — e nota-se que *herdar* é\n  compatível com a negação de qualquer usurpação, que é justamente a palavra do\n  enunciado. Uma previsão satisfeita por herança não testa uma hipótese de usurpação.\n  Exijo substituição por cláusula única e arriscada, do tipo: *a obra nomeará o\n  título que Imu ocupa, mostrará um ocupante anterior nomeado que não é Joy Boy, e\n  mostrará a transferência contra a vontade desse ocupante.*\n- Previsão (2) é pior que decorativa: é órfã de corpus. Refere um personagem sem\n  nenhum átomo e afirma sobre ele uma exclusividade (\"único sobrevivente conhecido\")\n  que nenhum átomo autoriza. Pela regra do repositório, ela deve ser retirada, e não\n  apenas reescrita — enquanto ela estiver lá, H-09 tem uma previsão inventada\n  ocupando o lugar de uma testável. Retirada a previsão (2) e cumprida metade da\n  previsão (1), sobra a H-09 **zero** previsão genuinamente arriscada, o que é\n  incompatível com status vivo sem reescrita.\n\n**Cadeia frágil — ponto único de falha.** Os dois átomos que sustentam a hipótese\ninteira, EV-1164-01 e EV-1164-02, são `fala`, do mesmo capítulo, da mesma boca —\nRocks D. Xebec — e ditos em provocação a Imu durante confronto. Nenhum é\n`traducao_disputada`, e o modo de falha aqui é pior que tradução: o átomo garante que\nRocks *disse*, não que seja assim; e EV-1164-02 registra explicitamente que Rocks\n**sugere**. Retire-se a veracidade de um provocador e não sobra nada de H-09. O\nrepositório já aplicou esse padrão de ceticismo em EV-1089-01, onde se recusa a\nnomear Uranus porque a suposição é do fandom e não da obra; o mesmo padrão aplicado\na EV-1164-01 impede tratar a fala de Rocks como fato institucional.\n\n### Custo estrutural\n\n8 suposições não evidenciadas:\n\n1. Que \"Rei do Mundo\" em EV-1164-01 designa um trono, uma instituição transferível\n   com sucessão, e não um epíteto na boca de Rocks. O átomo registra a declaração e\n   a negação furiosa, e não define coisa alguma.\n2. Que na disputa de EV-1164-01 Rocks diz a verdade e Imu mente. Nenhum átomo\n   arbitra; H-09 precisa do juízo para depois usá-lo como evidência.\n3. Que Imu tomou ou herdou esse título. Não há átomo ligando Imu à aquisição de\n   título nenhum: os atos de Imu que o corpus registra são ordenar o encobrimento do\n   nome de Roger por ele ser um D. (EV-1190-04) e energizar uma arma ancestral\n   desconhecida com a Mother Flame (EV-1089-01).\n4. Que \"a promessa de que ele falava\" (EV-1164-02) é de Davy Jones e não de Joy Boy,\n   quando o próprio átomo formula a pergunta como *Jones ou Joy Boy* e deixa a\n   atribuição aberta.\n5. Que o conteúdo dessa promessa é a restauração de um trono. Nenhum átomo enuncia\n   conteúdo algum para ela; a única promessa com conteúdo conhecido é a feita à Ilha\n   dos Homens-Peixe, cujo texto é um pedido de desculpas (EV-0649-01) e cujo prazo é\n   o tempo prometido (EV-0648-01).\n6. Que essa soberania é distinta do Reino Antigo, cuja queda a obra já registra com a\n   derrota de Joy Boy (EV-1115-03) e cujo nome Clover declara ser a chave do Século\n   Vazio (EV-0395-01). H-09 postula um segundo reino caído num corpus que documenta\n   um.\n7. Que a fúria e o medo de Imu são consciência de roubo, e não a doutrina que ele\n   mesmo enuncia — Dominação fundada em Corrupção, Pacto e inveja (EV-1181-01,\n   EV-1181-02) — nem o desprezo e medo profundos nascidos da relação pessoal com Joy\n   Boy que a obra já datou (EV-1181-03).\n8. Que Barba Negra existe neste corpus e é o único sobrevivente conhecido da linhagem\n   Davy. Zero átomos: nenhum dos 83 o menciona, e EV-1155-01 fala em descendentes no\n   plural estabelecidos em God Valley, descobertos pelo Governo e incluídos como\n   alvos na caçada.\n\nCusto agregado: H-09 gasta oito peças para explicar dois átomos de um único capítulo,\nditos por um único personagem hostil. Cada átomo que ela recruta fora desse par\n(EV-0908-01, EV-1085-01, EV-1190-04) é igualmente ou melhor explicado sem trono\nnenhum: interesse por Vivi e por Lili se explica pelo erro que espalhou os Poneglyphs\n(EV-1085-02, já usado por outras hipóteses), e a perseguição ao D. se explica pela\nrelação que o próprio Imu declara entre a Vontade de D. e o Reino Antigo.\n\n### Concorrente mais econômico\n\nH-05\n\nRegistro primeiro a ressalva honesta: H-09 tem escopo `imu` e é a única hipótese\ndesse escopo no repositório, de modo que não há concorrente formal na mesma\ncontagem. Mas o Red Team foi encarregado de nomear quem explica os mesmos átomos com\nmenos peças, e para o explanandum de H-09 — *que promessa é essa que Imu teme, e por\nque ele teme herança* — a resposta é H-05, \"o One Piece é o legado dirigido de Joy\nBoy: palavras, um pedido e as condições de uma promessa, endereçados a quem chegasse\ndepois dele\".\n\nH-05 explica EV-1164-02 sem inventar nada: a promessa cuja herança aterroriza Imu é a\nmesma cujas palavras Gaban declara conhecer e recusar seguir (EV-1190-03), cujo\nautor deixou por escrito um pedido de desculpas por não a ter cumprido (EV-0649-01) e\ncujo prazo os Reis do Mar aguardam (EV-0648-01). Explica também por que a raiva de\nImu tem o nome de Joy Boy na boca (EV-1181-02) e por que o desprezo e o medo nasceram\nde uma relação pessoal (EV-1181-03). Peças novas exigidas: zero. H-09 exige três\ninstituições invisíveis — um trono anterior, um segundo autor de promessa e uma\ndinastia com pretensão — para cobrir o mesmo terreno.\n\nSegunda opção, se o Curador quiser um concorrente que ataque especificamente o medo\nde herança: H-10 (\"a fruta Nika seleciona quem a come\"). O que o corpus mostra o\nGoverno temendo herdado é a fruta — os Cinco Anciãos cogitam que ela esteja fugindo\ndeles (EV-1037-01) e Vegapunk registra que Nika foi apagada dos documentos modernos\n(EV-1069-01). O objeto do terror já tem identidade evidenciada, e ela não é um trono.\n\nNão recomendo H-04 aqui: ela ocupa outro explanandum (o conteúdo do achado de Laugh\nTale) e não disputa nada com H-09. Recomendo ao Curador que, em vez de deflacionar\nH-09 e mantê-la viva com as previsões atuais, exija a reescrita das duas — sem isso\nela não satisfaz a barreira de previsão falseável do repositório.\n", "posterior": 0.34849382274483076, "fatia": 0.0}, {"id": "H-11", "enunciado": "O One Piece e um objeto fisico comum e sem poder proprio, e seu valor esta no ato de partilha-lo: quem o encontra reune o mundo ao distribui-lo, nao ao possui-lo.", "escopo": "one_piece", "status": "viva", "prior": 0.08, "apoia": [{"ev": "EV-0968-03", "peso": 0.4, "como": "Ao completar o feito Roger da uma grande festa com a tripulacao, trocando bebidas com todos: a reacao registrada de quem chegou ao fim da rota foi partilhar, nao guardar."}, {"ev": "EV-1000-01", "peso": 0.4, "como": "O titulo do capitulo 1000 e o sake que preparei enquanto esperava por voce, Luffy Chapeu de Palha: a obra nomeia um objeto comum preparado e guardado para ser oferecido a alguem que chegaria."}, {"ev": "EV-0585-01", "peso": 0.35, "como": "Diante de Ace e Sabo, Luffy declara o objetivo que esta no fim do seu sonho, o quadro corta antes da fala e os tres trocam tacas de sake: o gesto que a obra mostra no lugar da fala e a partilha."}, {"ev": "EV-0967-04", "peso": 0.3, "como": "A cancao Binks' Sake toca ao longo de todo o capitulo em que a tripulacao de Roger chega a Laugh Tale, ligando o achado a uma cancao de bebida partilhada."}, {"ev": "EV-1121-01", "peso": 0.25, "como": "Vegapunk afirma que o destino do mundo sera decidido por quem reivindicar o One Piece e que quem o encontrar pode nao ser aquele que Joy Boy esperava: e o uso que se faz da coisa, e nao a coisa, que decide."}, {"ev": "EV-1136-02", "peso": 0.3, "como": "No texto do Terceiro Mundo do Harley o deus do sol danca e ri, o sol retorna trazendo uma nova manha e diz-se que dessa vez eles certamente se encontrarao: o desfecho profetizado e um encontro, que e o que uma partilha produz."}], "contradiz": [{"ev": "EV-0972-02", "peso": 0.35, "como": "Os Piratas de Roger leram a mensagem e decidiram deixar tudo como estava por terem chegado cedo demais: se bastasse partilhar o objeto, nada impedia que o levassem e o partilhassem 25 anos depois."}, {"ev": "EV-0576-01", "peso": 0.25, "como": "Barba Branca declarou que achar o One Piece desencadeara uma guerra indizivel que engolfara o mundo inteiro, efeito dificil de derivar da distribuicao de um objeto comum."}, {"ev": "EV-0966-01", "peso": 0.2, "como": "Roger especulou que o Governo Mundial proibe a pesquisa dos Poneglyphs para que ninguem chegue a Laugh Tale e encontre o que esta escondido la: nao se sustenta uma politica de estado de 800 anos contra um objeto sem poder."}], "prediz": [{"texto": "Se verdadeiro, o One Piece sera mostrado sendo distribuido ou consumido, e nao guardado, exibido nem instalado em algum lugar.", "status": "aberta"}, {"texto": "Se verdadeiro, o One Piece mudara de maos ou sera repartido entre pessoas de mais de uma raca ou faccao no mesmo arco em que for encontrado, sem que nenhuma leitura de Poneglyph seja necessaria para isso.", "status": "aberta"}], "concorrentes": ["H-01", "H-02", "H-03", "H-04", "H-05", "H-06", "H-07", "H-08", "H-12", "H-13"], "corpo": "## Por que esta hipotese existe\n\nEla nao veio da nossa base: veio de fora, de um teorico que sustenta ha anos que\no tesouro e sake deixado por Joy Boy. Formulei-a em termos mais gerais do que ele\nusa — objeto comum, valor no ato de partilhar — porque a substancia especifica e\na parte mais fraca do argumento dele e a parte mais forte e o padrao.\n\nEla e a resposta ao teste de exaustividade: as fatias do repositorio assumem que\na resposta certa esta entre as hipoteses listadas, e esta nao estava. Nao e H-01\n(o valor nao e a riqueza), nao e H-02 (o objeto e indispensavel, e o efeito vem\ndo uso e nao do anuncio), nao e H-05 (nao sao palavras).\n\n## O caso a favor\n\nO gesto que a obra repete na cena do achado nao e tomar posse: Roger ri e da uma\nfesta. E o capitulo 1000 nomeia literalmente um objeto preparado e guardado a\nespera de alguem.\n\n## O que a mataria\n\nUma revelacao em que o One Piece exija leitura, ativacao ou habilidade — ou seja,\nquase qualquer coisa que confirme H-03, H-04 ou H-05.\n\n## Nota de curadoria\n\nPrior 0.10, o terceiro maior entre as vivas apesar de recem-criada, porque ela\nexplica de graca as duas coisas que as concorrentes explicam com esforco: o riso\ne a decisao de nao levar nada. Ainda nao passou pelo Red Team.\n\n## Revisao de 2026-08-11 (Red Team)\n\nVeredito: ferida. Seis suposicoes nao evidenciadas. Sobrevive por um motivo\ndesconfortavel — nenhum atomo mostra a cena de Laugh Tale, entao nada pode\nfalsifica-la hoje. Tres golpes, os tres aceitos:\n\n1. **Nao e distinta o bastante.** O objeto e declarado inerte por estipulacao e\n   nao entra em nenhuma previsao. A unica cena candidata (EV-0968-03, a festa de\n   Roger) e igualmente compativel com H-02 e H-05. O ataque registra que H-02\n   domina H-11 por parcimonia: mesma cobertura, duas pecas a menos.\n2. **A previsao (2) era decorativa nas duas metades.** 'Caber numa frase' e\n   propriedade da descricao, nao do objeto; 'nenhuma habilidade especial para\n   usa-lo' e vacuo porque o enunciado ja declara o objeto sem poder. Substituida\n   por uma previsao com pessoas, racas e prazo de arco.\n3. **O apoio distintivo e quase todo simbolico.** Cinco atomos de sake sustentam\n   praticamente sozinhos a hipotese, e tres deles carregam ressalva na propria\n   nota: EV-0585-01 (a fala foi cortada pelo quadro), EV-1000-01 (o falante nao e\n   nomeado) e EV-0488-01 (ambiguo). O repositorio ja errou exatamente assim uma\n   vez, em EV-0972-01.\n\n## Nota de curadoria\n\nPrior 0.10 -&gt; 0.08. Ela continua sendo a unica que explica o riso e a decisao de\nnao levar nada sem esforco, e foi a unica das tres importadas que sobreviveu — mas\no Red Team esta certo em que ela paga caro por pouca distincao.", "redteam": "# Red team — H-11\n\n## Ataque 2026-08-11\n\n### Contra-evidência encontrada\n\n- EV-0576-01 — Barba Branca declarou que um dia o One Piece será encontrado e que\n  isso desencadeará uma guerra indizível que engolfará o mundo inteiro. É a\n  colisão frontal com a metade positiva do enunciado: a única declaração canônica\n  da obra sobre o efeito de encontrar o tesouro diz que ele engolfa o mundo em\n  guerra, não que reúne o mundo. H-11 precisa que \"encontrar\" produza partilha; o\n  átomo diz que produz guerra.\n\n- EV-1172-01 — Jarul afirma que a profecia do Harley sugere que o mundo será\n  dividido em dois, e com isso declara Elbaf inimiga do Governo Mundial. Segunda\n  previsão interna à obra sobre o desfecho, e também de divisão. Duas fontes\n  independentes dentro da obra apontam para cisão; nenhuma aponta para reunião.\n  \"Reúne o mundo\" é a peça do enunciado com pior lastro na base.\n\n- EV-1121-01 — Vegapunk afirma que o destino do mundo será decidido por quem\n  conseguir reivindicar o One Piece, e que quem o encontrar pode não ser aquele\n  que Joy Boy esperava. Fere duas vezes. Primeiro o verbo: reivindicar é o\n  vocabulário de posse que o enunciado nega (\"não ao possuí-lo\"). Segundo a\n  identidade: se importa quem encontra, e se o encontrador pode ser o errado, o\n  objeto não é indiferente a quem o toca — e um objeto comum e sem poder próprio,\n  usável por qualquer um, seria exatamente indiferente.\n\n- EV-0972-02 — Os Piratas de Roger leram a mensagem em Laugh Tale, aprenderam a\n  verdadeira história e decidiram deixar tudo como estava ao perceber que tinham\n  chegado cedo demais. Este é o átomo mais caro para H-11: é a única tripulação\n  que a obra registra tendo chegado ao fim da rota, e o que ela fez com o achado\n  foi o oposto exato da previsão (1) — não distribuiu, não consumiu, deixou como\n  estava. Se o valor estivesse no ato de partilhar, a tripulação mais numerosa e\n  mais capaz de partilhar da obra escolheu não realizar o valor, sem que nenhum\n  átomo diga por quê em termos de partilha.\n\n- EV-0506-01 — Roger usou suas palavras finais na execução pública para declarar\n  abertamente que o One Piece pertence a quem conseguir encontrá-lo. O verbo que\n  o próprio Roger escolheu, no ato que abriu a caçada, é pertencer: propriedade\n  do encontrador, singular. É o contrário da fórmula \"reúne o mundo ao\n  distribuí-lo, não ao possuí-lo\", e vem de quem tinha visto o objeto.\n\n- EV-0202-01 — Nico Robin é uma das pouquíssimas pessoas vivas capazes de ler a\n  língua antiga dos Poneglyphs. Ataca diretamente a previsão (2): a obra já\n  estabeleceu que o acesso ao fim da rota passa por uma habilidade que quase\n  ninguém vivo tem. Para salvar \"ninguém precisará de habilidade especial\", H-11\n  tem de separar chegar de usar — distinção que nenhum átomo faz.\n\n- EV-0301-01 — Diz-se que ao chegar a Laugh Tale, se a pessoa levou consigo as\n  passagens dos Poneglyphs recolhidas na viagem, o Rio Poneglyph será finalmente\n  revelado. O que espera na ilha tem condição de acesso: revela-se em função do\n  que o visitante trouxe. Objeto trivial não tem cláusula de desbloqueio.\n\n- EV-0818-01 — Os quatro Road Poneglyphs, lidos em conjunto, revelam quatro\n  pontos cujo cruzamento indica a localização de Laugh Tale. O acesso é\n  criptográfico e distribuído em quatro chaves. A obra investiu oitocentos anos\n  de arquitetura de acesso em cima de uma coisa que H-11 declara trivial o\n  bastante para caber numa frase e usável sem habilidade nenhuma.\n\n- EV-0966-01 — Roger especulou que o Governo Mundial proíbe a pesquisa dos\n  Poneglyphs justamente para que ninguém chegue a Laugh Tale e encontre o que\n  está escondido lá. O Governo bloqueia acesso a uma coisa escondida num lugar.\n  Uma coisa comum e sem poder próprio não justifica a política; H-11 precisa que\n  o Governo esteja bloqueando o ato de partilhar, e não a coisa — leitura que\n  nenhum átomo autoriza.\n\n- EV-1122-02 — Joy Boy selou parte do seu Haki do Conquistador dentro de Emet,\n  atado em nó, para ser liberado séculos depois se o robô estivesse em perigo\n  mortal. É o único registro que a base tem do que Joy Boy faz quando quer\n  alcançar o futuro: ele instala poder dentro de um objeto e agenda a liberação.\n  A previsão (1) proíbe exatamente \"instalado\". O comportamento documentado do\n  autor do legado é o comportamento que a hipótese declara impossível.\n\n### Veredito\n\nferida\n\nNão digo refutada, e explico por quê para não virar ruído: nenhum átomo mostra a\ncena de Laugh Tale, então nenhuma hipótese sobre o conteúdo pode ser falsificada\nhoje, e H-11 não é exceção. Mas ela sai deste ataque em pior estado que as\nconcorrentes vivas, por cinco motivos.\n\n1. **A metade positiva do enunciado colide com os dois únicos átomos que falam do\n   efeito.** \"Reúne o mundo\" enfrenta EV-0576-01 (guerra que engolfa o mundo) e\n   EV-1172-01 (mundo dividido em dois). H-11 tem de tratar as duas como hipérbole\n   de personagem sem nenhum átomo que as desminta. As demais hipóteses vivas\n   convivem com EV-0576-01; H-11 é a única que precisa que ela seja falsa.\n\n2. **A previsão (2) é decorativa nas duas metades — respondendo (b) do encargo.**\n   \"Trivial o bastante para caber numa frase\" não é propriedade do objeto, é\n   propriedade da descrição: qualquer objeto cabe numa frase. Pluton cabe numa\n   frase (EV-0344-01 é uma frase). O registro completo do Século Vazio cabe numa\n   frase. O Rio Poneglyph cabe numa frase. A cláusula não separa H-11 de nenhuma\n   concorrente porque é satisfeita por todas — inclusive por H-01, que já está\n   refutada. E \"ninguém precisará de habilidade especial para usá-lo\" é vácuo por\n   construção: o enunciado já declara o objeto sem poder próprio, e o que não tem\n   poder não tem uso a ser executado, logo não há habilidade que possa ser\n   exigida. A cláusula se cumpre pela definição do sujeito, não por um estado do\n   mundo. Somando: a previsão (2) não é arriscada, é quase impossível de\n   reprovar. **Exijo substituição.** Uma previsão que discriminaria de verdade:\n   \"mais de uma pessoa fora da tripulação que chega receberá materialmente o One\n   Piece na mesma cena da revelação, e a obra mostrará a transferência\" — isso\n   EV-0972-02 e EV-1121-01 podem reprovar, e H-02 e H-05 não preveem.\n\n3. **A previsão (1) é metade arriscada e metade retrodição.** A parte proibitiva\n   (\"não guardado, exibido nem instalado\") é honesta e é onde EV-1122-02 acerta.\n   Mas a parte positiva (\"distribuído ou consumido\") já está satisfeita pelo único\n   registro existente de alguém chegando ao fim da rota: EV-0968-03, em que Roger\n   ao completar o feito dá uma grande festa com a tripulação, trocando bebidas com\n   todos. Prever a repetição da única cena que a obra já mostrou é retrodição\n   vestida de previsão.\n\n4. **Circularidade no motor da hipótese.** \"O valor está no ato de partilhá-lo\" é\n   afirmação sobre valor, não sobre fato, e por isso absorve qualquer desfecho:\n   se o objeto for entregue, confirma; se for guardado, a hipótese pode dizer que\n   o valor não foi realizado ainda. É o modo de falha que o CLAUDE.md deste\n   repositório nomeia — teoria elástica que não pode estar errada — e H-11 o\n   herda de H-02 sem corrigi-lo.\n\n5. **Respondendo (c) do encargo: o apoio é padrão projetado, não evidência.** A\n   base inteira tem cinco átomos de sake ou bebida — EV-0585-01, EV-0967-04,\n   EV-0968-03, EV-1000-01 e EV-0488-01 — e é dali que qualquer caso a favor de\n   \"partilha\" tem de sair, porque não existe outro lugar. Os cinco falham como\n   apoio, cada um por um motivo diferente:\n   - **EV-0968-03** é o mais forte e ainda assim não serve: a festa é posterior\n     (\"ao completar o feito\"), é reação ao feito e não o feito, e as bebidas\n     circulam entre a tripulação, não entre o mundo. Reunir a própria tripulação\n     na festa depois de uma conquista não é o mecanismo do enunciado.\n   - **EV-0585-01** tem, na própria nota do átomo, o aviso de que o quadro corta\n     antes da fala: Luffy declara o objetivo no fim do sonho e a obra esconde o\n     conteúdo, mostrando apenas a reação de Ace e Sabo e as taças de sake. Ler as\n     taças como sendo sobre o One Piece exige assumir que a fala cortada era sobre\n     o One Piece — a hipótese preenchendo o vazio que ela deveria explicar.\n   - **EV-1000-01** é título de capítulo cujo falante a própria nota do átomo diz\n     não ser nomeado, com a leitura corrente atribuindo a Yamato pelo pronome. Usá-lo\n     como promessa de sake partilhado exige comprar uma atribuição que o átomo\n     registra como disputada.\n   - **EV-0967-04** é fato de trilha sonora: a canção Binks' Sake toca ao longo do\n     capítulo em que a tripulação de Roger chega a Laugh Tale. Que uma canção sobre\n     dividir bebida toque na cena não é afirmação sobre o que há na ilha.\n   - **EV-0488-01** é `ambiguo` e, mesmo aceito, liga Laugh Tale a *riso*\n     (warai-banashi), não a partilha. Convertê-lo em apoio a \"partilha\" é um\n     segundo salto além do que o átomo licencia.\n\n   Ou seja: a fração de apoio que vem de cena de sake lida simbolicamente é\n   essencialmente a totalidade do apoio distintivo — o resto de qualquer caso a\n   favor (riso, \"cedo demais\") é apoio compartilhado com H-02 e H-05 e não\n   discrimina. E este repositório já tem precedente documentado desta exata falha:\n   EV-0972-01 foi corrigido em 2026-08-11 porque a paráfrase \"hilária\" da wiki\n   estava sustentando peso em três hipóteses, e a nota de leitura do átomo avisa\n   que a distinção entre sorrir e gargalhar nas nossas traduções é artefato. A\n   mesma disciplina aplicada ao sake derruba o apoio de H-11.\n\n6. **Respondendo (a) do encargo: H-11 é H-02 com um objeto pendurado.** As duas\n   afirmam \"sem poder próprio\" quase nas mesmas palavras. H-02 diz que o valor é\n   relacional; H-11 diz que o valor está num ato relacional específico. O acréscimo\n   de H-11 é (i) o objeto físico e (ii) o nome da relação. Nenhum dos dois carrega\n   carga: o objeto é declarado inerte por estipulação, e objeto inerte não entra em\n   nenhuma previsão a não ser pela cláusula \"trivial\", que é indeformável (item 2);\n   e o nome da relação só compraria falseabilidade se a base distinguisse partilhar\n   de outras relações, o que ela não faz — a única cena candidata, EV-0968-03, é\n   igualmente compatível com o efeito relacional de H-02 e com a reação a um legado\n   dirigido de H-05. Veio de fora do repositório e o repositório generalizou o\n   enunciado: essa generalização é justamente o que apagou o pouco de risco que a\n   versão do teórico de fandom podia ter. Conclusão: **não é genuinamente distinta\n   de H-02**; é H-02 mais duas peças que não pagam aluguel.\n\n### Custo estrutural\n\n6 suposições não evidenciadas:\n\n1. **Que existe objeto físico em Laugh Tale.** O único átomo que fala do conteúdo\n   da ilha ressalva: EV-0105-01 diz que Laugh Tale é a ilha no fim do New World\n   que *supostamente* guarda o tesouro chamado One Piece — a ressalva é da própria\n   fonte. H-11 é a hipótese que mais depende da materialidade e ela a assume onde a\n   base hesita.\n\n2. **Que a obra associa partilha ao One Piece.** Nenhum átomo liga sake, festa ou\n   distribuição ao tesouro. EV-0968-03 põe a festa como reação posterior ao feito.\n   O elo entre \"bebida partilhada\" e \"o que é o One Piece\" é fornecido pela\n   hipótese, não pela base — é a suposição mais cara do conjunto.\n\n3. **Que existe canal pelo qual o achado alcança o mundo.** Distribuir ao mundo\n   exige logística que a base não registra e cuja arquitetura registrada aponta no\n   sentido oposto: EV-0818-01 (quatro chaves cruzadas), EV-0301-01 (revelação\n   condicionada ao que o visitante trouxe) e EV-0202-01 (leitura restrita a\n   pouquíssimos vivos) descrevem uma rota estreita, não um canal de difusão.\n\n4. **Que o efeito de encontrar é reunir.** Contra EV-0576-01 e EV-1172-01, que são\n   os dois únicos enunciados internos à obra sobre o efeito, e ambos dizem cindir.\n   H-11 precisa reler os dois sem átomo que autorize a releitura.\n\n5. **Que \"nenhuma habilidade especial\" sobrevive à cadeia de acesso.** Só sobrevive\n   via distinção entre chegar e usar. Nenhum á  certo, a diferenca de forca entre os dois portadores seria estranha."}], "prediz": [{"texto": "Se verdadeiro, antes do fim da saga a obra mostrara a fruta ou o poder dela recusando, fugindo ou escolhendo por conta propria numa cena em que nenhum evento externo e nenhuma pessoa a acione — as duas exclusoes juntas, porque EV-1125-02 e EV-0647-01 ja cobrem essas duas rotas sem vontade alguma.", "status": "aberta"}], "concorrentes": [], "redteam_ultimo": "2026-08-11", "corpo": "## Por que esta hipotese existe\n\nVeio do relatorio de orfaos: quatro atomos sobre a fruta que ninguem conseguia pegar\nnao pertenciam a nenhuma hipotese sobre o tesouro.\n\n## O caso contra (Red Team, 2026-08-11)\n\nVeredito: ferida, com recomendacao de `dormente`. Oito suposicoes nao evidenciadas.\nTres achados, todos aceitos:\n\n1. **O atomo ancora nao prova o que parece.** EV-1037-01 e fala de um dos Cinco\n   Anciaos que *cogita* a fuga na mesma frase em que duvida que a fruta seja mais que\n   lenda. E evidencia canonica do estado de crenca do Governo — eles perderam o rastro\n   — e nao da agencia da fruta. Peso reduzido de 0.50 para 0.40.\n2. **A hipotese negava um fato ausente da base.** Ela existe para dizer que a chegada\n   da fruta a Luffy nao foi acidente, e o trajeto nunca tinha sido extraido. Agora foi:\n   EV-0001-01, e ele contradiz a hipotese com peso 0.50. Este e o tipo de correcao que\n   justifica o sistema inteiro — a evidencia que faltava era desfavoravel.\n3. **Previsao decorativa.** A anterior era existencial, sem prazo e sem criterio de\n   reprovacao, e ja seria satisfeita por duas rotas sem vontade (EV-1125-02,\n   EV-0647-01). Substituida por uma com prazo e com as duas exclusoes explicitas.\n\n## Decisao sobre o status\n\nO Curador manteve `viva` em vez de `dormente`: `dormente` e definido como sem atomo\nnovo relevante ha 30+ capitulos, e EV-1043-01 e EV-1122-01 sao recentes. Mas registra\na discordancia — se a previsao unica nao se resolver, o proximo ciclo deve
